 Post (Jackie Salo)&#34;, &#34;date&#34;: &#34;2017-11-03&#34;, &#34;text&#34;: &#34;Emily Michelle Rogers, 25, former social studies teacher and assistant girls volleyball/soccer coach at Smithson Valley High School, Comal ISD. Started August 2014; arrested and resigned April 2015 after Comal County deputies investigated a romantic/sexual relationship with an 18-year-old female student beginning late 2014.\n\nVictim testified to numerous sexual encounters including one on Christmas 2014. Documented drug use: Xanax at school, marijuana and cocaine during off-campus excursions. Relationship discovered when victim&#39;s other boyfriend found out and notified police. Relationship reportedly continued after Rogers&#39; April 2015 arrest.\n\nJury trial, Comal County, November 2017. Defense: John Kuntz (argued no proof of sex; Rogers did not testify). Jury deliberated ~1 hour; unanimous guilty on 2 counts of Improper Relationship Between Educator and Student (TX \u00a721.12, 2nd degree felony). Each count: up to 20 years (40 years total exposure).\n\nNovember 3, 2017: Sentenced to 10 years probation per count, no prison. $2,500 fine per count.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;guilty&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;drugs&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;adult-victim&#34;]}, {&#34;id&#34;: 155, &#34;case_id&#34;: 141, &#34;case_name&#34;: &#34;Leticia Lowery&#34;, &#34;source&#34;: &#34;KTRK-TV; FOX 26 Houston; Bossip (Josh Sanchez)&#34;, &#34;date&#34;: &#34;2020-11-24&#34;, &#34;text&#34;: &#34;Leticia Lowery, 39/40, former teacher and private tutor, Montgomery County TX. \n\nMay 2019: Charged with online solicitation of a minor after parents of a 15-year-old tutoring student found sexually explicit texts, nude photo, and request for explicit photo from Lowery. Bond $10,000. \n\nNovember 1, 2019: While out on bond, Lowery picked up 15-year-old boy and his 13-year-old girlfriend. Dropped girl at birthday party; drove back with boy to his home and performed oral sex and intercourse on a couch. In a separate encounter: had both minors in her car at the boy&#39;s home; directed the 13-year-old to perform oral sex on the boy while she watched. Girl complied. Mother discovered explicit messages. Bond set $100,000 on new charges.\n\nGuilty plea: Sexual Assault of a Child (2nd degree felony) and Sexual Performance by a Child (1st degree felony). November 2020: Sentenced to 20 years prison. Asst. DA Laura Bond: \&#34;Lowery preyed on our community&#39;s most vulnerable... she violated children to satisfy her own selfish desires.\&#34;&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;maximum-sentence&#34;, &#34;group-sex&#34;]}, {&#34;id&#34;: 156, &#34;case_id&#34;: 142, &#34;case_name&#34;: &#34;Alexandra E. Reiner&#34;, &#34;source&#34;: &#34;PhillyVoice (Michael Tanenbaum); Burlington County court record 19000418&#34;, &#34;date&#34;: &#34;2020-06-10&#34;, &#34;text&#34;: &#34;Alexandra E. Reiner, 30, special education teacher at Rancocas Valley Regional High School, Burlington County NJ. Resident of Eastampton NJ. Alleged sexual contact with male high school student December 2018 / early January 2019 in Mount Holly and Lumberton NJ. School district officials brought information to county prosecutors. Arrested January 29-30, 2019; held at Atlantic County Jail.\n\nOriginal charges: Sexual Assault + Endangering Welfare of Child. February 19, 2020: Guilty plea via accusation to Endangering Welfare of Child by Non-Caretaker (NJ 2C:24-4A(2), 3rd degree). Sexual assault charge dismissed per plea. Case number 19000418.\n\nJune 10, 2020: Sentenced by Judge Terrence R. Cook \u2014 364 days county jail (suspended/conditional), 5 years probation, 2 days credit time served. Defense: Michele Finizio (private). Victim age not publicly disclosed.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 157, &#34;case_id&#34;: 143, &#34;case_name&#34;: &#34;Robyn-Lea Gentile&#34;, &#34;source&#34;: &#34;KVVU Fox 5 Las Vegas; KTNV&#34;, &#34;date&#34;: &#34;2017-01-18&#34;, &#34;text&#34;: &#34;Robyn-Lea Gentile, 23, former substitute teacher at Harney Middle School and volunteer director of hip-hop club (Harney MS + Las Vegas High School students), Clark County NV. Incident December 2015. Victim: 17-year-old male high school student.\n\nArrested March 1, 2016; bail $10,000. Charged: 2 counts sex act by adult school employee with a pupil. Clark County School District Police investigated (Capt. Ken Young).\n\nConduct: 4-5 kisses during rides home after club practice; ~800 text messages. Student said he felt obligated to stay in relationship to feel comfortable in the club. Gentile told police she did not view him as a student; admitted feeling \&#34;powerful\&#34; and described it as revenge because her fiance was texting other girls.\n\nJanuary 18, 2017: Sentenced \u2014 19 to 48 months suspended; probation up to 5 years; sex offender registration; fines and fees. No incarceration.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 158, &#34;case_id&#34;: 144, &#34;case_name&#34;: &#34;Kisha Nuckols&#34;, &#34;source&#34;: &#34;Fox News; Greenfield Daily Reporter; TheIndyChannel.com&#34;, &#34;date&#34;: &#34;2018-01-09&#34;, &#34;text&#34;: &#34;Kisha Nuckols, 38, teacher&#39;s aide/substitute teacher, Mt. Vernon School District (Hancock County IN). Contacted 17-year-old male student via Twitter; escalated to social media flirting, nude photos, then repeated sex at Nuckols&#39; home while husband and children were upstairs. Victim turned 18 before arrest. Nuckols admitted to police knowing the relationship was wrong. School board notified April 1, 2016; terminated employment.\n\nArrested April 2016. Charges: 3x child seduction (felony) + 1x dissemination of matter harmful to minors (felony). Defense: James McNew. Nuckols admitted to inappropriate relationships with multiple students (up to 6 alleged).\n\nSeptember 2016 plea: Guilty to 1 count child seduction; remaining 3 counts dismissed. Sentence: 2 years home detention + 2 years probation; no prison. Sex offender registration; conditions: no social media, no alcohol, register cell phone.\n\nProbation violation #1 August 2017: 30 days jail for drinking + unregistered Facebook.\nProbation violation #2 January 2018: Warrant issued Jan 3; arrested Jan 7 for failing to register cell phone with Sex Offender Registry. Held without bond; fact-finding hearing March 1, 2018.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;home-confinement&#34;]}, {&#34;id&#34;: 159, &#34;case_id&#34;: 145, &#34;case_name&#34;: &#34;Kari L. Buchanan&#34;, &#34;source&#34;: &#34;WTHR/WAVE; Springs Valley Herald (Miles Flynn)&#34;, &#34;date&#34;: &#34;2019-06-25&#34;, &#34;text&#34;: &#34;Kari L. Buchanan, 42, health teacher at Springs Valley High School, French Lick/West Baden Springs, Indiana (Orange County). Investigation began Jan 15, 2019 when ISP contacted by Indiana DCS re: inappropriate relationship with male junior. Buchanan turned herself in Jan 25, 2019; school board held special meeting same day and accepted her resignation.\n\nCase 1: Charged with possession of child pornography, child seduction, and dissemination of matter harmful to a minor. Case 2: Arrested June 5, 2019 for obstruction of justice + invasion of privacy after allegedly attempting to have victim change his statement to Orange County Prosecutor&#39;s Office. Co-conspirator: Isral Qualkenbush, 37 (French Lick), charged with aiding Buchanan in contacting victim; released on $1,005 bond.\n\nJune 20, 2019: Guilty pleas before Judge R. Michael Cloud. Defense: Melissa Campbell.\nCase 1 plea: Guilty to dissemination of matter harmful to a minor (Level 6 felony); child pornography and child seduction dismissed.\nCase 2 plea: Guilty to invasion of privacy (Class A misdemeanor); obstruction dismissed.\n\nSentence: Case 1 \u2014 730 days, 365 suspended, 365 executed (32 days credit) = 333 days home incarceration, then 365 days formal probation. Case 2 \u2014 365 days all suspended, formal probation after Case 1. Probation administered through Washington County. Judge noted most of the probable cause affidavit content pertained to a broader pattern and would not have been admissible. Investigators heard rumors of similar conduct going back approximately a decade; only one victim in prosecution&#39;s case.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;evidence-tampering&#34;, &#34;charge-reduction&#34;, &#34;csam-distribution&#34;, &#34;possible-additional-victims&#34;, &#34;home-confinement&#34;]}, {&#34;id&#34;: 160, &#34;case_id&#34;: 146, &#34;case_name&#34;: &#34;Sherri Delle Mauldin&#34;, &#34;source&#34;: &#34;GBI press release; Greene County Superior Court docket&#34;, &#34;date&#34;: &#34;2025-03-24&#34;, &#34;text&#34;: &#34;Sherri Delle Mauldin, 60, former teacher at Nathanael Greene Academy (private), Siloam GA (Greene County). GBI investigation opened June 14, 2024 (originally re: co-teacher Bonnie Elizabeth Brown, 25, arrested March 21, 2025). Mauldin identified as second teacher from same school. Arrested by GBI March 24, 2025; booked Greene County Jail. GBI listed charges: Improper Sexual Contact by Employee, Aggravated Child Molestation, Statutory Rape.\n\nIndictment May 13, 2025 (warrants 25-89fw to 25-91fw): 3 counts \u2014 Aggravated Child Molestation (\u00a716-6-4(d)(1)), Child Molestation (\u00a716-6-4(b)(1)), Sexual Contact by Employee 1st Degree (\u00a716-6-5.1(b)). Defense: Adam S. Levin (Athens). Prosecutor: Blayne May, Ocmulgee DA.\n\nMay 27, 2025: Use and derivative use immunity granted to Ashton Leach (cooperating witness). Arraignment Oct 20, 2025 (Judge Burleson). Calendar call Dec 1, 2025. Trial set Jan 12, 2026 (Judge Amanda S. Petty) \u2014 defense filed conflict letter Jan 9, 2026; likely continued. Case active as of March 2026.&#34;, &#34;tags&#34;: [&#34;private-school&#34;]}, {&#34;id&#34;: 161, &#34;case_id&#34;: 147, &#34;case_name&#34;: &#34;Alisha Crins&#34;, &#34;source&#34;: &#34;WPRI 12 News (Sarah Bawden); Fox News (Michael Dorgan)&#34;, &#34;date&#34;: &#34;2026-03-03&#34;, &#34;text&#34;: &#34;Alisha Crins, ~39, physical education teacher at Ponaganset High School, Glocester RI (Foster-Glocester Regional School District). Married. Began texting male student during his sophomore year after reportedly finding his cell number online. During junior year (victim age 17): texts saying he \&#34;looked good,\&#34; requests to wear his jersey and sweatshirts, escalated to kiss request and giving her Cranston home address.\n\nStudent drove to Cranston; Crins sat in his vehicle, said \&#34;I can&#39;t believe I&#39;m going to do this\u2026 You can&#39;t tell anybody,\&#34; kissed him ~15 minutes. Follow-up texts: \&#34;can&#39;t stop thinking about him,\&#34; \&#34;good kisser.\&#34; Weeks later: invited back, kissed in backseat, engaged in sexual contact. Crins sent lingerie photos/videos while victim was 17; nude photos/videos only after he turned 18.\n\nPolice interview: Crins admitted to flirting, one kiss, text messages with \&#34;sexual innuendos,\&#34; and making plans for sex once he turned 18 (denied acting on it). Denied being \&#34;ever physical\&#34; beyond one kiss.\n\nStudent graduated spring 2025; filed formal complaint with RI State Police October 2025. Teacher \&#34;no longer works for the district\&#34; (Supt. Dr. Renee Palazzo). Indicted March 2026: 2 counts third-degree sexual assault.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;physical-evidence&#34;, &#34;delayed-reporting&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 162, &#34;case_id&#34;: 148, &#34;case_name&#34;: &#34;Shannon Cardinal&#34;, &#34;source&#34;: &#34;WISN; Patch (Scott Raynor); FOX 6 Milwaukee&#34;, &#34;date&#34;: &#34;2013-09-05&#34;, &#34;text&#34;: &#34;Shannon Cardinal, 42 at offense/44 at sentencing, Spanish teacher at Mayville High School, Oakfield WI (Fond du Lac County). Male victim age 16 at first sexual encounter December 8, 2011; 17 when relationship continued.\n\nRelationship began May 2011 (sophomore lunch in classroom), escalated through spring 2012 texting, first sex December 8, 2011 at Cardinal&#39;s Oakfield home. Additional encounters at her home (at least one with her 2-year-old child present) and in Marion Iowa at victim&#39;s mother&#39;s home after victim moved there March 2012. Cardinal traveled to Iowa for encounters.\n\nApril 23, 2012: placed on paid leave. April 27, 2012: 12 felony charges \u2014 6 counts sexual assault of a student by school staff + 6 counts child enticement through sexual contact. $5,000 bond. DA: Dan Kaminsky. Iowa charges discussed but unconfirmed.\n\nPlea: Guilty to 1 count sexual assault (11 counts dismissed). September 4, 2013: Judge Dale English sentenced 2 years prison + 1 year extended supervision, sex offender registration. Exceeded prosecution&#39;s recommendation of 1 year jail. English: \&#34;This isn&#39;t a probation case to me...the offense is so aggravating that probation I don&#39;t think is appropriate.\&#34; ADA Devra Ayala prosecuted.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;maximum-sentence&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 163, &#34;case_id&#34;: 48, &#34;case_name&#34;: &#34;Jill Edstrom&#34;, &#34;source&#34;: &#34;Holland Sentinel (Cassandra Lybrink)&#34;, &#34;date&#34;: &#34;2021-11-23&#34;, &#34;text&#34;: &#34;Jill Ann Edstrom, 50, long-term substitute/special education teacher at West Ottawa High School (via EduStaff agency) and West Ottawa summer school program (direct employee through Aug 11, 2021). Park Township, Ottawa County MI.\n\nHusband noticed odd behavior between Edstrom and 16-year-old male student as early as mid-May 2021. Student spent time at Edstrom&#39;s home; mother viewed this as helpful. Aug 10-11: husband heard wife and student having sex. Aug 12: discovered two used condoms, called police. Ottawa County Sheriff&#39;s Office investigation began Aug 12. Edstrom&#39;s last student contact was Aug 11. EduStaff placed her on unpaid leave in August; she was in orientation for a full-time GRPS position when investigation began.\n\nStudent told forensic interviewers (Children&#39;s Advocacy Center) Edstrom got drunk, came on to him, and started having sex and \&#34;he didn&#39;t know what to do.\&#34; Characterized it as \&#34;rape.\&#34; Edstrom Googled \&#34;having sex with a 16-year-old,\&#34; told him she \&#34;could be in a lot of trouble and maybe go to prison,\&#34; then threatened to kill herself if he disclosed. Edstrom did not deny a physical relationship when questioned by police.\n\nArraigned Oct 26, 2021, 58th District Court (Judge Juanita Bocanegra); bond $25,000. Charged: 3rd-degree criminal sexual conduct (felony; MI law covers 16-18 year old students when perpetrator is teacher/substitute teacher). Max 15 years. Preliminary exam Dec 8, 2021. Pleaded guilty; sentenced May 16, 2022: 18 months prison.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;husband-reported&#34;, &#34;alcohol&#34;, &#34;possible-additional-victims&#34;, &#34;surveillance&#34;, &#34;emotional-manipulation&#34;, &#34;special-needs-victim&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 164, &#34;case_id&#34;: 36, &#34;case_name&#34;: &#34;Elizabeth Blanchard&#34;, &#34;source&#34;: &#34;First Coast News (Malcolm Harvey)&#34;, &#34;date&#34;: &#34;2024-11-01&#34;, &#34;text&#34;: &#34;Additional warrant details \u2014 Elizabeth Blanchard, 34, EPIC Behavioral Healthcare, St. Augustine FL.\n\nPer arrest warrant: 15-year-old male client had been seeing Blanchard since June 18, 2024. Initial contact was flirting and texting; escalated to kissing and oral sex, then unprotected sexual intercourse \&#34;on multiple occasions (approximately four to five times).\&#34;\n\nAug 10, 2024: Blanchard rented a room at Homewood Suites, 10 Prawn St., St. Johns County. Surveillance footage shows Blanchard and boy entering a room ~12:38 PM, both exiting ~33 minutes later, then Blanchard returning alone ~18 minutes after that. She rented the room explicitly to have sex with him.\n\nBlanchard provided the victim vape pens and alcoholic beverages approximately two to three times. She sent approximately 50 nude photographs via iMessage and Snapchat. Note: investigators determined none of the saved images met the legal threshold to classify as \&#34;harmful material\&#34; \u2014 explaining absence of CSAM charge.\n\nAug 15, 2024 text from Blanchard to victim: \&#34;Switch to snap and delete this? Please babe\&#34; \u2014 evidence of consciousness of guilt/evidence management.\n\nArrest date discrepancy: Action News Jax reported Jacksonville deputies arrested Blanchard on Oct 25 on out-of-county warrants; First Coast News reports arrest date Oct 30. Likely two separate events (warrant service Oct 25, St. Johns County booking Oct 30). EPIC CEO Nangela Pulsfus confirmed Blanchard was fired before the charges were known.&#34;, &#34;tags&#34;: [&#34;snapchat&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;physical-evidence&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;surveillance&#34;]}, {&#34;id&#34;: 165, &#34;case_id&#34;: 28, &#34;case_name&#34;: &#34;Alyssa Todd&#34;, &#34;source&#34;: &#34;Maricopa County Grand Jury Indictment CR2024-113320-001&#34;, &#34;date&#34;: &#34;2024-03-27&#34;, &#34;text&#34;: &#34;Grand jury indictment filed March 27, 2024. Seven counts total.\n\nCount 1 (Sexual Conduct with a Minor, Class 2 Felony): First sexual act, on or between December 1, 2023 and March 12, 2024 \u2014 digital penetration of victim&#39;s vagina.\n\nCounts 2\u20134 (Sexual Conduct with a Minor, Class 2 Felony): On or about March 12, 2024 \u2014 oral/penile contact (Count 2), oral/vaginal contact (Count 3), digital penetration in car (Count 4).\n\nCount 5 (Sexual Conduct with a Minor, Class 2 Felony): Masturbatory act in defendant&#39;s office at Odyssey.\n\nCount 6 (Sexual Conduct with a Minor, Class 2 Felony): Masturbatory act at Skyline (separate location).\n\nCount 7 (Aggravated Luring of a Minor via Electronic Device, Class 2 Felony): Electronic communication used to lure victim.\n\nProsecutor: Nicole M. Northup, Deputy County Attorney (Maricopa County Attorney Rachel H. Mitchell). Case number CR2024-113320-001.&#34;, &#34;tags&#34;: [&#34;dna-evidence&#34;, &#34;physical-evidence&#34;]}, {&#34;id&#34;: 166, &#34;case_id&#34;: 149, &#34;case_name&#34;: &#34;Makaela Caldwell Hodgins&#34;, &#34;source&#34;: &#34;WKRC / 1819 News / New York Post&#34;, &#34;date&#34;: &#34;2025-10-08&#34;, &#34;text&#34;: &#34;Former teacher, cheer coach indicted for alleged sexual relationship with student\n\n32-year-old Makaela Caldwell Hodgins of Woodland, Alabama, a former teacher at Randolph County High School in Wedowee, Alabama, was indicted by a grand jury on a charge of sexual intercourse with a student.\n\nHodgins was introduced as the cheer coach at Randolph County High School in a Facebook post published by the school in 2022, which states that Hodgins grew up in the area and was the Woodland High School cheerleading squad captain. She was also a cheerleader at the University of West Alabama, which is where she earned her Master of Education.\n\nThe post states that Hodgins \&#34;has been involved in many aspects of coaching cheer for the past ten years through judging try-outs, conducting cheer camps, and choreographing routines.\&#34;\n\nAccording to The New York Post, she is \&#34;married to her college sweetheart,\&#34; with the couple raising \&#34;two beautiful children.\&#34;\n\nThe documents indicate that the student involved was under the age of 19, but an exact age was not specified.\n\nHodgins was arrested and held on a $30,000 bond. She has pleaded not guilty.\n\nRandolph County Schools Superintendent told The Post that Hodgins \&#34;began working for Randolph County School System on August 2, 2021,\&#34; adding that her last day was on November 15, 2024. \&#34;We will cooperate with local authorities as requested.\&#34;&#34;, &#34;tags&#34;: [&#34;grooming&#34;]}, {&#34;id&#34;: 167, &#34;case_id&#34;: 150, &#34;case_name&#34;: &#34;Jennifer Walsh&#34;, &#34;source&#34;: &#34;Cincinnati Enquirer / FOX19 / WCPO / WKRC Local 12&#34;, &#34;date&#34;: &#34;2019-07-12&#34;, &#34;text&#34;: &#34;Jennifer Walsh, 27, former special education teacher and girls JV lacrosse coach at Sycamore High School in Sycamore Township, Hamilton County, Ohio, was sentenced July 12, 2019 to one year of community control (probation) and a $100 fine after pleading guilty to interference with custody.\n\nWalsh was originally indicted October 29, 2018 on two counts of sexual battery related to a sexual relationship with a 17-year-old female student during the summer of 2018 (May\u2013August). The relationship occurred outside the school year with no direct supervisory nexus. The victim turned 18 before sentencing.\n\nThe charge was reduced from sexual battery to gross sexual imposition at an initial plea, then further amended to interference with custody \u2014 a non-sex offense \u2014 at the final guilty plea in June 2019.\n\nAt sentencing, the judge noted no sexual predator finding. The victim delivered a courtroom statement professing love for Walsh, which drew significant media attention. Walsh faced up to one year in prison if she violated probation. No prison time, no sex offender registration.\n\nCase received extensive coverage from Cincinnati Enquirer, FOX19, WCPO, and WKRC/Local 12 due to the highly reduced charges and probation-only outcome.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 168, &#34;case_id&#34;: 151, &#34;case_name&#34;: &#34;Wendie Ann Schweikert&#34;, &#34;source&#34;: &#34;WLTX / AP / NBC News / FOX News / WIS-TV&#34;, &#34;date&#34;: &#34;2007-06-01&#34;, &#34;text&#34;: &#34;Teacher Sentenced to 10 Years For Having Sex With Student\n\nLAURENS, S.C. (AP) \u2014 A former elementary school teacher pleaded guilty Friday to having sex with an eleven-year-old student and was sentenced to ten years in prison.\n\nLaurens County prosecutor Jerry Peace says 37-year-old Wendie Ann Schweikert was a fifth-grade teacher at E-B Morse Elementary School. She was arrested in May 2006 and charged with criminal sexual conduct with a minor and committing a lewd act on a minor in Laurens and Greenville counties.\n\nPeace says Schweikert read a three-page apology to the victim, his family, the school and the community.\n\nPeace says the victim&#39;s mother spoke to the judge and the boy&#39;s family was satisfied with the sentence.\n\nAdditional background: Schweikert arrested February 24, 2006. Victim was 11 years old, male. Multiple acts of sexual conduct at school and off-campus locations during 2005 into early 2006. Required to register as sex offender. Case received significant media coverage; local commentary noted racial dynamics (victim was Black, defendant was white).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 169, &#34;case_id&#34;: 152, &#34;case_name&#34;: &#34;Anna Elizabeth Jeanette Patton&#34;, &#34;source&#34;: &#34;WPDE / The State / WBTW / SC Attorney General / WLTX&#34;, &#34;date&#34;: &#34;2022-08-09&#34;, &#34;text&#34;: &#34;Anna Elizabeth Jeanette Patton (also referred to as Elizabeth Jeanette Patton), 25, former English teacher at Lamar High School in Darlington County, South Carolina, pleaded guilty May 9, 2022 to sexual battery (third degree), reduced from original criminal sexual conduct with a minor charges. She was arrested January 13, 2020.\n\nThe relationship involved grooming via social media and texts with a 16\u201317-year-old male student during her employment at Lamar High School. Sentenced to probation (starting July 1, 2022) with sex offender registration required; no prison time.\n\nOn August 9, 2022, the South Carolina State Board of Education permanently revoked her educator certification on grounds of immorality, moral turpitude, and unprofessional conduct per the board&#39;s revocation order.\n\nSources: WPDE, The State, WBTW (2022 plea/sentencing coverage); SC AG/ED.SC.gov (2022 revocation order); WLTX/WIS-TV (2020 arrest).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 170, &#34;case_id&#34;: 153, &#34;case_name&#34;: &#34;Caroline Johnson&#34;, &#34;source&#34;: &#34;Ohio AG / WLWT / WHIO / Scioto County Daily News / Portsmouth Daily Times&#34;, &#34;date&#34;: &#34;2025-04-25&#34;, &#34;text&#34;: &#34;Caroline Johnson (also identified as Caroline Nicole Haney-Johnson), 36, former coach and intervention specialist at Bloom-Vernon Local School District in South Webster, Scioto County, Ohio.\n\nIndicted December 6, 2023 following an investigation by the Ohio Bureau of Criminal Investigation into sexual activity with a minor student during her employment. Ohio Attorney General announcement.\n\nPleaded guilty October 23, 2024 to two counts of sexual battery (reduced from initial indictment charges). Source: WLWT.\n\nSentenced December 12, 2024 to one year in prison; required to register as a Tier III sex offender for life. Source: WHIO.\n\nGranted judicial release April 24, 2025 after serving the mandatory portion of her sentence \u2014 approximately 4.5 months. Sources: Scioto County Daily News, Portsmouth Daily Times (April 25, 2025).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;early-release&#34;]}, {&#34;id&#34;: 171, &#34;case_id&#34;: 154, &#34;case_name&#34;: &#34;Allyson Moran&#34;, &#34;source&#34;: &#34;Lansing State Journal / WZZM13 / New York Post / WHMI / Newsweek / TIME&#34;, &#34;date&#34;: &#34;2018-12-05&#34;, &#34;text&#34;: &#34;Allyson Moran (also Allyson Brittany Moran), 27, former long-term substitute chemistry teacher and girls soccer coach at Stockbridge High School, Stockbridge MI, sentenced December 5, 2018 to 25 months to 15 years in prison after pleading guilty October 25, 2018 to one count of third-degree criminal sexual conduct.\n\nMoran sexually assaulted a 15-year-old male sophomore at least twice at her home in Dansville, Michigan in April 2017. She invited the student to her home and greeted him wearing an open robe with bra and underwear. A second former student reported a non-sexual but similarly inappropriate relationship with Moran. She was married at the time of the offenses.\n\nArrested approximately mid-September 2017 (TIME, September 20, 2017). Originally charged with multiple counts. Plea reduced charges to one count of third-degree CSC.\n\nAt sentencing, Moran stated she was seeking \&#34;comfort\&#34; and initially attempted to blame the student. The judge and prosecutor both explicitly criticized her for victim-blaming. Sentenced to 25 months to 15 years (minimum before parole eligibility) with required sex offender registration.\n\nSources: Lansing State Journal (December 5, 2018), WZZM13 (October 26, 2018), New York Post (December 7, 2018), WHMI (December 6, 2018), Newsweek (December 7, 2018), TIME (September 20, 2017).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;victim-blaming&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 172, &#34;case_id&#34;: 155, &#34;case_name&#34;: &#34;Kathleen Boozer&#34;, &#34;source&#34;: &#34;FOX 2 Detroit / MLive / The US Sun / Lake Orion Review / Patch&#34;, &#34;date&#34;: &#34;2022-08-02&#34;, &#34;text&#34;: &#34;Kathleen \&#34;Kate\&#34; Boozer (also Kathleen Veronica Boozer), former Spanish teacher at Lake Orion High School in Oakland County, Michigan, sentenced August 2, 2022 to one year in jail, lifetime sex offender registration, and sex offender treatment.\n\nVictim Ryan Crue, who was 16 and a junior at Lake Orion High School when the relationship began in fall 2014, publicly broke his silence in December 2020 (FOX 2 Detroit interview, December 23, 2020; The US Sun, December 24, 2020), prompting law enforcement action. Crue alleged more than 100 instances of sexual intercourse, some occurring in Boozer&#39;s classroom after she covered the windows to prevent detection.\n\nBoozer was arrested approximately December 2020, arraigned March 26, 2021. She pleaded no contest in August 2022 to two counts of third-degree criminal sexual conduct; two other counts were dropped as part of the plea deal. Originally faced up to 15 years per count. Plea and one-year sentence drew criticism given scope of allegations.\n\nSources: FOX 2 Detroit (August 2, 2022; December 23, 2020; March 26, 2021), MLive (August 3, 2022), The US Sun (December 24, 2020), Lake Orion Review (August 10, 2022), Patch (August 4, 2022).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 173, &#34;case_id&#34;: 156, &#34;case_name&#34;: &#34;Heather Winfield&#34;, &#34;source&#34;: &#34;The Alpena News / Detroit Free Press / People Magazine / WBKB11 / True North Radio / UpNorthLive&#34;, &#34;date&#34;: &#34;2021-11-12&#34;, &#34;text&#34;: &#34;Heather Winfield (also Heather Ellen Winfield), former special education teacher at Thunder Bay Junior High School, Alpena Public Schools, Michigan.\n\nVictim, a male student who was 11 years old when the alleged relationship began in 2016, reported more than 100 instances of sexual assault by Winfield through approximately July 2018 (when victim was 13\u201314). Allegations included conduct at school and off-campus locations.\n\nArrested January 11, 2019. Bound over for trial following preliminary exam before Judge Thomas LaCross on March 1, 2019 (UpNorthLive, Detroit Free Press). Trial commenced September 2021 (10-day trial). After approximately 16\u201317 hours of deliberation, jury returned verdict September 23, 2021: acquitted on five counts of criminal sexual conduct (first, second, and third degree); guilty on one count of accosting a child for immoral purposes. Winfield maintained innocence throughout; defense alleged victim fabrication or coercion. (WBKB11, The Alpena News, September 24, 2021.)\n\nSentenced November 12, 2021 to 9 months in jail; required to register as sex offender for 25 years. Victim impact statements described lasting trauma. (The Alpena News, True North Radio Network, November 12, 2021.)\n\nCivil lawsuit filed 2023 by victim (now an adult) against Alpena Public Schools alleging failure to protect. (Detroit Free Press, September 19, 2023.)\n\nPeople Magazine covered the case during the preliminary exam period (March 5, 2019).&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;sex-offender-registration&#34;, &#34;long-term-relationship&#34;, &#34;on-campus&#34;, &#34;acquitted&#34;]}, {&#34;id&#34;: 174, &#34;case_id&#34;: 157, &#34;case_name&#34;: &#34;Jamee Hiatt&#34;, &#34;source&#34;: &#34;Lansing State Journal / Detroit Free Press / MLive / CBS News / NY Daily News / WILX&#34;, &#34;date&#34;: &#34;2017-01-05&#34;, &#34;text&#34;: &#34;Jamee Hiatt, 32, former third-grade teacher at Woodworth Elementary School, Leslie MI, sentenced January 5, 2017 to 3 to 20 years in prison after pleading guilty November 22, 2016 to one count of first-degree criminal sexual conduct and one count of third-degree criminal sexual conduct.\n\nHiatt had a sexual relationship with a 13\u201314-year-old male student involving intercourse on so many occasions the victim could not estimate the number. She was arrested mid-January 2016. She also gave the victim a firearm that was subsequently linked to a fatal shooting in Jackson, Michigan \u2014 an element that received separate media coverage in February 2016 (Detroit Free Press, CBS News, New York Daily News \u2014 February 25, 2016).\n\nHiatt, a married mother of two at the time, apologized in court: \&#34;I know my actions were inexcusable.\&#34; Some early reports indicated she initially deflected blame toward the victim. The judge acknowledged her remorse while emphasizing the harm to the victim. The victim&#39;s family told the court she \&#34;changed his life forever.\&#34;\n\nSex offender registration required. Minimum 3 years before parole eligibility under Michigan indeterminate sentencing.\n\nSources: Lansing State Journal (November 23, 2016; January 6, 2017), Detroit Free Press (January 6, 2017; February 25, 2016), MLive (January 5, 2017), CBS News (February 25, 2016), New York Daily News (February 25, 2016), WILX (January 5, 2017).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;physical-evidence&#34;, &#34;long-term-relationship&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 175, &#34;case_id&#34;: 157, &#34;case_name&#34;: &#34;Jamee Hiatt&#34;, &#34;source&#34;: &#34;Lansing State Journal / MLive / Detroit Free Press / Digital Journal / FOX47&#34;, &#34;date&#34;: &#34;2016-02-26&#34;, &#34;text&#34;: &#34;Clarification on school/role timeline: Hiatt taught sixth grade at Leslie Middle School during the 2013\u20132014 school year, where the victim was her student at age 13. The sexual relationship began during that period. She subsequently transferred to Woodworth Elementary School as a third-grade teacher and maintained contact with the victim, with the relationship continuing through 2015. She resigned from Woodworth Elementary in January 2016 just before her arrest.\n\nSources confirm the victim was a former middle-school student, not a current elementary student at time of arrest. Leslie Public Schools has a standard grade configuration (Woodworth Elementary for younger grades, Leslie Middle School for older). No grade configuration anomaly \u2014 this is a former-student ongoing-contact pattern.\n\nSources: Lansing State Journal (Nov 23, 2016; Jan 6, 2017), MLive (Jan 25, 2016), Detroit Free Press (Feb 26, 2016), CBS News Detroit (Feb 25, 2016), Digital Journal (Feb 26, 2016), FOX47 (Jan 6, 2017).&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 176, &#34;case_id&#34;: 158, &#34;case_name&#34;: &#34;Kathryn Houghtaling&#34;, &#34;source&#34;: &#34;FOX 2 Detroit / Detroit Free Press / WXYZ / MLive / People Magazine / Detroit News&#34;, &#34;date&#34;: &#34;2020-03-03&#34;, &#34;text&#34;: &#34;Kathryn Houghtaling, 27, former special education teacher at Rochester High School, Rochester Community Schools, Oakland County MI, sentenced March 3, 2020 to 51 months to 15 years in prison after pleading no contest to six counts of third-degree criminal sexual conduct and one count of delivery of a controlled substance to a minor.\n\nHoughtaling had sexual encounters with two male special education students, ages 16 and 17, at various locations including the students&#39; homes, which she allegedly entered without invitation. She also provided controlled substances to at least one victim. Arrested early January 2019; arraigned January 11, 2019 (Detroit Free Press, January 12, 2019). Pleaded no contest in January 2020. CSC sentence (51 months to 15 years) concurrent with 51 months to 8 years for drug delivery. Sex offender registration required.\n\nCivil lawsuit filed July 27, 2020 by victims and families against Rochester Community Schools for deliberate indifference and failure to supervise. (Detroit Free Press, MLive, People Magazine \u2014 July/August 2020.)\n\nSources: FOX 2 Detroit (March 3, 2020), Detroit Free Press (January 12, 2019; July 27, 2020), WXYZ (March 3, 2020), MLive (July 27, 2020), People Magazine (July 30, 2020), The Detroit News (March 3, 2020).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;drugs&#34;, &#34;special-needs-victim&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 177, &#34;case_id&#34;: 159, &#34;case_name&#34;: &#34;Abigail Simon&#34;, &#34;source&#34;: &#34;WOOD-TV / WZZM13 / FOX17 / Detroit Free Press / Michigan Court of Appeals / MDOC OTIS&#34;, &#34;date&#34;: &#34;2022-11-22&#34;, &#34;text&#34;: &#34;Abigail Simon (also Abigail Marie Simon), former tutor for athletes at Grand Rapids Catholic Central High School, Kent County MI, convicted November 26, 2014 by jury on three counts of first-degree criminal sexual conduct and one count of accosting a child for immoral purposes for a sexual relationship with a 15-year-old male student beginning April 26, 2013.\n\nGrooming included graphic texts, explicit photos, and romantic relationship framing. Defense argued at trial that the victim had raped her \u2014 rejected by the jury. Sentenced January 14, 2015 to 8 to 25 years in prison (Kent County Circuit Court). Conviction upheld by Michigan Court of Appeals June 16, 2016 (COA #326149); further appeals denied. Case received national media coverage.\n\nParoled November 22, 2022 after serving the 8-year minimum term (WOOD-TV, WZZM13, FOX17 \u2014 November 22, 2022). Fully discharged from parole supervision November 22, 2024 per MDOC OTIS profile (MDOC #951566).\n\nSources: WOOD-TV (November 22, 2022), WZZM13 (November 22, 2022), FOX17 (November 22, 2022), Detroit Free Press (2015\u20132016), Michigan Court of Appeals opinion COA #326149 (June 16, 2016), MDOC OTIS profile #951566.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;appeal&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 178, &#34;case_id&#34;: 160, &#34;case_name&#34;: &#34;Marcie Rousseau&#34;, &#34;source&#34;: &#34;MLive / OurMidland.com / MidMichiganNow / CNN / ABC affiliates&#34;, &#34;date&#34;: &#34;2010-12-16&#34;, &#34;text&#34;: &#34;Marcie Rousseau (also Marcie L. Rousseau), 34, former English teacher at Freeland High School, Freeland MI, sentenced December 16, 2010 to 4 to 15 years in prison after pleading guilty to 24 counts of criminal sexual conduct across two county jurisdictions.\n\nArrested June 28\u201329, 2010 on 29 felony counts (CNN, June 30, 2010) involving a sexual relationship with a 16-year-old male student spanning 2009\u20132010. Charges filed in both Saginaw and Midland counties due to incidents occurring across the school district&#39;s multi-county footprint.\n\nPleaded guilty to three counts in Midland County (October 20, 2010) and 21 counts in Saginaw County (November 29, 2010). MLive, MidMichiganNow coverage of plea hearings. Defense argued the victim had \&#34;courted\&#34; Rousseau; judge rejected this framing and imposed sentence at the higher end of guidelines. Concurrent sentences from both counties; sex offender registration required.\n\nCivil lawsuit filed May 2011 by victim in U.S. District Court against Freeland Community School District alleging failure to protect (multi-million dollar claim). OurMidland.com, May 6, 2011.\n\nSources: MLive (November 29, 2010; December 16, 2010), OurMidland.com (May 6, 2011), MidMichiganNow (November 29, 2010), CNN (June 30, 2010), ABC affiliates (2010).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;long-term-relationship&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 179, &#34;case_id&#34;: 161, &#34;case_name&#34;: &#34;Giovanna Yaranga&#34;, &#34;source&#34;: &#34;Vermont Public Radio / Burlington Free Press / Rutland Herald / WAMC / Boston Globe&#34;, &#34;date&#34;: &#34;2018-10-18&#34;, &#34;text&#34;: &#34;Giovanna Yaranga, former Spanish teacher at Burlington High School, Burlington VT, pleaded guilty October 18, 2018 to misdemeanor charges after a case that began with four felony counts of sexual exploitation of a minor.\n\nArrested April 29, 2013 after police discovered her with a 17-year-old male student in a car behind a building; the two had been in a sexual relationship for approximately seven months. Arraigned May 6, 2013 (Vermont Public Radio, WAMC); pleaded not guilty to four felony counts. Re-arrested May 27, 2013 for violating court-ordered no-contact conditions (Boston Globe, May 28, 2013). A trespass charge was also reported in June 2014 (Burlington Free Press, June 17, 2014).\n\nCase proceeded for approximately five years. Pleaded guilty October 18, 2018 to misdemeanor charges; felony counts dismissed (Burlington Free Press, Rutland Herald, October 18, 2018). Exact sentence not detailed in reporting; no significant prison term. Fired by Burlington School District following arrest; certification consequences.\n\nVermont&#39;s age of consent is 16; victim was 17. The felony exploitation statute targets authority-based relationships regardless of consent age, but this likely factored into the charge reduction trajectory.\n\nSources: Vermont Public Radio (May 6, 2013; May 28, 2013), Burlington Free Press (June 17, 2014; October 18, 2018), Rutland Herald (October 18, 2018), WAMC (May 6, 2013), Boston Globe (May 28, 2013).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;surveillance&#34;]}, {&#34;id&#34;: 180, &#34;case_id&#34;: 162, &#34;case_name&#34;: &#34;Nicole DuFault&#34;, &#34;source&#34;: &#34;NJ.com/Star-Ledger / Patch / Ocean County Prosecutor&#39;s Office / WOBM / Asbury Park Press&#34;, &#34;date&#34;: &#34;2025-05-16&#34;, &#34;text&#34;: &#34;Nicole DuFault, 36, former special education teacher at Manchester Township High School, Manchester NJ, sentenced May 16, 2025 to 7 years in New Jersey State Prison after pleading guilty March 27, 2025 to one count of second-degree sexual assault.\n\nDuFault had sexual relationships with three male high school students (ages 16\u201317) between approximately 2019 and 2021, with acts occurring at school and off-campus locations including her home. Arrested October 2021 following a school investigation and student disclosures (Asbury Park Press, Ocean County Prosecutor&#39;s Office, October 2021). Indicted by grand jury on multiple counts of sexual assault and official misconduct.\n\nPleaded guilty March 27, 2025 to one count of second-degree sexual assault \u2014 a significant reduction from the original multi-victim, multi-count indictment (NJ.com, Asbury Park Press, March 2025). Sentenced May 16, 2025 to 7 years in state prison with sex offender registration and parole supervision required upon release. New Jersey&#39;s No Early Release Act (NERA) applies: minimum 85% of sentence (~5.95 years) must be served before parole eligibility (WOBM, Patch, May 16\u201317, 2025).\n\nCivil lawsuit filed by victims and families against Manchester Township School District for failure to supervise and protect.\n\nSources: NJ.com/The Star-Ledger (March 27, 2025; May 16, 2025), Patch (May 17, 2025), Ocean County Prosecutor&#39;s Office (2021 arrest; 2025 plea announcement), WOBM (May 16, 2025), Asbury Park Press (October 2021; March 2025).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;special-needs-victim&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 181, &#34;case_id&#34;: 163, &#34;case_name&#34;: &#34;Denise Keesee&#34;, &#34;source&#34;: &#34;OregonLive/The Oregonian / KATU / KSL.com / Valley Times / Oregon TSPC&#34;, &#34;date&#34;: &#34;2014-10-24&#34;, &#34;text&#34;: &#34;Denise Keesee, former teacher at Sherwood High School, Washington County OR, sentenced October 24, 2014 to 14 months in prison after her probation was revoked for violating sex offender conditions.\n\nKeesee had sexual contact including intercourse with at least two male students (ages 16) during 2012\u20132013. Discovered through a school misconduct investigation. Her husband, a Sherwood Police Department officer, faced accusations of intimidation and attempted cover-up; he was cleared in a subsequent investigation.\n\nTurned herself in June 17, 2013 following indictment. Pleaded guilty February 10, 2014 to two counts of second-degree sexual abuse (reduced from original six counts). Initial sentence April 21, 2014: 30 days jail, 5 years probation, sex offender registration (KATU, April 21, 2014). Arrested October 2014 for probation violation \u2014 specifically, failing to disclose presence in an area where minors gather, as required by sex offender probation conditions. Probation revoked; sentenced to 14 months in prison October 24, 2014 (OregonLive, KSL.com).\n\nCivil lawsuit filed by victim and family against Keesee and Sherwood School District for $5.1\u20135.5 million (failure to protect); moved to federal court in 2015 (Valley Times, August 17, 2015; OregonLive, June 22, 2015). Oregon TSPC final order also issued.\n\nSources: OregonLive/The Oregonian (October 24, 2014; June 22, 2015), KATU (April 21, 2014), KSL.com (October 24, 2014), Valley Times (August 17, 2015), Oregon TSPC Final Order, Washington County Sheriff&#39;s Office (June 17, 2013).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 182, &#34;case_id&#34;: 164, &#34;case_name&#34;: &#34;Andrea Baber&#34;, &#34;source&#34;: &#34;News-Review (Roseburg) / FOX News / Register-Guard&#34;, &#34;date&#34;: &#34;2019-02-13&#34;, &#34;text&#34;: &#34;Andrea Nicole Baber, 30, former teacher at Logos Christian Academy in Springfield OR, sentenced February 13, 2019 to 20 months in state prison after pleading guilty to third-degree rape and other charges.\n\nBaber had a sexual relationship with a 15-year-old male student beginning in 2016, lasting more than a year. She also smoked marijuana with the victim and on at least one occasion provided him vodka.\n\nDiscovered December 12, 2017 when an anonymous email with photos of Baber and the boy was sent to the victim&#39;s parents; his father reported to the Douglas County Sheriff&#39;s Office the same day. Separately, Baber&#39;s husband walked in on her and the teen in bed (FOX News/Register-Guard, December 19, 2017). Baber was arrested days later at her home in Cottage Grove.\n\nDeputies executed a search warrant at Baber&#39;s home on Territorial Highway, recovering smoking devices and sex toys described by the victim (Douglas County Circuit Court affidavit).\n\nSources: News-Review (Roseburg) \u2014 February 13, 2019 sentencing; FOX News/FOX 5 DC \u2014 December 19, 2017 arrest; Register-Guard.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;husband-reported&#34;, &#34;physical-evidence&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;long-term-relationship&#34;, &#34;private-school&#34;]}, {&#34;id&#34;: 183, &#34;case_id&#34;: 165, &#34;case_name&#34;: &#34;Sarah Huggins Logan&#34;, &#34;source&#34;: &#34;Athens Banner-Herald / WGAU / Athens News Matters / GBI / Madison County Journal&#34;, &#34;date&#34;: &#34;2018-03-02&#34;, &#34;text&#34;: &#34;Sarah Huggins Logan (also Sarah Logan, Sarah Huggins-Logan), 36, former teacher at Madison County High School in Danielsville GA, sentenced March 2, 2018 to 5 years probation after pleading guilty to one count of felony sexual battery and one count of misdemeanor sexual battery.\n\nArrested May 17, 2017 following a student disclosure and referral to the Georgia Bureau of Investigation (GBI, May 2017 announcement; Athens Banner-Herald, May 18, 2017). Sexual relationship with 17-year-old male student in 2016\u20132017, including at school and off-campus locations. Fired by Madison County School District upon arrest.\n\nPleaded guilty February 2018 (WGAU, February 2018). Sentenced March 2, 2018: 5 years probation, no jail, sex offender registration for 10 years, sex offender treatment, community service. First offender status considered. Sentence drew criticism locally for leniency (Athens News Matters, Madison County Journal, March 2018).\n\nSources: Athens Banner-Herald (May 18, 2017; March 2, 2018), WGAU Radio (February 2018), Athens News Matters (March 2018), Georgia Bureau of Investigation (May 2017), Madison County Journal (2017\u20132018).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 184, &#34;case_id&#34;: 166, &#34;case_name&#34;: &#34;Melissa Williams&#34;, &#34;source&#34;: &#34;KTRE / Lufkin Daily News / YourConroeNews&#34;, &#34;date&#34;: &#34;2012-09-18&#34;, &#34;text&#34;: &#34;Melissa Williams (also Melissa Beth Williams), 46, former teacher at Huntington High School (Huntington ISD), back in jail September 2012 after probation violations.\n\nWilliams was originally arrested April 11, 2008 after a CPS tip to Huntington Police Department. Convicted June 2008; sentenced January 9, 2009 to 10 years probation (with 6 months in jail as condition). Prior violations in 2010 \u2014 possessing pornography, contact with a child under 17, associating with a known felon, possessing alcohol \u2014 were addressed through additional probation terms.\n\nTurned herself in to Angelina County Jail September 17, 2012, held without bond. Probation officer Dustin Fore (Angelina County Adult Probation, Specialized Casework Services) filed violation report citing: (1) discharged from sex offender treatment program for failing multiple polygraph tests; (2) internet access without officer permission; (3) association with Daniel McGinty, 26, wanted on felony warrants for drug possession and failure to register as a sex offender. McGinty had been convicted at age 15 for aggravated sexual assault of a 9-year-old girl; previously given shock probation after 6 months of a prison sentence. McGinty believed to be in the Houston-Conroe area.\n\nProbation revoked October 18, 2012; sentenced to 8 years in prison (Lufkin Daily News, KTRE, October 18, 2012).\n\nSources: KTRE (September 18, 2012; October 18, 2012), Lufkin Daily News (January 9, 2009; October 18, 2012), YourConroeNews (September 18, 2012).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;]}, {&#34;id&#34;: 185, &#34;case_id&#34;: 167, &#34;case_name&#34;: &#34;Christie Dunbar Oster&#34;, &#34;source&#34;: &#34;KLFY News 10 / KATC / Lafayette Parish Sheriff&#39;s Office / The Advocate&#34;, &#34;date&#34;: &#34;2026-01-29&#34;, &#34;text&#34;: &#34;Christie Elizabeth Dunbar Oster, 38, former math teacher at Broussard Middle School (Lafayette Parish School System), arrested January 28, 2026 at the school by the Lafayette Parish Sheriff&#39;s Office. Charged with indecent behavior with juveniles and carnal knowledge of a juvenile (felony charges).\n\nOster was the 2025\u20132026 Teacher of the Year nominee for Lafayette Parish at time of arrest \u2014 context that drew significant media attention. Victim is a juvenile male student; exact age not publicly disclosed per Louisiana victim privacy law. Lafayette Parish School System placed her on immediate administrative leave.\n\nCase active as of March 10, 2026; no plea or sentencing reported.\n\nSources: Lafayette Parish Sheriff&#39;s Office (January 28, 2026 arrest announcement), KLFY News 10 (January 29, 2026), KATC (January 28\u201329, 2026), The Advocate (January 2026).&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 186, &#34;case_id&#34;: 168, &#34;case_name&#34;: &#34;Ashley Blumenshine&#34;, &#34;source&#34;: &#34;Patch (Plainfield) / 6abc / Chicago-area coverage&#34;, &#34;date&#34;: &#34;2013-04-19&#34;, &#34;text&#34;: &#34;Ashley Blumenshine, 30, former gym teacher at Plainfield North High School, sentenced April 19, 2013 to 11 days in jail (30-day sentence halved by day-for-day credit; 4 days already served pre-bond) after pleading guilty to traveling to meet a minor, a Class 3 felony.\n\nBlumenshine, 27 at the time of offense, had texted a 16-year-old male junior to arrange a meeting in January 2011. Plainfield police officers noticed two cars parked alone in the Kohl&#39;s parking lot on Route 59; when they investigated, found Blumenshine in the driver&#39;s seat and the student in the back seat partially dressed. Both admitted to having just had sex (6abc, January 5, 2011; Plainfield Police Chief Bill Doster).\n\nOriginal charge of aggravated criminal sexual abuse was dropped; replaced with traveling to meet a minor. Sex offender evaluation indicated \&#34;very low risk\&#34; of reoffending. At sentencing, Blumenshine wept and apologized: \&#34;I will forever be humbled and remorseful for my actions.\&#34; She was handcuffed and led to the Will County jail. Also placed on 2 years sex offender probation and 10 years on the Illinois Sex Offender Registry. Defense attorney George Lenard; ASA Frank Byers. (Patch/Joseph Hosey, April 19, 2013.)\n\nSources: Patch Plainfield (April 19, 2013 sentencing by Joseph Hosey), 6abc (January 5, 2011 arrest).&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;no-prison&#34;, &#34;physical-evidence&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 187, &#34;case_id&#34;: 169, &#34;case_name&#34;: &#34;Lindsey Jarvis&#34;, &#34;source&#34;: &#34;WDRB Louisville / WLKY / WHAS11 / Courier-Journal / Kentucky DOC&#34;, &#34;date&#34;: &#34;2019-12-13&#34;, &#34;text&#34;: &#34;Lindsey Jarvis, former teacher at North Hardin High School and Radcliff Middle School in Hardin County, Kentucky, sentenced December 13, 2019 to 5 years in prison after pleading guilty October 2019 to one count of sexual abuse in the first degree.\n\nJarvis, 27 at arrest, had an ongoing sexual relationship with a 14-year-old male student spanning her tenure at two Hardin County schools; acts occurred at school, her home, and other locations. She was a married mother at the time.\n\nArrested January 12, 2018 (WDRB, January 12, 2018) on charges of rape, sodomy, sexual abuse, and unlawful use of electronic means to induce a minor. Indicted February 2018. Pleaded guilty October 2019 to a single first-degree sexual abuse count \u2014 a significant reduction (WLKY, October 2019). Sentenced December 13, 2019 (WDRB, WHAS11). Probation violation in 2020\u20132021 led to additional incarceration. Full release approximately 2023\u20132024 per Kentucky DOC records.\n\nCivil lawsuit filed by victim and family against Hardin County Schools for failure to protect (Courier-Journal, 2018\u20132020 coverage).\n\nSources: WDRB Louisville (January 12, 2018; December 13, 2019), WLKY (October 2019), WHAS11 (December 13, 2019), Courier-Journal (2018\u20132020), Kentucky Department of Corrections (parole/release records).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 188, &#34;case_id&#34;: 170, &#34;case_name&#34;: &#34;Lindsay Himmelspach&#34;, &#34;source&#34;: &#34;Chico Enterprise-Record / KCRA&#34;, &#34;date&#34;: &#34;2017-06-07&#34;, &#34;text&#34;: &#34;Lindsay Himmelspach, 34, former physical education teacher at Las Plumas High School (and Oroville High School), Butte County CA, ordered June 7, 2017 to serve 60 days in jail and register as a sex offender after admitting to a probation violation.\n\nHimmelspach was accused of having sexual relationships with two 17-year-old male students \u2014 one from Las Plumas High School, one from Prospect High School \u2014 during summer 2015, away from school premises. The relationships included sharing nude photographs via electronic devices. She had taught in the district approximately 10 years.\n\nArrested (approximately fall 2015) on six counts: two counts of unlawful sexual intercourse with a minor, two counts of communicating with a minor for purposes of committing sexual acts, and two counts of communicating with a minor to commit a lewd or lascivious act. Bail: $90,000. (KCRA report.)\n\nPleaded guilty June 2016 to two counts of unlawful sex with a minor; sentenced to three years probation with no sex offender registration required. Judge James Reilley had warned registration would be imposed upon violation.\n\nProbation violated March 2017 \u2014 accused of stealing pain medication from a home during work as a housekeeper (drug-related). Admitted violation April 12, 2017. Sentenced June 7, 2017: 60 days jail, sex offender registration required, probation reinstated. Defense attorney Grady Davis argued the non-sexual violation did not warrant registration; Judge Reilley disagreed. (Chico Enterprise-Record / Andre Byik, June 7, 2017.)\n\nSources: Chico Enterprise-Record (June 7, 2017, Andre Byik), KCRA (arrest report).&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;drugs&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 189, &#34;case_id&#34;: 171, &#34;case_name&#34;: &#34;Meredith Kane&#34;, &#34;source&#34;: &#34;Lawrence Journal-World / Lisa Horn&#34;, &#34;date&#34;: &#34;2007-07-02&#34;, &#34;text&#34;: &#34;Former Lawrence High School (LHS) teacher pleads guilty to sex with student.\n\nMeredith Kane, 24, in her first year of teaching at LHS, arrested March 16, 2007 for having sexual relations with a 15-year-old male student. Acts occurred between August 2006 and mid-March 2007 in Douglas County.\n\nPleaded guilty July 2, 2007 before Judge Stephen Six in Douglas County District Court to one count of aggravated indecent liberties with a child. Kane told the judge: \&#34;During that time period, I did have sexual intercourse (with the victim) in Douglas County.\&#34; A second count of aggravated indecent liberties and two counts of criminal sodomy were dismissed.\n\nDA Charles Branson: \&#34;Simply put, she plead guilty to the most severe charge she could plea to. We&#39;re pretty happy getting a guilty plea to the primary offense.\&#34; Defense attorney James Rumsey sought access to the victim&#39;s psychological records (hearing scheduled July 23, 2007). Sentencing scheduled October 12, 2007; possible range 55\u2013247 months in prison.\n\nSource: Lawrence Journal-World (Lisa Horn, July 2, 2007).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 190, &#34;case_id&#34;: 171, &#34;case_name&#34;: &#34;Meredith Kane&#34;, &#34;source&#34;: &#34;Lawrence Journal-World / Interested Participant blog&#34;, &#34;date&#34;: &#34;2007-12-19&#34;, &#34;text&#34;: &#34;Meredith L. Kane, 25, former English teacher at Lawrence High School, sentenced December 19, 2007 to 59 months in prison.\n\nAfter her July 2, 2007 guilty plea (one count aggravated indecent liberties with a child), Kane was re-arrested August 27, 2007 for violating bond conditions by contacting the victim; held until sentencing. A psychologist&#39;s report on her bipolar diagnosis was introduced in October 2007 proceedings (LJWorld, October 29, 2007); defense argued the condition impaired her judgment. Judge rejected the argument and imposed the 59-month prison term at sentencing December 19, 2007. Sex offender registration required.\n\nSources: Lawrence Journal-World (July 2\u20133, 2007 plea; August 28, 2007 bond violation; October 29, 2007 psych report; December 19, 2007 sentencing), Interested Participant blog (December 20, 2007).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;sex-offender-registration&#34;, &#34;surveillance&#34;]}, {&#34;id&#34;: 191, &#34;case_id&#34;: 172, &#34;case_name&#34;: &#34;Brooke Dinkel&#34;, &#34;source&#34;: &#34;Kansas Supreme Court / Salina Post / KAKE News / Hays Post / Salina Journal / Criminal Legal News&#34;, &#34;date&#34;: &#34;2022-01-26&#34;, &#34;text&#34;: &#34;Brooke Danielle Dinkel, former counselor at Smoky Valley Middle School, Lindsborg KS, pleaded no contest January 26, 2022 to contributing to child misconduct \u2014 resolving a case that had previously resulted in a 13.75-year prison sentence now vacated on appeal.\n\nCharged June 2013 with rape and aggravated criminal sodomy involving a 13-year-old male student. Convicted by jury June 2014 on two counts of rape of a child under 14; sentenced December 4, 2014 to 165 months (~13.75 years) concurrent (Salina Journal, 2014).\n\nKansas Court of Appeals affirmed March 23, 2018. Kansas Supreme Court vacated convictions September 24, 2021 (State v. Dinkel, No. 113,705; KAKE News, Hays Post, September 24\u201325, 2021): trial counsel was ineffective for failing to request a \&#34;voluntary act\&#34; jury instruction. Defense had argued the 13-year-old forcibly raped and blackmailed Dinkel; without the instruction, the jury could not evaluate whether her participation was involuntary. Released pending retrial.\n\nRetrial resolved via no-contest plea January 26, 2022 to contributing to child misconduct (Salina Post, January 27, 2022). No additional prison; approximately 6 years 9 months served on the vacated sentence.\n\nSources: Kansas Supreme Court opinion (State v. Dinkel, No. 113,705, September 24, 2021), Salina Post (January 27, 2022), KAKE News (September 25, 2021), Hays Post (September 24, 2021), Salina Journal (December 2014), Criminal Legal News (January 15, 2022).&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;guilty&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;appeal&#34;, &#34;charge-reduction&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 192, &#34;case_id&#34;: 172, &#34;case_name&#34;: &#34;Brooke Dinkel&#34;, &#34;source&#34;: &#34;Kansas Court of Appeals / Kansas Supreme Court (State v. Dinkel, No. 113,705)&#34;, &#34;date&#34;: &#34;2021-09-24&#34;, &#34;text&#34;: &#34;Factual summary from State v. Dinkel appellate record (Kansas Supreme Court, No. 113,705, September 24, 2021):\n\nDinkel hired as counselor at Smoky Valley Middle School for 2012\u201313 school year. K.H. was an 8th grader (age 13), 6&#39;2\&#34; and approximately 170 lbs. His aunt, a family friend of Dinkel&#39;s, asked her to check on him. Dinkel began counseling K.H. and quickly escalated contact: pulling him from class without justification, creating a boys&#39; club over teacher objections to include him, sneaking food into detention, hiring him to work at her home, playing Xbox, going to meals, and renting a hotel room for an overnight. Faculty found K.H. locked in Dinkel&#39;s office with paper covering the windows on multiple occasions. Principal warned her directly; other staff warned her she was crossing professional lines. She continued, enlisting a new teacher unaware of the warnings.\n\nRelationship turned sexual November/December 2012. Dinkel&#39;s own testimony placed first intercourse December 26, 2012, which she claimed was rape by K.H. She bragged to friends throughout about her \&#34;young boyfriend,\&#34; saying he was 19, calling him \&#34;the absolute best sex ever.\&#34; She showed friends photos of them kissing, texted from a friend&#39;s phone \&#34;this is ur gf bitch\u2014love u,\&#34; and described sexual encounters in graphic detail. February 2013 text to a friend: \&#34;Well I&#39;ve been with a really young guy... He is the absolute best sex ever... he just turned 19\u2014yes I know that&#39;s horrible... he looks so young but he is defiantly a man.\&#34; She bought K.H. clothing, an iPad, Airsoft games, cash, and a credit card.\n\nK.H.&#39;s aunt warned Dinkel to stay away. March 9, 2013: husband Jayson Dinkel found a love note to K.H. under the couch. March 10: Jayson came home at his normal time \u2014 Daylight Saving had begun and clocks had not all been updated \u2014 and found K.H. on the couch with pants and underwear at his ankles. Dinkel later laughed with a friend about Jayson catching them together.\n\nMarch 26, 2013: Dinkel delivered pizza to K.H. in in-school suspension; stood outside door while principal questioned him; K.H. was expelled. That evening K.H.&#39;s aunt reported concerns to the principal. March 27: K.H. confirmed sexual conduct with school officials. Same day, Dinkel texted K.H. warning him the school would try to turn them against each other and saying \&#34;I know you love me and aren&#39;t going to say anything.\&#34; She texted friends she thought the situation would \&#34;blow over because the police had not contacted her yet.\&#34;\n\nNo faculty member ever observed Dinkel express fear of K.H. At no point did Dinkel tell friends K.H. had raped her. She never told her husband K.H. had raped her when he caught them together.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;dna-evidence&#34;, &#34;prior-warning-ignored&#34;, &#34;physical-evidence&#34;, &#34;evidence-tampering&#34;, &#34;long-term-relationship&#34;, &#34;surveillance&#34;, &#34;gifts&#34;, &#34;cash&#34;, &#34;love-letters&#34;, &#34;on-campus&#34;, &#34;victim-blaming&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 193, &#34;case_id&#34;: 173, &#34;case_name&#34;: &#34;Makenzie Johnson&#34;, &#34;source&#34;: &#34;KCCI / Des Moines Register / KCRG / WHO13&#34;, &#34;date&#34;: &#34;2019-05-30&#34;, &#34;text&#34;: &#34;Makenzie Johnson, 38, former special-needs teacher at Harding Middle School, Des Moines IA, arrested May 30, 2019.\n\nCharged with lascivious acts with a child, solicitation to commit a felony, assault with intent to commit sexual abuse, third-degree sex abuse, and dissemination/exhibition of obscene materials to a minor. Victim was a 14-year-old male student not in her classroom. First incident: Johnson picked the boy up from a sporting event. Second incident: at her home watching TV; her husband unexpectedly walked in during the attempt. She sent nude photographs to the victim via Snapchat and berated him via text when he declined her advances. Police Sgt. Paul Parizek: \&#34;He tried to rebuff her advances and she continued on.\&#34;\n\nDistrict placed Johnson on leave April 15, 2019 upon learning of the investigation; she resigned May 17, 2019. Bond: $25,000 cash-only.\n\nParent Sabrina Westmoreland \u2014 whose nonverbal special-needs son was in Johnson&#39;s class \u2014 told KCCI she learned of the arrest from a news app, not the school, and expressed concern about potential unreported abuse of nonverbal students.\n\nPleaded guilty January 2020 to one count of sexual exploitation by a school employee; remaining charges dismissed. Sentenced August 21, 2020 to 2 years in prison; sex offender registration required. (KCCI, February 28, 2020 plea; Des Moines Register, August 21, 2020 sentencing.)\n\nCivil lawsuit: district found not liable November 8, 2021; settled August 15, 2023. (Des Moines Register.)\n\nSources: KCCI (May 31, 2019; February 28, 2020), Des Moines Register (August 21, 2020; November 8, 2021; August 15, 2023), KCRG (May 31, 2019), WHO13 (May 31, 2019).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;, &#34;special-needs-victim&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 194, &#34;case_id&#34;: 174, &#34;case_name&#34;: &#34;Stefanie Regine Kelsey&#34;, &#34;source&#34;: &#34;Messenger News / WHO 13&#34;, &#34;date&#34;: &#34;2022-03-14&#34;, &#34;text&#34;: &#34;East Sac County teacher arrested for alleged sexual abuse of student\n\nA former East Sac County School District teacher has been arrested on charges of third-degree sexual abuse involving a 15-year-old male student. Stefanie Regine Kelsey, 34, of Sac City, Iowa was arrested March 14, 2022. The Sac County Sheriff was notified by a concerned parent on March 10, 2022. Kelsey resigned from the school district immediately upon the start of the investigation. She was charged with three counts of third-degree sexual abuse and held on a $30,000 bond.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 195, &#34;case_id&#34;: 174, &#34;case_name&#34;: &#34;Stefanie Regine Kelsey&#34;, &#34;source&#34;: &#34;Court records / local reporting&#34;, &#34;date&#34;: &#34;2023-02-01&#34;, &#34;text&#34;: &#34;Kelsey pleaded guilty in February 2023 to third-degree sexual abuse and sexual exploitation by a teacher. She was sentenced to 10 years on the sexual abuse count and 5 years on the exploitation count, to run concurrently, for an effective sentence of 10 years. Sex offender registration required.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 196, &#34;case_id&#34;: 175, &#34;case_name&#34;: &#34;Erin Ward&#34;, &#34;source&#34;: &#34;KETV (Omaha)&#34;, &#34;date&#34;: &#34;2025-01-30&#34;, &#34;text&#34;: &#34;A former substitute teacher in Omaha accused of sexually assaulting a minor was sentenced Wednesday. Erin Ward received three years probation for felony child abuse. In November, she pleaded no contest to the amended charge, and was found guilty. Ward was arrested last April after Douglas County deputies responded to a suspicious vehicle parked in the area with its lights on. After spotting the vehicle, deputies said they saw a nude male climb from the back of the vehicle to the front and speed off without headlights on. According to court documents, when deputies got to the vehicle, Ward was lying down in the back and putting clothes on. Ward stated the driver was a student at Omaha Burke High School and that she was a substitute teacher with both Omaha Public Schools and Millard Public Schools. During interviews with deputies, court documents said Ward admitted to having sex with the victim on multiple occasions. She said the relationship had been ongoing for a few months and that they only had sex in her vehicle.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 197, &#34;case_id&#34;: 176, &#34;case_name&#34;: &#34;Ashley Nicole Anderson&#34;, &#34;source&#34;: &#34;Local Iowa news (Parkersburg)&#34;, &#34;date&#34;: &#34;2012-09-01&#34;, &#34;text&#34;: &#34;A former Iowa teacher faces charges after admitting to sexual misconduct with students. On Friday, police said Ashley Nicole Anderson, 24, turned herself in to the Butler County Sheriff&#39;s Office. Court records show that Anderson admitted to engaging in sexual conduct with four students -- ages 16-18 -- during the 2011-2012 school year. According to an affidavit, Anderson admitted to activity ranging from sending nude photos of herself to the students via text messages to sexual intercourse with one of the victims. Anderson, who taught high school math classes for the Aplington-Parkersburg Community School District since 2010, resigned from her position in the fall of 2012. Anderson faces four counts of sexual exploitation by a school employee.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;]}, {&#34;id&#34;: 198, &#34;case_id&#34;: 177, &#34;case_name&#34;: &#34;Ashley Nicole Anderson&#34;, &#34;source&#34;: &#34;Quad-City Times / KCRG / KWQC / Des Moines Register&#34;, &#34;date&#34;: &#34;2020-10-01&#34;, &#34;text&#34;: &#34;Ashley Nicole Anderson (also referred to as Ashley Anderson), former teacher at North Scott High School, North Scott Community School District, Eldridge, Scott County, Iowa. Arrested May 31, 2019 following investigation and her admission of misconduct with two male students ages 14 and 15 during the 2018-2019 school year. Original charges included multiple counts of lascivious acts with a child, solicitation to commit a felony, and assault with intent to commit sexual abuse. Pleaded guilty August 2020 to one count of sexual exploitation by a school employee. Sentenced October 2020 to 2 years in prison. Sex offender registration required. Civil lawsuit filed by victims and families against North Scott Community School District. Age 24 at arrest; 25 at sentencing.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 199, &#34;case_id&#34;: 178, &#34;case_name&#34;: &#34;Zobella Brazil Vinik&#34;, &#34;source&#34;: &#34;KGUN9 (Tucson)&#34;, &#34;date&#34;: &#34;2022-05-13&#34;, &#34;text&#34;: &#34;The Tucson Police Department Child Sexual Assault Unit responded to an inappropriate relationship between a school counselor and 15-year-old student on May 3, 2022. The counselor worked at Tucson High School. The counselor has been identified as 29-year-old Zobella Brazil Vinik. On May 11, 2022, Vinik turned herself in to detectives. Forensic investigators confirmed the teenager had sexual relations with Vinik. According to an interim complaint, the relationship turned sexual in February 2022. The 15-year-old confessed to having intercourse and engaging in other sexual activity multiple times. The teenager claimed they were in love, but knew the relationship was bad because of Zobella&#39;s age. Someone close to Zobella alerted authorities the teenager was living with the counselor for some time. Vinik resigned from TUSD on May 5, 2022.&#34;, &#34;tags&#34;: [&#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 200, &#34;case_id&#34;: 178, &#34;case_name&#34;: &#34;Zobella Brazil Vinik&#34;, &#34;source&#34;: &#34;KVOA (Tucson)&#34;, &#34;date&#34;: &#34;2023-09-25&#34;, &#34;text&#34;: &#34;Former Tucson High School counselor Zobella Vinik was sentenced Monday. She pled guilty last month to having sexual relations with a teenage student. After about 45 minutes, Zobella Vinik was sentenced to a year in jail and 15 years of probation. Vinik was charged with two felonies: sexual conduct with a minor and child abuse. The child was a 15-year-old student at Tucson High, where Vinik was a guidance counselor. At sentencing the courtroom was packed. Nearly a dozen were there to support Vinik; the victim&#39;s family was also present. The victim&#39;s step-mother spoke on behalf of her daughter, conveying the victim&#39;s statement that she wants all of this to go back to how her life was before. Both lawyers asked for the same agreed sentence. The judge ruled in support: one year in Pima County Jail, 15 years of probation, and fines and fees.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;female-victim&#34;]}, {&#34;id&#34;: 201, &#34;case_id&#34;: 179, &#34;case_name&#34;: &#34;Amanda Hubble&#34;, &#34;source&#34;: &#34;KFSN ABC30 (Fresno)&#34;, &#34;date&#34;: &#34;2022-04-20&#34;, &#34;text&#34;: &#34;A Clovis High School teacher arrested for sexual contact with one of her students was busted because of a locked house when the boy tried to sneak home, according to a search warrant. In her first full year at Clovis High School, Amanda Hubble is accused of getting sexually involved with one of her 17-year-old students. Police filed a search warrant to recover Hubble&#39;s bed sheets, comforter, and clothing. Detectives said the boy described two sexual encounters \u2014 one in Hubble&#39;s car in November and another in her house in December, two days before her arrest. Phone and Snapchat records show Hubble and the boy professing love for each other. Their secret unraveled when he came home and found the door locked and his father ready to confront him. The next day the boy told a friend about the relationship; Hubble told another student. Hubble faces four felony sex charges. Teaching credential suspended; placed on unpaid leave by CUSD.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;social-media&#34;, &#34;physical-evidence&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 202, &#34;case_id&#34;: 179, &#34;case_name&#34;: &#34;Amanda Hubble&#34;, &#34;source&#34;: &#34;Fresno Bee&#34;, &#34;date&#34;: &#34;2022-07-27&#34;, &#34;text&#34;: &#34;Former Clovis music teacher Amanda Hubble was sentenced Wednesday by Fresno County Superior Court Judge Jonathan Skiles to two years of probation and sex offender registration for at least 10 years. Hubble previously pleaded no contest to one count of unlawful sexual intercourse and one count of oral copulation of a person under 18. Skiles told Hubble she violated her position of trust and took advantage of a student. The victim&#39;s mother read a victim impact statement describing severe harm: weight loss, antidepressant side effects, academic failure, job loss, loss of friends, and suicidal ideation. The family requested the maximum sentence of 3 years 8 months. Defense attorney W. Kent Hamlin; prosecutor Sandra Garcia. Hubble was no longer employed by CUSD after her conviction; teaching credential also suspended.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 204, &#34;case_id&#34;: 181, &#34;case_name&#34;: &#34;Trisha Phillippe&#34;, &#34;source&#34;: &#34;WMBD / 25 News (Peoria, IL)&#34;, &#34;date&#34;: &#34;2022-04-07&#34;, &#34;text&#34;: &#34;A Woodford County teacher is facing felony charges for allegedly having an inappropriate relationship with a student. Trisha Phillippe \u2014 a study hall teacher at Roanoke-Benson High School \u2014 faces charges of Aggravated Criminal Sexual Abuse and Distributing Explicit Material to a Minor. A 14-year-old student told investigators he received explicit text messages and photos from Phillippe \u2014 and also was kissed by her at school \u2014 all on several occasions, ending last Friday. Phillippe reportedly confessed but has pleaded not guilty. She is believed to have resigned and is reportedly hospitalized and receiving mental health treatment.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 205, &#34;case_id&#34;: 181, &#34;case_name&#34;: &#34;Trisha Phillippe&#34;, &#34;source&#34;: &#34;WMBD / 25 News (Peoria, IL)&#34;, &#34;date&#34;: &#34;2022-10-12&#34;, &#34;text&#34;: &#34;A Roanoke woman has pleaded guilty to a lesser charge in connection to allegations she had an inappropriate relationship with a student while she worked as a teacher&#39;s aide. Trisha Phillippe, 40, pleaded guilty in Woodford County to Criminal Sexual Abuse, and h
