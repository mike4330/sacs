st Friday.\n\nAccording to The New York Post,26-year-old Hailey Clifton-Carmack of Waynesville, Missouri was sentenced to four years in prison after she pleaded guilty to sexually abusing a 16-year-old student while others served as \&#34;lookouts.\&#34;\n\n(Pulaski County Jail)\n(Pulaski County Jail)\n\nThe publication reported that Clifton-Carmack, a divorced mother of two and former math teacher at Laquey High School, pleaded guilty to the charges back in September.\n\nKJLU reported the charges of endangering the welfare of a child, second-degree statutory rape and fourth-degree child molestation were dismissed in exchanged for her plea.\n\nPer the station Circuit Judge John Beger ordered Clifton-Carmack to complete a sex-offender rehabilitation program, saying he would check-up on her behavior and progress in 90 days. The judge said that if Clifton-Carmack does well, her sentence could be suspended and she would be put on probation.\n\nThe Post reported that Clifton-Carmack was arrested back in January after her relationship with the teen was reported to a school resource officer by another student, who showed authorities images of the victim&#39;s scratched back.\n\n(Google Maps)\n(Google Maps)\n\nAccording to the publication, the former math teacher was accused of abusing the victim in the witness&#39;s driveway. The witness also told authorities that Clifton-Carmack had been disciplined by school officials previously for getting too close to students, per The Post, which reported that she initially denied having a relationship with the victim when questioned by police in December of 2023.\n\nThe 26-year-old left for Texas for the holidays and allegedly told her roommates that she would not return, according to The Post, citing a report from authorities. Clifton-Carmack was located in Texas a month later and taken into custody before being returned to Missouri, KJLU reported.\n\nAccording to The Post, the victim&#39;s father, Mark Creighton, was also arrested esday and testified, reading quickly from a statement.\n\n\&#34;I wish I could make it clear how regretful I am for what has occurred,\&#34; Peterson said looking down as she read. \&#34;If I could say one thing to the victim, it would have to be that I&#39;m sorry, two words used too often without much meaning but I can honestly say with everything in my heart that I mean it to its truest definition.\&#34;\n\nPeterson said she hopes to atone for what she did.\n\n\&#34;It&#39;s all a huge misfortune what has happened. And I hope I&#39;ll be able to make things right by staying on medication and attending regular therapy.\&#34;\n\nShe said she knows her actions are unforgivable.\n\n\&#34;Teaching was the most meaningful thing in my life and it&#39;s all I wanted to do growing up,\&#34; Peterson said. \&#34;Knowing I was in a position of power and misused that power to negatively influence one&#39;s life is a morbid thought I have to think about all day every day.\n\nPeterson, 27, pleaded guilty Oct. 16 to lewd and lascivious battery sex act with a child, a second-degree felony, and electronic transmission of material harmful to minors, a third-degree felony. As part of the plea agreement Peterson faced between five and 10 years in prison and probation.\n\nBut defense attorneys, Aaron Delgado and William Hathaway, could ask for a lower sentence, which they did citing Peterson&#39;s mental health struggles with bipolar disorder. They asked that she not be sentenced to prison.\n\nThe prosecutor asked for six to 10 years in prison.\n\nCircuit Judge Raul Zambrano cited Peterson&#39;s mental illness in going below the minimum five-year prison sentence.\n\n\&#34;You are mentally ill and you&#39;re going to be mentally ill for the rest of your life,\&#34; Zambrano said.\n\nBut he said she had to pay for her mistake.\n\n\&#34;Your actions have life long consequences to you and for this child for the rest of his life,\&#34; Zambrano said. \&#34;That memory will never be taken bation after sexually assaulting a student.\n\nOn Tuesday, Harris County Judge George Glass handed Marka Bodine her sentence, which is not sitting well with the district attorney&#39;s office.\n\nBodine was arrested and charged with continuous sexual abuse of a child in April 2021 after engaging in inappropriate sexual behavior with the student for three years. The student was between 12 and 15 years old at the time.\n\nDocuments state the student was a 6th grader in Bodine&#39;s class. The student said Bodine befriended him by playing Fortnite and she later began texting him\n\nThe two then started engaging in intercourse back in April 2018, shortly after the student had turned 13, according to court documents.\n\nBodine also moved into the apartment complex where the student lived after her divorce. When the student and his family moved to Houston&#39;s southside in July 2018, Bodine would also drive to his home two to four times a month until March 2021.\n\nShe also admitted to sending 25 to 40 explicit photographs of herself to the teen between April 2020 to February 2021, documents state.\n\nDuring court on Tuesday, the district attorney&#39;s office asked for Bodine to get 20 to 40 years in prison because of the nature of the case. Instead, a judge gave her 60 days in jail and 10 years of probation. In addition to that, Bodine has to register as a sex offender and undergo therapy.\n\nDuring the hearing, the court heard from the victim, his parent, and Bodines doctor.\n\n\&#34;I think no small part of an explanation for this sentence may lie in any psych info they provided to the court,\&#34; Christopher Downey, a criminal defense attorney, said.\n\nDowney said the judge had to take that testimony into account, along with how likely she is to re-offend.\n\nOther societal factors may have also been at play.\n\n\&#34;By all accounts, this is an unusual outcome. I am sure that the gender of the person on trial, the fact that this was a woman accused of having sex id.\n\nNews of McAllister&#39;s arrest generated hundreds of comments on the sheriff&#39;s office&#39;s Facebook page. Parents expressed various emotions from sadness, outrage, concern and confusion.\n\nOnline records show she bonded out sometime later in the day. However, the investigation remains ongoing.\n\n\&#34;At this point in time, there&#39;s nothing to suggest that any force was used,\&#34; said Montgomery.\n\nInvestigators are looking into the possibility of multiple other victim students. They want anyone with information to call the YPSO tip line at 757-890-4999 or the anonymous Crime Line at 1-888-LOCK-U-UP. You could also leave a tip online.\n\n\&#34;What we are taking away as a positive from this is that someone became aware of these very serious allegations and took the time to report this to the school division, who then contacted us,\&#34; Montgomery added.\n\nBelow is the full statement from York County School Division issued Thursday, June 9:\n\nOn the evening of Wednesday, June 8, Tabb High School and division administrators were informed of an allegation of unprofessional conduct by a school employee involving a minor. We immediately reported the allegations to the York-Poquoson Sheriff&#39;s Office and turned the matter over to law enforcement.\n\nThe York County School Division and Tabb High School take the safety and well-being of our students seriously. Our hiring procedures involve mandatory and thorough background checks and fingerprint clearance. We expect that our staff conduct themselves in a professional manner at all times, and any time there is a question of safety or misconduct, we immediately investigate.\n\nThe division is committed to working closely with the Sheriff&#39;s Office in the ongoing investigation. The staff member will not be permitted on campus or other YCSD property while this investigation is ongoing and we will follow division policy regarding employment status.\n\nAs requested by the York-Poquoson Sheriff&#39;s Office, anyone with information pertaining to this case is asked to call the YPSO Tip Line at (757) 890-4999 or the Crime Line at 1-888-LOCK-U-UP.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;teacher&#34;, &#34;active&#34;, &#34;misdemeanor&#34;, &#34;virginia&#34;, &#34;multiple-victims&#34;]}, {&#34;id&#34;: 9, &#34;case_id&#34;: 8, &#34;case_name&#34;: &#34;Commonwealth v. Kristen McAllister&#34;, &#34;source&#34;: &#34;Virginia court record&#34;, &#34;date&#34;: &#34;2025-06-24&#34;, &#34;text&#34;: &#34;Case Number: CR22001892-01\nFiled: 10/18/2022\nCommenced by: Indictment\nLocality: COMMONWEALTH OF VA\nDefendant: MCALLISTER, KRISTEN CLAIRE\nSex: Female\nDOB: 11/08/****\nAddress: WILLIAMSBURG, VA 23188\nCharge: INDECENT ACT W/CHILD BY PARENT\nCode Section: 18.2-370.1\nCase Type: Felony / Class 6\nOffense Date: 11/01/2021\nArrest Date: 06/09/2022\nDefendant&#39;s Attorney: WALTRIP, BRANDON\n\nHearings:\n1. 11/15/2022 \u2014 Grand Jury \u2014 True Bill\n2. 12/15/2022 \u2014 To Be Set \u2014 Continued\n3. 03/16/2023 \u2014 Pre-Sentence Report \u2014 Joint Motion\n4. 03/30/2023 \u2014 Pre-Sentence Report \u2014 Continued\n5. 06/20/2023 \u2014 Status Hearing \u2014 Under Advisement\n6. 06/24/2025 \u2014 Under Advisement \u2014 Sentenced\n\nFinal Disposition:\nDisposition Code: Guilty\nDisposition Date: 06/24/2025\nConcluded By: Guilty Plea\nAmended Charge: CONTRIB TO DELIQ OF MINOR (18.2-371) \u2014 Misdemeanor\nSentence: 12 Month(s) jail; Sentence Suspended: 12 Month(s) [fully suspended]\nProbation: Unsupervised, 12 Month(s), begins upon sentencing\nCosts: $262.00&#34;, &#34;tags&#34;: [&#34;court-record&#34;, &#34;guilty-plea&#34;, &#34;amended-charge&#34;, &#34;suspended-sentence&#34;]}, {&#34;id&#34;: 10, &#34;case_id&#34;: 9, &#34;case_name&#34;: &#34;State v. Alexandria Vera&#34;, &#34;source&#34;: &#34;AP&#34;, &#34;date&#34;: &#34;2017-06-01&#34;, &#34;text&#34;: &#34;HOUSTON (AP) \u2014 A fired Houston-area middle school teacher who pleaded guilty last year to having a long-term sexual relationship with a 13-year-old boy who impregnated her has been sentenced to 10 years in prison.\n\nAlexandria Vera had hoped for probation.\n\nState District Judge Michael McSpadden said the sentence he imposed Friday was intended to send a message and make an example of her because he&#39;s aware of too many similar cases.\n\nThe 24-year-old taught English in the Aldine Independent School District in north Houston in 2015 when she met the student. Court documents showed the boy&#39;s parents didn&#39;t object to their relationship. Vera told an investigator they were \&#34;very supportive and excited\&#34; when she disclosed her pregnancy. According to court documents, she aborted the pregnancy after a child welfare investigator questioned her.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;teacher&#34;, &#34;texas&#34;, &#34;pregnancy&#34;, &#34;deterrence&#34;]}, {&#34;id&#34;: 11, &#34;case_id&#34;: 10, &#34;case_name&#34;: &#34;State v. Jennifer Fichter&#34;, &#34;source&#34;: &#34;YouTube AI summary&#34;, &#34;date&#34;: null, &#34;text&#34;: &#34;Former Polk County teacher Jennifer Fichter was sentenced to 22 years in prison for having sexual relationships with three of her 17-year-old students.\n\nKey Details of the Sentencing:\n\nThe Sentence: Fichter received 22 years, which is just three years less than the maximum 25-year sentence pushed for by the state.\n\nApology: Before sentencing, Fichter turned to face the families of her victims and apologized, expressing regret for her actions.\n\nThe Crime: The incidents occurred dozens of times in various locations, including her truck, hotels, and on the roof of the Florida Aerospace Academy.\n\nDiscovery: The situation came to light when a mother of one of the victims discovered text messages between her son and Fichter.\n\nImpact: The mother of a victim described the emotional turmoil and damage to her son during the court proceedings.\n\nFuture: Fichter will be 52 years old when she completes her full sentence.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;sentenced&#34;, &#34;teacher&#34;, &#34;florida&#34;, &#34;multiple-victims&#34;, &#34;near-maximum-sentence&#34;]}, {&#34;id&#34;: 12, &#34;case_id&#34;: 10, &#34;case_name&#34;: &#34;State v. Jennifer Fichter&#34;, &#34;source&#34;: &#34;Wikipedia&#34;, &#34;date&#34;: &#34;2014-04-22&#34;, &#34;text&#34;: &#34;Fichter was fired by the Polk County School Board on April 22, 2014, after her arrest for molesting three of her male students, all 17 years old, more than 37 times between August 2012 and April 2014.&#34;, &#34;tags&#34;: [&#34;court-record&#34;, &#34;arrest&#34;]}, {&#34;id&#34;: 13, &#34;case_id&#34;: 11, &#34;case_name&#34;: &#34;State v. Emily Nutley&#34;, &#34;source&#34;: &#34;OSV News&#34;, &#34;date&#34;: &#34;2025-06-10&#34;, &#34;text&#34;: &#34;(OSV News) \u2014 A former counselor at an Ohio Catholic high school was sentenced to prison June 10 for sexual battery of a student, with prosecutors alleging in a sentencing document she had groomed others.\n\nEmily Nutley will serve three years for having sexual relations with a then 17-year-old attending St. Xavier High School in Cincinnati.\n\nIn a June 10 statement, the school&#39;s president, Tim Reilly, thanked both the Springfield Township Police Department and the Hamilton County Prosecutor&#39;s Office for its \&#34;thorough work and cooperation\&#34; in the matter.\n\n\&#34;We appreciate the unwavering commitment of our faculty, staff, and administration for the safety, well-being, and dignity of every student entrusted to our care,\&#34; said Reilly.\n\nWhile noting that \&#34;we believe this case to be an isolated incident,\&#34; Reilly also strongly urged victims to contact the school and law enforcement \&#34;if any St. Xavier employee has failed you or someone you know in this regard.\&#34;\n\nThe 43-year-old Nutley had led a program for students needing academic help at the all-boys Jesuit school. The teen victim had been assigned to the program and in the fall of 2023 was working on academic tasks with Nutley, who initiated additional contact outside of school hours and physical contact beginning in November 2023.\n\nAccording to the teen, the abuse consisted of Nutley \u2014 then 42 and married with three children \u2014 texting him sexually explicit messages, sending nude photos of herself, and engaging in sexual encounters with him at least four times, both on and off the school campus.\n\nIn a Nov. 30, 2023 text, Nutley said it would be \&#34;wild\&#34; to perform a sex act on the teen \&#34;when the whole school is at Mass.\&#34; Court documents also indicated she had bought the teen food, provided him with a monthly \&#34;allowance\&#34; of $100, and at least once sent him answers ahead of a test.\n\nIn March 2024, the teen tried to halt the advances, but Nutley nonetheless persisted in contacting him via text.\n\nBy October 2024, rumors Nutley was engaging in sexual relations with a student had reached staff, who reported the matter to the school principal.\n\nThe teen disclosed the abuse to his parents that same month and subsequently met with school administrators.\n\nSt. Xavier announced on Oct. 11, 2024, that Nutley had been fired following an internal investigation. She was indicted shortly thereafter on six counts of sexual battery, a third-degree felony and faced a possible 15-year sentence if convicted on all charges.\n\nNutley pleaded guilty to two counts of sexual battery, receiving a sentence of three years of incarceration followed by five years of probation. She will also have to register as a Tier III sex offender every 90 days for life.\n\nIn a letter she wrote to Hamilton County Common Pleas Court Judge Jennifer Branch, Nutley said her behavior had made her \&#34;sick with shame,\&#34; adding, \&#34;I think every day about the impact of my actions \u2014 not just on the victim, but on his family, friends and the entire St. X (Xavier) community.\&#34;\n\nAssistant Prosecutor Elyse Deters read a victim impact statement by the teen during the sentencing, which said the abuse had left him \&#34;confused, lacking self-worth and depressed.\&#34;\n\n\&#34;I can&#39;t get away from this,\&#34; the teen wrote. \&#34;I have a hard time trusting people, especially authority figures.\&#34;\n\nAlthough Nutley was tearful in court, Branch told her, \&#34;I was looking for you to say that you acknowledge the harm that you caused this young man. \u2026 You pretty much ruined the rest of his high school career.\&#34;\n\nBut, said Branch, \&#34;I didn&#39;t see it. I didn&#39;t hear it.\&#34;\n\nA sentencing memorandum filed by prosecutors and released June 9 said she had failed to show remorse and in a psychological interview had \&#34;completely blamed the victim.\&#34;\n\nThe memorandum also pointed to evidence \&#34;Nutley groomed other children.\&#34;\n\nIn their sentencing memorandum, Nutley&#39;s defense attorney said his client was a \&#34;broken woman\&#34; suffering from mental illness, alcoholism and sexual abuse.\n\nHe added his client, whose marriage has since ended and whose relationships with her children were now \&#34;severely damaged,\&#34; was currently in a program for those convicted of sexually harmful behaviors and would complete the course in 2027.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;ohio&#34;, &#34;sex-offender-registry&#34;, &#34;multiple-victims&#34;, &#34;counselor&#34;, &#34;catholic-school&#34;, &#34;blame-shifting&#34;, &#34;allowance&#34;]}, {&#34;id&#34;: 14, &#34;case_id&#34;: 12, &#34;case_name&#34;: &#34;State v. Payton Shires&#34;, &#34;source&#34;: &#34;Columbus Dispatch&#34;, &#34;date&#34;: &#34;2025-01-01&#34;, &#34;text&#34;: &#34;COLUMBUS, Ohio \u2014 A former licensed social worker who had sex with her client \u2014 a 13-year-old boy \u2014 was sentenced to nearly five years in prison on Thursday.\n\nPayton Shires, of Mount Sterling, pleaded guilty in May to four counts of unlawful sexual misconduct with a minor, one count of inducing panic with a firearm specification and one count of intimidation to a victim or witness. A second count of intimidation and discharging of a firearm was dropped as part of her guilty plea.\n\nShires was arrested in October 2023 when she was accused of having sex multiple times with a 13-year-old client assigned to her for counseling.\n\nRecords say the victim&#39;s mother found messages between Shires and her son, asking him if his mother \&#34;had seen the videos or messages.\&#34; The phone was turned over to the police.\n\nDays later, records show detectives found a video on the teen&#39;s phone showing Shires and the teen having sex and engaging in other sex acts in various locations across Columbus. All the incidents happened in September 2023, according to court records.\n\nShires reportedly admitted to having sex with the teen on a three-way call between her, the teen&#39;s mother and detectives.\n\nWeeks later, Shires was arrested again after showing up at the victim&#39;s home with a gun, according to court records. When police arrived at the home, Shires was sitting on the front porch with a gun to her head and her finger on the trigger. Records say that she was yelling that she wanted to kill herself and the victim&#39;s mother.\n\nDuring her sentencing, Shires apologized for what happened and said she felt horrible for the mistakes she made.\n\n\&#34;I just hope [the family] can find peace from this, that they can find peace and trust with their social workers in the future,\&#34; she said.\n\nOn Thursday, the judge ordered that Shires serve four years and nine months in state prison. She will have 253 days of jail credit.\n\nAdditionally, Shires will have to register as a Tier 2 sex offender for 25 years.\n\nThe judge said Shires would have the opportunity to be released from prison if she maintains a good record. After her prison sentence, she will be on parole for five years.\n\nIn November 2023, the teen&#39;s mother filed a lawsuit against Shires&#39; employer, the National Youth Advocate Program, saying the organization was negligent in hiring Shires because she wasn&#39;t competent to perform her duties. The mother and her son are seeking at least $50,000 in damages.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;sentenced&#34;, &#34;ohio&#34;, &#34;sex-offender-registry&#34;, &#34;social-worker&#34;, &#34;firearm&#34;, &#34;armed-standoff&#34;, &#34;video-evidence&#34;, &#34;civil-lawsuit&#34;]}, {&#34;id&#34;: 15, &#34;case_id&#34;: 13, &#34;case_name&#34;: &#34;State v. Allison Marchese&#34;, &#34;source&#34;: &#34;AP&#34;, &#34;date&#34;: null, &#34;text&#34;: &#34;NEW HAVEN, Conn. (AP) \u2014 A former Connecticut high school teacher, who is a Canadian citizen, has been sentenced to three years in prison for sexual misconduct with two students.\n\nAllison Marchese was sentenced last week.\n\nShe pleaded guilty under the Alford Doctrine in a plea deal, meaning she doesn&#39;t admit guilt but acknowledges there&#39;s enough evidence for a conviction.\n\nMarchese taught English at Daniel Hand High School in Madison, Connecticut. Police say a 17-year-old student received a selfie of Marchese scantily dressed.\n\nA 15-year-old student told police Marchese said she couldn&#39;t concentrate during class because he was so attractive.\n\nMarchese&#39;s lawyer says his client&#39;s friend died around the time of the incidents and that her marriage was \&#34;disintegrating on a daily basis.\&#34;\n\nMarchese will be on the state&#39;s sex offender registry for a decade.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;sentenced&#34;, &#34;teacher&#34;, &#34;sex-offender-registry&#34;, &#34;multiple-victims&#34;, &#34;connecticut&#34;, &#34;alford-plea&#34;, &#34;canadian-citizen&#34;]}, {&#34;id&#34;: 16, &#34;case_id&#34;: 13, &#34;case_name&#34;: &#34;State v. Allison Marchese&#34;, &#34;source&#34;: &#34;New Haven Register&#34;, &#34;date&#34;: &#34;2016-01-01&#34;, &#34;text&#34;: &#34;Former Madison teacher Allison Marchese pleaded guilty Monday to criminal charges related to sexual misconduct with two teen male students in a deal that could send her to prison for three years.\n\nMarchese, 39, had faced charges of second-degree sexual assault and risk of injury to a minor, charges that could have put her in jail for up to 20 years. But in a plea deal struck with prosecutors, Marchese pleaded guilty during a brief court hearing in Superior Court to lesser charges in exchange for the three-year prison term.\n\nMarchese entered guilty pleas to two counts of first-degree unlawful restraint, two counts of second-degree reckless endangerment, one count of second-degree harassment and one count of second-degree threatening, under the Alford doctrine, meaning she did not admit guilt to those charges but conceded that prosecutors had enough evidence for a conviction at trial.\n\nMarchese, a resident of Canada and mother of two children, was ordered by Judge Melanie Cradle to undergo sex offender treatment and be part of the Connecticut sex offender registry for 10 years. She also faces five years of probation and the possibility of having to leave the United States because federal immigration laws say that conviction of certain crimes can lead to deportation.\n\nCradle scheduled Marchese&#39;s sentencing for March 3. Marchese&#39;s lawyer, William F. Dow III, declined to comment after Monday&#39;s hearing. Prosecutor David Strollo said the victims and their families were aware of the plea deal, a punishment Strollo called, \&#34;a substantial sentence.\&#34;\n\nWhile a teacher at Daniel Hand High School, Marchese was accused of sending racy photos and improper texts to two teenage students and performing oral sex on one of them in a classroom in 2014, according to court records.\n\nCourt records said Marchese sent winking and smiling emoticons and other flirtations and sexual hints through Instagram as well as a \&#34;selfie\&#34; of Marchese \&#34;dressed in only thong style underwear with her breast covered and her midriff exposed.\&#34; One message said that the teacher \&#34;would do anything [the student] told her to do as long as he was going to talk to her.\&#34;\n\nThe younger student had a relationship with Marchese that began when he was 14. The Instagram messaging continued in summer 2014 after the school year ended. He told police that he asked Marchese to stop and that she did until two days before the start of the 2014 school year. In that message, she reportedly told him that he \&#34;broke her heart and betrayed her.\&#34; The next day she apologized and said she was drunk when she sent the message.\n\nThe older student, 17 at the time, told police he received a provocative photo through Instagram and flirtatious texts, and in December 2014, the two kissed and had oral sex in a locked classroom. After the encounter, the student came up with a plan to blackmail Marchese, telling her he would stay silent if she gave him $200. Marchese told her father about the blackmail attempt; she described her father as \&#34;abusive\&#34; with Mafia ties who would make sure the older teen \&#34;would never play football again.\&#34;\n\nWhen interviewed by police, Marchese admitted the \&#34;selfie\&#34; was of her but said she sent it to her husband and did not know how a student got it.\n\nHer former husband, Robert Marchese, a teacher at the high school, was granted entry into the family violence education program following his arrest on charges of disorderly conduct and interfering with an emergency call in January 2015.\n\nBoth teens are suing the town of Madison and the Madison Board of Education in separate claims seeking damages in excess of $15,000 for school officials&#39; alleged negligence.&#34;, &#34;tags&#34;: [&#34;court-record&#34;, &#34;civil-lawsuit&#34;, &#34;alford-plea&#34;, &#34;blackmail&#34;, &#34;deportation&#34;, &#34;instagram&#34;, &#34;oral-sex&#34;]}, {&#34;id&#34;: 17, &#34;case_id&#34;: 14, &#34;case_name&#34;: &#34;State v. Brittany Zamora&#34;, &#34;source&#34;: &#34;Maricopa County AG / local news&#34;, &#34;date&#34;: &#34;2019-06-10&#34;, &#34;text&#34;: &#34;PHOENIX \u2014 Brittany Zamora (D.O.B. 01-05-1991) was sentenced today to 20 years in the Department of Corrections after pleading guilty to Sexual Conduct with a Minor, Attempted Molestation of a Child and Public Sexual Indecency in connection to a sexual relationship with a young student.\n\n\&#34;Today&#39;s sentencing is fitting for an individual who exploited her position as a teacher to groom and then abuse a young teen student,\&#34; said Maricopa County Attorney Bill Montgomery. \&#34;Prosecutors and law enforcement will continue to be relentless in making Arizona the most unwelcome place for child sex predators.\&#34;\n\nOn March 21, 2018 police were alerted by school staff about a sexual relationship between a 13-year-old and his teacher after the victim&#39;s parents found evidence of the relationship on their son&#39;s phone using a parental monitoring app. The parents were also receiving phone calls from the defendant trying to convince the victim&#39;s family not to tell police about her actions.\n\nInvestigators learned the defendant had initially contacted the victim through text messages over a school break and started a sexual relationship soon after. The defendant had a sexual encounter with the victim at least once at school while another minor was in the room.\n\nZamora, who taught sixth-grade at Las Brisas Academy in Goodyear, was facing allegations of nine counts of sexual conduct with a minor, two counts of molestation of a child, and one count of furnishing harmful material to a minor. In April, most of the charges were dismissed due to a grand jury indictment. According to court records, Zamora pled guilty to sexual misconduct and reduced charges of public indecency and molestation.\n\nThe allegations were first reported to the school&#39;s principal in March 2018, by the parents of the victim, who found text message conversations between 27-year-old Zamora and her 13-year-old male student. The conversation indicated sexual activities were happening between the two, on and off campus.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;teacher&#34;, &#34;arizona&#34;, &#34;witness-in-room&#34;, &#34;obstruction&#34;, &#34;monitoring-app&#34;]}, {&#34;id&#34;: 18, &#34;case_id&#34;: 15, &#34;case_name&#34;: &#34;People v. Kathryn Ronk&#34;, &#34;source&#34;: &#34;Detroit Free Press&#34;, &#34;date&#34;: &#34;2015-03-19&#34;, &#34;text&#34;: &#34;Judge sends message with sentence in teacher sex case\nL.L. Brasier, Detroit Free Press\n\nDETROIT \u2014 Saying there is no room for double standards, an Oakland County judge sentenced a 30-year-old female teacher to spend the next six to 15 years in prison for having a sexual relationship with a student.\n\nKathryn Ronk, who taught Spanish at a Catholic high school, could have been sentenced to as little as a year in jail, but Oakland County Circuit Court Judge Nanci Grant opted for prison time Tuesday, noting the boy was 15 at the time.\n\nGrant was dismayed by letters asking for leniency for Ronk, a former teacher at Bishop Foley High School in Madison Heights, but making no mention of concern for the boy.\n\n\&#34;You are dealing with children that are still developing emotionally,\&#34; Grant said Wednesday. \&#34;To have this continuing double standard is unacceptable. The law does not recognize a double standard, the law is clearly on point in terms that these children are developing human beings. This was a person in position with power and influence over him.\&#34;\n\nRonk was originally charged with five counts of criminal sexual conduct, including rape, but pleaded guilty to two counts of third-degree criminal sexual conduct.\n\nRonk also faces charges in Macomb County because some of the sexual contact took place in the boy&#39;s Macomb Township home and in a car in Sterling Heights. A trial date has been set for March 31, although there are ongoing discussions about a plea arrangement.&#34;, &#34;tags&#34;: [&#34;felony&#34;, &#34;juvenile&#34;, &#34;sex-crime&#34;, &#34;sentenced&#34;, &#34;teacher&#34;, &#34;catholic-school&#34;, &#34;michigan&#34;, &#34;double-standard&#34;, &#34;indeterminate-sentence&#34;, &#34;multi-jurisdiction&#34;]}, {&#34;id&#34;: 19, &#34;case_id&#34;: 3, &#34;case_name&#34;: &#34;State v. Ana D&#39;Ettorre&#34;, &#34;source&#34;: &#34;court records&#34;, &#34;date&#34;: null, &#34;text&#34;: &#34;The crimes occurred between May 21 and Aug. 30, 2022, and involved a teen between the age of 13 and 16, according to the indictment.\n\nD&#39;Ettorre pleaded guilty in February in Butler County Common Pleas Court to unlawful sexual conduct with a minor, a fourth-degree felony and one count disseminating matter harmful to minors, a first-degree misdemeanor. The remainder of the charges were dismissed in exchange for the admission of guilt.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 20, &#34;case_id&#34;: 16, &#34;case_name&#34;: &#34;State v. Kathryn Murray&#34;, &#34;source&#34;: &#34;Houston Chronicle&#34;, &#34;date&#34;: &#34;2014-01-21&#34;, &#34;text&#34;: &#34;Ex-teacher gets year in jail for sex with boy\n\nTheir relationship began innocently enough: A 15-year-old Memorial Middle School student from Costa Rica was trying to learn English with help from a teacher.\n\nHis tutor, in her third year at Spring Branch ISD, started keeping him after school and passing him notes that contained promises of a happy life together.\n\nThe goings-on came to an abrupt end when the teen&#39;s younger brother caught the pair in bed. The younger boy told his parents, who had been away from the house at the time, about what he&#39;d seen and about finding a condom and a tan bra.\n\nOn Tuesday, the teen&#39;s parents said their son had been victimized first by 30-year-old Kathryn Camille Murray and then by the system.\n\nThe former teacher was sentenced to a year in jail and a year of probation, which was too lenient, the boy&#39;s family said.\n\n\&#34;If this had been a 27-year-old man and a 15-year-old girl, the judgment in there would have been completely different,\&#34; the teen&#39;s father said outside of a Harris County courtroom. \&#34;It goes to show you the double standard.\&#34;\n\nThe boy&#39;s adopted mother said her son was an easy target for Murray because he was in a new country and was trying to learn the language.\n\n\&#34;This was not justice,\&#34; she said after Murray was sentenced. \&#34;This was a child who believed and trusted in his teacher.\&#34;\n\nMurray, an English language support teacher who taught language arts at the middle school, pleaded guilty last month to two charges of sexual assault of a child.\n\nInvestigators said the teacher and student began a sexual relationship in her classroom on Feb. 7, 2012. According to court records, Murray on one occasion picked up the eighth-grader at a school dance after his father had dropped him off and took him to a hotel for two hours where they had sex.\n\nThe next night, Murray is accused of going to the teen&#39;s home to have sex with him while his parents were gone. Murray was arrested and charged with sexual assault of a child under 17, after the brother informed his parents.\n\nWhile free on $50,000 bail last year, Murray was again arrested after the teen ran away from home and was found at her house. The teacher was charged with harboring a runaway, a charge that was dropped as part of her plea agreement.\n\nMurray was sentenced to two years&#39; deferred adjudication for each of the sexual assault charges she admitted to. Those two punishments will run at the same time. As a condition for each probation, she was sentenced to six months in jail. Those two jail sentences will run one after another for a total of a year. While in jail, Murray&#39;s probation also begins, meaning she will have only one year of reporting to a probation officer when she is released.\n\nMurray, who has been behind bars since January 2013 when her bail was revoked, does not get that time applied to her sentence. In addition to being prohibited from contacting or communicating with the teen while on probation, she will have to register as a sex offender for life.&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;female-perpetrator&#34;, &#34;teacher-student-relationship&#34;]}, {&#34;id&#34;: 21, &#34;case_id&#34;: 17, &#34;case_name&#34;: &#34;State v. Meredith Hill&#34;, &#34;source&#34;: &#34;KATV / Local News&#34;, &#34;date&#34;: &#34;2023-09-25&#34;, &#34;text&#34;: &#34;Plea agreement results in 10 year sentence for sexual assault\n\nMark Freeman Sep 25, 2023 Updated Sep 25, 2023\n\nMeredith Lyndsey Hill agreed Monday to a negotiated guilty plea on two felony sexual assault charges, which will see her serve up to 10 years behind bars. The third sexual assault charge was dismissed.\n\nPer the agreement Hill will also have 120 months of her sentence suspended concurrently.\n\nShe was ordered to pay a $2,000 fine plus costs, register as a sex offender upon release, and have no contact with any of the victims or their families. LITTLE ROCK (KATV) \u2014 Authorities in Arkansas announced they booked a teacher from Pottsville School District for sexual assault charges.\n\nThe Pope County Sheriff&#39;s Office said they took Meredith Hill into custody on Thursday at 10 a.m.\n\nHill has been booked on sexual assault charges in the first degree with a minor and she is currently being held at the Pope County Detention Center.\n\nHill was currently teaching seventh-grade science and was the head tennis and softball coach.\n\nThe superintendent of the Pottsville School District, Larry Dugger released a statement and noted the following:\n\n\&#34;Pottsville School District has been made aware of an allegation involving a student and staff member. We are cooperating with law enforcement&#39;s investigation into the matter and have taken all appropriate and lawful actions to assure the safety of students, which is the District&#39;s top priority at all times. Due to confidentiality considerations for students and staff under applicable law, the District will have no further comment at this time.\&#34;\n\nThe sheriff&#39;s office said Hill will be appearing in court on Friday at 9 a.m. She will appear in front of Judge James Dunham on Zoom for a bond hearing pending the formal charges being filed.\n\nADC #719791 \u2014 Hill, Meredith L; DOB 12/12/1987; Race: Caucasian; Female; Initial Receipt Date: 09/27/2023; Facility: McPherson Unit, 302 Corrections Drive Newport, Arkansas 72112; Total Time: 10 yrs; PE/TE Date: 03/25/2026&#34;, &#34;tags&#34;: [&#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;Arkansas&#34;]}, {&#34;id&#34;: 22, &#34;case_id&#34;: 18, &#34;case_name&#34;: &#34;State v. Jacqueline Ma&#34;, &#34;source&#34;: &#34;San Diego Union-Tribune&#34;, &#34;date&#34;: &#34;2025-05-09&#34;, &#34;text&#34;: &#34;Former Teacher of the Year sentenced to 30 years in prison for student sexual abuse\nBy Caleb Lunetta and Teri Figueroa | San Diego Union-Tribune | Published May 9, 2025\n\nJacqueline Ma, 36, admitted that she had groomed and sexually abused two sixth-grade students at the elementary school she worked at in National City.\n\nA former San Diego County Teacher of the Year who pleaded guilty to sexually abusing two of her sixth-grade students was sentenced Friday to 30 years behind bars.\n\nThe sentence was part of the deal Jacqueline Ma, 36, struck in pleading guilty Feb. 5 to two counts of forcible lewd acts with a child under age 14 and also admitting to a lewd act with a child under age 14. Both children had been students at Lincoln Acres Elementary School, where Ma was a teacher.\n\nMa also pleaded guilty to a count of possessing material containing a minor engaged in or simulating sexual conduct.\n\nThe District Attorney&#39;s Office said she groomed boys with \&#34;gifts, food and special attention and even completed their homework for them.\&#34;\n\nBefore handing down the sentence, Chula Vista Superior Court Judge Enrique Camarena said Ma had cultivated the sexual relationships in plain sight over an extended period, but she was protected from scrutiny due to her status as an award-winning teacher.\n\n\&#34;This isn&#39;t just a one-day accident, mistake, bad judgment or evil act,\&#34; Camarena said. \&#34;(The sentencing) encompasses punishment for a prolonged pattern of child sexual abuse.\&#34;\n\nBefore her sentence was read, Ma was allowed to address the public and her family, who were filling a row of seats in the gallery. With her hands in cuffs, the former teacher apologized to the victims and their families, and said she had \&#34;disgraced the teaching profession.\&#34;\n\n\&#34;I abused my authority, I exerted my power and control over them, and I deceived them,\&#34; Ma said through tears. \&#34;Boys this age should be playing outside, feeling carefree \u2026 I ripped away their childhood.\&#34;\n\nMa went on to call her crimes selfish, said she manipulated the two boys and their families, and that her actions would be traumatizing for the victims and her community for years to come.\n\n\&#34;I lied to their faces while secretly abusing their sons,\&#34; Ma said. \&#34;I just pray for extra protection and strength for all those (affected).\&#34;\n\nDeputy District Attorney Drew Hart said after the hearing that although Ma took accountability and expressed remorse in the courtroom, he felt the sentencing was appropriate.\n\nHart said the mother of the 12-year-old victim did not have a statement for Ma. The mother of the 11-year-old victim directed the prosecutor to tell Ma that she had trusted the former teacher and had been left speechless by her crimes.\n\n\&#34;These parents knew Ms. Ma. They knew who she was, and they trusted her,\&#34; Hart said. \&#34;And so finding out not just that their child was abused, but finding out that they were abused by someone whom they trusted with their children and to care for their children, was incredibly devastating.\&#34;\n\nIn addition to paying thousands of dollars in fines and registering as a sex offender, Ma will be required to serve all 30 years of her sentence before a parole board allows her out of custody, Hart said.\n\nMa had taught fifth and sixth grades in the National School District since 2013. In August 2022, she was one of five teachers in the region selected as a San Diego County Teacher of the Year.\n\nShe was arrested seven months later. In March 2023, the parent of a 12-year-old boy reached out to National City police to report a suspected inappropriate relationship with their son.\n\nProsecutors said Ma had been using video game chat rooms and a family tablet to communicate with the 12-year-old. Hart said the physical relationship between the two began in late 2022, a few months before the messages were found by the boy&#39;s parents.\n\nThe boy&#39;s parents reportedly did not allow him to have social media or his own electronics. But investigators learned Ma was able to get access to him by setting up an unsanctioned after-school program and talking with him through a school chat application.\n\nThe sexual assaults occurred in Ma&#39;s classroom over three months while the boy&#39;s parents thought he was enrolled in an after-school basketball program, prosecutors said.\n\nThe investigation into Ma revealed a second suspected victim \u2014 a boy who was 11 years old when prosecutors say she sent him sexually charged messages in 2020, according to testimony at her preliminary hearing.\n\nThe 11-year-old boy was reportedly approached by Ma in 2020, but he fled the room, Hart said.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;CSAM&#34;, &#34;California&#34;, &#34;teacher-of-the-year&#34;]}, {&#34;id&#34;: 23, &#34;case_id&#34;: 19, &#34;case_name&#34;: &#34;State v. Stephanie Ragusa&#34;, &#34;source&#34;: &#34;ABC News&#34;, &#34;date&#34;: &#34;2010-06-28&#34;, &#34;text&#34;: &#34;Teacher Stephanie Ragusa Sentenced to 10 Years in Prison for Sex With Students\nBy Ray Sanchez | ABC News | June 28, 2010\n\nA Florida teacher convicted of having sex with two of her students, was called a sexual predator today by a judge who sentenced her to 10 years in prison.\n\nStephanie Ragusa, wearing an orange jumpsuit, cried at one point during her sentencing hearing, but nodded her head in approval as Circuit Judge Chet Tharpe also imposed five years of sexual offender probation on the 31-year-old defendant.\n\n\&#34;You were a teacher,\&#34; Tharpe said. \&#34;And as parents, we place our trust in teachers to provide a safe environment in which our children can learn. You violated that trust in the worst imaginable way. You preyed on these young boys...\&#34;\n\nThe judge described Ragusa&#39;s demeanor during her court appearances as arrogant.\n\n\&#34;You had a very lackadaisical attitude on your face, smiling, jovial,\&#34; Tharpe said. \&#34;If I had to sum up your attitude in one word, it would be arrogance. I don&#39;t know as we stand here today that you truly appreciate the harm that you caused. I honestly believe, Ms. Ragusa, that you are a sexual predator. And I honestly believe that you are a danger to children in our community.\&#34;\n\nRagusa, a former math teacher at Davidsen Middle School in Tampa, Fla., pleaded guilty in April to three counts of lewd and lascivious battery involving a 14-year-old boy, and two counts of having unlawful sex with a minor involving a 16-year-old student. The assaults occurred in 2008.\n\nThe prosecution described Ragusa as a master manipulator who sexually preyed on the most vulnerable teenage boys. Both boys she abused came from broken homes.\n\nThe defense, however, said Ragusa was remorseful, a mentally disturbed woman with no prior criminal history, and a victim of traumatic experiences in her life. They asked for probation and house arrest.\n\nTharpe sentenced her to the maximum according to a plea deal, 10 years in prison followed by five years of sex offender probation.\n\nThe sentence was imposed after the mother of one of the victims, a 14-year-old boy, told the court that she believes the former Davidsen Middle School teacher \&#34;maliciously\&#34; preyed on her son&#39;s emotional disabilities.&#34;, &#34;tags&#34;: [&#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;Florida&#34;, &#34;sexual-predator&#34;]}, {&#34;id&#34;: 24, &#34;case_id&#34;: 20, &#34;case_name&#34;: &#34;State v. Stacy Schuler&#34;, &#34;source&#34;: &#34;Associated Press / Valdosta Daily Times&#34;, &#34;date&#34;: &#34;2011-10-28&#34;, &#34;text&#34;: &#34;Ohio gym teacher convicted in student sex case\nBy The Associated Press | Published October 28, 2011\n\nA high school teacher was convicted Thursday of having sex with five students, some of them football players, after a judge rejected an insanity defense that argued the teens took advantage of her.\n\nStacy Schuler was sentenced to a total of four years in prison for the encounters with the Mason High School students at her home in Springboro in southwest Ohio in 2010. She can ask a judge to free her from prison after six months.\n\nThe 33-year-old Schuler, who could have faced decades in prison, cried as she was handcuffed and led out of the courtroom.\n\nThe five teens testified that Schuler, a health and gym teacher, had been drinking alcohol at the time of the encounters and was a willing participant who initiated much of the contact. The teens were about 17 at the time. The age of consent in Ohio is 16, but it&#39;s illegal for a teacher to have sex with a student.\n\n\&#34;This is a noble profession that you have, and I&#39;ve heard a lot of good things about you, but I know that you had the opportunity, as all teachers do, to affect the lives of our children,\&#34; Warren County Common Pleas Judge Robert Peeler said. \&#34;You crossed a line.\&#34;\n\nSchuler&#39;s lawyers argued that she had medical and psychological issues and couldn&#39;t remember the encounters.\n\nBefore sentencing Schuler on 16 counts of sexual battery and three counts of providing alcohol to a minor, the judge said it would be a \&#34;magnificent leap\&#34; to believe she didn&#39;t know her actions were wrong.\n\nSchuler didn&#39;t testify during the four-day nonjury trial, and she and her attorneys declined to address the judge before he sentenced her.\n\nBut parents of two of the teen victims made tearful statements.\n\nA father spoke of his son&#39;s depression and lost motivation and said the teen almost didn&#39;t go to college. He asked the judge to hand down a sentence to send a message that Schuler&#39;s acts are not acceptable and there are serious consequences.\n\n\&#34;It impacts the teaching community as a whole, how a single teacher who made the wrong decision multiple times overshadows 99.9 percent of the teachers that truly do care, not pretend to care, about their students,\&#34; he said.\n\nA mother said her son turned to and trusted Schuler during an extremely low period when his father had cancer and related health problems.\n\n\&#34;These young men may appear as if they are tough guys, but in reality, they are truly hurting,\&#34; she said. \&#34;She took advantage of their vulnerability. She crossed the line and it is unacceptable.\&#34;\n\nAssistant prosecutor Teresa Hiett further pointed out to the judge how the teens have been affected, noting that Mason High School was shut down for the week of the trial because \&#34;everyone&#39;s been trying to figure out who these five boys were.\&#34;\n\nTestimony from a defense psychologist had suggested that Schuler&#39;s medical and physical ailments, combined with her vegan diet and use of alcohol and an antidepressant, helped impair her ability to tell right from wrong.\n\nA psychologist for the prosecution rebutted that testimony, saying that the use of alcohol does not meet the state standard for an insanity defense and that willingly getting drunk is not a legal defense for a crime.\n\nTwo former Mason students had testified that Schuler had devised a plan to enter an insanity plea before she was ever charged. Other students testified on Schuler&#39;s behalf, hugging her in the courtroom and telling the judge she was a supportive advocate who kept appropriate boundaries.\n\nSchuler had been a teacher and athletic trainer at the school north of Cincinnati since 2000 before resigning in February after an anonymous tip to the school led to the charges against her.&#34;, &#34;tags&#34;: [&#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;female-offender&#34;, &#34;Ohio&#34;, &#34;trial&#34;]}, {&#34;id&#34;: 25, &#34;case_id&#34;: 21, &#34;case_name&#34;: &#34;State v. Anna Crocker&#34;, &#34;source&#34;: &#34;WISN / Local TV&#34;, &#34;date&#34;: null, &#34;text&#34;: &#34;KENOSHA, Wis. \u2014\n\nA former teacher aide in Kenosha County will spend the next 50 years in prison. A judge delivered that sentence to Anna Marie Crocker on Tuesday after the 34-year-old pleaded guilty to multiple sex crimes involving four young boys.\n\n\&#34;I take full responsibility for what has taken place,\&#34; Crocker said through tears during Tuesday&#39;s sentencing. \&#34;I am disturbed by the harm and distress, along with the trauma that you have to endure. I am deeply sorry that this has caused confusion, pain and anger, and that you have to live with this the rest of your lives.\&#34;\n\nDuring the sentencing, investigators detailed Crocker&#39;s crimes, including forcing a 12-year-old to have sex with her and luring a 14-year-old out of his home to sexually assault him.\n\n\&#34;She couldn&#39;t help herself. She was juggling all these boys at the same time,\&#34; prosecutor Rosa Delgado said in court.\n\nA court order prohibited the recording of the victims and their families, but one mother told the judge, \&#34;This person destroyed my son&#39;s psyche and loving and caring spirit.\&#34;\n\nAs a result of the defendant&#39;s actions, that family moved out of state.\n\nCrocker, a mother of four herself, pleaded for a lighter sentence, saying, \&#34;I am asking for mercy and compassion even though I understand the seriousness.\&#34;\n\nJudge David Hughes ultimately sentenced Crocker to 51.5 years of incarceration and 32 years of extended supervision.\n\n\&#34;She sought out children, she used children and she took advantage of children,\&#34; the judge said.\n\nCrocker showed little emotion as the judge handed down the hefty sentence.\n\nShe will be in her 80s by the time her sentence runs out. The judge said she will be required to register as a sex offender for the rest of her life.&#34;, &#34;tags&#34;: [&#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;Wisconsin&#34;]}, {&#34;id&#34;: 26, &#34;case_id&#34;: 22, &#34;case_name&#34;: &#34;State v. Madison Bergmann&#34;, &#34;source&#34;: &#34;WKRC / New York Post / KARE&#34;, &#34;date&#34;: &#34;2024-12-19&#34;, &#34;text&#34;: &#34;ST. CROIX COUNTY, Wis. (WKRC) \u2014 A Wisconsin elementary school teacher was sentenced to six years in prison, followed by six years of supervision, after pleading guilty to one count of child enticement and two counts of sexual misconduct.\n\nMadison Bergmann, 26, broke down in tears during her sentencing on Dec. 19. Per the New York Post, she had exchanged 35,000 texts with an 11-year-old student. Those texts included messages to the fifth-grader about \&#34;making out\&#34; and other inappropriate conduct, according to KARE, WQOW, and WEAU.\n\nThe criminal complaint detailed allegations of kissing, touching and sexual contact.\n\nAuthorities reported that Bergmann sent texts expressing affection for the student and that she enjoyed inappropriate physical contact. A criminal complaint revealed 100 handwritten notes and artwork, alongside the texts. One message read, \&#34;Dude I love you so much more \u2014 like I didn&#39;t think it was possible \u2014 but oh my god today during reading....\&#34; Bergmann pleaded guilty to receive a reduced sentence, asking for only a year behind bars, while prosecutors sought 12 years, according to KARE.\n\n\&#34;I want to make it absolutely clear that I take full accountability for every boundary that was crossed,\&#34; she said to the judge while sobbing. \&#34;I hope that your family has been able to begin to heal and find some peace in your lives again. I know the journey will be long for your family.\&#34;\n\nThe case came to light when the victim&#39;s parents discovered the texts, prompting the boy&#39;s father to confront Bergmann in the classroom with print-outs of the conversations. The inappropriate relationship began after Bergmann obtained the child&#39;s phone number during a skiing trip over winter break, and they communicated almost daily, reports KSTP.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;Wisconsin&#34;]}, {&#34;id&#34;: 28, &#34;case_id&#34;: 24, &#34;case_name&#34;: &#34;State v. McKenna Kindred&#34;, &#34;source&#34;: &#34;New York Post&#34;, &#34;date&#34;: &#34;2026-01-29&#34;, &#34;text&#34;: &#34;Sicko ex-teacher proposed conniving way to hide predatory affair with teen student after 3-hour sex marathon\nBy Georgia Worrell | NY Post | January 29, 2026\n\nMarried ex-high school teacher McKenna Kindred suggested that she and a teenage student she was sexually abusing should start using Snapchat to hide their X-rated chats, according to court docs.\n\n\&#34;Hm next time I need to relearn Snapchat haha,\&#34; Kindred, now 27, texted the 17-year-old boy at one point during their tryst, which began when Kindred was his educator at Central Valley High School in Spokane, Washington.\n\nThe conniving message came after the pair had already engaged in a depraved three-and-a-half hour sex marathon at Kindred&#39;s marital home in November 2022 \u2013 while her oblivious husband was away on a hunting trip.\n\n\&#34;Mom glad I can satisfy you,\&#34; the teen kicked off the text thread.\n\nAfter the teacher liked the message, the boy asked if she used a sex toy while thinking about him. \&#34;I did,\&#34; she replied. \&#34;U should have video it and save it,\&#34; the teen responded, prompting Kindred to propose that he teach her how to use Snapchat the next time they meet up.\n\nBy that point, the pair had already exchanged a series of racy text messages, pictures and videos on social media for months, dating back to when the teen found Kindred&#39;s Instagram account in June 2022, according to court docs.\n\n\&#34;When other girls talk about you in my class I could feel myself getting mad,\&#34; she wrote in one message.\n\nAs rumors about McKenna&#39;s abuse of the boy eventually began to spread around the school, the teen&#39;s friends shared screenshots of the racy messages with school officials in December 2022. The school district placed Kindred on administrative leave, before she resigned in 2023.\n\nShe pleaded guilty to first-degree sexual misconduct \u2013 for which she avoided jail time, but was ordered to serve two years of probation, pay $700 in fines and register as a sex offender for a decade.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;teacher&#34;, &#34;lenient-sentence&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;Washington&#34;]}, {&#34;id&#34;: 29, &#34;case_id&#34;: 123, &#34;case_name&#34;: &#34;Megan Jordan Swanson&#34;, &#34;source&#34;: &#34;WWBT / WRIC&#34;, &#34;date&#34;: &#34;2024-05-20&#34;, &#34;text&#34;: &#34;HENRICO, Va. (WWBT) - A former Henrico middle school teacher was sentenced Monday to six years in prison for multiple sex crimes involving a former student.\n\nMegan Jordan Swanson, of Chesterfield, pleaded guilty to several charges of carnal knowledge and one count of indecent liberties of a minor earlier this year. The victim was a student of Swanson&#39;s during the 2022-23 school year and was 14 years old at the time of the offenses. Last year, police said the sexual acts happened while Swanson was a teacher at Hungary Creek Middle School.\n\nOn Monday, she received a sentence of a total of 40 years, with 34 years of those being suspended. After she serves six years in prison, she will be placed on 20 years of supervised probation.\n\n---\n\nHENRICO COUNTY, Va. (WRIC) \u2014 A former teacher at Hungary Creek Middle School in western Henrico County has pleaded guilty to five felony charges for engaging in a sexual relationship with a student who was 14 years old at the time.\n\nAccording to the Office of the Henrico County Commonwealth&#39;s Attorney, 25-year-old Megan Pauline Jordan of Chesterfield County pleaded guilty to four felony counts of carnal knowledge of a minor and one felony count of indecent liberties with a minor.\n\nAccording to Henrico Commonwealth&#39;s Attorney Shannon Taylor, Jordan engaged in sexual relations with the victim while he was a student of hers during the 2022-2023 school year, going to his home on several occasions to have sexual intercourse. Jordan&#39;s DNA was found on the victim&#39;s bed sheets.\n\n\&#34;I must recognize the brave action of those who brought this matter to the attention of Henrico Police Division. We are always asking people if they see something unusual, or not quite right, to say something,\&#34; said Taylor in a statement. \&#34;Because of their efforts, this predator is off the streets, out of our schools, and will be held accountable for her actions.\&#34;\n\nJordan was arrested in June 2023 and was initially charged with five counts of carnal knowledge of a minor and two counts of indecent liberties with a minor. Jordan faces 50 years in prison when sentenced on May 20.&#34;, &#34;tags&#34;: [&#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;Virginia&#34;]}, {&#34;id&#34;: 30, &#34;case_id&#34;: 26, &#34;case_name&#34;: &#34;State v. Lauren King&#34;, &#34;source&#34;: &#34;NBC2 News (Fort Myers)&#34;, &#34;date&#34;: &#34;2024-08-22&#34;, &#34;text&#34;: &#34;FORT MYERS, Fla. \u2014 A former Lee County teacher assistant accused of having a sexual relationship with a student pleaded guilty in court Wednesday.\nBy Joe Espy and Samantha Serbin | NBC2 News | Updated August 22, 2024\n\n\&#34;We are very happy to give the victims closure in this crime. By having the defendant admit to the allegations, go to prison, become a sexual offender and a convicted felon,\&#34; Assistant State Attorney Erin Hughes said. \&#34;Any eagerness on the state&#39;s part to go to trial must take a back seat to the wishes of the family and the mental health of the child; the protection of the community. This was an extreme betrayal of trust. And now, the community is safe as she is a sexual offender on her way to Department of Corrections.\&#34;\n\n\&#34;The allegations in this case were very complicated, very serious. I believe, as does Ms. King, that the resolution of this case is in the best interest of everyone involved,\&#34; defense attorney Desiree Wilson added.\n\nLauren King, 32, was arrested in March after police received reports that she was having a sexual relationship with a 12-year-old student at the Royal Palm Exceptional Center.\n\nThe victim&#39;s father spoke to the judge Wednesday, sharing his frustration and hurt that someone in a position of trust would take advantage of his child. In his statement, the father revealed the now 13-year-old victim is attending counseling multiple times a week.\n\nThe inappropriate relationship began earlier this year. King allegedly took a picture of the boy and his friends and he asked her to send it to him. Lee County Clerk of Court documents stated that King contacted the boy on a regular basis for months and sent more than 4,000 messages.\n\nShe reportedly performed oral sex and had sexual intercourse with the boy in her car after arranging to meet him at an apartment complex where one of his relatives lived. According to the document, King even bribed the victim to keep him quiet and told him she loved him.\n\nKing&#39;s arrest report states she gave the victim money several times over Cash App. She also gave him an iPhone, computer and Beats by Dre headphones under the guise of a birthday present.\n\nThe report further detailed how the boy became uncomfortable and tried to stop contact; however, King was reportedly persistent.\n\nAccording to the report, King even attempted to make the boy jealous and told him she was engaging in sexual activities with other students.\n\nIt wasn&#39;t until the boy&#39;s mentor caught King repeatedly calling him one day that the truth was revealed. King tried to get away, saying she&#39;d quit her job and leave the area. The mentor recorded that conversation and called the police.\n\nOn March 7, the U.S. Marshals regional fugitive task force arrested King at The Enclave at 3726 apartment complex on Central Avenue.\n\nKing pleaded guilty to charges of lewd or lascivious molestation and lewd or lascivious battery. She is sentenced to eight years in prison, followed by five years of probation. She will be designated a sex offender for life.\n\nProsecutors said in court this sentence is lower than what they previously offered King in a plea deal. However, at the request of family, the counteroffer was accepted in an effort to avoid a trial and allow the victim to put this behind him.\n\nFort Myers police reported they have not had any more victims come forward.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;teacher&#34;, &#34;sexual-assault&#34;, &#34;plea&#34;, &#34;female-offender&#34;, &#34;Florida&#34;, &#34;special-needs-school&#34;]}, {&#34;id&#34;: 31, &#34;case_id&#34;: 27, &#34;case_name&#34;: &#34;Michelle Christine Solis&#34;, &#34;source&#34;: &#34;Butte County DA press release&#34;, &#34;date&#34;: &#34;2024-06-27&#34;, &#34;text&#34;: &#34;FORMER GRIDLEY TEACHER SENTENCED TO PRISON FOR SEX WITH STUDENT\n\nA former Gridley school teacher was sentenced to four years in state prison today for having sex with a 14-year-old boy who was her student in June 2021.\n\nMichelle Christine Solis, 46, was sentenced to the maximum term by Butte County Superior Court Judge Michael Deems following her plea to one count of sex with a minor.\n\nButte County District Attorney Mike Ramsey said the charge stems from conduct during the boy&#39;s 8th-grade year at Sycamore Junior High School in Gridley. Solis was the boy&#39;s teacher. She \&#34;friended\&#34; him on Instagram at the time and began messaging him in the weeks leading up to his graduation. Evidence showed Solis sent the boy four explicit photos of herself before having sexual intercourse with him in her classroom on the day of the boy&#39;s 8th-grade graduation.\n\nRumors and copies of one of the photographs began to circulate in the Gridley community in October 2023. A Gridley Police investigation ensued and investigators contacted the boy and reviewed the contents of his phone. There they found communication between Solis and the boy, including two explicit photographs of Solis that matched the descriptions the boy previously provided.\n\nIn court today, Solis&#39; attorney asked the judge to give his client probation, citing the incident as only \&#34;one act.\&#34; The District Attorney&#39;s Office argued the upper term in state prison was appropriate due to the 29-year age difference between Solis and the boy, Solis&#39; position as a trusted community member, and a pattern of conduct amounting to \&#34;grooming\&#34;. The District Attorney&#39;s Office pointed to Solis&#39; special treatment of the boy in school, the numerous social media contacts between Solis and the boy, Solis&#39; directions to delete their communications, and the explicit photographs Solis sent to the boy before initiating sexual intercourse.\n\nRamsey said Solis was previously remanded to the Butte County Jail on June 27, 2024, after her attorney requested a continuance of the sentencing hearing. She will be transported to the state prison within a week. Solis will be required to register as a sex offender and was ordered to stay away from the victim for ten years.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;]}, {&#34;id&#34;: 32, &#34;case_id&#34;: 28, &#34;case_name&#34;: &#34;Alyssa Todd&#34;, &#34;source&#34;: &#34;InBuckeye&#34;, &#34;date&#34;: &#34;2025-07-23&#34;, &#34;text&#34;: &#34;Teacher sentenced to 3 years for sexual misconduct with student\nBy Michael McDaniel, Reporter \u2014 July 23, 2025\n\nA Maricopa County judge today imposed a three-year prison sentence on former Odyssey teacher Alyssa Todd, who was convicted of attempted sexual conduct with a minor in Buckeye.\n\nMaricopa County Superior Court Judge Todd Lang said the case involved a blatant breach of trust and profound emotional harm to the victim&#39;s life and family.\n\nThe victim and his mother read emotional impact statements, but Lang barred InBuckeye from publishing those accounts.\n\nUnder the three-year sentence, Todd received credit for 490 days of incarceration. In addition to prison, the court ordered lifetime supervised probation with strict restrictions on computer usage. Todd must also register as a sex offender.\n\nDefense attorney Dakota Johnson acknowledged the serious nature of the offense, emphasized Todd&#39;s willingness to accept responsibility, and noted her commitment to rehabilitation. Johnson argued that her lack of prior criminal history and proactive steps toward accountability warranted a sentence of two to two-and-a-half years.\n\n\&#34;There was another case in this exact area, within the same school district, where I served as the defense attorney. You were the sentencing judge, and the prosecutor in this case was the prosecutor in that case,\&#34; Johnson said. \&#34;In that case, that person was facing far worse time at trial, had the same criminal history and got probation out of that.\&#34;\n\nThe judge rejected calls for a lesser sentence, stating the impact was too severe.\n\n\&#34;While the mitigating factors are acknowledged, they do not overcome the gravity of the harm caused,\&#34; Lang said. \&#34;I&#39;m finding a slightly mitigated sentence of three years is appropriate. I can&#39;t get to two or two-and-a-half. The aggravators are so serious.\&#34;\n\nLang also applauded the victim&#39;s bravery for resisting and halting further misconduct, remarks that emphasized the impact Todd had on the teen&#39;s well-being.\n\nTodd was indicted early last year on six counts of sexual misconduct with a 15-year-old and one count of aggravated luring of a minor.\n\nTodd&#39;s case began when her husband, also an Odyssey employee, called Buckeye police after finding evidence that Todd and a 15-year-old boy were in a sexual relationship. The husband reportedly found handwritten notes in a dresser that were \&#34;sexual in nature,\&#34; along with laptop messages that outlined a sexual relationship.\n\nTodd later gave detectives a handwritten note alleging the relationship began when the teen kissed her, according to court documents.\n\n\&#34;Everything started when she was taking the victim to get new track spikes, and he kissed her,\&#34; the documents state. \&#34;After that, the defendant stated they tried to find times to be alone. This included lying about their destination. They would sit in her car and sneak into her husband&#39;s office at the school to kiss each other.\&#34;\n\nThe relationship escalated from watching movies alone in Todd&#39;s car to sexting with lewd photos, leading to planned sexual encounters, court records show.\n\n\&#34;According to the defendant, the victim stated he wanted to have sex with her. She then bought condoms, and they planned to leave the school and drive somewhere to have sex. When they did this, the defendant made the victim leave his phone at school so no one could see his location.\&#34;\n\nInvestigators later found a used condom in Todd&#39;s car containing both parties&#39; DNA. However, investigator narratives say the parties claimed only grinding occurred.\n\nThe sentence comes months after another Buckeye teacher&#39;s aide, Diana Pirvu, was spared prison in a similar case involving a 13-year-old. Pirvu was offered a plea deal due to police errors, prosecutors said. InBuckeye later confirmed an apparent Miranda rights violation influenced the state&#39;s decision.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;dna-evidence&#34;, &#34;probation&#34;, &#34;husband-reported&#34;]}, {&#34;id&#34;: 33, &#34;case_id&#34;: 29, &#34;case_name&#34;: &#34;Emma Delaney Hancock&#34;, &#34;source&#34;: &#34;NonDoc&#34;, &#34;date&#34;: &#34;2024-10-30&#34;, &#34;text&#34;: &#34;Former Wellston substitute teacher convicted for sexting student\nBy Sasha Ndisabiye Bennett Brinkman \u2014 October 30, 2024\n\n(Update: On Wednesday, Dec. 18, Lincoln County District Court Judge Sheila Kirk sentenced Emma Delaney Hancock to four years in prison.)\n\nCHANDLER \u2014 After three days of testimony from two dozen witnesses in the trial against former Wellston Public Schools substitute teacher Emma Delaney Hancock, a Lincoln County jury found her guilty Wednesday on two felony counts of soliciting sexual conduct or communication with a minor by use of technology.\n\nAlthough she was acquitted of three other charges, Hancock cried quietly as Lincoln County Associate District Judge Sheila Kirk read the verdict. Seated in the gallery behind the defense table, members of Hancock&#39;s family showed signs of disbelief and despair. Hancock faced four charges related to her actions with a 15-year-old sophomore at Wellston High School while working as a substitute teacher in 2022. She faced an additional charge for showing two eighth graders inappropriate videos on her phone. Her trial began Monday and concluded Wednesday afternoon.\n\nJurors found Hancock guilty on one count related to sexual messages she sent to the 15-year-old student and on another count for showing the eighth graders videos of herself kissing another woman and pretending to perform oral sex on someone at a Halloween party.\n\nHancock was found not guilty on three counts, two of which were \&#34;lewd or indecent acts to (a) child under 16,\&#34; and one of which was \&#34;soliciting sexual conduct or communication with (a) minor by use of technology.\&#34; Each of those counts dealt with Hancock&#39;s actions with the 15-year-old student.\n\nBefore she was taken into custody, Hancock received a moment to say goodbye to her family, which includes two children she has with her husband, Wellston police chief Alfred Hancock. On the two counts for which they found her guilty, jurors recommended three-year sentences. Her sentencing date was set for Dec. 18.\n\nBilly Coyle, one of Hancock&#39;s attorneys, said Wednesday evening he will likely appeal the jury&#39;s verdict.\n\n\&#34;I thought we fought hard, and I&#39;m proud of her for standing up and going all the way to jury trial with it,\&#34; Coyle said. \&#34;It takes a lot to maintain your innocence.\&#34;\n\nCoyle acknowledged the evidence against his client even though she testified Wednesday that the things being said of her were untrue.\n\n\&#34;She maintained her innocence throughout trial. I represented her to the best of my ability, based upon her innocence, but I&#39;m not naive in saying that it was a tough case. There was a lot of witnesses that were against her,\&#34; Coyle said. \&#34;I thought the theme of the case was punish a woman as hard as a man. And I think that overall, there was just a lot more going on with this case than that. I respect the jury&#39;s verdict (\u2026) and so I just hope we&#39;ll continue to fight our case.\&#34;\n\nHancock is also facing a civil lawsuit filed by the high school student and his father in June. Their petition alleges nearly identical facts to those alleged in this week&#39;s criminal case.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;sentenced&#34;, &#34;civil-lawsuit&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;appeal&#34;]}, {&#34;id&#34;: 34, &#34;case_id&#34;: 30, &#34;case_name&#34;: &#34;Andie Rosafort&#34;, &#34;source&#34;: &#34;Connecticut Post&#34;, &#34;date&#34;: &#34;2024-09-26&#34;, &#34;text&#34;: &#34;Ex-New Fairfield lunch aide sentenced to prison in student sex assault case: &#39;She violated him&#39;\nBy Kendra Baker \u2014 September 26, 2024\n\nDANBURY \u2014 The former New Fairfield Middle School cafeteria aide accused of sexually assaulting a student will spend the next two-and-half years behind bars after accepting a plea agreement in her case.\n\nAndie Rosafort was sentenced Thursday at state Superior Court in Danbury to 20 years in prison, suspended after 30 months, followed by 10 years probation after pleading guilty to second-degree sexual assault and risk of injury to minor.\n\nThe 33-year-old appeared in court that afternoon dressed in gray sweatpants and a black T-shirt, prepared for what was to come.\n\n\&#34;This is the outcome of a lot of pretrial efforts \u2026 to get to a conclusion in a difficult case,\&#34; Rosafort&#39;s attorney, William Westcott, said during her Sept. 26 disposition hearing.\n\nThe charges against Rosafort stemmed from a state police investigation into \&#34;possible inappropriate behavior\&#34; involving a student, which resulted in her February 2023 arrest.\n\nRosafort was accused of exchanging inappropriate images with a student she met through her job at New Fairfield Middle School, according to the warrant for her arrest, as well as having illegal sexual contact with the minor.\n\nAccording to the warrant, police determined Rosafort had been privately messaging the student on social media for months, including sending sexually explicit images and videos of herself and asking the student for images as well.\n\nThe student told police he and Rosafort had sexual contact in January after she asked to meet in person, according to the warrant for her arrest. The student told police he was attending a party at a friend&#39;s house the night of the incident and agreed to meet her outside.\n\nAfter Rosafort picked him up, he told police she drove a short distance away and they \&#34;had contact of a sexual nature \u2026 inside of the SUV,\&#34; according to the warrant. The warrant for Rosafort&#39;s arrest says the victim told police he felt uncomfortable and immediately went back to the party.\n\nInvestigators later found explicit videos of Rosafort on the student&#39;s cellphone, as well as photos and videos on her social media that were consistent \&#34;with those described by the victim,\&#34; according to the warrant for her arrest.\n\nRosafort, who resigned from her position as a cafeteria aide after the state police investigation launched, was investigated and warned by school officials in November 2022 about her interactions with minor students on social media, according to records obtained from the school district. The school district&#39;s inquiry did not turn up any evidence of serious wrongdoing, according to a letter the superintendent sent to the school board.\n\n\&#34;When we send our children to school, we put our trust in the adults who work (there) that they will put our children&#39;s best interest first and take care of them. That was not done here,\&#34; Assistant State&#39;s Attorney Mary-Caitlin Harding said in court Thursday, adding that Rosafort \&#34;used her position\&#34; as a school employee to \&#34;infiltrate\&#34; the victim&#39;s life.\n\n\&#34;She violated him and she violated the trust of parents in the community,\&#34; Harding said. \&#34;Her actions were not just a one-time lack of judgment. This was prolonged activity that, as an adult in this situation, should have been stopped many times (but) she did not do that \u2014 and her actions had real consequences.\&#34;\n\nRosafort was arrested on second-degree sexual assault, risk of injury to minor and enticing a minor by computer charges, and originally pleaded not guilty to all three offenses.\n\nLast December, she rejected an open plea offer and opted to take her case to trial \u2014 which would have exposed her to a maximum potential sentence of 25 years in prison.\n\nRosafort later accepted an offer by the state and changed her pleas to guilty on the sexual assault and risk of injury charges. Judge Maximino Medina said in court Thursday that a nolle would be entered for the enticing a minor charge, meaning it will be dropped.\n\nIn addition to spending 30 months in prison \u2014 nine months of which Medina noted are mandatory \u2014 followed by 10 years probation, Rosafort will be required to register as a sex offender for 10 years. A lifetime protective order, prohibiting her from having any contact with the victim, is also in place.\n\nRosafort waived her right to make a public statement during her disposition hearing, but told loved ones in the courtroom, \&#34;I love you. I&#39;ll see you soon,\&#34; as she was escorted out in handcuffs.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;prior-warning-ignored&#34;]}, {&#34;id&#34;: 35, &#34;case_id&#34;: 31, &#34;case_name&#34;: &#34;Kelly Ann Schutte&#34;, &#34;source&#34;: &#34;Pottstown Mercury / MediaNews Group&#34;, &#34;date&#34;: &#34;2025-05-15&#34;, &#34;text&#34;: &#34;Ex-guidance counselor Kelly Ann Schutte sentenced for sexual contact with 14-year-old male student\nBy Carl Hessler Jr. \u2014 May 15, 2025\n\nNORRISTOWN \u2014 A Pennsburg woman, a former guidance counselor at a Bucks County middle school who had sexual contact with a 14-year-old male student, offered no apology or expression of remorse at her sentencing hearing as the boy and his parents sat only a few feet away.\n\n\&#34;As a guidance counselor, you were in a position of trust. You breached that trust on multiple occasions. You were supposed to offer guidance, and instead, you sexually molested a student,\&#34; Montgomery County Judge Wendy G. Rothstein sternly addressed Kelly Ann Schutte.\n\nUnder a plea agreement, Schutte, 36, of the 600 block of Penn Street, was sentenced to seven years of probation. Additionally, Schutte will have to report her address to state police for 15 years to comply with Pennsylvania&#39;s Sexual Offender Registration and Notification Act, previously known as Megan&#39;s Law. The conviction ensures that Schutte can never be employed as a school counselor again.\n\nSchutte also must undergo a psychosexual evaluation and comply with all treatment recommendations. Rothstein made it adamantly clear to Schutte that she is to have no contact with the victim and is prohibited from having unsupervised contact with minors except for her biological children.\n\nIn February,
