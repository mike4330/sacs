const qEl = document.getElementById("q");
const status = document.getElementById("status");
const results = document.getElementById("results");

function esc(s) {
  return String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
}

function highlight(text, terms) {
  let out = esc(text);
  terms.forEach(t => {
    if (!t) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    out = out.replace(re, m => `<mark>${m}</mark>`);
  });
  return out;
}

function excerpt(text, terms, ctx=120) {
  const lower = text.toLowerCase();
  let pos = 0;
  for (const t of terms) {
    const i = lower.indexOf(t.toLowerCase());
    if (i >= 0) { pos = i; break; }
  }
  const start = Math.max(0, pos - 40);
  const end = Math.min(text.length, pos + ctx);
  return (start > 0 ? "…" : "") + text.slice(start, end) + (end < text.length ? "…" : "");
}

function search(q) {
  q = q.trim();
  if (!q) { results.innerHTML = ""; status.textContent = `${INDEX.length} entries indexed.`; return; }
  const terms = q.toLowerCase().split(/\s+/);
  const hits = INDEX.filter(e =>
    terms.every(t => e.text.toLowerCase().includes(t) || (e.source||"").toLowerCase().includes(t))
  );
  status.textContent = `${hits.length} result${hits.length !== 1 ? "s" : ""} for "${q}"`;
  if (!hits.length) { results.innerHTML = "<p>No matches.</p>"; return; }
  results.innerHTML = hits.map(e => `
    <article>
      <header>
        <a href="${e.entry_path}"><strong>Entry #${e.id}</strong></a>
        — <a href="${e.case_path}">${esc(e.case_name)}</a>
        <span style="float:right; color:#888; font-size:0.85em">${esc(e.source||"")} ${esc(e.date||"")}</span>
      </header>
      <p>${highlight(excerpt(e.text, terms), terms)}</p>
      ${e.tags.length ? '<p>' + e.tags.map(t=>`<span class="tag">${esc(t)}</span>`).join(" ") + '</p>' : ""}
    </article>
  `).join("");
}

qEl.addEventListener("input", () => search(qEl.value));
