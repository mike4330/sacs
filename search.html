as been sentenced to 180 days in jail. She had been charged in April with Aggravated Criminal Sexual Abuse and Distributing Explicit Material to a Minor. Phillippe allegedly kissed a 14-year-old Roanoke-Benson student on several occasions, and traded explicit text messages and photos with the boy. She must serve at least half her jail sentence before she can be released. She had been receiving mental health treatment before now.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 206, &#34;case_id&#34;: 182, &#34;case_name&#34;: &#34;Ashley Wells&#34;, &#34;source&#34;: &#34;West Kentucky Star&#34;, &#34;date&#34;: &#34;2022-11-17&#34;, &#34;text&#34;: &#34;A former Trigg County High School teacher accused of having an inappropriate relationship with a minor accepted a plea deal Thursday in Christian Circuit Court. Forty-year-old Ashley Wells of Hopkinsville entered an Alford plea to one count of unlawful transaction with a minor in the second-degree, amended down from sexual abuse in the first-degree. The deal comes with a one-year sentence that will be felony pre-trial diverted for three years under the supervision of probation and parole. Commonwealth&#39;s Attorney Rick Boling described the conduct as a passionate kiss that lasted several minutes when the minor&#39;s hands made some type of sexual contact with Wells&#39; body. No accusations of sexual intercourse. The pre-trial diversion will last three years with no jail time and no sex offender registration required as long as she commits no new crimes. The original Christian County Grand Jury indictment said the incident happened in December 2016 and that Wells held a position of special authority or trust over the victim.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;no-prison&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 207, &#34;case_id&#34;: 182, &#34;case_name&#34;: &#34;Ashley Wells&#34;, &#34;source&#34;: &#34;West Kentucky Star&#34;, &#34;date&#34;: &#34;2023-01-19&#34;, &#34;text&#34;: &#34;A former Trigg County High School teacher alleged to have had an inappropriate relationship with a 17-year-old Christian County student in 2016 appeared in court for formal sentencing Wednesday. Ashley Wells was indicted by a Christian County grand jury last April on one count of first-degree sexual abuse. At a November hearing, Wells entered an Alford plea to an amended charge of second-degree unlawful transaction with a minor. The Commonwealth&#39;s Attorney recommended a one-year sentence to be diverted under the felony pretrial diversion program for three years. The judge agreed. Wells would not serve any jail time and would not be required to register as a sex offender.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 208, &#34;case_id&#34;: 182, &#34;case_name&#34;: &#34;Ashley Wells&#34;, &#34;source&#34;: &#34;West Kentucky Star&#34;, &#34;date&#34;: &#34;2025-03-14&#34;, &#34;text&#34;: &#34;Hopkinsville Police arrested 42-year-old Ashley Wells of Hopkinsville for driving under the influence of alcohol with children in her car. Wells was found sleeping in her car in the parking lot at Christian County Middle School. A witness told the school resource officer that Wells had an open container of alcohol in the car. Officers followed Wells as she left the lot, observed swerving, and conducted a traffic stop. Field sobriety test was reportedly failed. Two child passengers and an open alcoholic beverage were found in the car. Charged with second-degree wanton endangerment, operating a vehicle under the influence of alcohol, and possession of an open alcohol beverage in a vehicle.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 209, &#34;case_id&#34;: 183, &#34;case_name&#34;: &#34;Haley Reed&#34;, &#34;source&#34;: &#34;AP / Lexington Herald-Leader&#34;, &#34;date&#34;: &#34;2022-06-27&#34;, &#34;text&#34;: &#34;Former choir teacher at Oldham County High School Haley Reed, 40, of La Grange, sentenced Thursday to five years in prison for raping an underage student in 2018. Not eligible for probation. Required to complete sex offender treatment and register as a sex offender for life. Reed pleaded guilty in March to third-degree rape and first-degree unlawful illicit sex acts with a minor under the age of 18. Originally charged with 30 offenses: 15 unlawful transaction charges, 10 third-degree rape counts, and 5 third-degree sodomy counts. All but two dismissed. Reed admitted to police at arrest in June 2018 that she had sex with the student eight times between April and June after school hours on school property.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 210, &#34;case_id&#34;: 184, &#34;case_name&#34;: &#34;Makana Masacayan&#34;, &#34;source&#34;: &#34;KRQE / Santa Fe New Mexican / Rio Grande Sun / Inquirer.net&#34;, &#34;date&#34;: &#34;2023-03-30&#34;, &#34;text&#34;: &#34;Makana Masacayan, 26, former special education teacher at Espa\u00f1ola Valley High School, Espa\u00f1ola Public Schools, New Mexico. Arrested June 14-15, 2022 following investigation. Charged with fourth-degree criminal sexual penetration, fourth-degree criminal sexual contact of a minor, contributing to the delinquency of a minor, and enticement of a child. Evidence included cellphone records of interactions. Victim was a 16-year-old male student who disclosed the relationship to a probation officer. Conduct included a lap dance in a classroom closet, genital touching, and sexual intercourse on at least one occasion. Pleaded no contest March 30, 2023 in Rio Arriba County District Court to three charges. Sentenced same day to three years supervised probation and permanent ban from working in U.S. public schools. No prison time. NMPED revoked professional license. Masacayan was a Filipino national on a teaching visa; the case received coverage in Filipino press.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;physical-evidence&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 211, &#34;case_id&#34;: 185, &#34;case_name&#34;: &#34;Sarah O. Shirey&#34;, &#34;source&#34;: &#34;Meadville Tribune / Erie Times-News / WTAJ&#34;, &#34;date&#34;: &#34;2020-05-01&#34;, &#34;text&#34;: &#34;Sarah O. Shirey, 28 (at arrest), former English teacher at Conneaut Area Senior High School, Conneaut School District, Linesville, Crawford County, Pennsylvania. Arrested June 2019. Victim: 17-year-old male student. Relationship included sexual contact at school and off-campus during the 2018-2019 school year, discovered via student disclosure. Originally charged with multiple counts of indecent assault, corruption of minors, and unlawful contact with a minor. Pleaded guilty February 2020 to corruption of minors and indecent assault. Sentenced May 2020 to 6 to 23 months in Crawford County jail (minimum 6 months served). Sex offender registration for 15 years. Probation following jail. PA Department of Education revoked teaching license.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 212, &#34;case_id&#34;: 186, &#34;case_name&#34;: &#34;JoAnn Karel&#34;, &#34;source&#34;: &#34;KPRC / ABC13 / Houston Chronicle&#34;, &#34;date&#34;: &#34;2019-05-01&#34;, &#34;text&#34;: &#34;JoAnn Karel, 39 (at arrest), former teacher at Shadow Creek High School, Alvin Independent School District, Pearland, Brazoria County, Texas. Arrested August 2, 2018 following investigation. Victim: 17-year-old male student. Sexual relationship included multiple instances at school and off-campus during 2017-2018 school year. Original charges included indecency with a child and other sex offenses. Alvin ISD terminated employment 2018. Pleaded guilty May 2019 to improper relationship between educator and student (Tex. Penal Code \u00a7 21.12, second-degree felony). Sentenced May 2019 to 10 years deferred adjudication probation. Sex offender registration required. Probation violation exposure up to 20 years. TEA revoked teaching license 2019.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 213, &#34;case_id&#34;: 187, &#34;case_name&#34;: &#34;Sarah Noel Suggs&#34;, &#34;source&#34;: &#34;KPRC / ABC13 / Houston Chronicle&#34;, &#34;date&#34;: &#34;2019-03-01&#34;, &#34;text&#34;: &#34;Sarah Noel Suggs, 29 (at arrest), former special education teacher at Langham Creek High School, Cy-Fair Independent School District, Houston, Harris County, Texas. Arrested July 25, 2018 following investigation. Victim: 17-year-old male student. Sexual relationship included multiple instances at school and off-campus during 2017-2018 school year. Original charges included indecency with a child and other sex offenses. Cy-Fair ISD terminated employment 2018. Pleaded guilty March 2019 to improper relationship between educator and student (Tex. Penal Code \u00a7 21.12, second-degree felony). Sentenced March 2019 to 10 years deferred adjudication probation. Sex offender registration required. Probation violation exposure up to 20 years. TEA revoked teaching license 2019.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 214, &#34;case_id&#34;: 161, &#34;case_name&#34;: &#34;Giovanna Yaranga&#34;, &#34;source&#34;: &#34;Vermont Superior Court Docket No. 1749-5-13 Cncr&#34;, &#34;date&#34;: &#34;2013-09-06&#34;, &#34;text&#34;: &#34;Vermont Superior Court, Chittenden Criminal Division. State vs. Yaranga, Giovanna. DOB 11/19/1968. Prosecutor Susan Hardin; Defense James W. Murdoch; Judge Kevin Griffin. Original charges: 4 counts Sexual Exploitation of a Minor, Felony, 13 V.S.A. 3258(c). Offense dates: 10/01/12, 12/01/12, 02/01/13, 03/01/13. Arraigned 05/06/13; pleaded not guilty. Conditions: no contact with R.B. or his family, surrender passport. On 09/06/13 all 4 counts amended to SEXUAL EXPLOITATION OF A MINOR, Misdemeanor, 13 V.S.A. 3258(b). Defendant pleaded guilty to all 4 amended counts. Sentence: Counts 1-2: 6-12 months all suspended, probation. Counts 3-4: 0-1 year all suspended, probation. All concurrent. Probation expires September 6, 2017. Conditions: no contact with R.B.; no contact with minor males without PO permission (incidental/public contact permissible); counseling; remain away from schools R.B. attends. Sex offender registration ordered. Passport returned 09/20/13. Three motions for early discharge from probation filed (Oct 2015, Oct 2016, Jul 2017), all denied. Case disposed.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;appeal&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 215, &#34;case_id&#34;: 188, &#34;case_name&#34;: &#34;Lindsey Rose Schneeberger&#34;, &#34;source&#34;: &#34;Post-Bulletin / KIMT / KROC-AM / KAAL-TV&#34;, &#34;date&#34;: &#34;2024-04-01&#34;, &#34;text&#34;: &#34;Lindsey Rose Schneeberger, 26, former physical education teacher and volleyball coach at Pine Island Public Schools, Minnesota. Arrested May 25, 2023 after RPD and Goodhue County Sheriff investigated a 13-year-old female student and her former teacher. Abuse occurred at Schneeberger&#39;s Rochester residence March-May 2023: nude photo exchange and sexual assault. Victim&#39;s mother discovered explicit text messages with pet names. Schneeberger placed on leave March 6, resigned March 16, 2023. Pleaded guilty February 6, 2024 to first-degree criminal sexual conduct with a child under 14 (Minn. Stat. \u00a7 609.342). Sentenced April 1, 2024 to 12 years; 8 years minimum to serve. Court rejected probationary departure request. Sex offender registration; lifetime post-release supervision.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;female-victim&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 216, &#34;case_id&#34;: 188, &#34;case_name&#34;: &#34;Lindsey Rose Schneeberger&#34;, &#34;source&#34;: &#34;Post-Bulletin / Minnesota Court of Appeals (A24-1002)&#34;, &#34;date&#34;: &#34;2025-03-24&#34;, &#34;text&#34;: &#34;After the Minnesota Appellate Court decided to uphold her sentence, former Pine Island teacher Lindsey Rose Schneeberger is asking the Minnesota Supreme Court for further review. The Court of Appeals ruled March 3, 2025 that this was not a rare case warranting reversal and that the Olmsted County District Court did not abuse its discretion in denying a dispositional departure. Schneeberger filed a petition for further review to the Minnesota Supreme Court on March 21, 2025.&#34;, &#34;tags&#34;: [&#34;appeal&#34;]}, {&#34;id&#34;: 217, &#34;case_id&#34;: 189, &#34;case_name&#34;: &#34;Leslie Nicole Rains&#34;, &#34;source&#34;: &#34;Naughty Teacher List / local reporting&#34;, &#34;date&#34;: &#34;2023-12-15&#34;, &#34;text&#34;: &#34;Leslie Rains, 28, instructional assistant at Asbury High School, Asbury, Alabama, arrested December 2023 after Marshall County Sheriff&#39;s Office investigation beginning November 30, 2023. School officials and SRO deputies received information of inappropriate behavior with a student. Charged with engaging in a sexual act with a student under the age of 19 (Class B felony). Posted 5,000 property bond and bonded out hours after arrest. Board accepted Rains&#39; resignation the morning the matter came to the district&#39;s attention. Marshall County Schools Superintendent Cindy Wigley confirmed prompt reporting to authorities and immediate action. Community discussion arose regarding hiring protocols for unlicensed educational staff.&#34;, &#34;tags&#34;: [&#34;grooming&#34;]}, {&#34;id&#34;: 218, &#34;case_id&#34;: 189, &#34;case_name&#34;: &#34;Leslie Nicole Rains&#34;, &#34;source&#34;: &#34;Local Alabama news (sentencing report)&#34;, &#34;date&#34;: &#34;2024-12-02&#34;, &#34;text&#34;: &#34;Leslie Nicole Rains, 29, of Albertville, sentenced to a five-year split sentence: six months in Marshall County Jail plus 52 months probation. Ordered to register as a sex offender. Investigation began November 30, 2023. She was booked into Marshall County Jail at 5:05 p.m. on the day of sentencing with no bond. Charge: engaging in a sexual act with a student under the age of 19, Class B felony, Alabama.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;]}, {&#34;id&#34;: 219, &#34;case_id&#34;: 190, &#34;case_name&#34;: &#34;Amber Nicole Prince&#34;, &#34;source&#34;: &#34;Caller-Times / KRIS 6 / Naughty Teacher List&#34;, &#34;date&#34;: &#34;2023-05-31&#34;, &#34;text&#34;: &#34;Amber Prince, former London ISD teacher, rearrested May 26, 2023 for probation violation. Had pleaded guilty February 2022 to 10 counts improper relationship between educator and student. Sentenced to 5 years deferred adjudication with staggered 60-day jail (12 days/year). Probation violations included: failure to report to CSCD Feb 7, disrespect to probation officer, non-payment of fines/costs, curfew violation, failure to enroll in felony victim impact panel, failure to complete community service, failure to comply with internet monitoring. CSCD recommended revocation. Judge Galvan imposed sanctions instead. London ISD Superintendent Judi Whitis reaffirmed commitment to student safety. London ISD placed Prince on leave March 2021 upon notification; she resigned. Certificate surrendered and Do Not Hire Registry listing both March 2022.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 220, &#34;case_id&#34;: 190, &#34;case_name&#34;: &#34;Amber Nicole Prince&#34;, &#34;source&#34;: &#34;Texas Scorecard / Caller-Times&#34;, &#34;date&#34;: &#34;2026-03-03&#34;, &#34;text&#34;: &#34;Amber Nicole Prince, 45, former London ISD teacher, booked into Nueces County Jail February 24, 2026 to serve final 12-day installment of her agreed 60-day sentence. First arrested March 2021, charged with 10 counts improper relationship between educator and student. Pleaded guilty February 2022 to 5 years deferred adjudication probation. 60-day jail served in 12-day annual segments. Rearrested May 2023 for probation violations; Judge Bobby Galvan added sanctions (24-day jail, 90-day GPS) rather than revoking. Teaching certificate surrendered voluntarily; added to Do Not Hire Registry March 2022. Had worked at London ISD since 2015.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;appeal&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 221, &#34;case_id&#34;: 191, &#34;case_name&#34;: &#34;Megan Carlisle&#34;, &#34;source&#34;: &#34;Naughty Teacher List / Northwest Regional PD / CBS21&#34;, &#34;date&#34;: &#34;2023-06-01&#34;, &#34;text&#34;: &#34;Megan Carlisle, 37, paraprofessional and ISS monitor at Elizabethtown Middle School, Lancaster County PA, arrested May 2023. Victim 1 (15yo): sexual activity in her vehicle; explicit photos/videos sent to victim&#39;s 16yo friend. Victim 2 (14yo): fondled in ISS classroom April-May 2023; transported to storage unit on Elizabethtown Rd. in Mount Joy Township April 26, 2023, where she performed a sexual act; then drove him to a family member&#39;s home. Storage facility surveillance footage recovered. School staff reported misconduct May 3; district dismissed Carlisle and issued statement May 25. Additional charges filed June 2023 upon identifying second victim. Held at Lancaster County Prison on $200,000 bail. Possible additional victims; graphic photos/videos distributed to unknown number of students. Charges: involuntary deviate sexual intercourse, institutional sexual assault, statutory sexual assault, unlawful contact with minor, corruption of minors, dissemination of sexually explicit materials to minors.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;explicit-photos&#34;, &#34;physical-evidence&#34;, &#34;csam-distribution&#34;, &#34;possible-additional-victims&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 222, &#34;case_id&#34;: 191, &#34;case_name&#34;: &#34;Megan Carlisle&#34;, &#34;source&#34;: &#34;WGAL / CBS21&#34;, &#34;date&#34;: &#34;2024-07-31&#34;, &#34;text&#34;: &#34;Megan Carlisle, 39, former Elizabethtown Middle School paraprofessional, sentenced July 31, 2024 to 8 to 16 years in prison. Pleaded guilty February 2024 to statutory sexual assault, unlawful contact with a minor, and other charges; no contest to institutional sexual contact with a student. Crimes occurred spring 2023 while she was paraprofessional and ISS monitor.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;]}, {&#34;id&#34;: 223, &#34;case_id&#34;: 192, &#34;case_name&#34;: &#34;Emalee Marga Kedzierski&#34;, &#34;source&#34;: &#34;Erie Times-News / Pennsylvania court docket CP-25-CR-0002609-2022&#34;, &#34;date&#34;: &#34;2023-07-31&#34;, &#34;text&#34;: &#34;Emalee M. Kedzierski, 28, substitute teacher, Harbor Creek School District, Erie County PA. DOB 05/19/1994. Charged September 2, 2022 with institutional sexual assault of a minor (felony 3), corruption of minors, and furnishing alcohol to minors. Victim was a 17-year-old male student she had taught as a sub and also worked with at McDonald&#39;s; exchanged Snapchat info at YMCA April 2021. Visits to her residence June-July 2021; she provided beer ($50-$80 per occasion). Victim stated sex occurred twice. Kedzierski admitted oral sex, denied intercourse. No school-property contact alleged. Arraigned September 13, 2022 by District Judge Ferrick; released own recognizance. Harbor Creek SD removed her from sub list (Superintendent Kelly Hess). Charges resolved: guilty plea to corruption of minors M1 only (18 \u00a7 6301 \u00a7 A1i). Institutional sexual assault and furnishing alcohol charges dismissed. Sentenced July 31, 2023 by Judge Daniel J. Brabender Jr. to 6 months probation. Defense: Justin Panighetti.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 224, &#34;case_id&#34;: 193, &#34;case_name&#34;: &#34;Angela Leigh Stewart&#34;, &#34;source&#34;: &#34;First Coast News&#34;, &#34;date&#34;: &#34;2023-05-24&#34;, &#34;text&#34;: &#34;First Coast teacher arrested for alleged lewd conduct with student\n\nAngela Stewart, 53, is being charged with soliciting or engaging in lewd conduct with a student, lewd behavior, lewd molestation and unlawful use of two-way communication device.\n\nA redacted police report indicates that the engagement between the two, dates back from November 2022 to May 20. During the investigation, officers received screenshots of conversations between the student and Stewart.\n\nLighthouse Christian School released a statement saying they are \&#34;saddened and shocked.\&#34;\n\nStewart was taken into custody after being interviewed by police Tuesday and is being held on a bond of $325,012.\n\nStatement from Esther Skinner of Lighthouse Christian School:\n\nIn late April DCF investigators arrived at my campus due to an anonymous complaint made on behalf of a student regarding abuse occurring at home. Shortly after I was notified by Ms. Stewart that the same student initiated contact with Ms. Stewart over Facebook messenger asking for help because her mother was abusing her. Ms. Stewart shared with me that the student asked her to come pick her up from a nearby park and she did so. I let Ms. Stewart know that while I understand her heart to help students she was totally out of line with our strict policies regarding contact with students after hours. She firmly stated that she felt she did nothing wrong and was simply trying to help a student she felt was in need. I explained again that we have policies and procedures in place and she was to consider this to be a verbal reprimand.\n\nOn Monday of this week I was notified by a JSO detective that Ms. Stewart was under investigation. Upon learning this, Ms. Stewart was sent home as quickly and quietly as possible so as not to upset the school day any more than necessary. I informed the investigating Detective of our action and reassured him she would remain off campus, away from students. I was contacted by the detective late yesterday afternoon that Ms. Stewart had been arrested on the allegations and was being taken to jail.\n\nTo say I am saddened and shocked would be an understatement. All employees are thoroughly screened far above the requirements from the state for employment with Lighthouse. Ms. Stewart of course had all the background checks completed before hiring. Her fingerprints went through the Florida Department of Law Enforcement and FBI and were returned clear. All written and verbal references were very good including letters from previous parents. She has worked in education at various places for 10 years.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;, &#34;prior-warning-ignored&#34;, &#34;female-victim&#34;, &#34;private-school&#34;]}, {&#34;id&#34;: 225, &#34;case_id&#34;: 194, &#34;case_name&#34;: &#34;Lacey Brooke Oakes&#34;, &#34;source&#34;: &#34;Naughty Teacher List&#34;, &#34;date&#34;: &#34;2023-05-11&#34;, &#34;text&#34;: &#34;Airline High School English Teacher Lacey Oakes Arrested for Playing Inappropriate Sexual Games with Students\n\nA 36-year-old teacher from Haughton, Lacey Oakes, has been arrested for inappropriate behavior with students at a Bossier Parish high school. The Bossier Sheriff&#39;s Office launched an investigation into Oakes&#39; behavior with students, and according to reports, she showed sexual images to a student and played a sexually explicit game with several others. There was no evidence of sexual contact between Oakes and any of the students involved.\n\nOakes was taken into custody on a warrant and charged with one count of Indecent Behavior with a Juvenile and one count of Prohibited Sexual Conduct between Educator and Student. Her bond was set at $35,000. She is no longer employed by Bossier Parish Schools.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;explicit-photos&#34;]}, {&#34;id&#34;: 226, &#34;case_id&#34;: 194, &#34;case_name&#34;: &#34;Lacey Brooke Oakes&#34;, &#34;source&#34;: &#34;Rose-Neath Funeral Home (obituary)&#34;, &#34;date&#34;: &#34;2023-05-25&#34;, &#34;text&#34;: &#34;Lacey Brooke Oakes departed this life to her heavenly home on Thursday, May 18, 2023. Lacey was born on March 27, 1987, in Shreveport, Louisiana, grew up in Bossier City and was known for her kind and compassionate nature.\n\nLacey graduated from Airline High School in 2005. She went on to further her education earning a Bachelor of Science degree in education along with numerous academic honors from Louisiana State University in Shreveport in 2016. She then began her life-long dream of being a teacher. Lacey spent the last several years dedicating her time, energy, and creativity to the students of Bossier Parish Schools where she taught theater at Airline High School. She was a gifted and inspiring teacher who went above and beyond to support and help her students discover their talents and reach their full potential.\n\nLacey&#39;s greatest joy in life was being a mother to her two children, Macen and Noah.\n\nThose who knew Lacey will remember her for her devotion to her family, her infectious smile, her unwavering kindness, and her witty sense of humor.\n\nSurvived by daughter Macen Nix; son Noah Bradshaw; mother Karen Loyd Avery; step-father Randy Avery; grandmother Marguerite Richmond Loyd; brother Brock Oakes; and others.\n\nService held May 25, 2023 at Rose-Neath Funeral Home, Shreveport. Interment at Hosston Cemetery, Hosston, Louisiana.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;]}, {&#34;id&#34;: 227, &#34;case_id&#34;: 195, &#34;case_name&#34;: &#34;Allieh Kheradmand&#34;, &#34;source&#34;: &#34;InsideNoVa.com / WTOP&#34;, &#34;date&#34;: &#34;2023-04-15&#34;, &#34;text&#34;: &#34;Fairfax County special education teacher jailed for indecent liberties with student\n\nA special education teacher for Fairfax County Public Schools has been charged with four counts of taking indecent liberties with a student.\n\nOn April 12, James Madison High School administrators notified law enforcement after a student disclosed an inappropriate sexual relationship with a teacher, Fairfax police said in a news release.\n\n\&#34;Detectives determined Allieh Kheradmand, 33, of Reston had unlawful contact with a student over the past several months,\&#34; the release said.\n\nOn Thursday, Kheradmand was arrested and charged with four counts of indecent liberties by a custodian. Kheradmand is currently being held without bond.\n\nSpecialists from the police department&#39;s Victim Services Division have been assigned to ensure that the victim receives appropriate resources and assistance.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 228, &#34;case_id&#34;: 196, &#34;case_name&#34;: &#34;Devon Gabrielle Hooper&#34;, &#34;source&#34;: &#34;Naughty Teacher List&#34;, &#34;date&#34;: &#34;2023-01-04&#34;, &#34;text&#34;: &#34;Canyon Lake teacher arrested in November for an inappropriate relationship with a 15-year-old student\n\nOn November 14, a former Canyon Lake High School teacher was detained on suspicion of having improper contact with a 15-year-old pupil.\n\nAccording to court records, 38-year-old Devon Hooper was charged with improper relationship between educator and student and lodged in Comal County Jail before being released the same day.\n\nDetectives with the Comal County Sheriff&#39;s Office became aware of the accusations in October as a result of a police report from the victim&#39;s parents.\n\nAccording to reports, Hooper for at least a month sent the victim obscene messages and photos. According to a criminal complaint, \&#34;there were several mentions of sexual actions, meeting outside of school, and touching.\&#34; Hooper allegedly gave the victim pictures of herself in her underwear as well.\n\nAccording to reports, Hooper also taught the victim this year, as well as the year before.\n\nHooper resigned before being detained, according to Canyon Lake High School Principal Mark Oberholtzer, and the administration held off notifying parents of the charges until after the inquiry was over.\n\nAccording to the criminal complaint, \&#34;Several texts viewed demonstrated that Devon was aware that her acts were prohibited and that she may be fired and even arrested for her actions with (the boy).\&#34;\n\nHooper allegedly admitted to the conversations and gave a statement to school officials in an effort to shed light on the relationship, according to Comal County Sheriff&#39;s officers.\n\nHooper is wed to Brian Hooper, another employee of Canyon Lake High School.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;]}, {&#34;id&#34;: 229, &#34;case_id&#34;: 197, &#34;case_name&#34;: &#34;Emily Shay Walker&#34;, &#34;source&#34;: &#34;The Winchester Star&#34;, &#34;date&#34;: &#34;2024-01-30&#34;, &#34;text&#34;: &#34;Frederick teacher sentenced for sexual texting with student\n\nEmily Shay Walker, 24, of the 900 block of Filbert Street, Stephens City, entered her guilty plea last week in Frederick County Circuit Court to a felony charge of taking indecent liberties with a minor under the age of 15.\n\nIn accordance with the terms of a plea agreement reached between Frederick County Assistant Commonwealth&#39;s Attorney Marie Acosta and defense attorney Beau Bassler, Walker was sentenced by Judge Alexander Iden to five years in prison with all but 15 months suspended. Following her release from custody, she will spend two years under supervised probation, during which time she will be forbidden from entering any Frederick County Public Schools property, having unsupervised contact with minors other than immediate family members and using any computer, smartphone or social media service unless allowed by her probation officer.\n\nAdditionally, Walker will be required to register with the Virginia State Police as a sex offender and pay $872 in restitution to her victim&#39;s family.\n\nThe plea agreement credited Walker with time spent in custody while awaiting trial. She has been held without bond at the Northwestern Regional Adult Detention Center since being arrested on March 23 and, as of Tuesday morning, was still an inmate at the facility, according to jail records.\n\nWalker was a physical education teacher at Frederick County Middle School when she was accused in March of sending a series of sexually inappropriate text messages to one of her students. She was subsequently fired by the school system.\n\nAt a bond appeal hearing in May in Frederick County Circuit Court, Acosta said the texts \&#34;numbered in the thousands\&#34; and were exchanged beginning when the boy was 12 and continued after his 13th birthday.\n\nAt first, Acosta said, there was nothing sexual in the comments between Walker and her student. As soon as the boy turned 13, though, the tone changed.\n\nAccording to Acosta, Walker and the alleged victim were both playing an online multiplayer game in their own homes while exchanging messages about what the other would receive for winning. The boy said he wanted to kiss Walker and she replied: \&#34;If you win, I&#39;ll touch you wherever.\&#34;\n\nAcosta said Walker and the 13-year-old eventually kissed, but there is no indication their physical relationship went any further.\n\nThe kissing, according to Walker&#39;s indictment and a criminal complaint filed by Frederick County Deputy J.A. Tanner, occurred during the school day Feb. 18.\n\nSometime during the first two weeks of March, Acosta said, the boy&#39;s mother became suspicious of the text exchanges between her son and Walker, who was his basketball coach. Walker had urged the boy to delete the messages but they were still on his device when the mother took his phone.\n\nAfter reading the messages, the mom notified Frederick County Middle School, which in turn contacted the Frederick County Sheriff&#39;s Office on March 13.\n\nTanner wrote in his criminal complaint: \&#34;These messages confirmed a relationship between the student and the accused. Several messages relating to the proposal of potential future intercourse and the touching of Ms. Walker&#39;s body parts (female breast, female buttocks) were present on the phone as well as Ms. Walker proposing she touch [the] student&#39;s body parts.\&#34;\n\nIden, who privately reviewed the messages during Walker&#39;s hearing in May, said his interpretation of the texts was that Walker and the boy were considering making pornographic videos of themselves to share with each other.\n\nWalker was one of three Frederick County educators charged last year with having inappropriate relations with students. The other two were James Wood High School substitute teacher Kyle Ray Hendrickson and Sherando High School teacher&#39;s aide Matthew Jurgen Geyer, both of whom have since been terminated by Frederick County Public Schools.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;, &#34;sexting&#34;, &#34;csam-distribution&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 230, &#34;case_id&#34;: 197, &#34;case_name&#34;: &#34;Emily Shay Walker&#34;, &#34;source&#34;: &#34;DC News Now&#34;, &#34;date&#34;: &#34;2023-03-23&#34;, &#34;text&#34;: &#34;Frederick County middle school teacher turned herself in to the Frederick County Sheriff&#39;s Office after deputies investigated claims that she had inappropriate contact with a 12-year-old boy.\n\nThe sheriff&#39;s office said Emily Walker teaches Physical Education and coaches basketball at Frederick County Middle School. Walker is accused of having contact with the student, who is 13 years old now, on more than one occasion.\n\nInvestigators said they found evidence of hundreds of text messages between Walker and the student that spanned the course of several weeks. The messages supposedly indicated \&#34;an escalation in expectations of physical contact.\&#34;\n\nThe sheriff&#39;s office said Walker and the boy also met on more than one occasion on school property and kissed.\n\nDeputies said the charge against Walker is Taking Indecent Liberties with a Child.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;sexting&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 231, &#34;case_id&#34;: 198, &#34;case_name&#34;: &#34;Ashley Nicole Waffle&#34;, &#34;source&#34;: &#34;KSWO&#34;, &#34;date&#34;: &#34;2022-11-18&#34;, &#34;text&#34;: &#34;School employee arrested for sex with student\n\nA Granite Public Schools employee has been arrested after reportedly having sex with a 16-year-old student.\n\nAshley Waffle, 22, was charged with two accounts of second-degree rape, according to court documents filed Thursday in Greer County.\n\nAn investigation began Nov. 9 after school officials alerted the Granite Police Department about a rumor of Waffle having sex with a student, according to court documents. Those documents allege Waffle and the victim had intercourse at Waffle&#39;s apartment on two separate occasions after they started talking via Snapchat on Oct. 25.\n\nWaffle was arrested and booked into the Greer County Jail. She faces two charges of second-degree rape, which both carry sentences of up to 15 years in jail.\n\nThe District 3 Drug Task Force is leading the investigation.&#34;, &#34;tags&#34;: [&#34;snapchat&#34;, &#34;social-media&#34;]}, {&#34;id&#34;: 232, &#34;case_id&#34;: 76, &#34;case_name&#34;: &#34;Bonnie Rose Guess-Mazock&#34;, &#34;source&#34;: &#34;Doe v. Conroe ISD (S.D. Tex.), civil complaint&#34;, &#34;date&#34;: &#34;2022-02-24&#34;, &#34;text&#34;: &#34;Summary of factual background from civil suit (Doe v. Conroe ISD):\n\nIn October 2021, during his sophomore year at Oak Ridge High School, Doe&#39;s science teacher, Guess-Mazock, a woman in her thirties, \&#34;preyed\&#34; on the fifteen-year-old Doe, knowing that he was young and otherwise vulnerable. Guess-Mazock asked Doe to \&#34;stay with her in the classroom after the rest of the classroom was dismissed\&#34; and \&#34;met with Doe alone with the door to the classroom closed.\&#34; At this closed-door meeting, Guess-Mazock began to groom Doe for a sexual relationship and, in furtherance of that goal, asked Doe for his Snapchat username. Guess-Mazock then began to seduce Doe via Snapchat by sending seductive photos of herself appended with solicitous messages.\n\nThroughout the fall and winter of 2021, Guess-Mazock and Doe \&#34;had repeated sexual contact at different locations,\&#34; including Guess-Mazock&#39;s car and Doe&#39;s home. Guess-Mazock also purchased, or gave money to Doe to purchase, prescription and over-the-counter drugs, and encouraged Doe to abuse those substances prior to their having sex. On January 12, 2022, Doe overdosed on prescription drugs that Guess-Mazock gave Doe or paid him to get. Doe survived after a long hospital stay.\n\nDoe&#39;s legal guardian filed civil action against Conroe ISD (\u00a71983, failure to train staff to identify inappropriate relationships; failure to screen employees \u2014 district had at least five instances of sexual assault of a student by employees in last 20 years; failure to supervise Guess-Mazock who also \&#34;attempted to seduce other students\&#34;) and against Snapchat (failure to monitor for predators). The relationship was reportedly \&#34;an open secret that students frequently discussed.\&#34;&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;civil-lawsuit&#34;, &#34;social-media&#34;, &#34;drugs&#34;, &#34;possible-additional-victims&#34;]}, {&#34;id&#34;: 233, &#34;case_id&#34;: 199, &#34;case_name&#34;: &#34;Daena Coreas Delgado&#34;, &#34;source&#34;: &#34;Naughty Teacher List&#34;, &#34;date&#34;: &#34;2022-09-22&#34;, &#34;text&#34;: &#34;Daena Coreas Delgado, Bay City ISD teacher arrested for improper relationship with student and online solicitation of a minor under 14\n\nA 31-year-old woman was detained by Bay City police on Thursday morning, August 25, for illegal relationships between educators and internet solicitation of a juvenile under 14, according to police reports.\n\nOn August 25, Sgt. Minerva Pena was dispatched to Municipal Court to serve a warrant. When Pena arrived, she executed a warrant for improper relationships between educators and internet solicitation of a juvenile under 14 on Daena Coreas Delgado, 31, of Bay City.\n\nAccording to authorities, the warrants are the outcome of an investigation that started in October 2021. Initial reports indicate that Delgado assaulted the victim, who was under the age of 14 and was then investigated and detained for injury to a child.\n\nThe victim, a former student, and Delgado had an inappropriate relationship, according to additional inquiry, the police said, adding that the same victim had also been the target of internet solicitation.\n\nThe defendant was transferred to the Matagorda County Jail where he was arrested on charges after detectives obtained warrants and served them to him.\n\nDetectives currently assume there is just one victim.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;]}, {&#34;id&#34;: 234, &#34;case_id&#34;: 200, &#34;case_name&#34;: &#34;Taylor Cruze&#34;, &#34;source&#34;: &#34;USA Today&#34;, &#34;date&#34;: &#34;2022-09-14&#34;, &#34;text&#34;: &#34;Former Tennessee elementary school teacher facing two dozen child sex charges, including rape, after police say she posted inappropriate videos of students to TikTok.\n\nTaylor Cruze, 23, was indicted last week by a grand jury in Smyrna after a police investigation in connection to the felony crimes. Evans said that before her arrest last month, Cruze was a first-year fifth grade teacher at John Colemon Elementary School in Smyrna, about 25 miles southeast of Nashville. She was suspended without pay May 2 and resigned May 22.\n\nOn Aug. 3, court records show, officials issued a warrant for Cruze&#39;s arrest and the Rutherford County Sheriff&#39;s Office arrested her Aug. 10. Cruze is charged with multiple counts of exploitation of a minor under 13 by electronic means, exploitation of a minor by electronic means and especially aggravated sex exploitation of a minor. She also faces charges of solicitation of a minor \u2013 rape of a child, and sexual battery by an authority figure.\n\nA jail spokesperson told USA TODAY that Cruze posted a $100,000 bond the same day she was arrested.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;social-media&#34;, &#34;csam-distribution&#34;]}, {&#34;id&#34;: 235, &#34;case_id&#34;: 200, &#34;case_name&#34;: &#34;Taylor Cruze&#34;, &#34;source&#34;: &#34;Rutherford County source (via Naughty Teacher List)&#34;, &#34;date&#34;: &#34;2024-06-20&#34;, &#34;text&#34;: &#34;Taylor Cruze sentenced to 10 years \u2014 one year update.\n\nCruze was arrested on sexual in nature charges in 2022 and found guilty in 2023. 19 offenses alleged to have occurred in August 2021. Charges included 5 counts exploitation of a minor by electronic means (under 13), 5 counts exploitation of a minor by electronic means, 5 counts especially aggravated sexual exploitation of a minor, 3 counts solicitation of a minor \u2013 rape of a child, and 1 count sexual battery by an authority figure. Found guilty of especially aggravated sexual exploitation of a minor and solicitation of a minor - rape of a child before Judge James Turner; Sharon Reddick prosecuted; defense attorney Will Fraley.\n\nSentenced to 10 years in West Tennessee State Penitentiary, Henning, Tennessee. Commenced June 20, 2023; projected release June 20, 2033. At release she will be 34. Classified \&#34;Violent Against Children\&#34; on Tennessee Sex Offender Registry.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;csam-distribution&#34;]}, {&#34;id&#34;: 236, &#34;case_id&#34;: 201, &#34;case_name&#34;: &#34;Jaime Corinna Melton&#34;, &#34;source&#34;: &#34;Tampa Bay Times&#34;, &#34;date&#34;: &#34;2024-09-04&#34;, &#34;text&#34;: &#34;Jaime Corinna Melton, 44, pleaded guilty to sexual battery for a short-lived romantic relationship with a 16-year-old girl, a student at Carrollwood Day School in Tampa where she taught English. Sentenced Aug. 23 by Hillsborough Circuit Judge Christine Marlewski to 45 months in prison plus 10 years sex offender probation (GPS ankle monitor, annual polygraphs, residency restrictions near schools). State guidelines suggested 10 years; judge cited acceptance of responsibility, genuine remorse, low recidivism risk, and positive impact on others as basis for downward departure.\n\nDefense attorney Jason Mayberry argued for no prison; ASA Amber Turbeville prosecuted. Defense psychosexual evaluator Jennifer Sager testified Melton showed no psychopathy, had anxiety/depression and some histrionic traits, was not attracted to minors generally but to this particular teen, and was low recidivism risk. Victim&#39;s parents requested maximum sentence.\n\nMelton stated in court: \&#34;I understand that my actions were wrong. I am deeply sorry for the harm that they have caused.\&#34; Spoke of guilt, shame, and lasting harm to the victim. Had previously worked at Bloomingdale High School. Victim was described as a family friend who also attended the school.&#34;, &#34;tags&#34;: [&#34;female-victim&#34;, &#34;private-school&#34;]}, {&#34;id&#34;: 237, &#34;case_id&#34;: 201, &#34;case_name&#34;: &#34;Jaime Corinna Melton&#34;, &#34;source&#34;: &#34;Law&amp;Crime / Alberto Luperon&#34;, &#34;date&#34;: &#34;2022-09-13&#34;, &#34;text&#34;: &#34;Private School English Teacher with &#39;Unblemished&#39; Record Accused of Sexually Abusing a Student in Florida.\n\nJaime C. Melton, 42, taught English at Carrollwood Day School, a private institution in Tampa. Deputies said they developed probable cause and got an arrest warrant. Authorities took Melton into custody Sunday. Charged with Sexual Battery, Child Over 12 but Less than 18, by a Person in Familial or Custodial Authority.\n\nSchool head Sara Rubinstein: \&#34;Ms. Melton has had an unblemished teaching record and we have not had any concerns about her conduct prior. Ms. Melton has been suspended from her position immediately.\&#34; Deputies said the incident seemed to be isolated. Held at Hillsborough County Jail without bond.\n\nSheriff Chad Chronister: \&#34;This woman was a trusted member of this community who was responsible for the education and well-being of students, instead she violated that trust.\&#34;&#34;, &#34;tags&#34;: [&#34;female-victim&#34;, &#34;private-school&#34;]}, {&#34;id&#34;: 238, &#34;case_id&#34;: 202, &#34;case_name&#34;: &#34;Elizabeth Suzanne Bailey&#34;, &#34;source&#34;: &#34;Iredell County Sheriff&#39;s Office press release&#34;, &#34;date&#34;: &#34;2023-05-15&#34;, &#34;text&#34;: &#34;UPDATE (May 15, 2023): District Court Judge Christine Underwood amended bond, striking the $750,000 bond issued by the magistrate. Bailey to remain under posted bond from October 2022 and released without posting additional bond.\n\nSheriff Darren Campbell: On Saturday, May 13, 2023, Elizabeth Suzanne Bailey was arrested again.\n\nBailey was first arrested August 1, 2022, charged with Felony Statutory Rape of a Child 15 or Younger, Felony Indecent Liberties with a Child, and Felony Sex Offense with a Student. Bond: $75,000 secured, ankle monitor.\n\nAugust 8, 2022: charged with Felony Statutory Sex Offense with a Child Under 15 and Misdemeanor Contributing to Delinquency of a Minor. Bond: $50,000 secured.\n\nSeptember 2, 2022: arrested again, 19 charges \u2014 9 counts Misdemeanor Contributing to Delinquency of a Minor, 9 counts Felony Intimidating or Interfering with a State&#39;s Witness, 1 count Misdemeanor Violation of Pretrial Release Conditions. Bond: $500,000 secured.\n\nMay 13, 2023: Deputies responded to a traffic accident on 700 block of Mocksville Highway. Two juveniles fled the scene. Bailey, adult passenger, admitted she had been drinking. Later determined Bailey was under court order to stay away from one of the juveniles in the vehicle. Arrested for Violation of Pretrial Release. Also cited by NC Highway Patrol for Contributing to Delinquency of a Minor and Allowing an Unlicensed Driver to Drive.\n\nMagistrate M. Russell issued $750,000 bond; reduced to $50,000 by Judge Underwood on May 15, 2023.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 239, &#34;case_id&#34;: 203, &#34;case_name&#34;: &#34;Alissa McCommon&#34;, &#34;source&#34;: &#34;FOX13 Memphis&#34;, &#34;date&#34;: &#34;2024-12-20&#34;, &#34;text&#34;: &#34;Former Tipton County teacher sentenced to 25 years in prison for child sex crimes.\n\nAlissa McCommon pleaded guilty to 12 counts including rape of a child, statutory rape by an authority figure (2 counts), aggravated statutory rape (3 counts), sexual exploitation of a minor by electronic means (3 counts), solicitation of a minor: aggravated statutory rape (2 counts), and violation of the Child Protective Act. Originally indicted on 23 counts; others dismissed by agreement per Circuit Court Judge Blake Neill.\n\nSentenced to 25 years at 100% (no parole), lifetime supervision as violent sex offender, no contact with victims including the infant child fathered by one victim. Teaching license revoked.\n\nMcCommon worked as a fourth-grade teacher at Charger Academy when arrested September 2023. Investigators believed she may have had as many as 21 victims, ages 12\u201317.\n\nDA Mark Davidson: \&#34;The District Attorney General&#39;s Office commends the incredibly courageous victims who came forward to testify along with their parents.\&#34;&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;pregnancy&#34;]}, {&#34;id&#34;: 240, &#34;case_id&#34;: 203, &#34;case_name&#34;: &#34;Alissa McCommon&#34;, &#34;source&#34;: &#34;PEOPLE / ABC24 / WREG&#34;, &#34;date&#34;: &#34;2024-12-23&#34;, &#34;text&#34;: &#34;Teacher Who Got Pregnant After Raping Boy, 12, Gets 25 Years in Prison.\n\nAlissa McCommon, 39, of Covington, pleaded guilty December 20, 2024. DA Mark Davidson confirmed McCommon gave birth to a child fathered by one of the victims (12-year-old boy; paternity confirmed by DNA). Victim&#39;s mother has custody of the baby.\n\nCovington police began investigating August 2023 after DCS report. Multiple juveniles stated McCommon befriended them as their former teacher, played video games with them, connected via mobile apps, sent inappropriate photos on Snapchat, requested sexual relations. At least one victim met at a party; one met playing Fortnite. ADA Joni Reagan noted some victims were her students.\n\nPrimary victim (16 at investigation; 12 at time of oral sex incident): McCommon used a code word to verify he was alone, then sent nude photos on Snapchat. After arrest, contacted victim via unknown phone number using same code word, texted he would \&#34;regret doing this,\&#34; admitted to sexual encounter. Re-arrested September 28, 2023 for coercion of a witness, aggravated stalking, harassment.\n\nMcCommon threatened to kill herself if the 12-year-old victim ended their relationship.\n\nVictim&#39;s mother in court: \&#34;You took innocence from my son before puberty... Your mind is sick and twisted for looking at a child and being turned on. You will burn in hell.\&#34;\n\nMcCommon barred from contact with all victims and with the infant child. Lifetime supervision as violent sex offender on Tennessee Sex Offender Registry.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;pregnancy&#34;, &#34;no-remorse&#34;]}, {&#34;id&#34;: 241, &#34;case_id&#34;: 204, &#34;case_name&#34;: &#34;Casey McGrath&#34;, &#34;source&#34;: &#34;WTVC&#34;, &#34;date&#34;: &#34;2025-04-10&#34;, &#34;text&#34;: &#34;Former Hamilton County teacher pleads guilty to statutory rape of minor.\n\nCasey McGrath will be on state supervised probation and must register as a sex offender. She was also ordered to have no contact with the victim. The case will be dismissed from McGrath&#39;s record if she complies with all conditions after four years (Judicial Diversion).\n\nEARLIER (August 21, 2023): Hamilton County teacher suspended in 2023 on suspicion of inappropriate relationship with a student arrested and booked. Deputies with HCSO arrested 28-year-old Casey McGrath on Aug. 18, charged with aggravated statutory rape. McGrath had been suspended last April while investigators looked into the case; Hamilton County Schools confirmed she is no longer an employee.\n\nIndictment: McGrath engaged in sexual activity with someone between ages 13 and 18 on May 1, 2022. She is at least 10 years older than the victim.\n\nMcGrath taught algebra at Central High School since 2020 and algebra at East Ridge Middle School in the past. Personnel file shows she was suspended with pay and under investigation for \&#34;inappropriate physical contact with a student that does not result in harm\&#34; of a \&#34;sexual nature.\&#34;&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 242, &#34;case_id&#34;: 204, &#34;case_name&#34;: &#34;Casey McGrath&#34;, &#34;source&#34;: &#34;India Today / Fox News Digital&#34;, &#34;date&#34;: &#34;2023-08-26&#34;, &#34;text&#34;: &#34;&#39;Teacher of the month&#39; indicted for statutory rape of a minor student in Tennessee.\n\nCasey McGrath, 28, high school geometry teacher at Central High School Chattanooga, Tennessee. Voted \&#34;teacher of the month\&#34; in October 2021. Suspended with pay May 2022 after investigation into \&#34;inappropriate physical contact with a student that does not result in harm\&#34; of \&#34;sexual nature.\&#34; Not rehired for current school year; suspended without pay March 31.\n\nGrand jury indicted August 14 on charges of \&#34;unlawfully and knowingly engaging in sexual penetration with a person of at least 13 years of age, but less than 18,\&#34; noting she is \&#34;at least 10 years older than the victim.\&#34; Arrested August 18; posted $10,000 bond.\n\nMcGrath also worked as assistant volleyball coach at Central High School. Graduated from Lee University (mathematics) and Vanderbilt University (master&#39;s in secondary education for mathematics). Taught five years total, two at Central High. Article in school paper quoted her saying she enjoyed \&#34;getting to interact with students and build relationships with them.\&#34;\n\nAggravated statutory rape is a Class D felony in Tennessee carrying two to 12 years in prison.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 243, &#34;case_id&#34;: 205, &#34;case_name&#34;: &#34;Danielle Weaver&#34;, &#34;source&#34;: &#34;Fox News / WALB&#34;, &#34;date&#34;: &#34;2026-02-21&#34;, &#34;text&#34;: &#34;Georgia high school teacher arrested in alleged sex case involving student.\n\nDanielle Weaver, 29, of Leesburg, charged with child molestation and improper sexual contact by an employee, agent or foster parent, according to the Georgia Bureau of Investigations.\n\nLee County High School requested the Leesburg Police Department investigate allegations on Feb. 3. GBI called to assist Feb. 4. Investigators identified Weaver as the \&#34;subject\&#34; and identified the victim as a student under 18 at Lee County High School. Arrest warrants obtained Tuesday. Weaver turned herself in to the Lee County Sheriff&#39;s Office on Wednesday (Feb. 18) and was released on bond.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 244, &#34;case_id&#34;: 206, &#34;case_name&#34;: &#34;DaNita Wilson&#34;, &#34;source&#34;: &#34;AP / Morris News Service&#34;, &#34;date&#34;: &#34;2014-02-25&#34;, &#34;text&#34;: &#34;Former Charlton County High School math teacher DaNita Wilson, 33, sentenced to 10 years in prison after pleading guilty to six counts of sexual assault. Ordered to spend 15 years on probation after her sentence; barred from contact with minors other than her children.\n\nWilson was arrested in 2013 and removed from her job teaching 9th grade after posting $35,000 bond.\n\nSix students Wilson had sex with were 16 or older; state law prohibits teachers from having sex with students regardless of age of consent.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 245, &#34;case_id&#34;: 206, &#34;case_name&#34;: &#34;DaNita Wilson&#34;, &#34;source&#34;: &#34;CNN&#34;, &#34;date&#34;: &#34;2013-01-31&#34;, &#34;text&#34;: &#34;Georgia high school teacher DaNita Wilson, 32, arrested after being accused of having sex with seven students, one of whom was 15.\n\nCharlton County district attorney charged Wilson with seven counts of sexual assault; more charges may be pending. GBI assistant special agent in charge Stacy Carson: \&#34;After we began the investigation, there was enough that developed to arrest Ms. Wilson. The investigation is still ongoing.\&#34;\n\nSix victims over 16 (legal age of consent in Georgia); seventh was 15. One was a former student who had graduated. \&#34;Some of the relationships had been going on for at least one year or longer.\&#34;\n\nDistrict officials began inquiry Monday after receiving a complaint. Wilson removed from class before lunch by Superintendent John Lairsey, who escorted her to investigators. Bond set at $35,000 ($5,000 per count). Suspended with pay pending formal hearing.\n\nPrincipal Joshua M. Howard sent letter to parents about \&#34;inappropriate conduct by an employee.\&#34; Superintendent Lairsey: \&#34;I will be recommending termination. We&#39;re just shocked and disappointed.\&#34;\n\nWilson had been at the school for a decade, teaching 9th grade math.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 246, &#34;case_id&#34;: 207, &#34;case_name&#34;: &#34;Jennifer McCall Hubert&#34;, &#34;source&#34;: &#34;WRDW/WAGT&#34;, &#34;date&#34;: &#34;2016-07-28&#34;, &#34;text&#34;: &#34;Former Thomson High School teacher Jennifer McCall Hubert sentenced to ten years for having sexual contact with a student.\n\nHubert will spend her first year behind bars in the McDuffie County Jail and the rest of her sentence on probation. Under the first offender act, she will also pay a $2,500 fine and join the sex offender registry. Hubert has lost her teaching credentials and is not allowed to reapply for another teaching certificate.\n\nHubert was arrested in November 2015 on allegations of having sexual contact with a student. She taught American civics and economics at Thomson High School.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 247, &#34;case_id&#34;: 207, &#34;case_name&#34;: &#34;Jennifer McCall Hubert&#34;, &#34;source&#34;: &#34;WRDW/WAGT&#34;, &#34;date&#34;: &#34;2015-11-10&#34;, &#34;text&#34;: &#34;Jennifer McCall Hubert, 37, Thomson High School teacher arrested on allegations of sexual conduct with a student.\n\nGBI called to assist McDuffie County Sheriff&#39;s Office. Special Agent in Charge Pat Morgan: investigation revealed Hubert and a 16-year-old male student had been engaging in sexual conduct since early September.\n\nHubert arrested at the high school Tuesday; booked into McDuffie County Detention Center on felony charge of sexual assault by person with supervisory or disciplinary authority. Bond set at $25,000.\n\nMcDuffie County Board of Education: \&#34;deeply saddened and shocked... The safety of our students is \u2014 and always will be \u2014 our top priority.\&#34; Hubert no longer affiliated with the school system.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 248, &#34;case_id&#34;: 208, &#34;case_name&#34;: &#34;Corinna Carmen Crumpton&#34;, &#34;source&#34;: &#34;FOX 5 Atlanta&#34;, &#34;date&#34;: &#34;2022-01-05&#34;, &#34;text&#34;: &#34;Hart County school teacher arrested on sexual assault charges.\n\nCorinna Crumpton of Toccoa, GA, taken into custody January 4, 2022 on felony charges for allegedly electronically furnishing obscene materials to a minor and sexual assault. Age 30. Teacher at Hart County High School in Hartwell, Georgia.\n\nAuthorities said the crimes started in August and lasted through December 2021. Hartwell Police Department previously requested GBI assistance.&#34;, &#34;tags&#34;: [&#34;social-media&#34;, &#34;explicit-photos&#34;]}, {&#34;id&#34;: 249, &#34;case_id&#34;: 208, &#34;case_name&#34;: &#34;Corinna Carmen Crumpton&#34;, &#34;source&#34;: &#34;Georgia Court of Appeals, Case No. A23A0888&#34;, &#34;date&#34;: &#34;2023-10-12&#34;, &#34;text&#34;: &#34;The State v. Corinna Carmen Crumpton, Georgia Court of Appeals, Case No. A23A0888, decided October 12, 2023.\n\nCourt reversed trial court&#39;s order granting Crumpton&#39;s general demurrer to Count 2 (Improper Sexual Contact by an Employee in the First Degree, O.C.G.A. \u00a716-6-5.1(b.2)). Indictment alleged Crumpton, while employed as teacher at Hart County High School, electronically transmitted a photograph of her genitals to a minor student via Instagram.\n\nTrial court sustained demurrer, ruling the statute required physical contact. Court of Appeals disagreed: plain language of \u00a716-6-5.1(b.2) prohibits \&#34;sexual contact\&#34; with a student by a school employee; \&#34;sexual contact\&#34; is not limited to in-person physical touching. Transmitting a lewd image (a \&#34;lewd exhibition of the genitals\&#34;) constitutes prohibited sexual contact under the statute&#39;s broad definition, which includes acts intended to arouse or satisfy sexual desires. Statute title (\&#34;improper sexual contact\&#34;) does not restrict offense to physical contact only.\n\nCase reversed and remanded for further proceedings. Ruling clarified that digital transmission of explicit material from a teacher to a student can violate Georgia&#39;s educator misconduct statute even without physical touching.&#34;, &#34;tags&#34;: [&#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;appeal&#34;, &#34;novel-statute&#34;]}, {&#34;id&#34;: 250, &#34;case_id&#34;: 209, &#34;case_name&#34;: &#34;Krystal Jackson&#34;, &#34;source&#34;: &#34;KFSN ABC30 Fresno&#34;, &#34;date&#34;: &#34;2024-07-10&#34;, &#34;text&#34;: &#34;Former Kings Canyon Unified teacher to stand trial for sex crimes against student.\n\nKrystal Jackson, accused of four felony sex crimes involving a student who was 14 years old. Detectives learned the boy was part of an independent study program at Mountain View School and would meet with Jackson weekly at Dunlap Leadership Academy. Jackson sexually assaulted the boy during those meetings.\n\nInvestigators testified to phone evidence: allegation that victim had received a picture of a pregnancy test. Another investigator found proof Jackson wiped her phone on August 22, 2021 \u2014 just days before she was arrested in early September \u2014 then restored from prior backup minutes later.\n\nJackson remains out on bond. Faces five years and four months in prison if convicted on all charges.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 251, &#34;case_id&#34;: 210, &#34;case_name&#34;: &#34;Laura Dunker&#34;, &#34;source&#34;: &#34;PEOPLE / Yahoo News&#34;, &#34;date&#34;: &#34;2021-01-25&#34;, &#34;text&#34;: &#34;Ohio Teacher Gets Prison for Sex with Students, Including in Car Before School.\n\nLaura Dunker, former Bedford High School teacher, sentenced to two years in prison after pleading guilty to two counts of sexual battery. Two male students; incidents in her home and in her car at a park. Two years for each count, concurrent. Five years probation after release. Tier III registered sex offender; re-register every 90 days for life.\n\nOriginally charged with six counts of sexual battery (four with one student, two with the other) plus tampering with evidence. Incidents November 1, 2018 to October 19, 2019. In one instance, Dunker picked up a student before school and had intercourse in her car in a park.\n\nProsecutor Michael O&#39;Malley: \&#34;Teachers are expected to be role models to their students and communities which they serve. She took advantage of these students and now must face the consequences.\&#34;&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 252, &#34;case_id&#34;: 210, &#34;case_name&#34;: &#34;Laura Dunker&#34;, &#34;source&#34;: &#34;News 5 Cleveland&#34;, &#34;date&#34;: &#34;2020-01-06&#34;, &#34;text&#34;: &#34;Bedford High School teacher Laura Dunker indicted on six counts of sexual battery and one count of tampering with evidence. Appeared in Cuyahoga County Court of Common Pleas. Bond set at $5,000 cash surety; ordered to provide DNA specimen and have no contact with victim.\n\nAlleged sexual activity between Dunker and two male students occurred November 2018 to October 2019. In one incident, Dunker picked up a student before school, went to a park, and engaged in sexual activity with the student. Also accused of engaging in sexual conduct with a student at her home.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 253, &#34;case_id&#34;: 211, &#34;case_name&#34;: &#34;Laura V. Bucy&#34;, &#34;source&#34;: &#34;Akron Beacon Journal&#34;, &#34;date&#34;: &#34;2020-10-15&#34;, &#34;text&#34;: &#34;Former Twinsburg teacher gets early prison release after serving nine months for sexual battery.\n\nSummit County Common Pleas Judge Susan Baker Ross granted Laura Bucy, 35, early release after approximately 9 months served. Placed on probation for three years. Originally sentenced to two years in prison in January 2020. Prosecutors opposed release citing emotional toll on the student.\n\nDefense attorneys Joe Gorman and Larry Whitney: \&#34;We thought that not only the original sentence but the decision for judicial release was consistent and fair.\&#34;\n\nBucy began working as family and consumer sciences teacher in Twinsburg in August 2017. Admitted to having sex once with a male student, then 17, at the high school and sharing illicit images with him.&#34;, &#34;tags&#34;: [&#34;snapchat&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 254, &#34;case_id&#34;: 211, &#34;case_name&#34;: &#34;Laura V. Bucy&#34;, &#34;source&#34;: &#34;Twinsburg Bulletin / Akron Beacon Journal&#34;, &#34;date&#34;: &#34;2018-09-27&#34;, &#34;text&#34;: &#34;Laura V. Bucy, 32, Twinsburg High School teacher confessed to ex-father-in-law August 2, 2018 that she had sex with a 17-year-old male student at school; was crying and asking for forgiveness. Then abandoned her vehicle on I-71, located walking barefoot by OSHP; taken to hospital.\n\nEx-husband contacted Twinsburg police September 6. Police met with Bucy September 11; she admitted sexual relationship with student and exchange of explicit photographs. Charges filed and warrant issued September 12 after she left secured facility. Traveled to Arizona; father brought her back. Turned herself in September 22, 2018.\n\nArraigned in Stow Municipal Court: sexual battery (3rd-degree felony) and disseminating matter harmful to juveniles (5th-degree felony). Released on personal recognizance bond.\n\nPer police report: student helped clean classroom/pantry; Bucy initiated contact, kissing escalated to intercourse (student&#39;s account: before Christmas 2017; Bucy&#39;s account: February/March 2018). Bucy allowed student to vape in her office, purchased vaping juice for him. Also exchanged explicit videos on Snapchat. Bucy told police she also had illicit correspondence with another student at a prior employer (redacted).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;sexting&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 255, &#34;case_id&#34;: 212, &#34;case_name&#34;: &#34;Brooke L. Rosendale&#34;, &#34;source&#34;: &#34;PEOPLE / Yahoo News&#34;, &#34;date&#34;: &#34;2018-03-08&#34;, &#34;text&#34;: &#34;Engaged Ohio Teacher Had Sex With 13-Year-Old Female Student From Her School.\n\nBrooke Rosendale, 5th grade intervention specialist and girls volleyball and basketball coach at Riverdale School, sentenced to three years in prison for sexual battery after pleading guilty to having sex with a 13-year-old female student. Incidents occurred January and February 2017; not on school grounds. Rosendale was not the girl&#39;s teacher but they met through the school&#39;s extracurricular programs.\n\nRosendale, 27, was engaged to her long-term boyfriend when the incidents occurred. Parents reported in March 2017. Rosendale resigned; relinquished teaching certificate.\n\nOriginally charged with three counts of sexual battery; pleaded guilty to one count January 26; two counts dropped. Tier III sex offender; $225 restitution to victim&#39;s family. Cannot work with children.\n\nIn court: \&#34;I want to apologize to the family. I know I hurt them and I apologize.\&#34;&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 256, &#34;case_id&#34;: 212, &#34;case_name&#34;: &#34;Brooke L. Rosendale&#34;, &#34;source&#34;: &#34;The Blade&#34;, &#34;date&#34;: &#34;2017-06-28&#34;, &#34;text&#34;: &#34;Former Riverdale teacher Brooke L. Rosendale, 26, of Bloomdale, indicted by Hancock County grand jury on three counts of sexual battery (3rd-degree felonies). Offenses alleged January 4 and February 3. Incidents did not happen on school grounds; girl was not in Rosendale&#39;s class but the two knew each other through school programs.\n\nHancock County Prosecutor Phil Riegle confirmed the incidents were reported by the girl&#39;s parents on March 12. Rosendale resigned March 27. Employed by district for three years; received one-year contract for 2016-17 school year in March 2016.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 257, &#34;case_id&#34;: 213, &#34;case_name&#34;: &#34;Brooke M. Wright&#34;, &#34;source&#34;: &#34;InspireDot / WBNS / AP&#34;, &#34;date&#34;: &#34;2021-02-11&#34;, &#34;text&#34;: &#34;Tutor Sentenced For Having Sex With Vulnerable Teenage Boy Multiple Times.\n\nBrooke Wright, 40, from Gahanna, Ohio, sentenced to four years in prison after pleading guilty to two counts linked to sexual battery with a teen student. Franklin County Common Pleas Judge Chris Brown told Wright she would be eligible for release in 12 months if she committed to good behavior.\n\nWright served as teacher and administrator for Ventures Academy, an alternative school for students needing \&#34;social, emotional and behavioral interventions.\&#34; First indicted 2019 after victim reported sexual relationship that lasted seven months. Wright met the boy when he was 13; sexual activity occurred in 2019 when he was 14, at multiple locations in Franklin County.\n\nTwo counts of unlawful sexual conduct with a minor were dismissed under the plea agreement. Lifetime sex offender registration; teaching license surrendered. Educational Service Center removed Wright and suspended her upon learning of allegations in August 2019.\n\nProsecutor Ron O&#39;Brien: \&#34;This teacher and school administrator was engaging in inappropriate sexual acts with a student.\&#34;&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 258, &#34;case_id&#34;: 214, &#34;case_name&#34;: &#34;Suzanne Lea Owen&#34;, &#34;source&#34;: &#34;Lee County Sheriff&#39;s Office / State Attorney&#39;s Office&#34;, &#34;date&#34;: &#34;2019-06-25&#34;, &#34;text&#34;: &#34;Suzanne Owen, 36, of North Fort Myers, sentenced to two and a half years in prison followed by ten years of sex offender probation after pleading guilty to one count of Sexual Activity with a Child. Registered lifetime Sexual Predator.\n\nApril 2018: LCSO received report that defendant, a teacher, had inappropriate relationship with a student. Owen and victim communicated through emails and text messages. Defendant admitted to engaging in sexual activity with the student.\n\nOwen made an open plea to the court, then withdrew it; plea agreement reached in coordination with victim&#39;s family. No previous criminal history. Conditions: sex offender treatment program, GPS tracking monitor during probation, curfew, no contact with anyone under 18.\n\nLCSO arrest (April 11, 2018): One sexual encounter approximately one week prior; off-campus meeting by mutual arrangement. Text message communication for several weeks beforehand. Original charge: Custodial Sexual Battery (1st-degree felony).\n\nASA Mary Anderson handled the case.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 259, &#34;case_id&#34;: 215, &#34;case_name&#34;: &#34;Heidi Monroy&#34;, &#34;source&#34;: &#34;WITN&#34;, &#34;date&#34;: &#34;2024-06-12&#34;, &#34;text&#34;: &#34;PITT COUNTY, N.C. (WITN) - A Pitt County teacher has been arrested for allegedly having a sexual relationship with a student.\n\nThe Pitt County Sheriff&#39;s Office says Heidi Monroy, 44, was arrested Tuesday and charged with sexual activity with a student and indecent liberties with a student.\n\nMonroy was a teacher at D.H. Conley High School in Greenville.\n\nThe school system says Monroy was a language arts teacher and has been placed on administrative leave.\n\n\&#34;The safety and well-being of our students is always our top priority,\&#34; said Pitt County Schools spokeswoman Diane Garris. \&#34;We take all allegations of employee misconduct seriously and are cooperating fully with law enforcement in this matter.\&#34;\n\nThe sheriff&#39;s office says the investigation began after a parent contacted school administrators about a possible inappropriate relationship.\n\nMonroy has been released from the Pitt County Detention Center after posting a $50,000 bond.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;no-prison&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 260, &#34;case_id&#34;: 216, &#34;case_name&#34;: &#34;Mackenzie Matthews&#34;, &#34;source&#34;: &#34;10TV / Newark Advocate&#34;, &#34;date&#34;: &#34;2014-11-06&#34;, &#34;text&#34;: &#34;Heath High School Guidance Counselor Charged For Having Sex With Student\n\nA guidance counselor at Heath High School has been charged with sexual battery after she admitted to having sex with a student.\n\nMackenzie Matthews, 34, was charged with the third-degree felony. She has been on paid leave from the school during the investigation.\n\nMatthews engaged in sexual conduct with an 18-year-old male student between Feb. 1, 2010, and March 31, 2010, according to the Newark Advocate.\n\nPolice say she has admitted the relationship to them.\n\nEven though it was consensual and happened off school grounds, it is illegal in Ohio for an educator to have a sexual relationship with a student.\n\nThe newspaper reports that another teacher is currently filling the guidance counselor role at the school.\n\nMatthews has been at the school since 2005.&#34;, &#34;tags&#34;: [&#34;female-defendant&#34;, &#34;adult-victim&#34;]}, {&#34;id&#34;: 261, &#34;case_id&#34;: 216, &#34;case_name&#34;: &#34;Mackenzie Matthews&#34;, &#34;source&#34;: &#34;Newark Advocate&#34;, &#34;date&#34;: &#34;2015-01-06&#34;, &#34;text&#34;: &#34;Heath counselor gets two-year prison sentence\n\nA former Heath High School guidance counselor pleaded guilty Tuesday to sexual battery.\n\nMackenzie Matthews, 34, was sentenced to two years in prison. Matthews will lose her teaching license and be classified as a Tier III sex offender.\n\nBefore he handed down the sentence, Judge Thomas Marcelain said he hopes it sends a message: Student-teacher relationships are not OK, and teachers involved will be punished.\n\nMarcelain told Mackenzie Matthews that she was in a position of trust and authority, and that she abused it. \&#34;It has happened too often by people in your position,\&#34; Marcelain said.\n\nMatthews, 34, was calm throughout the hearing, pleading guilty to a bill of information and only choking up when she delivered a brief statement to the court.\n\n\&#34;I just want to sincerely apologize to the victim and his family, and to the Heath community and my school system,\&#34; she said. \&#34;I want to apologize to my friends and my family and my children, and especially my husband. I want to express the remorse I have for this, and I accept the responsibility for my actions.\&#34;\n\nMatthews was charged in November with one count of sexual battery, the result of a sexual relationship she had in 2010 with a person who was then a high school senior. She was facing up to five years in prison and a $10,000 fine. Her attorney, Kristin Burkett, requested probation.\n\nMatthews was hired at Heath in 2005. She was the district&#39;s only guidance counselor and, apart from this incident, her personnel file contained no disciplinary action.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;]}, {&#34;id&#34;: 262, &#34;case_id&#34;: 216, &#34;case_name&#34;: &#34;Mackenzie Matthews&#34;, &#34;source&#34;: &#34;Newark Advocate / Columbus Dispatch&#34;, &#34;date&#34;: &#34;2015-07-01&#34;, &#34;text&#34;: &#34;Mackenzie Land Matthews, a former Heath High School guidance counselor in Ohio, was granted early judicial release from prison in July 2015.\n\nRelease Terms: Following her early release in July 2015, Judge Thomas Marcelain ordered Matthews to serve three years of community control (probation).\n\nOriginal Sentence: In January 2015, she was sentenced to two years in prison after pleading guilty to sexual battery (a third-degree felony) involving an 18-year-old student.\n\nEligibility: She was granted early release after serving roughly six months, which is allowed under Ohio law for certain sentences between two and five years.\n\nBackground: The incident involved a consensual relationship with a student in 2010, which was reported years later. Her teaching license was permanently revoked.\n\nIf she violates the terms of her probation, she could be required to serve the remaining five-plus years of her sentence.&#34;, &#34;tags&#34;: [&#34;early-release&#34;]}, {&#34;id&#34;: 263, &#34;case_id&#34;: 20, &#34;case_name&#34;: &#34;State v. Stacy Schuler&#34;, &#34;source&#34;: &#34;Dayton Daily News (Denise G. Callahan)&#34;, &#34;date&#34;: &#34;2012-11-13&#34;, &#34;text&#34;: &#34;Teacher who had sex with students released from prison\n\nBefore a Warren County judge released convicted sex offender Stacy Schuler from prison Tuesday, one of the five victims said his former teacher ruined his life.\n\nJudge Robert Peeler released the 34-year-old former Mason High School teacher from prison after an hour-long hearing. Prior to her release one of her victims \u2014 the only one who showed up in court \u2014 said Schuler ruined his life.\n\n\&#34;I trusted Miss Schuler during a rough time in my life, and she used that trust against me,\&#34; he said. \&#34;She played her games and groomed me and took advantage. Most people in society feel that it&#39;s every 17-year-old&#39;s fantasy to sleep with their teacher. Being young and naive at the time, it was. What people fail to realize is this fantasy quickly turned into a nightmare that I&#39;m living today.\&#34;\n\nThe 34-year-old former Mason High School teacher apologized to the five victims and their families as a whole and to one in particular. She mentioned one of the victim&#39;s mothers at the sentencing who said her son had lost faith in God and authority figures.\n\nPeeler said he received more than 63 letters of support for Schuler, including one from one of her victims who felt Schuler needed counseling and had served enough time in prison. Another victim sent a letter letting Peeler know he has suffered from the ordeal.\n\nSchuler served a little more than one year on her four-year sentence on 16 felony counts of sexual battery. After a four-day bench trial where five former students \u2014 most of them football players \u2014 testified, Peeler said Schuler would be eligible for release after six months.\n\n\&#34;I&#39;m glad that the judge saw that one year in prison, the loss of her teaching position and the fact that she has to register as a sex offender for the rest of her life is punishment enough,\&#34; said her attorney Charlie H. Rittgers.\n\nSome parents of Schuler&#39;s victims were stunned by the judge&#39;s decision to release the former educator.\n\n\&#34;One teacher, five students, 16 counts of sexual battery, three counts of offenses involving underage students, 12 months in prison; it amounts to just under three weeks per count,\&#34; the mother of one victim said in court Tuesday. \&#34;It is appalling and I strongly object. Our son and our family have spent the last two years in emotional turmoil.\&#34;\n\nThe former physical education teacher at Mason High School was found guilty of supplying five students with alcohol and having sex with them on multiple occasions in her Springboro home in fall 2010.\n\nThe five young men gave graphic, detailed accounts of the exploits at Schuler&#39;s home. One said sex with Schuler was initiated on a kitchen counter and two others talked about sex they had with Schuler in her shower. Several said they had repeated group sex with Schuler in her bed.\n\nPeeler, before announcing his decision, said while her crimes were serious and had far-reaching consequences, he doesn&#39;t believe she will
