dicting defense&#39;s claim all acts were off-campus. Husband James Franklin Parker, 32 (math teacher, basketball/football coach at same school), was arrested March 30, 2016 on the same charges involving a different female student \u2014 incidents described as separate and unrelated by DA Chris McCool.\n\nAppeal filed February 6, 2018 by appellate attorney M. Virginia Buck (Northport) on three grounds: (1) Equal protection \u2014 Alabama law criminalizes consensual sex between school employees and 16-18 year olds, but not doctors, ministers, therapists, or attorneys; \&#34;School employees have been unfairly singled out and are being sent to prison for something that, at most, might cost people their job or their license in any other profession.\&#34; (2) Statute \u00a7 13A-6-81 did not cover private schools until a mid-2016 amendment; Parker&#39;s charges pre-date that change. (3) Constitutional right to private consensual sexual intimacy; Alabama&#39;s age of consent is 16. The Alabama Court of Criminal Appeals denied the appeal, finding Parker&#39;s reasoning unpersuasive on all three grounds.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;guilty-plea&#34;, &#34;private-school&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;civil-suit&#34;, &#34;coach&#34;, &#34;cemetery-venue&#34;, &#34;constitutional-appeal&#34;, &#34;equal-protection&#34;, &#34;spousal-co-offender&#34;, &#34;appeal-denied&#34;]}, {&#34;id&#34;: 72, &#34;case_id&#34;: 64, &#34;case_name&#34;: &#34;Lyndsey Sherrod Bates&#34;, &#34;source&#34;: &#34;AP / AL.com&#34;, &#34;date&#34;: &#34;2019-05-06&#34;, &#34;text&#34;: &#34;Lyndsey Sherrod Bates, 22-23, former special education teacher at Madison County High School, Alabama, was convicted of having sex with a student and engaging in a sex act with a student younger than 19, plus three misdemeanor counts of distributing obscene material to a student.\n\nShe was sentenced to time served plus three years of probation. A 10-year prison sentence was suspended in a plea deal with county prosecutors. Both students were at least 16, and neither was a student in Bates&#39; classroom.\n\nBates resigned March 29, 2019. Two weeks later, on April 12, she was arrested on five sex crimes charges. She is accused of having sex with a 17-year-old male student around February 14, and sending nude photos to that student and a second student. The nude photos to the second student were sent on or about March 29, 2019 \u2014 the day her resignation became effective. The second student&#39;s age is not listed in court records.\n\nBates was daughter-in-law of Stacy Bates, chief deputy for the Madison County Sheriff&#39;s Office, which reviewed the case. Sheriff&#39;s officials stated the relationship didn&#39;t affect the investigation.\n\nBates was hired at the start of the 2018-19 school year with a salary of $39,305. She passed a criminal background check and was deemed \&#34;suitable and fit to teach.\&#34; She resigned before her arrest; the Alabama State Department of Education said it had not yet proposed any negative action against her certification at the time of arrest.&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;multiple-victims&#34;, &#34;guilty-plea&#34;, &#34;suspended-sentence&#34;, &#34;sexting&#34;, &#34;no-prison&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;special-ed&#34;, &#34;law-enforcement-family-connection&#34;, &#34;valentines-day&#34;]}, {&#34;id&#34;: 73, &#34;case_id&#34;: 65, &#34;case_name&#34;: &#34;Carrie Cabri Witt&#34;, &#34;source&#34;: &#34;WAFF / local press&#34;, &#34;date&#34;: &#34;2021-07-06&#34;, &#34;text&#34;: &#34;Carrie Cabri Witt, 48, former history/psychology/government/economics teacher and JV cheerleading/varsity golf coach at Decatur High School, was sentenced July 6, 2021 to 10 years with 18 months to serve in prison, followed by an 18-month community corrections program, 7 years probation, and lifetime sex offender registration.\n\nWitt was arrested March 21, 2016 by Decatur PD&#39;s Violent Crimes Unit on two counts of a school employee engaging in a sex act with a student under 19 (Ala. Code \u00a7 13A-6-81). Victims were ages 17 and 18. She was released on a $10,000 bond. Superintendent Ed Nichols placed her on administrative leave.\n\nWitt challenged the statute as unconstitutional \u2014 arguing Alabama&#39;s 16-year age of consent preempts the school-employee prohibition on private consensual relationships. A Morgan County Circuit Court judge agreed, ruling the statute unconstitutional. The Alabama Supreme Court reversed and remanded. After five years of litigation, Witt pleaded guilty in March 2021 to one count; the second charge was dropped.\n\nADA Courtney Schellack: \&#34;Teachers are some of the most trusted and respected members of society. Ms. Witt violated that trust by her actions with one of her own students. That is exactly why this law is necessary \u2014 to protect students and their safety at school.\&#34;\n\nNote: The Morgan County constitutional ruling coincided with the month Charli Jones Parker (#63) pleaded guilty on the same statute. The Alabama Supreme Court&#39;s reversal in the Witt case became the controlling precedent that foreclosed Parker&#39;s appeal.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;guilty-plea&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;coach&#34;, &#34;constitutional-appeal&#34;, &#34;equal-protection&#34;, &#34;appeal-denied&#34;, &#34;alabama-statute-challenge&#34;, &#34;controlling-precedent&#34;, &#34;five-year-delay&#34;]}, {&#34;id&#34;: 74, &#34;case_id&#34;: 66, &#34;case_name&#34;: &#34;Susan Weddle&#34;, &#34;source&#34;: &#34;WEAR ABC 3&#34;, &#34;date&#34;: &#34;2021-11-28&#34;, &#34;text&#34;: &#34;Susan Weddle, 40, former Escambia County School District teacher, was sentenced November 28, 2021 to 6.5 years in prison for a sexual relationship with a Tate High School student. She was convicted of lewd or lascivious battery (victim over 12 but younger than 16) and unlawful sexual activity with certain minors. Court documents state she will register as a sex offender and serve five years of probation following release.\n\nAn arrest report states Weddle had a sexual relationship with a teen, either 16 or 17, that lasted more than a year before ending October 2019. The victim told law enforcement he met Weddle through her son, who was his friend. Incidents occurred at her house, the beach, his house, and in her car. Weddle sent the victim nude photos via cell phone. The victim stated Weddle was his only sexual partner and that he believed he loved her. Both cell phones were seized.\n\nAt the time of her arrest, Weddle was working at the J.E. Hall Center Administrative Building, not in a classroom. State Attorney Bill Eddins disclosed that his office had investigated Weddle approximately 18 months earlier for similar allegations involving a different minor; that investigation was closed after all leads were exhausted with no determination that a crime had been committed. Bond was set at $150,000.&#34;, &#34;tags&#34;: [&#34;sexting&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;access-via-defendants-child&#34;, &#34;prior-investigation&#34;, &#34;repeat-offender&#34;, &#34;multiple-venues&#34;, &#34;victim-believed-love&#34;]}, {&#34;id&#34;: 75, &#34;case_id&#34;: 67, &#34;case_name&#34;: &#34;Crystal Gilliland Clowdus&#34;, &#34;source&#34;: &#34;AL.com / AP&#34;, &#34;date&#34;: &#34;2014-03-03&#34;, &#34;text&#34;: &#34;Crystal Gilliland Clowdus, 32, former teacher at Susan Moore High School, Oneonta, Blount County AL, pleaded guilty March 3, 2014 to transmitting obscene material to a minor. A 15-year-old male student said she sent him nude and partially nude photos and sexual text messages saying she would like to have sex with him. No physical contact was established.\n\nSentence: 10 years with 9 suspended; 6 months Blount County Correctional Facility, then 6 months house arrest; 5 years probation; lifetime sex offender registration; teaching license surrender. Bond at arrest was $100,000. Plea deal was reached within 3 days of her December 20, 2013 arrest; a new judge had to be assigned before the formal plea could be entered.\n\nBlount County DA Pamela Casey (a Susan Moore alumna) stated publicly that there was no physical contact between Clowdus and the victim, to counter community rumors. She also noted the principal was aware of the student&#39;s claims three weeks before the parents were notified, and requested the Alabama Bureau of Investigation examine why school officials had not reported as required by law. The victim&#39;s family supported the plea deal; Casey said Clowdus is taking full responsibility.\n\nA second Susan Moore teacher, Warren Kelley, 42, was arrested in January 2014 on harassment and second-degree sex abuse charges for inappropriate touching of a different student; his trial was set for March 17.\n\nUpdate (August 2017): Clowdus, 35, was arrested August 9, 2017 after records showed she was volunteering at Oneonta Elementary School while registered as a lifetime sex offender. State law prohibits sex offenders from volunteering at schools. She was charged with violating the Sex Offender Registration and Notification Act.&#34;, &#34;tags&#34;: [&#34;guilty-plea&#34;, &#34;sexting&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;institutional-failure&#34;, &#34;alabama-statute-challenge&#34;, &#34;no-physical-contact&#34;, &#34;sora-violation&#34;, &#34;post-conviction-reoffense&#34;, &#34;principal-delay&#34;, &#34;co-teacher-arrested&#34;]}, {&#34;id&#34;: 76, &#34;case_id&#34;: 68, &#34;case_name&#34;: &#34;Alicia Gray&#34;, &#34;source&#34;: &#34;AL.com / AP&#34;, &#34;date&#34;: &#34;2014-01-10&#34;, &#34;text&#34;: &#34;Alicia Gray, 28, former math teacher (algebra, math 9, honors pre-calculus) at Mary G. Montgomery High School, Semmes, Mobile County AL, pleaded guilty January 10, 2014 before Circuit Court Judge Michael Youngpeter. She had surrendered to the Mobile County Sheriff&#39;s Office on February 25, 2013.\n\nCharges: second-degree sodomy, second-degree sexual abuse, and school employee sexual contact with student under 19 (Ala. Code \u00a7 13A-6-81). Victim was 14 years old at the time of the incident. Gray had taught at Mary G. Montgomery for at least six years and graduated from the school herself approximately ten years earlier.\n\nSentence: five-year split sentence; six months served plus five years probation. As a condition of probation, Gray cannot be employed with minors. She surrendered her teaching certificate to the Alabama Department of Education at sentencing. She must register as a sex offender for life.\n\nADA Nicki Patterson called the deal \&#34;a win-win for everyone.\&#34; She said the primary consideration was keeping Gray away from children and that the deal spared the 14-year-old victim from testifying. Patterson noted that Gray admitted at the plea that she had harmed \&#34;the victim and others,\&#34; though detectives were unable to identify additional victims with improper contact after interviewing former students. The victim&#39;s family was satisfied with the outcome. Gray had been on paid administrative leave since her arrest and resigned several months before the plea.\n\nSuperintendent Martha Peek: \&#34;When the allegations came out, we acted quickly. We deeply regret this ever happened.\&#34;&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;guilty-plea&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;young-victim&#34;, &#34;sodomy&#34;, &#34;alma-mater&#34;, &#34;unresolved-additional-victims&#34;, &#34;six-years-tenure&#34;]}, {&#34;id&#34;: 77, &#34;case_id&#34;: 69, &#34;case_name&#34;: &#34;Heather Daughdrill&#34;, &#34;source&#34;: &#34;KPLC / 14th JDC press release&#34;, &#34;date&#34;: &#34;2012-10-09&#34;, &#34;text&#34;: &#34;Heather Daughdrill, 29, of Westlake LA, pleaded guilty October 9, 2012 in 14th Judicial District Court (Calcasieu Parish, Division H) to felony carnal knowledge of a juvenile. Judge Ron Ware sentenced her to five years LDOC with four years suspended, concurrent with her Beauregard Parish sentence; five years supervised probation; no contact with the victim or his family; no contact with any minors under 17; sex offender registration; restitution to the victim&#39;s family.\n\nDaughdrill met the 13-year-old male victim at a summer Bible school camp. She had multiple encounters with the boy at multiple locations; she sometimes picked him up after school without his parents&#39; permission (the basis for the kidnapping charges).\n\nIn September 2012, Daughdrill had separately pled guilty in Beauregard Parish (36th JDC) to felony carnal knowledge of a juvenile: five years LDOC, four suspended, five years supervised probation. The Calcasieu sentence runs concurrent, making effective custodial time one year.\n\nOriginal Calcasieu charges: 4x carnal knowledge of a juvenile; 8x sexual battery; 3x second-degree kidnapping; 1x contributing to delinquency of a juvenile; 1x indecent behavior with a juvenile. Original Beauregard charges: felony carnal knowledge + 3x second-degree kidnapping.\n\nJudge Ware told Daughdrill at sentencing: \&#34;I trust the judgment of these lawyers, but you need to know you are getting a very lenient sentence. This affair was not a one-time thing and it happened at multiple locations. It doesn&#39;t only affect the victim but his family and your family.\&#34; ADA Cynthia Guillory prosecuted. Defense attorney: Fred Lebleu.&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;guilty-plea&#34;, &#34;sentencing&#34;, &#34;male-victim&#34;, &#34;multiple-venues&#34;, &#34;young-victim&#34;, &#34;faith-setting&#34;, &#34;edge-case&#34;, &#34;two-parish-prosecution&#34;, &#34;kidnapping-charges&#34;, &#34;judicial-leniency-acknowledgment&#34;]}, {&#34;id&#34;: 78, &#34;case_id&#34;: 70, &#34;case_name&#34;: &#34;Jennifer Collins McNeill&#34;, &#34;source&#34;: &#34;HuffPost / WBRC&#34;, &#34;date&#34;: &#34;2014-08-08&#34;, &#34;text&#34;: &#34;Jennifer Collins McNeill, 39, former teacher and cheerleading coach at Thorsby School (K-12 combined), Chilton County AL, was sentenced August 7, 2014 to five years in prison (60 months, all custodial) for second-degree rape and sodomy of a teenage male.\n\nThe victim was the son of McNeill&#39;s 10-year friend. The families attended the same church, where McNeill had taught Sunday school. The victim was not a student at Thorsby. The offenses occurred between April 2012 and June 2013. McNeill was arrested in August 2013 on 6 counts of rape and 2 counts of sodomy of a juvenile male (under 16).\n\nShe pleaded guilty in May 2014 to second-degree rape and sodomy. The original plea deal called for half of her sentence in prison and half under house arrest. However, McNeill lied about incriminating Facebook posts in the case, claiming the victim and his mother had hacked her account. Her attorney later admitted she had \&#34;misrepresented herself.\&#34; The judge mandated all 60 months be served in prison, citing her moral responsibility to her community and church, and the misuse of that trust. McNeill cried and begged for mercy at sentencing.\n\nThe victim&#39;s mother spoke before sentencing, noting that she and McNeill had been friends for 10 years before the abuse. Chief Deputy DA C.J. Robinson: \&#34;It&#39;s embarrassing for the school system, and it&#39;s not fun for anybody involved, but it&#39;s something that we have to face now.\&#34; Superintendent Dave Hayden placed McNeill on administrative leave after her arrest; she later resigned.&#34;, &#34;tags&#34;: [&#34;guilty-plea&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;coach&#34;, &#34;young-victim&#34;, &#34;sodomy&#34;, &#34;faith-setting&#34;, &#34;access-via-friendship&#34;, &#34;facebook-evidence&#34;, &#34;plea-modification&#34;, &#34;lying-to-court&#34;, &#34;rape&#34;]}, {&#34;id&#34;: 79, &#34;case_id&#34;: 71, &#34;case_name&#34;: &#34;Heather Whitten&#34;, &#34;source&#34;: &#34;WBRC / AL.com&#34;, &#34;date&#34;: &#34;2012-10-09&#34;, &#34;text&#34;: &#34;Heather Whitten, 38, former 5th-grade teacher (math and reading) at Williams Intermediate School, Pell City AL, was sentenced October 9, 2012 by Judge Jim Hill to a five-year split sentence: one year and one day in prison at Tutwiler, with the remainder on supervised probation. She was indicted on three counts of second-degree sexual abuse for having sexual relations with a boy between the ages of 12 and 16; she pleaded guilty to second-degree rape.\n\nProsecutors stated the sexual relationship occurred during and after the time Whitten had legal custody of the 14-year-old male victim. She had met him at school but he was not her student. Whitten was arrested in February 2012 and released on a $5,000 bond. She had been teaching at Williams Intermediate School since January 2012 \u2014 one month before her arrest \u2014 and previously taught at Eden Elementary for three years.\n\nAt sentencing, her brother and a longtime family friend testified on her behalf, saying she was compassionate, cared about children, was active in her church, and that the incidents were out of character for her.\n\nWhitten resigned from her job following her arrest. DA Richard Minor (St. Clair County) prosecuted the case. Superintendent Bobby Hathcock suspended her without pay immediately after the arrest.\n\nBackground: 1992 Pell City High graduate; BS health administration Auburn 1997; MA early childhood/elementary education West Alabama 2011.&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;guilty-plea&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;young-victim&#34;, &#34;faith-setting&#34;, &#34;rape&#34;, &#34;legal-custody&#34;, &#34;guardian-victim&#34;, &#34;character-witnesses&#34;, &#34;out-of-character-framing&#34;]}, {&#34;id&#34;: 80, &#34;case_id&#34;: 72, &#34;case_name&#34;: &#34;Emily Marie Anderson&#34;, &#34;source&#34;: &#34;KSAT / New Braunfels Herald-Zeitung&#34;, &#34;date&#34;: &#34;2022-01-01&#34;, &#34;text&#34;: &#34;Emily Marie Anderson, 35, former special education inclusion support teacher and assistant cheer sponsor at Canyon High School, New Braunfels TX (Comal ISD), pleaded guilty to sexual assault of a child and improper relationship between an educator and student after admitting to having sex with a 15-year-old male student in a biology classroom closet in May 2021.\n\nSentence: 60 days in jail distributed over 10 years of probation; sex offender registration; $2,000 fine; 500 hours community service; lifetime protective order prohibiting contact with the victim.\n\nAnderson was hired for the 2020-21 school year. Her first arrest came in August 2021 (sexual assault of a child, second-degree felony; bond $50,000); a second arrest followed in December 2021 (improper relationship between educator and student). Police noted at the time of her first arrest that there may be additional victims. Discovery: the victim&#39;s mother found sexually explicit texts on her son&#39;s phone, confirmed they were from Anderson, and contacted police. The arrest affidavit noted the texts contained details of the classroom encounter.\n\nAt sentencing, the victim&#39;s mother addressed Anderson per the New Braunfels Herald-Zeitung: she described her son&#39;s depression and anxiety, said the \&#34;ideal punishment\&#34; would be for Anderson to see her own children endure that pain, and revealed her initial instinct had been to go to the school and confront Anderson herself \u2014 \&#34;When I saw those messages \u2014 when I went through that phone, my instinct was to go and get you out of that school and deal with you myself.\&#34;\n\nPrincipal Dustin Davisson notified Canyon High School parents by letter after Anderson&#39;s first arrest: \&#34;I know that it can be quite disturbing to learn that one of our teachers was charged with a crime such as this.\&#34;&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;guilty-plea&#34;, &#34;sexting&#34;, &#34;no-prison&#34;, &#34;possible-additional-victims&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;classroom-offense&#34;, &#34;special-ed&#34;, &#34;victim-family-statement&#34;, &#34;coach&#34;, &#34;closet-venue&#34;, &#34;mother-discovery&#34;]}, {&#34;id&#34;: 81, &#34;case_id&#34;: 73, &#34;case_name&#34;: &#34;Jakalyn Moore&#34;, &#34;source&#34;: &#34;WREG Memphis / Mississippi AG press release&#34;, &#34;date&#34;: &#34;2025-11-03&#34;, &#34;text&#34;: &#34;Jakalyn Moore, of Southaven MS, former substitute teacher at West Tallahatchie School District, was sentenced November 3, 2025 for sexual battery by a person in a position of trust and authority, child exploitation, and production of child sexual abuse material.\n\nState sentence: 25 years MDOC custody \u2014 15 years to serve, 10 years post-release supervision; sex offender registration; $2,000 assessment to the Victims of Human Trafficking and Commercial Sexual Exploitation Fund. Federal sentence: 15 years for production of CSAM (18 U.S.C. \u00a7 2251), concurrent with state sexual battery charge. After release, 10 years of state post-release supervision still applies.\n\nProsecuted by the Mississippi Attorney General&#39;s office in partnership with the FBI. AG Lynn Fitch: \&#34;Exploiting children that you are responsible to care for is a serious violation of trust. I am grateful to my team for their hard work investigating and prosecuting this predator, as well as the FBI for their partnership on this case. It is my hope that closing this chapter will help the victims and their families on their journey to healing and recovery.\&#34;&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;multiple-victims&#34;, &#34;csam-distribution&#34;, &#34;fbi&#34;, &#34;sentencing&#34;, &#34;federal-prosecution&#34;, &#34;substitute-teacher&#34;, &#34;csam-production&#34;, &#34;mississippi-ag&#34;, &#34;trust-authority&#34;]}, {&#34;id&#34;: 82, &#34;case_id&#34;: 73, &#34;case_name&#34;: &#34;Jakalyn Moore&#34;, &#34;source&#34;: &#34;U.S. District Court, Northern District of Mississippi \u2014 Indictment&#34;, &#34;date&#34;: &#34;2024-12-04&#34;, &#34;text&#34;: &#34;IN THE UNITED STATES DISTRICT COURT FOR THE NORTHERN DISTRICT OF MISSISSIPPI\nCase No. 3:24-cr-00153-GHD-RP\nFiled: December 4, 2024\n\nCOUNTS ONE, TWO, THREE \u2014 Sexual Exploitation of a Child (18 U.S.C. \u00a7 2251(a) and (e))\n\nCOUNT ONE: On or about December 19, 2023 \u2014 defendant did employ, use, persuade, induce, and entice \&#34;Minor 1\&#34; to engage in sexually explicit conduct for the purpose of producing a visual depiction of such conduct using materials transported in interstate and foreign commerce.\n\nCOUNT TWO: On or about December 20, 2023 \u2014 same conduct with \&#34;Minor 2.\&#34;\n\nCOUNT THREE: On or about December 13, 2023 \u2014 same conduct with \&#34;Minor 3.\&#34;\n\nAll three incidents occurred in the Northern District of Mississippi and, in Count Three, \&#34;elsewhere,\&#34; suggesting a possible remote/online component.\n\nFORFEITURE: Upon conviction, defendant shall forfeit any property used to commit or promote the offenses, including any device or media containing depictions of persons engaged in sexually explicit conduct.&#34;, &#34;tags&#34;: [&#34;federal&#34;, &#34;csam-production&#34;, &#34;indictment&#34;, &#34;three-victims&#34;, &#34;one-week-window&#34;, &#34;forfeiture&#34;]}, {&#34;id&#34;: 83, &#34;case_id&#34;: 74, &#34;case_name&#34;: &#34;Kayla Tindall&#34;, &#34;source&#34;: &#34;WLBT / Webster Progress-Times (WCBI)&#34;, &#34;date&#34;: &#34;2022-04-04&#34;, &#34;text&#34;: &#34;Kayla M. Tindall, 32, former assistant teacher at Eupora High School (Webster County Schools, Mississippi), pleaded guilty to statutory rape in Webster County Circuit Court and was sentenced to six years in prison. Upon release she must register as a sex offender and serve nine years of probation.\n\nTindall was hired as an assistant teacher at EHS during a special board meeting on July 30 (2019). EHS administrators were made aware of alleged misconduct on January 30, 2020; she was no longer employed by Webster County Schools as of that afternoon. The Mississippi Bureau of Investigation took over from the Webster County Sheriff&#39;s Office. MBI Investigator Vernon Hathcock filed an affidavit on February 4, 2020 charging Tindall with statutory rape of a 13-year-old child on or about October 1, 2019. The affidavit specified the child was 36 or more months younger than Tindall. Tindall surrendered on the warrant, was released on $50,000 bond set by Justice Court Judge Rebecca Ellison, and requested a preliminary hearing.\n\nSuperintendent Brian Jones: \&#34;Our top priority is the safety of our students.\&#34; He said an immediate investigation was initiated after administrators were made aware. The sheriff&#39;s office confirmed the case was turned over to MBI.&#34;, &#34;tags&#34;: [&#34;guilty-plea&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;young-victim&#34;, &#34;assistant-teacher&#34;, &#34;short-tenure&#34;, &#34;mbi-investigation&#34;, &#34;statutory-rape&#34;]}, {&#34;id&#34;: 84, &#34;case_id&#34;: 75, &#34;case_name&#34;: &#34;Amber Turnage&#34;, &#34;source&#34;: &#34;WLBT Jackson&#34;, &#34;date&#34;: &#34;2021-04-08&#34;, &#34;text&#34;: &#34;Amber Turnage, former teacher at Provine High School, Jackson Public Schools, was sentenced April 8, 2021 to 15 years in MDOC custody \u2014 ten years to serve, five years suspended \u2014 on two counts of sexual battery against a 17-year-old male student. She must register as a sex offender.\n\nInvestigation launched in 2017 after the victim&#39;s father became suspicious of his son&#39;s behavior, went through his cell phone, and found sexually explicit videos of Turnage and his son. The student said he met Turnage, who was married at the time, after school one day and they quickly developed a relationship. She gave him gift cards and money, and they would sometimes meet at different motels in Jackson.\n\nTurnage was fired from Jackson Public Schools after two years at Provine High School. Charged with six counts of sexual battery, she was found guilty on two counts by a Hinds County jury on March 11, 2021, after a trial in which the defense claimed Turnage was \&#34;controlled by the student.\&#34; She was taken into custody immediately after the verdict. Hinds County ADA Gwen Agho prosecuted.\n\nVictim&#39;s family attorney statement: \&#34;Despite having taken nearly four years to present this case, my clients are pleased that a Hinds County jury found Amber Turnage guilty of two counts of sexual battery against a minor. Today&#39;s conviction reaffirms the notion that child predators deserve the shock and outrage which accompany their despicable acts and in a civilized society, these acts must always be met with the severest punishment. Going forward, my clients ask for privacy as they continue to heal from these permanent, traumatic experiences.\&#34;&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;video-evidence&#34;, &#34;trial&#34;, &#34;gifts&#34;, &#34;cash&#34;, &#34;victim-blaming&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;transactional-grooming&#34;, &#34;motel-venue&#34;, &#34;father-discovery&#34;, &#34;married-defendant&#34;, &#34;four-year-delay&#34;]}, {&#34;id&#34;: 85, &#34;case_id&#34;: 75, &#34;case_name&#34;: &#34;Amber Turnage&#34;, &#34;source&#34;: &#34;Mississippi Court of Appeals, No. 2021-KA-01229-COA (Nov. 29, 2022)&#34;, &#34;date&#34;: &#34;2022-11-29&#34;, &#34;text&#34;: &#34;Mississippi Court of Appeals, No. 2021-KA-01229-COA. IN THE COURT OF APPEALS OF THE STATE OF MISSISSIPPI. AMBER TURNAGE, APPELLANT v. STATE OF MISSISSIPPI, APPELLEE. DATE OF JUDGMENT: 04/08/2021. TRIAL JUDGE: HON. ADRIENNE HOOPER-WOOTEN. COURT FROM WHICH APPEALED: HINDS COUNTY CIRCUIT COURT, FIRST JUDICIAL DISTRICT. ATTORNEY FOR APPELLANT: ZAKIA HELEN ANNYCE BUTLER. ATTORNEY FOR APPELLEE: OFFICE OF THE ATTORNEY GENERAL BY: ASHLEY LAUREN SULSER. DISTRICT ATTORNEY: JODY EDWARD OWENS II. NATURE OF THE CASE: CRIMINAL - FELONY. DISPOSITION: AFFIRMED - 11/29/2022.\n\nFACTS: Turnage was a biology teacher at Provine High School in Jackson, MS with 15 years teaching experience. She was also an academic liaison for student athletes. She tutored K.W.&#39;s sister in biology. K.W. was a 17-year-old male student. The sexual relationship occurred between November 1, 2016 and April 27, 2017. K.W. testified sexual contact occurred over 100 times. Turnage&#39;s husband confronted K.W. at an AT&amp;T store, pulled a gun, and threatened to kill him. K.W.&#39;s father became suspicious of his son&#39;s behavior, searched his cell phone, and found two videos \u2014 one showing oral sex in a truck, one showing the two kissing at Walmart. Gift cards admitted into evidence: Belks reward card, School Aid gift card, Steinmart card. Turnage was never questioned by police. She picked up her indictment on May 18, 2017 (indictment dated May 10, 2017). At trial, Turnage claimed K.W. brought a gun to a man named Lewis&#39;s house and forced her to engage in sexual acts, then blackmailed her with the video. The jury rejected the coercion defense. JNOV motion filed April 23, 2021; denied September 27, 2021. Lindsey brief filed on appeal \u2014 appellate counsel found no arguable issues. AFFIRMED.&#34;, &#34;tags&#34;: [&#34;appeal&#34;, &#34;evidence-tampering&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 86, &#34;case_id&#34;: 76, &#34;case_name&#34;: &#34;Bonnie Rose Guess-Mazock&#34;, &#34;source&#34;: &#34;KTRK ABC13 (Oct. 5, 2022)&#34;, &#34;date&#34;: &#34;2022-10-05&#34;, &#34;text&#34;: &#34;TX Conroe ISD teacher due for prison after she&#39;s accused of drugging, sexually abusing student \u2014 KTRK ABC13, October 5, 2022.\n\nBonnie Rose Guess-Mazock, 36, former science teacher at Oak Ridge High School, Conroe ISD. Pleaded guilty to sexual assault of a child on July 13, 2022; sentenced to 10 years in prison on October 3, 2022. Arrested January 25, 2022; charged with indecency with a child; posted $100,000 bond; placed on administrative leave.\n\nVictim&#39;s family discovered relationship after victim overdosed on prescription drugs. Civil lawsuit filed February 24, 2022 (No. 4:22-CV-00590, S.D. Tex.) against Snap Inc., Guess-Mazock, and Conroe ISD. Lawsuit alleges Mazock arranged private off-campus meetings, sent seductive photos via Snapchat, encouraged teen to take prescription drugs she provided along with money. No school policy addressing social media communications between students and teachers. Victim&#39;s attorney Derek Merman: &#39;This boy&#39;s school was his safe haven. He trusted his teachers and the staff around him. All of the parties failed him and must be held accountable.&#39; Co-counsel Andrea Kolski also representing victim.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;drugs&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 87, &#34;case_id&#34;: 76, &#34;case_name&#34;: &#34;Bonnie Rose Guess-Mazock&#34;, &#34;source&#34;: &#34;Doe ex rel. Roe v. Snap, Inc., No. 4:22-CV-00590 (S.D. Tex.), Plaintiff&#39;s Original Complaint (Feb. 24, 2022)&#34;, &#34;date&#34;: &#34;2022-02-24&#34;, &#34;text&#34;: &#34;Plaintiff&#39;s Original Complaint, Doe ex rel. Roe v. Snap, Inc., et al., No. 4:22-CV-00590 (S.D. Tex. Feb. 24, 2022), ECF 1.\n\nFACTS: Victim John Doe was a minor (under 17) resident of Conroe, Montgomery County, TX; sophomore at Oak Ridge High School. Severely disadvantaged: father abandoned him, mother was murdered. School was described as his safe haven. Fall 2021: Mazock, a science teacher in her first semester at Oak Ridge, preyed on Doe knowing he was disadvantaged. Used her authority to keep him alone in the classroom after other students were dismissed, door closed. October 19, 2021: Mazock provided Doe with her Snapchat username; they added each other as friends. Her Snapchat handle: &#39;starshine bunny.&#39; Used Snapchat&#39;s disappearing-messages feature to send sexually explicit photos and solicitous messages. Conroe ISD had no policy prohibiting teacher-student social media communication. Mazock also communicated with other students on Snapchat, including &#39;M.P.,&#39; to whom she confided that she and Doe were having sex and that Doe had made a &#39;cough syrup jolly rancher.&#39; Repeated sexual contact during fall and winter 2021. December 2021: Mazock picked Doe up in her vehicle, drove him near his home to have sex; also entered Doe&#39;s home and had sex in his bedroom. Provided cough syrup and Benadryl; encouraged drug use before sex. January 9, 2022 text: &#39;don&#39;t forget the percs of th tutoring&#39; \u2014 soliciting Percocet + sexual reference. January 12, 2022 texts: &#39;I wanted to be there when you said no one was but I&#39;m fucking stupid&#39; and &#39;I love you dumbass.&#39; January 12, 2022: Doe overdosed on prescription drugs provided by Mazock or purchased with money she gave him; required lengthy hospitalization. Discovery through overdose and subsequent guardian investigation. Relationship was open secret at school; students frequently discussed it; Principal Anthony Livecchi failed to investigate. Mazock was also making advances on other Oak Ridge students. School alleged to have had at least five prior instances of sexual assault by employees in 20 years.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;civil-lawsuit&#34;, &#34;social-media&#34;, &#34;prior-warning-ignored&#34;, &#34;drugs&#34;, &#34;possible-additional-victims&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 88, &#34;case_id&#34;: 77, &#34;case_name&#34;: &#34;Annaleigh Andrews&#34;, &#34;source&#34;: &#34;KTRE (Apr. 8, 2025) / KLTV (Apr. 25, 2025)&#34;, &#34;date&#34;: &#34;2025-04-25&#34;, &#34;text&#34;: &#34;Former Nacogdoches ISD teacher gets 2 years for relationship with student \u2014 KTRE, April 8, 2025; Former East Texas teacher convicted of sexual assault of child reports to jail \u2014 KLTV, April 25, 2025.\n\nAnnaleigh Andrews, 26, former teacher at McMichael Middle School, Nacogdoches ISD. Arrested July 20, 2023; 12 charges: 3x improper relationship between educator and student, 3x sexual assault of a child, 3x trafficking a child to engage in sexual conduct, 3x enticing a child with intent to commit a felony. Grooming involved Snapchat messaging, marijuana use, and taking victim to a home described as &#39;a mansion.&#39; Andrews asked victim to lie to their mother; separately lied to the mother herself, claiming she took the child to work on a project. Sexually assaulted the child multiple times. April 8, 2025: 420th District Judge Malcolm Bales found Andrews guilty of 7 of 12 charges (bench trial). Sentenced to two concurrent 2-year terms, $5,000 fine, lifetime sex offender registration. Credit for 3 months time served. On the stand, Andrews asked court to excuse her behavior citing academy schooling that left her &#39;sheltered and unprepared for the world,&#39; and also presented a defense-expert autism diagnosis as mitigation. DA Amy Wren issued statement: office &#39;respectfully disagrees&#39; with the sentence and does not believe it reflects the seriousness of the crime, the position of trust, or the harm to the victim and family. April 24, 2025: self-surrendered; booked into Gregg County Jail, Longview.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;lenient-sentence&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;no-prison&#34;, &#34;drugs&#34;]}, {&#34;id&#34;: 89, &#34;case_id&#34;: 78, &#34;case_name&#34;: &#34;Jenny Christine Hipp&#34;, &#34;source&#34;: &#34;WDAM / Hattiesburg American (Nov. 21, 2019)&#34;, &#34;date&#34;: &#34;2019-11-21&#34;, &#34;text&#34;: &#34;Former Lamar Co. teacher sentenced for statutory rape \u2014 WDAM / Hattiesburg American, November 21, 2019.\n\nJenny Christine Hipp, 40 at sentencing (39 at time of offense), former speech-language pathologist at Lamar County School District since 2014. Victim: 15-year-old male. None of the alleged incidents occurred on school grounds. Complaint received June 15, 2017; superintendent Tess Smith launched immediate investigation; contacted Lamar County DA&#39;s office after learning of potential criminal behavior; Hipp terminated June 21, 2017. Arrested June 2017 by Jones County authorities on Lamar County warrant. Pled guilty November 12, 2019 to statutory rape. Sentenced November 21, 2019 by Circuit Court Judge Prentiss G. Harrell: 7 years MDOC \u2014 3 years custody + 4 years post-release supervision; $2,500 fine plus court costs; SORA registration; credit for time served. Post-release conditions: area restriction; 9 p.m.\u20135 a.m. curfew unless work requires; field officer\u2013supervised program. Defense attorney: Tangi A. Carter, Hattiesburg.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;]}, {&#34;id&#34;: 90, &#34;case_id&#34;: 79, &#34;case_name&#34;: &#34;Ramsey BethAnn Bearse&#34;, &#34;source&#34;: &#34;CNN (Jul. 17, 2020) / AP (Dec. 18, 2019)&#34;, &#34;date&#34;: &#34;2020-07-17&#34;, &#34;text&#34;: &#34;Former Miss Kentucky sentenced to 2 years in prison for sending topless photos to a 15-year-old student \u2014 CNN, July 17, 2020; Ex-Miss Kentucky admits to trading sexual photos with teen \u2014 AP, December 18, 2019.\n\nRamsey BethAnn Bearse (maiden name Ramsey Carpenter), 29, former teacher at Andrew Jackson Middle School, Cross Lanes WV. Crowned Miss Kentucky 2014; fiddle performance won preliminary talent at Miss America national pageant in Atlantic City. Sent at least 4 topless photos via Snapchat to a 15-year-old male former student. Discovery: boy&#39;s parents found photos on his phone and reported to police. Arrested December 2018; originally charged with 4 counts sending obscene material to a minor. Pled guilty December 2019 to 1 count possession of material depicting minors in sexually explicit conduct (felony); stated in court that the first photo was intended for her husband. Sentenced July 14, 2020 by Judge Louis H. Bloom, Kanawha County Circuit Court: 2 years prison at Lakin Correctional Center, reported July 20; 10 years supervised release; lifetime sex offender registration. Defense attorney Timothy DiPiero declined to comment.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 91, &#34;case_id&#34;: 80, &#34;case_name&#34;: &#34;Katherine Folger Pelfrey&#34;, &#34;source&#34;: &#34;FITSNews (Mar. 29\u201330, 2023)&#34;, &#34;date&#34;: &#34;2023-03-30&#34;, &#34;text&#34;: &#34;Sexual Battery Charge Reduction Leads to Probation for Former Pickens County Teacher \u2014 FITSNews / Kevin D. Hollis, March 30, 2023; Ex-South Carolina Teacher Enters Plea In Student-Teacher Sex Scandal \u2014 FITSNews / Will Folks, March 29, 2023.\n\nKatherine Folger Pelfrey, 35 at plea (33 at time of offense), former teacher at Pickens County high school, Clemson SC; with district since 2017. Victim: student aged 16 or 17, single sexual encounter at Pelfrey&#39;s home December 29, 2021. District and investigators notified December 31, 2021; Pelfrey immediately confessed and was terminated. Arrested January 3, 2022. Grand jury indictment January 2023: sexual battery of student aged 16\u201317 + contributing to delinquency of a minor. Solicitor: Walt Wilkins (13th Circuit). March 2023: Alford plea to contributing to delinquency of a minor; sexual battery charge dropped. Sentence: 2 years probation + sex offender registration + lifetime teaching ban. No prior criminal record.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 92, &#34;case_id&#34;: 81, &#34;case_name&#34;: &#34;Brianne Altice&#34;, &#34;source&#34;: &#34;AP/Salt Lake Tribune (Jan. 24, 2017) / KUTV (Sep. 11, 2019)&#34;, &#34;date&#34;: &#34;2019-09-11&#34;, &#34;text&#34;: &#34;Teacher: Low self-esteem made me have sex with students \u2014 AP / Salt Lake Tribune, January 24, 2017; Former Davis High School teacher Brianne Altice out of prison \u2014 KUTV, September 11, 2019.\n\nBrianne Altice, former English teacher at Davis High School, Draper UT. Age 33 at arrest (December 2013). Three teenage male victims: one age 16, two age 17. One relationship continued while on bail after arrest. Running joke at Davis High: &#39;Who is Ms. Altice sleeping with now?&#39; \u2014 civil lawsuits by parents alleged school knew. Pled guilty 2015 to 3 counts forcible sexual abuse (Utah Code \u00a7 76-5-404). Sentenced July 2015: indeterminate 2\u201330 years, minimum 2 years. At sentencing: &#39;I take responsibility for what I&#39;ve done.&#39; Davis County Attorney&#39;s Office: she had &#39;layers of excuses&#39; and was &#39;not taking responsibility.&#39; Parole denied January 2017; at hearing said: &#39;I had extreme self-esteem issues and they said things that made me feel good about myself. I just started to justify it all.&#39; Board guidelines indicated stay until 2020; parole granted April 2019 anyway. Released September 10, 2019 (~4 years served). Required: 2-year sex offender treatment, restitution via counseling for victims. Civil lawsuits filed against Davis County School District.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;prior-warning-ignored&#34;, &#34;early-release&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 93, &#34;case_id&#34;: 82, &#34;case_name&#34;: &#34;Lauren Hill&#34;, &#34;source&#34;: &#34;FOX 17 (May 21, 2015) / Herald-Palladium (Jul. 18, 2015)&#34;, &#34;date&#34;: &#34;2015-07-18&#34;, &#34;text&#34;: &#34;St. Joseph teacher pleads guilty to having sex with student \u2014 FOX 17, May 21, 2015; Former SJ teacher sentenced to prison in sex case \u2014 Herald-Palladium (Julie Swidwa), July 18, 2015.\n\nLauren Hill, 26, former teacher and assistant girls&#39; soccer coach at St. Joseph High School, Berrien County MI. Victim: one female student, a player on Hill&#39;s soccer team. Criminal sexual conduct began when victim was entering sophomore year (~age 15) and continued through end of senior year \u2014 3+ years. Hill had taught at the school 4 years; voted &#39;best teacher&#39; by students three times. Resigned May 1, 2015. Charged May 8, 2015: 4 counts CSC. Pled guilty May 20, 2015 to 2 counts second-degree CSC (position of authority, victim under 16); 2 counts third-degree CSC dismissed. Sentenced July 2015 by Judge Gary Bruce: 4\u201315 years, parole eligible at 4 years; 25-year SORA; 60-day county jail credit. APA Jake Jenison at sentencing: &#39;She was looking for a mentor, and Miss Hill was there for her. She couldn&#39;t complete her senior year with her friends. That&#39;s supposed to be the best time of her life.&#39; Judge Bruce: &#39;Your victim was a child. You manipulated her and exploited her vulnerability. It was your responsibility to put on the brakes... You stole that from this victim... the loss of four years of your life can never be made up.&#39; Bruce also noted the court received more character-support letters than he had seen in 16 years on the bench \u2014 &#39;not one of these letters made mention of the victim.&#39; Hill&#39;s apology: &#39;To know I&#39;m at fault for this is truly devastating.&#39; Defense attorney Peter Johnson said Hill was &#39;naive.&#39;&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 94, &#34;case_id&#34;: 83, &#34;case_name&#34;: &#34;Mary Faith McCormick&#34;, &#34;source&#34;: &#34;NWA Democrat-Gazette (Jul. 31, 2015) / KHBS (Aug. 14, 2014)&#34;, &#34;date&#34;: &#34;2015-07-31&#34;, &#34;text&#34;: &#34;Former Siloam Springs teacher sentenced to eight years in prison \u2014 NWA Democrat-Gazette (Tracy M. Neal), July 31, 2015; Teacher bonds out of jail after arrest in connection with rape charges \u2014 KHBS/40/29, August 14, 2014.\n\nMary Faith McCormick, 32, former 6th-grade language arts teacher at Siloam Springs Intermediate School, Benton County AR; taught at Siloam Springs 3 years, previously in Gravette and Little Rock. Victim: 13-year-old male student who turned 13 in January of the 2013\u201314 school year; 4.0 student and athlete. Grooming via Snapchat beginning ~2 weeks after school year ended; McCormick sent topless photo; a Snapchat glitch saved images to victim&#39;s phone (primary evidence). Two sexual encounters: one at McCormick&#39;s home, one at a remote location after she picked victim up from a friend&#39;s house late at night. Investigation began August 8, 2014 after tip; arrested August 2014; placed on paid leave, later resigned. Pled guilty July 14, 2015 to first-degree sexual assault (Class A felony). Sentenced July 30, 2015 by Circuit Judge Brad Karren: 8 years ADC, parole eligible after 2 years; 12-year suspended sentence; SORA; sex offender treatment; no contact with victim/witnesses; no unsupervised contact with minors. McCormick showed no emotion and declined to address court. Victim&#39;s mother statement: &#39;I have sent my child into the public school system... not ever believing that one day his very own teacher... would be the wolf that would prey upon him.&#39; Family closed business and relocated due to harassment.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;]}, {&#34;id&#34;: 95, &#34;case_id&#34;: 84, &#34;case_name&#34;: &#34;Lillie Bowman&#34;, &#34;source&#34;: &#34;KOLN 10/11 (Mar. 29, 2024) / Lincoln Journal Star (Jan. 31, 2024)&#34;, &#34;date&#34;: &#34;2024-03-29&#34;, &#34;text&#34;: &#34;Former Norris teacher gets probation, jail time for sexually abusing student \u2014 KOLN 10/11, March 29, 2024; Ex-Norris High School teacher pleads no contest to sexual abuse by a school employee \u2014 Lincoln Journal Star, January 31, 2024.\n\nLillie Bowman, 23 (24 at sentencing), former 9th/10th-grade English teacher and assistant trap shooting coach at Norris High School, Lancaster County NE. Victim: 17-year-old male student. Relationship began March 2023; sex approximately 10 times at Bowman&#39;s Lincoln apartment. Student rumors reached school administrator early April 2023 \u2014 both denied; no escalation by school. Parent of another student later reported to Lancaster County Sheriff&#39;s Office. May 14: report received. May 18: phone records obtained \u2014 306 calls between Bowman and student from April 1 to May. May 19: apartment searched, open condom wrappers and used condoms found; both admitted to relationship and 10 sexual encounters. Arrested May 19, 2023; bond 10% of 0,000, posted May 22; fired. Initial charge: Class IIA felony (first-degree sexual abuse by school employee, up to 20 years). No contest plea January 31, 2024 to Class IV felony (third-degree, up to 2 years). Sentenced March 29, 2024 by Judge Andrew Jacobsen: 5 years probation + 90 days jail in 30-day annual installments (April 5, 2024/2025/2026); SORA registration.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;prior-warning-ignored&#34;, &#34;no-prison&#34;, &#34;physical-evidence&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 96, &#34;case_id&#34;: 85, &#34;case_name&#34;: &#34;Sarah Fowlkes&#34;, &#34;source&#34;: &#34;KXAN / People (Oct. 2018)&#34;, &#34;date&#34;: &#34;2018-10-12&#34;, &#34;text&#34;: &#34;Ex-Texas teacher pleads guilty to relationship with student \u2014 KXAN / People, October 2018.\n\nSarah Fowlkes, 27 at arrest (28 at plea), former teacher of anatomy, physiology, and environmental systems at Lockhart High School, Caldwell County TX; previously at Plum Creek Elementary. Victim: 17-year-old male student. Arrested March 20, 2017; suspended by Lockhart ISD (district&#39;s first teacher-student relationship investigation). Mugshot showed Fowlkes smiling broadly \u2014 image circulated internationally; attorney Jason Nassour initially attributed this to her belief in her own innocence. Conditional guilty plea submitted October 10, 2018 to Caldwell County District Court; Judge Chris Schneider reviewed and is assumed to have accepted. Terms: 4 years deferred adjudication, teacher license surrender, fine. No prison time. Note: deferred adjudication in Texas means no final conviction on record if probation is successfully completed.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 97, &#34;case_id&#34;: 86, &#34;case_name&#34;: &#34;Rebecca L. Kilps&#34;, &#34;source&#34;: &#34;WLUK FOX 11 (Jan. 25, 2023) / Manitowoc Herald Times Reporter (Jan. 26, 2023)&#34;, &#34;date&#34;: &#34;2023-01-26&#34;, &#34;text&#34;: &#34;Former Two Rivers teacher sentenced for having sex with student \u2014 WLUK FOX 11 (Brian Kerhin), January 25, 2023; A former Two Rivers teacher will spend time in jail after being found guilty of sexually assaulting a student \u2014 Manitowoc Herald Times Reporter (Alisa M. Schafer), January 26, 2023.\n\nRebecca L. Kilps, 35, former Spanish teacher at Two Rivers High School, Manitowoc County WI. Victim: 17-year-old male student, met in her Spanish class. Social media messages escalated from occasional to frequent and personal; multiple sexual encounters. Discovery: husband found messages on her phone showing victim and Kilps discussing a future together and saying they love each other; husband called police. Arrested May 2022. Kilps initially denied sexual contact, then admitted knowing it was illegal. Both gave separate statements to police confirming encounters. Resigned; relinquished teaching license. Originally charged with 3 felony counts sexual assault of student by school staff. Plea: 2 felonies reduced to misdemeanors (sexual intercourse with child 16+); 1 felony deferred prosecution for 5 years. Sentenced January 25, 2023 by Judge Robert Dewane: 3 years probation, 3 months jail (probation condition), 6 months stayed; no contact with minors; psychosexual evaluation; mental health treatment; sentence withheld on misdemeanors. Apology: &#39;My guilty and shameful heart has been carrying around the burden of my actions for what seems like an eternity... he was an innocent bystander during a time in my life of deep sadness.&#39;&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;social-media&#34;, &#34;probation&#34;, &#34;husband-reported&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 98, &#34;case_id&#34;: 87, &#34;case_name&#34;: &#34;Jessica L. Sawicki&#34;, &#34;source&#34;: &#34;WPVI Action News (Apr. 11, 2024) / Monmouth County court records (2025)&#34;, &#34;date&#34;: &#34;2025-11-14&#34;, &#34;text&#34;: &#34;NJ teacher accused of having sexual relationship, assaulting high school student \u2014 WPVI Action News (Trish Hartman), April 11, 2024; NJ court records, Case No. 24001375 (Monmouth County Superior Court).\n\nJessica L. Sawicki, 37, former English teacher at Hamilton High School West, Hamilton Township NJ (Mercer County); resident of Point Pleasant. Victim: 16\u201317-year-old student. Multiple sexual encounters at Assunpink Wildlife Management Area, Wall Township, Monmouth County (~20 minutes from school). Monmouth County prosecution (offense location controls, not school location). Arrested April 8, 2024; charged with sexual assault and endangering welfare of a child; placed on administrative leave. Defense: Edward A. Cridge. Prosecutor: Keri C. Schaefer (Monmouth County). Plea to accusation (pre-indictment) July 28, 2025: guilty to 2C:14-2C(3)(b), second-degree sexual assault by supervisor, victim 16\u201317. Sentenced November 14, 2025 by Judge Jill G. O&#39;Malley: 5 years incarceration, 9 days jail credit; Parole Supervision for Life; fines SNSF 5, LETF 0, VCCA 00, SANE 00, SXA 00, SCVT ,000, SOMP 0.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;parole-supervision-for-life&#34;]}, {&#34;id&#34;: 99, &#34;case_id&#34;: 88, &#34;case_name&#34;: &#34;April Novak&#34;, &#34;source&#34;: &#34;Milwaukee Journal Sentinel (Vielmetti) / FOX 6 Milwaukee&#34;, &#34;date&#34;: &#34;2017-06-29&#34;, &#34;text&#34;: &#34;Former Menomonee Falls teacher sentenced for sexual affair with student in her classroom \u2014 Milwaukee Journal Sentinel, June 29, 2017\n\nApril Novak, 32, now of Fond du Lac, pleaded no contest in April to three of the 12 counts of sexual assault of a student by school staff filed in December 2015. Sentenced to two years in prison for having a short-lived sexual affair with a 16-year-old student. Judge Ralph Ramirez said while he didn&#39;t think Novak was a risk to re-offend, he felt probation would send the wrong message, given the betrayal of trust. The fact Novak and the boy had sex as many as a dozen times, always in her classroom during the school day, \&#34;compounds the severity.\&#34; Three years supervised release; cannot work in any school setting even as volunteer; must register as sex offender.\n\nPsychiatrist Jeffrey Taxman (treating since Jan 2016) testified she has made huge strides, is not a pedophile, and the victim was \&#34;a very mature, 6-foot nearly 17-year-old.\&#34; Defense attorney Hart said Novak \&#34;initially was the prey not the hunter.\&#34; Boy&#39;s grandmother disputed this \u2014 said Novak bought victim many gifts including shoes expecting sex in return. Victim&#39;s family moved out of state; victim still suffers. Bail jumping charge (screaming at ex-husband&#39;s residence) dismissed at sentencing.\n\nFOX 6 article (Jan 4, 2016): 30-year-old Novak waived preliminary hearing; not guilty plea entered by attorney; bail reduced from $100,000 to $10,000 + $25,000 signature bond. Novak wore protective vest at initial appearance due to statements suggesting suicidal ideation. Husband filed for legal separation before charges. Prior employment at Brown Deer School District (basketball coach). Teaching license (2008) and administrator license (2013) under investigation by Wisconsin DPI.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;gifts&#34;, &#34;on-campus&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 100, &#34;case_id&#34;: 89, &#34;case_name&#34;: &#34;Sara M. Domres&#34;, &#34;source&#34;: &#34;Milwaukee Journal Sentinel (Vielmetti)&#34;, &#34;date&#34;: &#34;2016-12-07&#34;, &#34;text&#34;: &#34;Ex-New Berlin teacher sent to prison for sex with student \u2014 Milwaukee Journal Sentinel, Dec. 7, 2016\n\nSara M. Domres, 29, pleaded guilty in August to two counts of sexual assault of a student by school staff, charges filed in April over incidents in 2015. Sentenced Wednesday to two years in prison. She cried and hung her head as she was led from court in handcuffs.\n\nThe student was in Domres&#39; English class as a sophomore in 2014-15, became friends with Domres and began texting frequently. Between April 2015 and January 2016 the two exchanged more than 1,100 messages. First incident: sexual intercourse in Domres&#39; car at a park-and-ride lot on Moorland Road in New Berlin in July 2015 (victim age 16). Second: October 2015 at Motel 6 in Brookfield (victim age 17); Domres reserved room with single bed, paid cash. Evidence: victim&#39;s phone connected to motel WiFi on same date as room reservation.\n\nProsecutor Szczupakiewicz: had Domres not been a teacher, more than a dozen encounters with a 16-17 year old would have been misdemeanors. Judge Dreyfus told Domres the crime went \&#34;well beyond a mistake in judgment\&#34; \u2014 \&#34;It was to meet your needs, and not those of a child.\&#34; Sentence: Count 1: 2 years prison + 3 years extended supervision; Count 2: 2 years prison + 2 years supervision suspended in favor of 3 years probation (re-exposure to Count 2 if probation violated). Sex offender registration. Victim&#39;s family did not appear and submitted no impact statement.\n\nDomres married her high school sweetheart in August 2015, during the offense period.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;physical-evidence&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 101, &#34;case_id&#34;: 90, &#34;case_name&#34;: &#34;Camryn Zelinger&#34;, &#34;source&#34;: &#34;KABC (Juarez)&#34;, &#34;date&#34;: &#34;2019-05-24&#34;, &#34;text&#34;: &#34;Former teacher in Southern California pleads guilty to molesting 14-year-old girl \u2014 KABC, May 24, 2019 / February 9, 2017\n\nCamryn Zelinger, 32 (of Corona), former teacher at Encore High School for the Arts, Riverside. Arrested February 6, 2017 at school on suspicion of lewd or lascivious acts with a minor and annoying or molesting a child under 18. Victim&#39;s mother had contacted police over prior weekend reporting the months-long relationship. Communication included text messages. School officials \&#34;fully cooperated\&#34; with investigation.\n\nPleaded guilty May 17, 2019 to 1 felony count contacting a child with intent to commit a crime and 2 misdemeanor counts child molestation (Rodriguez&#39;s 14-year-old daughter + second student). Sentence: 120 days jail on weekends; sex offender registration; sex offender classes.\n\nVictim&#39;s mother Shaterra Rodriguez had been seeking justice for two years. Daughter, now 16, still dealing with trauma. Rodriguez subsequently filed civil suit against Riverside Unified School District, alleging failure to protect; cited unanswered email she sent about daughter&#39;s excessive tardies.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;lenient-sentence&#34;, &#34;multiple-victims&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 102, &#34;case_id&#34;: 91, &#34;case_name&#34;: &#34;Elizabeth Dillett&#34;, &#34;source&#34;: &#34;Milwaukee Journal Sentinel (Vielmetti / Dikanovic)&#34;, &#34;date&#34;: &#34;2016-12-02&#34;, &#34;text&#34;: &#34;Teacher gets prison for sex with student \u2014 Milwaukee Journal Sentinel, Dec. 2, 2016 / April 14, 2016\n\nElizabeth Dillett, 31, kindergarten teacher and coach at St. Peter Immanuel School (private/religious), Milwaukee. Charged April 8, 2016 with sexual assault of a child by a person who works with children and sexual intercourse with a child age 16 or older. School put her on paid leave April 8. Amended complaint added more serious felony (second-degree sexual assault of a child) and additional counts; included sexual contact in June 2015 and January.\n\nMale victim, 16, was a former St. Peter student Dillett had coached in grade school. Dillett was close family friend; helped watch the children while mother worked long hours for child protective services and father was in prison. Sexual intercourse at Dillett&#39;s Franklin home in February 2016 and at the school in March 2016.\n\nDillett admitted offense to victim&#39;s parents and begged them not to report her, saying she was \&#34;more concerned about her job than my son\&#34; (per father). Boy initially tried to protect Dillett by claiming he had raped her. ADA Schrank cited \&#34;salacious texts recovered from the boy&#39;s phone\&#34; as evidence of sexual intent.\n\nGuilty plea November 2016 to 2 counts assault by someone who works with children; 6 counts including more serious felony dismissed. Sentenced December 2, 2016 by Judge Joseph Donald: 2 years prison + 3 years supervised release; sex offender registration. Defense attorney Schiro had requested probation with suspended 18-month prison term. Judge noted offense went beyond a single mistake and that \&#34;it may take the boy&#39;s lifetime to overcome the experience.\&#34; Article noted Dillett was the third Milwaukee-area schoolteacher charged with sexually assaulting a student in the same period.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;private-school&#34;, &#34;on-campus&#34;, &#34;female-defendant&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 103, &#34;case_id&#34;: 92, &#34;case_name&#34;: &#34;Luisa Melchionne&#34;, &#34;source&#34;: &#34;CT Insider / Norwalk Hour (Hardaway)&#34;, &#34;date&#34;: &#34;2026-03-04&#34;, &#34;text&#34;: &#34;Former Norwalk middle school counselor pleads guilty to sexual assault of student \u2014 CT Insider, March 4, 2026\n\nLuisa Melchionne, former guidance counselor at Nathan Hale Middle School, Norwalk (residence: New Canaan), pleaded guilty December 9 to second-degree sexual assault and illegal sexual contact. Accused of performing sexual acts and \&#34;lapdances\&#34; on an adolescent student. Originally arrested July 11, 2024; initial charges: second-degree sexual assault + 2 counts risk of injury to a minor. Free on $500,000 bond. Sentencing scheduled March 10, 2026 in state Superior Court in Stamford. Attorney Mark Sherman said client is accepting responsibility and \&#34;looking forward to concluding the criminal case.\&#34;&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;charge-reduction&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 104, &#34;case_id&#34;: 93, &#34;case_name&#34;: &#34;Barbara Corbo&#34;, &#34;source&#34;: &#34;WPVI (Hall) / Philadelphia court records (CP-51-CR-0001209-2022, MC-51-CR-0002132-2022)&#34;, &#34;date&#34;: &#34;2022-02-10&#34;, &#34;text&#34;: &#34;PA Hunting Park teacher accused of sexually assaulting student \u2014 WPVI, Feb. 10, 2022 + court records\n\nBarbara Corbo, 30 (DOB 06/04/1991), former English and social studies teacher at Mercy Career and Technical High School (Catholic/private), Hunting Park, Philadelphia. Hired August 2021; taught 11th-grade English and 10th-grade social studies. Arrested February 9, 2022; police said incident occurred December 2021 on Kelly Drive. Initial charges: sexual assault, contact with a minor, other offenses.\n\nSchool notified January 18, 2022 when student came forward; Corbo immediately terminated and matter reported to Philadelphia PD, DHS, ChildLine, PA Dept of Education, and Archdiocese of Philadelphia Office of Investigations. Investigating officer: Detective Joseph Jenkins, Special Victims Unit.\n\nCourt records (CP-51-CR-0001209-2022): Negotiated guilty plea August 16, 2022 before Judge Robert P. Coleman to Corruption of Minors M1 (18 Pa.C.S. \u00a7 6301(a)(1)(i)). Sentence: 5 years probation, no prison. Defense attorney: Abigail Beth Cohen. Municipal court docket (MC-51-CR-0002132-2022) shows case held for Common Pleas; same charge, Offense Date 12/11/2021.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;lenient-sentence&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;private-school&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 105, &#34;case_id&#34;: 94, &#34;case_name&#34;: &#34;Elena Bardin&#34;, &#34;source&#34;: &#34;WBKO/Gray News / Lexington Herald-Leader (Cheves) / Court TV (Brown)&#34;, &#34;date&#34;: &#34;2025-11-13&#34;, &#34;text&#34;: &#34;KY teacher convicted of sex charges, acquitted of conspiracy to murder husband \u2014 Lexington Herald-Leader, Sept. 12, 2025; Court TV sentencing, Nov. 13, 2025\n\nElena Bardin, 27, former English teacher at Adair Youth Development Center (state juvenile detention), Columbia, KY. Male victim age 17, incarcerated juvenile. Relationship developed over months; security footage showed Bardin entering victim&#39;s cell in violation of facility rules. Evidence: 190+ handwritten letters and explicit photos developed at Walmart. Colleagues grew suspicious; victim transferred to different housing unit. Building-wide sweep March 27, 2025 found letters and photos in new cell. Arrested April 2, 2025.\n\nBardin discussed in letters wanting husband Michael Bardin killed \u2014 to avoid dividing marital assets and sharing custody of 5-year-old daughter. Letter: \&#34;I know you say you&#39;ll take care of him, but shouldn&#39;t someone else do it to take the suspicion away from you?\&#34; Defense argued comments were jokes. Victim testified he never planned to act; relationship was a \&#34;way to kill time.\&#34; Michael Bardin filed for divorce and sole custody May 7, 2025.\n\nJury trial September 11-12, 2025: guilty on first-degree sexual abuse, unlawful transaction with a minor, distribution of obscene material to a minor; acquitted on solicitation to commit murder. Defense attorney Steve Romines attacked victim&#39;s credibility: \&#34;he was grooming her just as much.\&#34; Bardin did not testify. Bardin wrote in one letter: \&#34;I can&#39;t be classified as an effing pedophile.\&#34;\n\nSentenced November 13, 2025 by Judge Spalding: 4 years (sexual abuse) + 10 years (unlawful transaction) consecutive = 14 years; 12 months distribution concurrent; sex offender registration 20 years. Judge noted Bardin&#39;s own letter admissions resulted in her conviction.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;sentenced&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;physical-evidence&#34;, &#34;behavioral-health&#34;, &#34;court-ordered-victims&#34;, &#34;love-letters&#34;, &#34;female-defendant&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 106, &#34;case_id&#34;: 95, &#34;case_name&#34;: &#34;Laura Caron&#34;, &#34;source&#34;: &#34;WPVI Action News&#34;, &#34;date&#34;: &#34;2025-01-16&#34;, &#34;text&#34;: &#34;Detention hearing set for NJ teacher accused of having child with young student \u2014 WPVI, January 16, 2025\n\nLaura Caron, 34, teacher at Middle Township Elementary School, Middle Township, NJ (Cape May County). Arrested January 15, 2025 on charges of aggravated sexual assault, sexual assault, and endangering the welfare of a child. Abuse began when victim was 11 years old.\n\nVictim&#39;s family befriended Caron; children began staying at her home 1-2 nights/week, then permanently 2016-2020. Caron identified in court as a \&#34;resource family parent\&#34; for the children. Victim was 13 and living with then-28-year-old Caron when they had a child together in 2019; child is now 5 years old. Victim confirmed sexual relationship in police interview January 3, 2025.\n\nCase came to light in December 2024 when victim&#39;s father posted on social media that Caron&#39;s child resembled his son. Virtual first appearance January 16; detention hearing set for next Tuesday. School district placed Caron on paid administrative leave immediately.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;pregnancy&#34;, &#34;dna-evidence&#34;, &#34;delayed-reporting&#34;, &#34;long-term-relationship&#34;, &#34;female-defendant&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 107, &#34;case_id&#34;: 96, &#34;case_name&#34;: &#34;Jennifer Caswell&#34;, &#34;source&#34;: &#34;AP / Deseret News / NewsOK (Hitt)&#34;, &#34;date&#34;: &#34;2017-07-25&#34;, &#34;text&#34;: &#34;Ex-teacher in Oklahoma gets 10 years in student sex case \u2014 AP, Aug. 13, 2015; Oklahoma school district settles lawsuit \u2014 NewsOK (Hitt), July 25, 2017\n\nJennifer Caswell, 29, former middle school English teacher, Hollis Public Schools, Hollis, OK (Harmon County). Male victim age 15, eighth grade. Sexual contact in classroom, student&#39;s home, her car, her home, and Mississippi hotel room where police found them at arrest (June 2014). Two witnesses saw classroom assault; school failed to report to police and permitted Caswell to resign in April 2014 while retaining credentials.\n\nPleaded guilty June 2015 to 3 counts second-degree rape, 2 counts enticing a child, 1 count forcible sodomy. Sentenced August 13, 2015: 15 years with 5 suspended per count concurrent = 10 years; min. 8.5 years per statutory minimums. Defense attorney David Cummins said sentence was \&#34;at least twice\&#34; anticipated.\n\nCivil lawsuit (June 2015): father sued school and Caswell; Hollis Public Schools settled July 2017 for $125,000, denied wrongdoing. Caswell defaulted.\n\nDr. Phil appearance May 2015: Caswell admitted classroom sex, called relationship \&#34;stupid\&#34; but consensual \u2014 \&#34;I&#39;m not a monster and I&#39;m not a predator.\&#34; Blamed failing marriage: \&#34;I was in a very unhappy marriage and received little to no attention from my husband.\&#34; Incarcerated at Mabel Bassett Correctional Center.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;civil-lawsuit&#34;, &#34;prior-warning-ignored&#34;, &#34;no-remorse&#34;, &#34;on-campus&#34;, &#34;female-defendant&#34;, &#34;victim-blaming&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 108, &#34;case_id&#34;: 97, &#34;case_name&#34;: &#34;Aimee Palmitessa&#34;, &#34;source&#34;: &#34;City News Service / KABC (Granda)&#34;, &#34;date&#34;: &#34;2019-04-18&#34;, &#34;text&#34;: &#34;Former Brentwood School Teacher Sentenced to Three Years \u2014 City News Service, April 18, 2019 / KABC arrest/arraignment coverage August\u2013September 2017\n\nAimee Palmitessa, 45 (at offense), biology teacher at Brentwood School (elite private K-12), Brentwood, Los Angeles. Nine-year teacher at school. Male victim age 16, former student in one of her classes. Offenses June 12\u2013August 11, 2017 (summer). Victim informed authorities; arrested August 18, 2017 at West Hollywood home; bail $230,000. School placed on immediate administrative leave.\n\nOriginally charged with 12 felony counts: 7 counts unlawful sexual intercourse, 2 counts sodomy of person under 18, 2 counts sexual penetration by foreign object of person under 18, 1 count oral copulation of person under 18. Faced up to 10 years 4 months if convicted as charged. Not guilty plea September 15, 2017.\n\nNo contest plea April 18, 2019 to 3 felony counts unlawful sexual intercourse; immediately sentenced to 3 years prison; surrender May 1. Also had separate drug charge from Coachella Festival (April 2017). Married with one child. Brentwood School notable alumni: Adam Levine, Jonah Hill, Patrick Schwarzenegger.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;charge-reduction&#34;, &#34;private-school&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 109, &#34;case_id&#34;: 98, &#34;case_name&#34;: &#34;Nicole Renee Wooten&#34;, &#34;source&#34;: &#34;Arizona Republic / azcentral.com (Shacklett)&#34;, &#34;date&#34;: &#34;2015-01-06&#34;, &#34;text&#34;: &#34;Former Phoenix teacher sentenced to 20 years for sex with student \u2014 AZ Republic, Jan. 6, 2015\n\nNicole Renee Wooten, former PE teacher at Herrera Elementary School, Phoenix (13-year teacher). Female victim age 14; sexual conduct April-October 2006, victim transitioning from middle to high school. Victim kept secret 6+ years; reported to police November 2012; Wooten arrested February 2013.\n\nVictim at sentencing: \&#34;Nicole robbed my childhood away... I kept my words for about six years.\&#34; Described Wooten as a former role model. Prosecutor Ryan Powell: Wooten turned a vulnerable transition period \&#34;into a way for her to get her own sexual gratification from a child.\&#34; Defense argued mitigated sentence: acceptance of responsibility, higher education, no criminal history, abusive childhood. Wooten submitted written letter to court instead of speaking.\n\nGuilty plea 2014. Sentenced January 6, 2015 by Judge Sherry Stephens: 20 years prison + lifetime probation \u2014 nearly nine years after the offense occurred.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;delayed-reporting&#34;, &#34;female-victim&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 110, &#34;case_id&#34;: 99, &#34;case_name&#34;: &#34;Katerina Bardos&#34;, &#34;source&#34;: &#34;Greeley Tribune (Moylan) / KUSA / Weld County DA press release&#34;, &#34;date&#34;: &#34;2018-09-23&#34;, &#34;text&#34;: &#34;Former Frontier Academy teacher convicted of sex with student released from prison \u2014 Greeley Tribune, Sept. 23, 2018; KUSA May 8, 2015; Weld County DA press release May 3, 2016\n\nKaterina Bardos (DOB 09/23/1990), former teacher at Brentwood Middle School (2013-14), then Frontier Academy, Greeley, CO. Male victim, age 12 when relationship began; turned sexual June 2014 at victim&#39;s home while family was camping (victim age 13). Bardos fostered close relationship with victim&#39;s mother and sisters, described as \&#34;like family\&#34;; groomed through Xbox, homework, overnight stays.\n\n40-50 sexual encounters over one year at victim&#39;s home, her apartment, her car at various Greeley locations including Frontier Academy parking lot, and her parents&#39; home. Also provided marijuana. Arrested May 6, 2015 initially on marijuana/delinquency charge; sexual relationship discovered in investigation.\n\nGuilty plea March 3, 2016 to Felony Child Abuse (F3) + Criminal Attempt to Commit Sexual Assault on a Child (F5); two sexual-assault-by-position-of-trust counts dropped. Sentenced May 3, 2016 by Judge Kopcow: 7 years DOC + 5 years mandatory parole; range was 4-20 years. Paroled September 11, 2018 (~2 years 5 months served). Chief Deputy DA Thea Carrasco prosecuted. Child abuse charge (F3) used instrumentally in plea deal for sentencing range \u2014 nobody died. Judge noted the 40-50 encounters and the exploitation of the position of trust including the family relationship.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;drugs&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;early-release&#34;, &#34;on-campus&#34;, &#34;female-defendant&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 111, &#34;case_id&#34;: 100, &#34;case_name&#34;: &#34;Brittni Nicole Colleps&#34;, &#34;source&#34;: &#34;AP/CBS8 / CBS11 DFW (Villarreal)&#34;, &#34;date&#34;: &#34;2015-01-06&#34;, &#34;text&#34;: &#34;Texas teacher convicted after sex with 5 students \u2014 AP, Aug. 17, 2012; Teacher released \u2014 CBS11 DFW, Jan. 6, 2015\n\nBrittni Nicole Colleps, 28, former English teacher at Kennedale High School, Kennedale TX (near Arlington). Five male victims, all age 18 (current students). Group sex encounters at her Arlington home over two months in 2011 while husband Christopher Colleps was deployed overseas. Encounters included multiple students simultaneously. Cellphone video of one group encounter recorded by a student and later emerged. Relationships began for some via sexual text messages.\n\nThree students testified they did not consider themselves victims and did not want prosecution. School questioned students in May 2011; a student initially denied encounters \&#34;trying to save her.\&#34; Jury convicted all 16 counts in under an hour August 17, 2012; sentenced same day to 5 years. Remained in Tarrant County Jail on appeal; appeal denied May 2014; to state prison. Paroled December 2014 (~2.5 years post-conviction); eligible since March 2013 per TX law. No parole restrictions; not required to register as sex offender (victims were adults). Mandatory supervision through August 2017.\n\nHusband remained with her. Jan. 2015: \&#34;No. I&#39;ve already said everything I&#39;m going to say\&#34; when asked if she had anything to say to victims.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;sexting&#34;, &#34;physical-evidence&#34;, &#34;no-remorse&#34;, &#34;early-release&#34;, &#34;female-defendant&#34;, &#34;adult-victim&#34;, &#34;group-sex&#34;]}, {&#34;id&#34;: 112, &#34;case_id&#34;: 34, &#34;case_name&#34;: &#34;Julie Rizzitello&#34;, &#34;source&#34;: &#34;Asbury Park Press (Serrano)&#34;, &#34;date&#34;: &#34;2026-02-13&#34;, &#34;text&#34;: &#34;Ex-teacher sentenced in student sex case impregnated by victim: judge \u2014 Asbury Park Press, Feb. 13, 2026\n\nJulie Rizzitello, 37, sentenced February 11, 2026 by Judge Jill G. O&#39;Malley to 10 years prison. Victim 1 (17-year-old) impregnated Rizzitello during unprotected sex at his family&#39;s home on his birthday in January 2018; she had told him she could not get pregnant. She later confirmed the pregnancy (~8 weeks, consistent with birthday encounter) and had an abortion without the victim&#39;s comfort or agreement. This was read by O&#39;Malley from the presentence investigation report based on the victim&#39;s statement.\n\nJudge O&#39;Malley on the sentencing letter: \&#34;It was all about you. Not mentioned the names of the victims, not once. You apologized to your friends, your family, the community. And you didn&#39;t apologize to the victims. You still don&#39;t see them as victims.\&#34; On the pregnancy: \&#34;Now he&#39;s struggling to come to terms with the fact that this individual had an abortion he wasn&#39;t comfortable with. This is the psychological impact. This is the devastation.\&#34; Rizzitello twice interjected \&#34;I do\&#34; when O&#39;Malley said she didn&#39;t see the victims as victims, angering the judge. Rizzitello said at sentencing: \&#34;What I did was completely wrong and it&#39;s unexcusable, I know that.\&#34;\n\nSentence: 10 years, Parole Supervision for Life, Megan&#39;s Law registration, no contact with victims, teaching license forfeiture. Defense attorney Mitchell Ansell sought 5 years; cited two children ages 4 and 6 and no prior record.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;pregnancy&#34;, &#34;sex-offender-registration&#34;, &#34;no-remorse&#34;, &#34;parole-supervision-for-life&#34;]}, {&#34;id&#34;: 113, &#34;case_id&#34;: 101, &#34;case_name&#34;: &#34;Paige Morley&#34;, &#34;source&#34;: &#34;Hillsborough County Sheriff&#39;s Office press releases (Mar 10 &amp; Mar 28, 2023) + Hillsborough County Circuit Court records&#34;, &#34;date&#34;: &#34;2023-03-10&#34;, &#34;text&#34;: &#34;FL Riverview Teacher Arrested for Inappropriate Conduct Facing Additional Charges\n\nUPDATE: MARCH 28, 2023\n\nAfter further investigation, Paige Morley, who was previously arrested for an inappropriate relationship with a student, is facing additional charges.\n\nMorley is now charged with Transmission of Harmful Material to a Minor, Unlawful use of a Two-Way Communication Device, and Tampering with Evidence.\n\nORIGINAL PRESS RELEASE: MARCH 10, 2023\n\nThe Hillsborough County Sheriff&#39;s Office has arrested a teacher for initiating an inappropriate relationship with a student.\n\nPaige Morley, 22, was a teacher at Winthrop College Preparatory Academy, in Riverview, when she entered into a romantic relationship with a male student. Morley coordinated to meet with the victim after school hours through various school sanctioned events beginning in February of 2023. These events were at the school following normal school hours. During the events, the victim and defendant would engage in sexual acts.\n\nCharges: Lewd or Lascivious Battery (Engage) (Authority Figure Over Student); Lew
