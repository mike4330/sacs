: &#34;2017-04-10&#34;, &#34;text&#34;: &#34;Ex-teacher who sent graphic sex texts to student sentenced to 5 years in prison\nBy Rob Jennings, NJ.com\nPublished/Updated: April 10, 2017\n\nMORRISTOWN \u2014 The former Parsippany Hills High School teacher who admitted to trading sexually-graphic texts with a male student is going to state prison for up to five years.\n\nJenna Leahey, 35, of Mount Olive, was taken away in handcuffs Monday, following a failed bid for leniency, after being sentenced by Superior Court Judge Salem Ahto.\n\n\&#34;I&#39;m deeply ashamed and embarrassed for what I have done,\&#34; Leahey said in addressing Ahto.\n\nThe former student, now 20 and identified only by his initials, was in the fourth-floor courtroom with his mother and other family members.\n\nMorris County Supervising Assistant Prosecutor Meg Rodriguez read a statement from him, in which he wrote, \&#34;No 16-year-old should go through what I went through.\&#34;\n\nLeahey pleaded guilty in January to one count of endangering the welfare of a child, as jury selection was about to begin for a trial.\n\nShe was indicted in 2014 for sexual assault, official misconduct and criminal sexual conduct, in addition to endangering. The other charges, stemming from her alleged actions between January 2013 and June 2013, were dismissed as part of her plea agreement.\n\nThe full scope of the interaction between Leahey and the student was not spelled out in court, though several of her text messages were read by Morris County Supervising Assistant Prosecutor Meg Rodriguez.\n\nIn a statement following the sentencing, County Prosecutor Fredric Knapp&#39;s office also alluded to explicit photos from Leahey to the student and unspecified \&#34;acts occurring on and off school grounds.\&#34;\n\nKnapp said, \&#34;The state prison sentence for this offender will hopefully send a message that the abuse of children, in any way shape or form, by those in positions of authority will not be tolerated.\&#34;\n\nLeahey, in court, alluded to her lost career. \&#34;I have lost the only thing I ever wanted in my life -- to teach,\&#34; she said.\n\nLeahey also sought to place some blame on the then-high school junior, accusing him of assaulting her and being \&#34;overly aggressive.\&#34;\n\n\&#34;I am guilty of texting my student,\&#34; Leahey said. \&#34;At the time I did it, it was because I thought it would end the ongoing sexual assault. Now I realize that there were and are far better ways to have dealt with the situation,\&#34; Leahey said.\n\nRodriguez, when it was her turn, denied Leahey&#39;s allegation. \&#34;The facts do not support what Ms. Leahey says now,\&#34; Rodriguez said.\n\nRodriguez said nothing in the text messages \&#34;supports him being physically aggressive with her.\&#34; \&#34;That came later, when the crocodile tears didn&#39;t work,\&#34; Rodriguez said.\n\nShe read several of the voluminous texts between Leahey and the former student, showing the teacher welcoming their exchanges.\n\nOf the student, Rodriguez said, \&#34;He clearly had a crush on her,\&#34; adding, \&#34;What 16-year-old wouldn&#39;t.\&#34; The messages showed Leahey \&#34;flirting back,\&#34; Rodriguez said.\n\nAhto, in a ruling concluded just before 11 a.m., sided with the five-year sentence sought by prosecutors as part of the plea agreement. He said he had reviewed all of the text messages at the core of the case, and that Leahey was to blame. \&#34;The text messages between the two of them are extremely vivid, extremely descriptive, but she is the adult. She was the teacher, and although he wasn&#39;t her student at the time, he still went to her for advice,\&#34; Ahto said.\n\nLeahey will be eligible to apply for parole after serving just over a year.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;, &#34;early-release&#34;, &#34;on-campus&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 330, &#34;case_id&#34;: 259, &#34;case_name&#34;: &#34;New Jersey v. Leahey&#34;, &#34;source&#34;: &#34;Daily Record (Morris County)&#34;, &#34;date&#34;: &#34;2017-01-03&#34;, &#34;text&#34;: &#34;Sex abuse trial for ex-Parsippany Hills H.S. teacher to start Jan. 17\nBy Peggy Wright, Daily Record\nUpdated January 4, 2017\n\nThe trial of former Parsippany Hills High School English teacher Jenna Leahey on charges of sexually abusing a 16-year-old male student in 2013 is scheduled to start with jury selection on Jan. 17.\n\nNow 35 and living in Flanders, Leahey is expected to use a defense of duress. Morris County Assistant Prosecutor Meg Rodriguez told a Superior Court judge Tuesday that the defense mental health expert&#39;s opinion that Leahey&#39;s \&#34;idiosyncratic\&#34; personality features made her behave in certain ways should be barred.\n\nRodriguez said she also just received from Hand statements from two new potential defense witnesses who have disparaging opinions of the male accuser. Their statements include insults about his character and comments that the student often got crushes on females at school and girls generally ignored him at school.\n\nRodriguez said she believes those witness statements will not be admissible at trial because they are opinions instead of facts. She said she could even invoke the rape shield law to limit the defense ability to introduce evidence or to cross-examine the alleged victim about his past sexual behavior.\n\nHand said he isn&#39;t yet sure which witnesses he may call and that the comments can be dealt with at trial time. Ahto noted that some of the comments do sound inadmissible but he wasn&#39;t going to immediately decide or prejudge them.\n\nAhto also told the lawyers that he has spent hours exploring the possible meanings of emoticons, abbreviated words and symbols used in text exchanges between Leahey and the now-former student. He said he cannot allow jurors to interpret the text exchanges on their own.\n\nRodriguez and Gaynor told the judge that detectives will likely read the texts for the jury, playing the role of accuser and Leahey. The detectives will not be asked to fill in any gaps or interpret any symbols in the texts.\n\nLeahey, who appears for every court hearing, was criminally charged in 2013 with official misconduct, endangering the welfare of a child between January and June 2013, sexual assault and criminal sexual contact. The accuser last year filed a lawsuit against the district and Leahey, alleging that he was sexually abused by the teacher who was poorly supervised by district officials.\n\nThe Prosecutor&#39;s Office has extended a plea offer to Leahey of five years in prison, with the full five years to be served before parole, in exchange for a guilty plea to official misconduct. She rejected the plea offer, opting to go to trial.\n\nAccording to prior hearings, Leahey told investigators that the relationship \&#34;got out of hand,\&#34; and that the student pursued her but she denied having sex with him.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 331, &#34;case_id&#34;: 260, &#34;case_name&#34;: &#34;South Carolina v. McClure&#34;, &#34;source&#34;: &#34;Spartanburg Herald-Journal&#34;, &#34;date&#34;: &#34;2016-03-23&#34;, &#34;text&#34;: &#34;Byrnes High teacher charged in sexual activities with student\nBy Zach Fox, Spartanburg Herald-Journal\nMarch 23, 2016\n\nDistrict officials said McClure resigned during the law enforcement investigation.\n\nAn incident report states the 16-year-old was a student in McClure&#39;s Spanish I class. He started flirting with her and left his phone number on her desk, the report states.\n\nThe two then flirted on Facetime, according to the report. The report states McClure sent the student topless photos, which he saved before deleting.\n\nDuring the football game between Byrnes High and J.L. Mann High School that year, McClure texted the student to meet her at her house, the report states.\n\nThat night, and two other times that month, McClure performed oral sex on the student, the report states.\n\nHayes said that even though the student was of legal consent age, state law makes it illegal for a teacher to engage in sexual activity with a student.\n\nMcClure was booked into the Spartanburg County jail Wednesday afternoon, where she awaited a bond hearing.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 332, &#34;case_id&#34;: 261, &#34;case_name&#34;: &#34;South Carolina v. Wentzky&#34;, &#34;source&#34;: &#34;WIS (Columbia)&#34;, &#34;date&#34;: &#34;2015-01-05&#34;, &#34;text&#34;: &#34;Fmr. Dreher teacher gets probation after admitting sex with teen student\nBy WIS Staff\nPublished: Jan. 5, 2015 / Updated: Jan. 15, 2015\n\nCOLUMBIA, SC (WIS) - A former Dreher High School English teacher has been sentenced to three years probation following admission to having an intimate relationship with a 17-year-old student in May 2012.\n\nKinsley Wentzky, 36, of Forest Acres pleaded guilty in late October 2014 to two counts of sexual battery with a student 16 to 17 years of age, no aggravated force or coercion.\n\nA judge sentenced Wentzky to a suspended sentence of five years in prison and three years probation. She will be placed on the Central Registry of Child Abuse/Neglect and seek mental health counseling.\n\nWentzky had been arrested twice and hit with sexual battery charges by the Columbia Police Department and the Forest Acres Police Department in early January of 2013.\n\nCPD initiated the investigation as a result of gaining victim information in partnership with Forest Acres.\n\nInvestigators said Wentzky engaged in two relationships with two 17-year-old students at a Columbia home and a Forest Acres home.\n\nIn the CPD case, an arrest warrant said both Wentzky and the student gave sworn statements admitting to an \&#34;intimate\&#34; relationship. The warrant said the two engaged in sexual activity in May of 2012.\n\nWentzky taught at Dreher High for seven years. Her class web page noted at the time that she was happily married with two children.\n\nShe was on paid administrative leave from the school district before she was ultimately let go following the State Department of Education&#39;s suspension of her teaching certificate in January of 2013.\n\nWentzky&#39;s probation is scheduled to end on October 27, 2017.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 333, &#34;case_id&#34;: 261, &#34;case_name&#34;: &#34;South Carolina v. Wentzky&#34;, &#34;source&#34;: &#34;ABC Columbia / WOLO&#34;, &#34;date&#34;: &#34;2013-01-08&#34;, &#34;text&#34;: &#34;Local Teacher Charged with Second Count of Sexual Battery\nBy ABC Columbia Staff\nJanuary 8, 2013\n\nFOREST ACRES, S.C. (WOLO) Just three days after being arrested and charged with Sexual Battery with a Student, 34-year-old Kinsley Wentzky was arrested again Monday for the same charge allegedly involving a different student. Wentzky has been an English teacher at Dreher High School for nearly seven years.\n\n\&#34;She had been a teacher of this individual,\&#34; says Lt. Bryant Hinson of the Forest Acres Police Department. But whether 34-year-old Wentzky was still teaching the student in her latest arrest, by Forest Acres Police, is not known.\n\nIn an arrest warrant obtained by ABC Columbia News, both Wentzky and the student admitted to having sexual intercourse at her home on December 20, 2012. \&#34;It would not be illegal if she was not a teacher or someone in authority, an authority figure, over him,\&#34; says Lt. Hinson.\n\nIn a separate arrest warrant, this time from Columbia Police, it states Wentzky and another student admitted to sexual intercourse at a home on Wilmot St. in Columbia back in May of 2011.\n\nIn both cases, Wentzky was charged with Sexual Battery with a Student 16 or 17 years old with no aggravated force or coercion. Authorities say in both cases, the students consented.\n\n\&#34;In 2010, a law was introduced and passed outlawing this based off the fact that a teacher, a school resource officer or anyone of authority in a school, basically could use their ability as a teacher or their influence to possibly influence a child who is of school age to do things which would be inappropriate,\&#34; says Lt. Hinson. The charge carries a sentence of up to 5 years in prison. Both incidents are under investigation.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 334, &#34;case_id&#34;: 262, &#34;case_name&#34;: &#34;South Carolina v. Callaham&#34;, &#34;source&#34;: &#34;Fox News&#34;, &#34;date&#34;: &#34;2025-07-11&#34;, &#34;text&#34;: &#34;Former public school teacher, 33, charged after &#39;prolonged pattern of abuse&#39; with teen boy\nBy Louis Casiano, Fox News\nPublished July 11, 2025\n\nA former South Carolina teacher was charged with having a prolonged inappropriate relationship with a teenage boy.\n\nNicole Ballew Callaham, 33, turned herself in to the Anderson County Detention Center Thursday, the Anderson County Sheriff&#39;s Office said.\n\nShe was charged with three counts of criminal sexual conduct with a minor and one count of contributing to the delinquency of a minor.\n\nDetectives began investigating Callaham in May and found that the alleged misconduct began in 2021 and continued for at least two years.\n\nCallaham, a teacher at the time, began \&#34;grooming behavior\&#34; with the boy in his early teen years, authorities said.\n\n\&#34;The relationship intensified as she reportedly signed the student out of school, transported him to practices and served as a supervisor for after-school activities,\&#34; the sheriff&#39;s office said. \&#34;These repeated interactions led to a prolonged pattern of abuse, which was corroborated by search warrants and ongoing cooperation with the victim&#39;s family.\&#34;\n\nThe boy came forward after turning 18, \&#34;following time spent processing the experience and trauma associated with the abuse,\&#34; authorities said.\n\nIn addition to the charges in Anderson County, the Greenville City Police Department has brought similar charges against Callaham.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;delayed-reporting&#34;, &#34;long-term-relationship&#34;, &#34;possible-additional-victims&#34;]}, {&#34;id&#34;: 335, &#34;case_id&#34;: 263, &#34;case_name&#34;: &#34;Louisiana v. Odom&#34;, &#34;source&#34;: &#34;People&#34;, &#34;date&#34;: &#34;2018-05-14&#34;, &#34;text&#34;: &#34;&#39;She Should Not Be Around Children&#39;: La. Teacher Gets Five Years for Sexual Contact with Boys, 13 and 14\nBy Steve Helling, People\nPublished May 14, 2018\n\nA teacher in Lake Charles, Louisiana has been sentenced to prison for having sexual contact with three students, ages 13 and 14.\n\nSommer Odom, 38, pleaded guilty to the charges earlier this year. She was sentenced to five years in prison for each charge, with all but 18 months suspended. She will be on supervised probation for four years after her release from jail.\n\nBefore she pleaded guilty, she faced multiple charges of oral sexual battery charge, child molestation charge and sexual battery.\n\nOdom was arrested in April 2015 after a student&#39;s mother reported that the teacher had sexual contact with her son on multiple occasions. In court, prosecutors said that Odom texted one victim several naked photos of herself. They also alleged that she performed a sex act on him in a classroom.\n\nDuring sentencing on Friday, two mothers addressed the court, urging the judge to give Odom a harsh sentence.\n\n\&#34;I was astonished at the whole thing when it happened because I considered myself to be an awesome parent,\&#34; one mother said, according to The American Press. \&#34;This flipped my household upside down. We send our kids to school to be taught but also to be protected by their teachers. It was wrong. It was so wrong.\&#34;\n\nProsecutor Denisse Parrales addressed the court. \&#34;She endeared herself to the families, developed what would be a trusting relationship and preyed upon that relationship \u2014 and preyed upon these children,\&#34; said Parrales.\n\n\&#34;She preyed on them as a trusted adult,\&#34; Parrales told the court. \&#34;The effect that that had on these boys, these are the formative years, and the event was tremendous. One of these victims did not attend high school. She really should not be around children.\&#34;\n\nIn court, the prosecutors alleged that Odom had attended juvenile sports games after her arrest, which they said was a sign that she was not remorseful. But Odom&#39;s attorney, Walt Sanchez, said in court that she was at the parks to watch her own children play.\n\nOdom was immediately taken into custody after her sentencing.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;no-remorse&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 336, &#34;case_id&#34;: 263, &#34;case_name&#34;: &#34;Louisiana v. Odom&#34;, &#34;source&#34;: &#34;KPLC&#34;, &#34;date&#34;: &#34;2015-04-22&#34;, &#34;text&#34;: &#34;Lake Charles Charter Academy teacher accused of sex crimes\nBy Michael Cooper, KPLC\nPublished: Apr. 22, 2015 / Updated: Jun. 21, 2015\n\nIOWA, LA (KPLC) - A teacher at the Lake Charles Charter Academy has been accused of having inappropriate contact with a student, city police said.\n\nDeputy Chief Mark Kraus said Sommer Nicole Odom, 35, of Iowa, La., was arrested Tuesday afternoon on four counts of indecent behavior with juveniles, three counts of oral sexual battery and one count of sexual battery.\n\nKraus said the student&#39;s mother contacted authorities Saturday and stated that a teacher at the school had inappropriate contact with her juvenile son on several occasions.\n\nKraus said the investigation is ongoing and more charges may be added.\n\nOdom was jailed on $120,000 bond and has since bonded out.\n\nThe Lake Charles Charter Academy Foundation issued a news release about allegations made against a former teacher. The release signed by Foundation President Gene Thibodeaux reads: \&#34;The Board of Trustees condemns the conduct associated with these disturbing allegations. If proven true, it represents a gross and inexplicable departure from the conduct expected of the instructional staff. This tragic incident does not reflect the moral identity upon which our school was founded. We are taking steps to provide appropriate counseling to the affected students and to the immediate family members of the former teacher, who are victims as well. We are conducting our own internal investigation and are fully cooperating with law enforcement to protect the rights of all parties.\&#34;&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 337, &#34;case_id&#34;: 264, &#34;case_name&#34;: &#34;South Carolina v. Hope&#34;, &#34;source&#34;: &#34;WMBF News&#34;, &#34;date&#34;: &#34;2011-12-15&#34;, &#34;text&#34;: &#34;Teacher pleads guilty to sex crime charges\nWMBF News\nPublished: Dec. 15, 2011 / Updated: Apr. 16, 2014\n\nCHESTERFIELD COUNTY, SC (WMBF) - Carole Ann Hope, 38, a teacher accused of sleeping with a former student in both Horry and Darlington counties, pleaded guilty in front of a Conway judge Wednesday.\n\nHope pleaded guilty to three charges of criminal sexual conduct with a minor in the second degree - one charge for an incident in each county: Horry, Chesterfield and Darlington.\n\nHope currently lives in Darlington, but taught in Chesterfield where the student went to school.\n\nJudge Hyman sentenced Hope 10 years, but suspended the sentence to two years of active time. Hope also received five years probation, after incarceration and is required to register as a sex offender.\n\nHope will serve her sentence two years from today.\n\nThe victim&#39;s family was present in court and asked the judge to punish Hope, but take leniency on her because she has a young child herself.\n\nThe charges stemmed from separate incidents in Chesterfield County. Back in 2011, Hope was charged in this case.\n\nBy pleading guilty, Hope admitted to criminal sexual conduct with a minor, victim 11 to 14 years of age and lewd act upon a child under 16.\n\nWarrants obtained by WMBF News in 2011, alleged that Hope engaged in sexual activity with a former student along the side of a dirt road outside of McBee between March 1 and Oct. 31 of 2011.\n\nThe incidents occurred near the Central High School Stadium in Hope&#39;s vehicle.\n\nThis was the third county in which Hope had been arrested by SLED agents for sex acts against a former student.\n\nIn November 2011, Hope was arrested in Darlington County after agents said she engaged in sexual activity with the victim in her home along Snyder Lane in Hartsville.\n\nShe was then transported to Horry County, where she was charged with similar charges after allegedly engaging in sexual activity with the victim at a hotel in Horry County.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;long-term-relationship&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 338, &#34;case_id&#34;: 265, &#34;case_name&#34;: &#34;Oklahoma v. Day&#34;, &#34;source&#34;: &#34;KFOR / Canadian County court record&#34;, &#34;date&#34;: &#34;2019-06-15&#34;, &#34;text&#34;: &#34;Former Yukon teacher sentenced to prison following second-degree rape plea\nBy Kaylee Douglas, KFOR\nPosted: Jun 15, 2019\n\nCANADIAN CO., Okla. - A former Yukon teacher who pled guilty to lewd acts with a teen has been sentenced to serve prison time.\n\nIn November of 2017, officials with the Canadian County Sheriff&#39;s Office arrested Hunter Day, a teacher at Yukon High School.\n\nDeputies say that the investigation began after they received a complaint by parents who said that Day was having inappropriate contact with their son.\n\nAuthorities say the teen&#39;s parents told investigators that they found text messages and nude photographs on their son&#39;s cell phone.\n\nInvestigators say they determined that Day and the teenage boy had already had sex, and that they had made plans to meet at her home to have sex again.\n\n\&#34;This is a classic case of a serious breach of public trust. School teachers are entrusted to protect and educate our children, not to engage in an unlawful sexual relationship with them,\&#34; said Canadian County Sheriff Chris West.\n\nAuthorities with the sheriff&#39;s office used the boy&#39;s cell phone and pretended to be him while contacting Day. Investigators asked Day if the meeting was still on, and she allegedly said it was but added that he should hurry before her husband got home from work.\n\nDay texted the teen&#39;s cell phone that the \&#34;door&#39;s unlocked as usual,\&#34; and investigators found Day sitting on the living room floor with the lights turned off and candles lit.\n\nDay was charged with one count of second-degree rape and one count of soliciting sexual conduct or communication with a minor by use of technology.\n\nShe was sentenced to prison June 14. Sentencing for second-degree rape is a minimum of 1 year and a maximum of 15 years.\n\n[Court minute from June 17, 2019]: Case came on for sentencing following the defendant&#39;s blind pleas of guilty in both counts. Defendant appeared with Tommy Adler and the State appeared by Erika Simpson. Court sentenced the defendant in Count #1 to serve ten years in the custody of the Department of Corrections, all suspended except for the first three years, and ordered to pay a $500.00 VCA. In Count #2, the defendant was sentenced to the same sentence as in Count #1 and ordered to pay a $250.00 fine and $250.00 VCA. The sentences were ordered to run concurrently. Restitution to be determined after the defendant&#39;s release from prison upon motion of the State. Defendant to be supervised by the Department of Corrections with special conditions of probation. Judge Paul Hesse.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 339, &#34;case_id&#34;: 266, &#34;case_name&#34;: &#34;Missouri v. Barclay&#34;, &#34;source&#34;: &#34;Springfield News-Leader&#34;, &#34;date&#34;: &#34;2020-02-25&#34;, &#34;text&#34;: &#34;Ex-Monett school staffer pleads guilty to harassment of teen\nBy Claudette Riley, Springfield News-Leader\nUpdated Feb. 25, 2020\n\nThree years ago, allegations surfaced that a substitute teacher in Monett was involved in an inappropriate relationship with a student.\n\nLoryn Barclay, 27, was later charged with multiple counts of felony sexual contact with a student in Barry and Lawrence counties.\n\nUnder a plea deal, Barclay entered a guilty plea last week on one count of harassment of a person under age 17. The other charges were dropped.\n\nShe received a suspended execution of sentence of three years in prison and must serve five years of probation as part of the plea agreement, according to the Thursday ruling by Barry County Judge David Boyce Mouton.\n\nIn April 2017, the Monett Police Department received an anonymous tip alleging Barclay had an inappropriate relationship with a male student at Monett High School.\n\nCourt documents showed Barclay admitted sexual contact with the student in a city park and the student&#39;s home in fall and winter of 2016. The documents say the student told police the contact happened after his 17th birthday.\n\nBarclay was hired in August 2016 as a substitute teacher in Monett and was called to fill in, as needed, at schools during the fall semester. In January 2017, she was hired as a full-time paraprofessional, or teaching assistant, at the high school but was terminated when the allegations surfaced.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 340, &#34;case_id&#34;: 266, &#34;case_name&#34;: &#34;Missouri v. Barclay&#34;, &#34;source&#34;: &#34;Fox News / FOX 5 DC&#34;, &#34;date&#34;: &#34;2017-06-28&#34;, &#34;text&#34;: &#34;Substitute teacher accused of sexually assaulting 17-year-old student\nFOX 5 DC / Fox News\nPublished June 28, 2017\n\nA former substitute teacher in southwestern Missouri was arrested Sunday and charged in connection with alleged sexual contact with one of her students.\n\nLoryn Barclay, 24, faces charges in two counties as a result of the alleged relationship with the 17-year-old boy while she worked as a substitute teacher at Monett High School.\n\nAccording to court documents, Monett City Police Officer Jay Jastal, who works at the high school, was tipped off about the relationship in April. The officer said the student confirmed the relationship with Barclay on May 3. The following day, Barclay admitted having \&#34;an inappropriate relationship\&#34; with the boy.\n\nAccording to the affidavit, Barclay said she performed oral sex on the boy in a car at a park located in Lawrence County, Mo. She also admitted she had intercourse with the teen at the boy&#39;s home in neighboring Barry County.\n\nThe Monett Times reported that Barclay was hired as a substitute teacher this fall and was promoted to a paraprofessional in November. She became a teacher assistant in January and was removed April 27, the day the relationship was first reported to police.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 341, &#34;case_id&#34;: 267, &#34;case_name&#34;: &#34;Missouri v. Kirker&#34;, &#34;source&#34;: &#34;Inside Edition Digital&#34;, &#34;date&#34;: &#34;2023-11-06&#34;, &#34;text&#34;: &#34;Missouri Teacher, 27, and Young Mom Accused of Performing Oral Sex on Boy in Classroom Admits to Act: Cops\nBy Kristin Kirker reporting, Inside Edition Digital\nFirst Published: November 6, 2023\n\nA Missouri school teacher allegedly confessed to engaging in sexual acts with a student after being arrested by police.\n\nKristin Rose Kirker, 27, is now behind bars and charged with two counts of sexual contact with a student following incidents that allegedly occurred between March and April of this year, according to the felony complaint filed on Friday.\n\nThe school district says Kirker, who has a 3-year-old daughter, is no longer employed at the school.\n\nThose incidents were brought to the attention of the school on Nov. 2, according to a probable cause affidavit obtained by Inside Edition Digital.\n\nIn another incident, Kristin Rose Kirker went over to the victim&#39;s home, where she allegedly performed oral sex on the victim and then engaged in sexual intercourse, according to the affidavit.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 342, &#34;case_id&#34;: 267, &#34;case_name&#34;: &#34;Missouri v. Kirker&#34;, &#34;source&#34;: &#34;KFVS Heartland News&#34;, &#34;date&#34;: &#34;2025-03-25&#34;, &#34;text&#34;: &#34;Former Kelly School District teacher&#39;s aide sentenced Tuesday\nBy Heartland News / KFVS\nPublished: Mar. 25, 2025 / Updated: Mar. 25, 2025\n\nSCOTT COUNTY, Mo. (KFVS) - A former teacher&#39;s aide at the Kelly R-IV School District was sentenced on Tuesday, March 25.\n\nAccording to court records, 27-year-old Kristin Kirker, who admitted to having sexual contact with a student, will avoid prison time as long as she follows the terms of her probation.\n\nKirker received a 3-year suspended sentence in a Scott County courtroom Tuesday afternoon. The judge also sentenced her to five years probation. Additionally, she will have to register as a sex offender.\n\n\&#34;The state positioned, as stated by each of our witnesses, that a term of incarceration was appropriate,\&#34; Scott Co. Prosecuting Attorney Donald Cobb said in a statement. \&#34;There had been a previous Casenet entry by the defense describing a probation cap and that was simply not accurate. We sought a prison term. There have been far too many of these cases lately.\&#34;\n\nShe was initially charged back in 2023. According to online court records, she changed her plea to the felony charge on January 28.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 343, &#34;case_id&#34;: 268, &#34;case_name&#34;: &#34;Texas v. Ferguson&#34;, &#34;source&#34;: &#34;CBS News / KHOU&#34;, &#34;date&#34;: &#34;2016-12-05&#34;, &#34;text&#34;: &#34;Police: Texas teacher had sex with student after Snapchat encounter\nCBS News / KHOU\nPublished: December 5, 2016\n\nInvestigators say an encounter on the social media platform Snapchat led to a sexual relationship between a Texas math teacher and a 16-year-old student.\n\nAlaina Ferguson, 23, was arrested and charged with sexual assault on Nov. 30, after authorities discovered the alleged relationship.\n\nThe 16-year-old student told police that he wrote his Snapchat user name at the top of a test while in Ferguson&#39;s algebra class at Plano Senior High School, according to court documents. Ferguson allegedly replied via the social media app, and the two met a few days later and had sex on a park bench, the alleged victim told police.\n\nPolice allege that between one and two weeks later, the teen and a friend went to Ferguson&#39;s apartment, which she shared with her fianc\u00e9, who was away for the weekend. Ferguson and the teens ate pizza and played beer pong, the alleged victim said, and he and Ferguson allegedly had sex while his friend took the dog for a walk.\n\n\&#34;Ms. Ferguson told [the student] that she knew it was not the right thing to do, but it felt right at the time, and that she was going to break it off with her fianc\u00e9 because she didn&#39;t feel anything with him,\&#34; an investigator wrote in the court documents.\n\nThe teen and Ferguson had sex in the same apartment on several occasions during their relationship, the victim told officers. The most recent occurrence was in the back of his pickup truck after a football game on Nov. 4.\n\nFerguson was released from jail on Dec. 1 after posting a $100,000 bond. The Plano Independent School District said Ferguson was hired in August of this year and resigned in October.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 344, &#34;case_id&#34;: 268, &#34;case_name&#34;: &#34;Texas v. Ferguson&#34;, &#34;source&#34;: &#34;FOX 26 Houston&#34;, &#34;date&#34;: &#34;2018-08-25&#34;, &#34;text&#34;: &#34;Former Plano Senior High School teacher Alaina Ferguson, 25, sentenced to 10 years probation for relationship with 16-year-old student. Ferguson pleaded guilty, admitting to meeting the boy several times in a Lewisville park, at her apartment, and in the back of his pickup truck. As part of her sentence she will spend two weeks in Collin County jail every year for the next four years. She must also register as a sex offender.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 345, &#34;case_id&#34;: 269, &#34;case_name&#34;: &#34;Florida v. Hinckley&#34;, &#34;source&#34;: &#34;Florida Times-Union&#34;, &#34;date&#34;: &#34;2017-06-07&#34;, &#34;text&#34;: &#34;Former St. Augustine teacher sentenced for sex with teen student\nBy Dan Scanlan, Florida Times-Union\nJune 7, 2017\n\nA 28-year-old former St. Augustine High School teacher was sentenced to six months in jail Wednesday morning and classified a sex offender for having sex with a then-16 year-old student, according to St. Johns County court records.\n\nVirginia Houston Hinckley will also face 72 months of probation, the first 12 of those under community control, after she is released from jail.\n\nHinckley was originally arrested Nov. 25 after an investigation into an inappropriate relationship with a student, according to the St. Johns County Sheriff&#39;s Office. Hinckley and the student texted nude photographs to each other. The student said they kissed and he fondled her in a classroom, then they parked in Treaty Park on Wildwood Drive and had sex in her vehicle, her arrest report said.\n\nShe had been suspended Oct. 20 by the school district.\n\nHinckley pleaded no contest as part of a plea agreement May 8 and was sentenced Wednesday by Judge Howard Maltz, according to court records.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 346, &#34;case_id&#34;: 269, &#34;case_name&#34;: &#34;Florida v. Hinckley&#34;, &#34;source&#34;: &#34;First Coast News&#34;, &#34;date&#34;: &#34;2016-11-25&#34;, &#34;text&#34;: &#34;St. Augustine High teacher accused of having sex with student\nFirst Coast News\nNovember 25, 2016\n\nA 26-year-old St. Augustine High School teacher was arrested after being accused of having sex with a student.\n\nThe St. Johns County Sheriff&#39;s Office said Virginia Houston Hinckley, who lives in Jacksonville, turned herself in at the Nassau County Sheriff&#39;s Office after learning a warrant for her arrest was issued.\n\nHinckley is charged with having unlawful sexual activity with a minor, a second-degree felony. She was released after posting $10,000 bond.\n\nSpecial Victims&#39; Unit detectives began the investigation Oct. 20 after allegations that Hinckley had sex with a 16-year-old male student who was in her class. Detectives turned the investigation over to the State Attorney&#39;s Office, which issued the arrest warrant.\n\nHinckley was suspended with pay in October pending the outcome of the investigation. According to the St. Augustine High School website, Hinckley teaches ninth-grade English and ninth- and tenth-grade intensive reading.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 347, &#34;case_id&#34;: 270, &#34;case_name&#34;: &#34;Florida v. Geliga&#34;, &#34;source&#34;: &#34;CBS News&#34;, &#34;date&#34;: &#34;2017-05-19&#34;, &#34;text&#34;: &#34;Police: Florida chemistry teacher had sex with student\nBy Crimesider Staff, CBS News\nMay 19, 2017\n\nPORT ST. LUCIE, Fla. \u2014 Florida police say a 35-year-old high school teacher was unaware they were listening in when she confirmed that she had a sexual relationship with a student.\n\nTiffany Michelle Geliga, who will turn 36 on May 26, has been charged with two counts of sex assault by persons 24 years or older on a victim 16 or 17 year old.\n\nThe mother of a student contacted a school resource officer after she found several text messages between Geliga and her son. When officials questioned the boy, he allegedly told them that while he did not have a sexual relationship with Geliga, he believed another 17-year-old boy had.\n\n\&#34;The school administration then called in the other student, a 17-year-old male, who said that he had sexual relations with Geliga on two separate occasions,\&#34; Port St. Lucie police said in a press release.\n\nThe boy said in late April or early May he twice met Geliga off-campus, where they had sex in her car.\n\nDetectives say they listened in while the student called Geliga on the phone and had a conversation with her in which she allegedly confirmed that they had sexual relations.\n\nGeliga was booked into St. Lucie County jail.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;physical-evidence&#34;]}, {&#34;id&#34;: 348, &#34;case_id&#34;: 270, &#34;case_name&#34;: &#34;Florida v. Geliga&#34;, &#34;source&#34;: &#34;TCPalm / Treasure Coast Newspapers&#34;, &#34;date&#34;: &#34;2019-04-01&#34;, &#34;text&#34;: &#34;Former Port St. Lucie high school chemistry teacher Tiffany Michelle Geliga, 36, sentenced to 66 months in prison and two years sex offender probation for having sex with a 17-year-old student she was tutoring at Indian River State College. Geliga pleaded no contest in January to a charge of having sex with a minor. She was arrested in May 2017 and was suspended then dismissed by St. Lucie Public Schools. (Sentencing date approximate.)&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;appeal&#34;, &#34;physical-evidence&#34;]}, {&#34;id&#34;: 349, &#34;case_id&#34;: 270, &#34;case_name&#34;: &#34;Florida v. Geliga&#34;, &#34;source&#34;: &#34;Florida 4th DCA (appellate opinion)&#34;, &#34;date&#34;: &#34;2020-01-01&#34;, &#34;text&#34;: &#34;Appeal of sentence. Geliga argued the trial court erred in denying a downward departure based on mental health treatment (F.S. 921.0026(2)) by requiring the condition to be connected to the criminal conduct. The court also considered whether the victim was a willing participant under F.S. 921.0026(2)(f); the trial court found no evidence to support that ground. Fourth DCA reversed and remanded for new sentencing hearing, holding trial court erred as a matter of law on the mental health mitigator. (Date approximate.)&#34;, &#34;tags&#34;: [&#34;appeal&#34;, &#34;sora-appeal&#34;]}, {&#34;id&#34;: 350, &#34;case_id&#34;: 271, &#34;case_name&#34;: &#34;Former English teacher at Stamford High School, Stamford, CT. Age 32 at arrest (July 2014). Began sexual relationship with a male student who was 17 at the start of the relationship (September 2013); victim was 18 when he reported to police in June 2014. Also provided marijuana to the same student and to a second, 15-year-old male student. Threatened to fail the older student if he attempted to break off the relationship. Approximately 2,000 text messages recovered, including nude photos sent to the student&#39;s phone.&#34;, &#34;source&#34;: &#34;Stamford Advocate&#34;, &#34;date&#34;: &#34;2015-03-11&#34;, &#34;text&#34;: &#34;Stamford teacher sentenced to five years for having sex with student\nSecond arrest for threatening victim jeopardized plea agreement of maximum four years\nBy John Nickerson, Reporter\nUpdated March 11, 2015\n\nSTAMFORD -- Nine months after her arrest for carrying on a sexual relationship with a student set off a series of events that plunged the city&#39;s school district into crisis, former Stamford High School teacher Danielle Watkins stood before a judge for her sentencing Wednesday and fought back tears as she apologized for what she did.\n\n\&#34;I was put in a position of trust and I violated that trust,\&#34; she said, trying not to sob.\n\nDressed in a baggy light gray sweat suit with shackles around her ankles, the young mother of two small children read from handwritten notes on pieces of paper, which she held in front of her after a Judicial Marshal unlocked her handcuffs.\n\n\&#34;As a parent I understand how parents need to know their children are safe when they go to school,\&#34; she said.\n\nChildren should know they are protected, and not have to fear that the people caring for them would endanger them, she continued, saying she accepted responsibility for her actions. In addition to the sexual relationship with the student, during which she threatened to fail him when he tried to break it off, she also provided him and a second student with marijuana.\n\n\&#34;I am sorry and know I betrayed a sacred trust and make no excuses,\&#34; she said.\n\nWatkins then asked White for mercy and to get back her children, both under the age of 4, as soon as possible.\n\nThe judge did neither.\n\nThe plea deal Watkins agreed to in December called for between nine months and four years in exchange for pleading guilty to felony charges of second-degree sexual assault and risk of injury to a minor.\n\nBut her subsequent arrest for threatening one of her victims when she encountered him in a coffee shop near her former place of employment in January jeopardized her plea arrangement, and Judge Gary White instead gave her five years.\n\nThe longer sentence should not come as a surprise, given that when she originally accepted the plea bargain, White warned her not to get arrested again before her sentencing. If she did, he told her, he would be free to scrap the agreement and possibly sentence her to the maximum punishment of 20 years that the charges against her could bring.\n\nJust over a month later, however, she walked into the Dunkin&#39; Donuts that is in effect an extension of Stamford High School, where the younger of her victims happened to be waiting to pick up the breakfast he had ordered for himself and his mother, who was waiting in her car outside the shop.\n\nIn clear view of a security camera that recorded the whole interaction, Watkins pointed to the boy and issued a threat.\n\nShe said, \&#34;You are going to get yours,\&#34; or something to that effect,\&#34; Senior Assistant State&#39;s Attorney Michelle Manning told the court Wednesday.\n\nIn addition to threatening the boy, she also broke the terms of her bond, which required her to stay away from her victims. She pleaded guilty to those charges as part of Wednesday&#39;s sentencing.\n\nWatkins&#39; father and mother John and Iolanda Stashenko also begged the judge to let Watkins return to her family soon, and promised to look after her when she got home. Sobbing as she spoke to the court, Iolanda Stashenko blamed her daughter&#39;s behavior on a back injury that she had suffered, and postpartum depression.\n\nJudge White&#39;s sentence did not go as far as the prosecutor and victims&#39; lawyer would have liked. Manning, the state&#39;s attorney, asked White to sentence Watkins to 12 years in jail and suspend her sentence after she spends five years in jail followed by 15 years probation. She said that was the only way to deter and monitor Watkins, keeping her from doing something like this again.\n\nWatkins&#39; attorney, Rob Serafinowicz, said his client was taking responsibility for what she had done by pleading guilty, and asked the judge to give her to only the minimum sentence of nine months in prison. He said she made a \&#34;serious mistake\&#34; going to the Dunkin&#39; Donuts, but said her meeting with the younger of her victims was not planned.\n\nAttorney Devin Janosov, who is representing the two victims, asked White to go beyond the original plea deal because of the damage she caused the two boys, who he said are now in need of psychological help.\n\nThe judge described her actions as \&#34;outrageous,\&#34; and that she must be held accountable for them. Although Watkins had a lot going for her -- an education, career and no prior criminal record -- she had shown the criminal justice process the \&#34;back of her hand\&#34; when she threatened the youth at the Dunkin&#39; Donuts.\n\n\&#34;It is clear she abused the trust she had,\&#34; White said before pronouncing her sentence.\n\nIn addition to the five years of prison time, he also gave her 15 years of probation, and a \&#34;suspended sentence\&#34; of five years that she can be made to serve if she breaks the terms of her probation. She will also spend 10 years following her release on the sex offender registry, and a protective order prohibits her from contacting the two victims in the case until March 2030.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;prior-warning-ignored&#34;, &#34;drugs&#34;, &#34;long-term-relationship&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 351, &#34;case_id&#34;: 271, &#34;case_name&#34;: &#34;Former English teacher at Stamford High School, Stamford, CT. Age 32 at arrest (July 2014). Began sexual relationship with a male student who was 17 at the start of the relationship (September 2013); victim was 18 when he reported to police in June 2014. Also provided marijuana to the same student and to a second, 15-year-old male student. Threatened to fail the older student if he attempted to break off the relationship. Approximately 2,000 text messages recovered, including nude photos sent to the student&#39;s phone.&#34;, &#34;source&#34;: &#34;AP/WABC&#34;, &#34;date&#34;: &#34;2014-07-18&#34;, &#34;text&#34;: &#34;Stamford, Conn., teacher accused of using grade threat against student for sex\nAP / WABC\nFriday, July 18, 2014\n\nSTAMFORD, Conn. -- A Stamford High School English teacher is accused of threatening to fail a student if he broke off their sexual relationship.\n\nDanielle Watkins of Norwalk turned herself in to police Thursday. She is charged with sexual assault, sale of marijuana and risk of injury to a minor.\n\nPolice say the 18-year-old student came to them in June and described how the 32-year-old teacher had provided him with drugs and sex since last September. Police say she also gave marijuana to a 15-year-old.\n\nPolice say they recovered 2,000 text messages, including nude photos sent to the teen&#39;s phone.\n\nWatkins posted $100,000 bond and is due in state Superior Court in Stamford on July 31.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;drugs&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 352, &#34;case_id&#34;: 272, &#34;case_name&#34;: &#34;Lindsey Limbaugh&#34;, &#34;source&#34;: &#34;Southeast Missourian&#34;, &#34;date&#34;: &#34;2025-12-08&#34;, &#34;text&#34;: &#34;Former teacher Linsey Limbaugh to serve ten days in jail for assaulting student\nNathan Gladden, Southeast Missourian\nDecember 8, 2025\n\nFormer Kelly High School teacher Lindsey Limbaugh pleaded guilty to fourth-degree assault on a student and was sentenced to 10 days in jail on Nov. 5.\n\nLimbaugh was arrested for allegedly kissing a student while on a field trip to a Cape Girardeau park. A prior Southeast Missourian article states the unidentified student allegedly suggested that he and Limbaugh go to a men&#39;s restroom, and while inside, the two kissed and the student touched Limbaugh sexually. Limbaugh allegedly clarified in an interview that she consented to kissing but did not consent to being touched and claimed she attempted to remove his hands from her.\n\nLimbaugh also faces a case in Scott County that involves sexual contact with an alleged student, where she faces one charge of fourth-degree assault. In the Cape Girardeau County case, the state amended charges in the case from two class E felonies of sexual contact with a student to one count of fourth-degree assault as a class C misdemeanor and one count of sexual contact with a student.\n\nAccording to Limbaugh&#39;s guilty plea, the count of sexual contact with a student was dismissed, and Limbaugh pleaded guilty to one count of fourth-degree assault as a class C misdemeanor. Limbaugh was sentenced on Nov. 5 by judge Gary Albert Kamp to 10 days in the Cape Girardeau County Jail with credit for time served on the count of fourth-degree assault.\n\nLimbaugh was represented by attorney Mark Hammer, and the state of Missouri was represented by assistant prosecuting attorney Tabatha Blakely.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 353, &#34;case_id&#34;: 272, &#34;case_name&#34;: &#34;Lindsey Limbaugh&#34;, &#34;source&#34;: &#34;KFVS&#34;, &#34;date&#34;: &#34;2024-03-18&#34;, &#34;text&#34;: &#34;Case moves forward against former Kelly School Dist. teacher accused of having sexual contact with student\nBy Amber Ruch, KFVS\nPublished: Nov. 7, 2023 / Updated: Mar. 18, 2024\n\nSCOTT COUNTY, Mo. -- The case against a former southeast Missouri teacher moves forward.\n\nAccording to Scott County Prosecuting Attorney Donald Cobb, Lindsey Limbaugh, 38, of Benton, waived her preliminary hearing in January. Her next court appearance is a trial setting set for April 3.\n\nSuperintendent Dr. Bradley Kolwyck told us on Monday, March 18 that Limbaugh is no longer employed with the district. He said she was terminated on December 20, 2023.\n\nLimbaugh briefly appeared in court on Wednesday morning, November 15 where her lawyer, Marvin Gilmore, explained to the judge why he felt she should be released. Gilmore noted Limbaugh has no prior criminal history, and reminded the judge she&#39;s the one who reported the alleged crimes to the school superintendent. He said she graduated from Kelly High School, went to college in Cape Girardeau and then followed in the footsteps of her mother, who taught at Kelly for more than 20 years. He also reminded the judge Limbaugh has two young children. Ultimately, the judge set Limbaugh&#39;s bond at $40,000, which allowed her to pay her way out.\n\nLimbaugh was charged with two felony counts of sexual contact with a student. She pleaded not guilty.\n\nLimbaugh was arrested on Tuesday, Nov. 7 after authorities say she reported the alleged crimes to the school superintendent. According to court documents, Limbaugh admitted to a detective to having a sexual relationship with a student during the last week of the 2022-2023 school year. The relationship reportedly started after contacting the student through TikTok when she was intoxicated at a concert in April 2023.\n\nCourt documents state Limbaugh told a detective she made out with the student at a car wash, they kissed and she was fondled while on a school field trip to a park, the student came to her house, but that she did not have sex with the student until after he had graduated. The former student confirmed Limbaugh&#39;s statements, but said they also kissed sometime around the last few days of school, that he had sex with Limbaugh at her house before school had ended for the year and that Limbaugh had sex with him at his house sometime after he had graduated.\n\nLimbaugh is the second employee of the school district arrested in the past week.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;, &#34;alcohol&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 354, &#34;case_id&#34;: 273, &#34;case_name&#34;: &#34;Former vice principal at Burley High School, Burley, ID (Cassia County). Age 40 at start of offenses (July 2011); 41 at arrest. Had sexual contact with two female students over approximately 18 months, from July 2011 through December 2012. Victims were 16\u201317 years old. Fled to Utah; arrested near St. George on approximately December 22, 2012 on seven felony charges. Waived extradition December 27, 2012 and returned to Idaho.&#34;, &#34;source&#34;: &#34;Times-News&#34;, &#34;date&#34;: &#34;2013-07-17&#34;, &#34;text&#34;: &#34;Former vice principal sentenced for sexual abuse\nSite staff, Jul 17, 2013\n\nThe former vice principal of a high school in south-central Idaho has been sentenced to at least eight years in prison for sexually assaulting two students.\n\nThe Times-News reports 41-year-old Tara Bagley was sentenced Tuesday to two consecutive four- to 13-year prison terms. She earlier pleaded guilty to two counts of sexual abuse committed by lewd or lascivious acts on a minor child.\n\nProsecutors charged that Bagley had sexual contact with two female students at Burley High School over a period of about 18 months, starting in July 2011.\n\nDefense attorney Robert Nielsen said Bagley&#39;s actions were due to depression that was not properly treated.\n\nDistrict Judge Michael Crabtree also ordered Bagley to pay a $5,000 civil penalty to each victim.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;early-release&#34;]}, {&#34;id&#34;: 355, &#34;case_id&#34;: 273, &#34;case_name&#34;: &#34;Former vice principal at Burley High School, Burley, ID (Cassia County). Age 40 at start of offenses (July 2011); 41 at arrest. Had sexual contact with two female students over approximately 18 months, from July 2011 through December 2012. Victims were 16\u201317 years old. Fled to Utah; arrested near St. George on approximately December 22, 2012 on seven felony charges. Waived extradition December 27, 2012 and returned to Idaho.&#34;, &#34;source&#34;: &#34;Associated Press&#34;, &#34;date&#34;: &#34;2012-12-30&#34;, &#34;text&#34;: &#34;Idaho woman waives extradition in sex abuse case\nAssociated Press, Dec. 30, 2012\n\nBURLEY, Idaho -- A school administrator at Burley High School accused of sexually abusing two minors has waived her right to an extradition hearing after being arrested in another state.\n\nThe decision Thursday clears the way for 41-year-old Tara Leigh Bagley to be returned to Idaho. Bagley -- the vice principal at the high school -- was arrested last week near St. George, Utah, on seven felony charges of sexual abuse of a child between the ages of 16 and 17.\n\n5th District Court documents spelling out the specifics of the charges will remain sealed until Bagley is returned to authorities in Cassia County.\n\nAuthorities have said the charges stem from Bagley&#39;s alleged sexual conduct with two female victims from July 2011 to December 2012.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;female-victim&#34;]}, {&#34;id&#34;: 356, &#34;case_id&#34;: 273, &#34;case_name&#34;: &#34;Former vice principal at Burley High School, Burley, ID (Cassia County). Age 40 at start of offenses (July 2011); 41 at arrest. Had sexual contact with two female students over approximately 18 months, from July 2011 through December 2012. Victims were 16\u201317 years old. Fled to Utah; arrested near St. George on approximately December 22, 2012 on seven felony charges. Waived extradition December 27, 2012 and returned to Idaho.&#34;, &#34;source&#34;: &#34;Associated Press&#34;, &#34;date&#34;: &#34;2013-02-27&#34;, &#34;text&#34;: &#34;Former Burley vice principal denies sex charges\nAssociated Press, Feb 27, 2013\n\nBURLEY, Idaho -- A former Burley High School vice principal has pleaded not guilty to seven child sex charges.\n\nThe Times-News reports Tara Leigh Bagley was arraigned Tuesday in 5th District Court in Cassia County. Her trial is set for April 17.\n\nBagley was charged in December with seven felony counts of sexual battery committed by lewd or lascivious acts on a child 16 to 17 years old for allegedly having sexual contact with two female students.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;female-victim&#34;]}, {&#34;id&#34;: 357, &#34;case_id&#34;: 274, &#34;case_name&#34;: &#34;Former student teacher at Lamar Middle School, Lamar, MO (Barton County), placed while a senior at Missouri Southern State University. Age approximately 36 at time of offenses (2017); 39 at sentencing. Had received the top award for middle school education from MSSU&#39;s School of Arts and Sciences shortly before her arrest.&#34;, &#34;source&#34;: &#34;AP/Joplin Globe&#34;, &#34;date&#34;: &#34;2020-10-20&#34;, &#34;text&#34;: &#34;Ex-southwest Missouri student teacher gets prison for nude photos to students\nAssociated Press / KGNS\nPublished: Oct. 20, 2020\n\nLAMAR, Mo. -- A 39-year-old former student teacher in southwestern Missouri has been sentenced to four years in prison for sending nude photographs of herself to three 13-year-old male students back in 2017.\n\nThe Joplin Globe reports that former at Lamar Middle School teacher Emily Edson was sentenced last week to four years for each of three counts of sexual misconduct with a child and one count of promoting child pornography. The sentences are to be served at the same time.\n\nEdson had pleaded guilty to the charges; in exchange for her plea, more serious charges of sexual enticement and child pornography counts were dropped.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;parole-supervision-for-life&#34;, &#34;csam-distribution&#34;]}, {&#34;id&#34;: 358, &#34;case_id&#34;: 274, &#34;case_name&#34;: &#34;Former student teacher at Lamar Middle School, Lamar, MO (Barton County), placed while a senior at Missouri Southern State University. Age approximately 36 at time of offenses (2017); 39 at sentencing. Had received the top award for middle school education from MSSU&#39;s School of Arts and Sciences shortly before her arrest.&#34;, &#34;source&#34;: &#34;KOAM/FOX14&#34;, &#34;date&#34;: &#34;2019-03-08&#34;, &#34;text&#34;: &#34;Former student teacher in child porn case will stand trial\nBy Stacie Strader, KOAM/FOX14\nMar 8, 2019\n\nOn March 5th, 2019, Emily Louise Edson and her attorney filed a written waiver of her preliminary hearing. The courts set the case for trial.\n\nThe Barton County, Missouri Prosecutor&#39;s Office filed charges against Edson, 35, of Golden City, for possession of child pornography, three counts of sexual misconduct involving a child by indecent exposure and one count of enticement of a child. The alleged crimes happened at the Lamar Middle School in 2017.\n\nAn investigation was opened referencing a Lamar School District student teacher acting inappropriately with her students. Interviews were conducted on possible victims. One student alleged that his teacher, Edson, spoke sexually to him and that she sent a nude photo of herself to him. Two other students alleged that Edson also sent a nude photo of herself to them.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;csam-distribution&#34;]}, {&#34;id&#34;: 359, &#34;case_id&#34;: 274, &#34;case_name&#34;: &#34;Former student teacher at Lamar Middle School, Lamar, MO (Barton County), placed while a senior at Missouri Southern State University. Age approximately 36 at time of offenses (2017); 39 at sentencing. Had received the top award for middle school education from MSSU&#39;s School of Arts and Sciences shortly before her arrest.&#34;, &#34;source&#34;: &#34;Dade County news&#34;, &#34;date&#34;: &#34;2025-09-08&#34;, &#34;text&#34;: &#34;Golden City sex offender charged with two felonies after attending youth football games\nSeptember 8, 2025\n\nA 10 a.m. October 14 court date is scheduled in Dade County Circuit Court for Emily Edson, 44, Golden City, a sex offender who was charged with two counts of violating lifetime supervision, both felonies, after attending youth football games at Dykens Field in Greenfield August 23 and August 25.\n\nAccording to the probable cause statement, Edson was asked to leave and did so on August 23 after she had been at the field for an hour. She returned two days later.\n\nEdson stated her nephew was playing tackle football. She went to the parking lot and watched him play for 20 minutes. She stated she sat in the car and had a chaperone with her and did not know she could not be there.\n\nAccording to the probable cause statement, under the conditions of her lifetime supervision, Edson has to receive advanced approval from the Department of Corrections Command Center.\n\nEdson was sentenced to four years in prison in 2020 after pleading guilty in Barton County Circuit Court in Lamar to two counts of possession of child pornography, three counts of sexual misconduct involving a child by indecent exposure and one count of enticement of a child. The charges were in connection with incidents occurring at Lamar Middle School in 2017.\n\nThe initial arrest of Edson, who was a senior at Missouri Southern State University at the time, came less than two months after she received the top award for middle school education from the School of Arts and Sciences during the annual Academic Achievement Ceremony.\n\nThe probable cause statement says a student said his teacher had asked him to have sex with her several times, would speak sexually to him and had sent him a nude photo. The 2017 probable cause statement indicated that while executing a search warrant on Edson&#39;s phone, the Southwest Missouri Cyber Crimes Task Force uncovered photos depicting two naked underage boys either having anal intercourse or simulating the act.&#34;, &#34;tags&#34;: [&#34;appeal&#34;, &#34;parole-supervision-for-life&#34;]}, {&#34;id&#34;: 360, &#34;case_id&#34;: 275, &#34;case_name&#34;: &#34;Former 4th grade teacher at Woodland Elementary, Bollinger County, MO (Marble Hill). Age 23 at time of offense. Admitted to having sex with a 17-year-old male high school student multiple times; victim confirmed the details. Missouri State Highway Patrol opened the investigation on March 25, 2022; offense date per sex offender registry March 5, 2022. Placed on administrative leave by the school district.&#34;, &#34;source&#34;: &#34;KFVS&#34;, &#34;date&#34;: &#34;2022-03-29&#34;, &#34;text&#34;: &#34;Marble Hill, Mo. teacher accused of sexual intercourse with high school student\nBy Amber Ruch, KFVS\nPublished: Mar. 29, 2022\n\nBOLLINGER COUNTY, Mo. -- A Heartland teacher is on leave after allegedly having sex with a high school student.\n\nRachel Baker, 23, is charged with sexual contact with student.\n\nAccording to court documents, the Missouri State Highway Patrol opened the investigation on Friday, March 25. According to a probable cause statement, Baker, who teaches 4th grade at Woodland Elementary in Bollinger County, admitted to having sex with a 17-year-old high school student multiple times.\n\nAuthorities say the victim confirmed the details.\n\nThe school superintendent told us Baker is on administrative leave, but did not comment on the allegations.\n\nBaker is scheduled to be in court on April 20.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 361, &#34;case_id&#34;: 276, &#34;case_name&#34;: &#34;Former drama teacher at Lebanon High School, Lebanon, MO (Laclede County). Age 30 at arrest. Developed an inappropriate relationship with a male high school student. Lebanon Police Department became aware of the investigation on January 5, 2018; investigators spoke with the student and witnesses and gathered electronic evidence.&#34;, &#34;source&#34;: &#34;KOLR/OzarksFirst&#34;, &#34;date&#34;: &#34;2018-01-13&#34;, &#34;text&#34;: &#34;Lebanon Teacher Arrested for Sexual Contact with Student\nPosted: Jan 13, 2018\n\nLEBANON, Mo. -- A teacher from Lebanon was arrested and charged with felony sexual contact with a student today.\n\nElizabeth Morgan, 30, was arrested and bonded out on a $5,000 bond with conditions. On January 5, Lebanon Police Department became aware of an investigation pertaining to sexual contact with a teacher and a male high school student.\n\nIt was reported that Morgan was having an inappropriate relationship with a student of hers. After speaking with the student, witnesses and viewing electronic evidence, information was gathered to pursue charges on Morgan.\n\nAccording to the press release from Lebanon PD, any questions regarding Morgan&#39;s current employment status at Lebanon R-III should be referred to the school district.&#34;, &#34;tags&#34;: [&#34;grooming&#34;]}, {&#34;id&#34;: 362, &#34;case_id&#34;: 276, &#34;case_name&#34;: &#34;Former drama teacher at Lebanon High School, Lebanon, MO (Laclede County). Age 30 at arrest. Developed an inappropriate relationship with a male high school student. Lebanon Police Department became aware of the investigation on January 5, 2018; investigators spoke with the student and witnesses and gathered electronic evidence.&#34;, &#34;source&#34;: &#34;Associated Press&#34;, &#34;date&#34;: &#34;2018-08-20&#34;, &#34;text&#34;: &#34;Missouri teacher given suspended sentence for student affair / Former teacher pleads guilty to lesser charge in sex case\nAssociated Press, Aug 20, 2018\n\nLEBANON (AP) -- A 31-year-old Missouri teacher was given a suspended sentence in a case of sexual conduct with a student.\n\nOzarksfirst.com reports Elizabeth Morgan, a Lebanon High School drama teacher, was sentenced Monday to one year of suspended and two years of tracking probation with Child Protective Services.\n\nMorgan was arrested after police became aware in early January of an investigation into a relationship between her and a male high school student.\n\nMorgan was fired on Jan. 22.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 363, &#34;case_id&#34;: 277, &#34;case_name&#34;: &#34;Former teacher at The Broach School, a private school for students with learning disabilities and autism in Bradenton, FL (Manatee County). Age 30 at start of offenses (2018-2019 school year); 31 at arrest. Initiated a sexual relationship with A.R., a 15-year-old male ninth grader. Sent him provocative lingerie images (some exposing her body) via text and met him at G.T. Bray Park on multiple occasions for sex. Investigation began April 2019 after a complaint about flirtatious text messages.&#34;, &#34;source&#34;: &#34;WWSB/ABC7&#34;, &#34;date&#34;: &#34;2022-05-12&#34;, &#34;text&#34;: &#34;Former Bradenton teacher sentenced in child sex battery\nABC7 Staff, WWSB\nPublished: May 12, 2022\n\nBRADENTON, Fla. -- A former teacher from Bradenton entered a plea agreement, admitting she sexually abused a former student.\n\nKassandra Moore, a former teacher at The Broach School, was sentenced to 20 years in prison. Circuit Judge Frederick P. Mercurio also ordered two years of house arrest followed by eight years of sexual predator probation, as well as psychological evaluation.\n\nMoore pleaded guilty to four counts of sexual battery on a juvenile, stemming from her contact with a 15-year-old boy.\n\nThe student told another individual who informed a teacher. Detectives also discovered that Moore had sent the teen photos of herself in lingerie. Further investigation revealed that Moore had asked another colleague at the school to provide an alibi. That person refused. Police were able to use DNA from a contact to determine that the victim had been assaulted by Moore.\n\nMoore had asked for no prison time due to a series of mental illnesses. The judge also noted that eight years was the longest period of time that he could order Moore to be held on probation.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sexual-predator&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;dna-evidence&#34;, &#34;appeal&#34;, &#34;physical-evidence&#34;, &#34;evidence-tampering&#34;, &#34;private-school&#34;, &#34;special-needs-victim&#34;]}, {&#34;id&#34;: 364, &#34;case_id&#34;: 277, &#34;case_name&#34;: &#34;Former teacher at The Broach School, a private school for students with learning disabilities and autism in Bradenton, FL (Manatee County). Age 30 at start of offenses (2018-2019 school year); 31 at arrest. Initiated a sexual relationship with A.R., a 15-year-old male ninth grader. Sent him provocative lingerie images (some exposing her body) via text and met him at G.T. Bray Park on multiple occasions for sex. Investigation began April 2019 after a complaint about flirtatious text messages.&#34;, &#34;source&#34;: &#34;CBS12&#34;, &#34;date&#34;: &#34;2019-06-24&#34;, &#34;text&#34;: &#34;Florida teacher charged with having sex with teen\nBy Gary Detman, CBS12\nJune 24, 2019\n\nBRADENTON, Fla. -- A Florida teacher is accused of having sex with a 15-year-old student.\n\nBradenton Police arrested 31-year-old Kassandra Moore on four counts of lewd and lascivious behavior and one count of transmission of harmful material to a minor.\n\nThe investigation began in April when police received a complaint about some flirtatious text messages between Moore and the student at the Broach School. According to police, the boy said Moore sent him lewd images of her wearing lingerie. Some photos exposed parts of her body. The boy also said he met up with Moore on numerous occasions to have sex in a park, police said.\n\nOnce the investigation began, police said Moore tried to get another teacher to provide an alibi. Detectives said she also asked another student about the possibility of deleting texts and photos from someone else&#39;s locked cell phone.\n\nMoore no longer works at the school.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;evidence-tampering&#34;, &#34;private-school&#34;, &#34;special-needs-victim&#34;]}, {&#34;id&#34;: 365, &#34;case_id&#34;: 277, &#34;case_name&#34;: &#34;Former teacher at The Broach School, a private school for students with learning disabilities and autism in Bradenton, FL (Manatee County). Age 30 at start of offenses (2018-2019 school year); 31 at arrest. Initiated a sexual relationship with A.R., a 15-year-old male ninth grader. Sent him provocative lingerie images (some exposing her body) via text and met him at G.T. Bray Park on multiple occasions for sex. Investigation began April 2019 after a complaint about flirtatious text messages.&#34;, &#34;source&#34;: &#34;WWSB&#34;, &#34;date&#34;: &#34;2022-12-10&#34;, &#34;text&#34;: &#34;Sexual abuse victim suing Bradenton private school for negligence\nBy Jim DeLa, WWSB\nPublished: Dec. 10, 2022\n\nBRADENTON, Fla. -- A former student who was sexually abused by a teacher at a private school for special needs children in Bradenton is suing the school for negligence.\n\nThe now-18-year-old victim, identified in court documents only as A.R., was a ninth grader during the 2018-2019 school year at The Broach School when his teacher, Kassandra Moore, initiated a sexual relationship with him. Moore sent provocative images of herself to the victim and eventually had sex with him several times.\n\nThe then-15-year-old&#39;s version of events was substantiated through DNA evidence after investigators recovered a used condom from G.T. Bray Park and matched the genetic profile to Moore. The investigators also obtained video surveillance taken at the school, which showed Moore and the boy together in her car.\n\nMoore was placed on administrative leave after school administrators received the allegations. She was fired within days of police launching the investigation.\n\nMoore was eventually arrested, convicted and sentenced in May of this year to 20 years in state prison. During her sentencing hearings, psychological evaluations indicated Moore was bipolar and suffered from other conditions including mixed personality disorder, sexual dysfunction and post traumatic stress. Moore, 33, could have received a life sentence. In addition to the 20-year sentence, Circuit Judge Frederick Mercurio ordered two years of house arrest, and eight years of sexual predator probation after her release, now scheduled for 2042. Moore is appealing her conviction.\n\nThe victim stated in court that after the ordeal began, he spent a year and a half without leaving his bedroom and even attempted to take his own life. \&#34;Someone who sexually violates young children has no place working in the school system,\&#34; said the victim&#39;s attorney, Adam Horowitz. \&#34;Any school in which such a crime is committed should take responsibility if they fail to properly screen potential teachers and protect their students.\&#34;\n\nThe civil suit filed in Manatee County Circuit Court alleges the school, which serves students with learning disabilities and autism, should have known Moore was unfit to be a teacher. The suit alleges the school did not conduct proper background checks and ignored red-flag behavior.\n\nThe Broach School is owned by Children&#39;s Educational Services, which operates five other private schools in Florida.&#34;, &#34;tags&#34;: [&#34;civil-lawsuit&#34;, &#34;dna-evidence&#34;, &#34;appeal&#34;, &#34;physical-evidence&#34;, &#34;private-school&#34;, &#34;special-needs-victim&#34;]}, {&#34;id&#34;: 366, &#34;case_id&#34;: 279, &#34;case_name&#34;: &#34;Katie Marcus&#34;, &#34;source&#34;: &#34;AP / K2 Radio&#34;, &#34;date&#34;: &#34;2016-06-24&#34;, &#34;text&#34;: &#34;CODY, Wyo. (AP) \u2014 A former Douglas and Cody special education teacher has pleaded guilty to having sex with an underage student. In exchange for a potentially lighter sentence, Katie Marcus pleaded guilty on May 20 to third-degree sexual molestation of a minor. As part of a plea agreement, prosecutors will recommend she be placed on supervised probation for up to five years. After completing the probation the conviction could be wiped from her record. The judge must approve the plea agreement. According to court documents, Marcus approached a 17-year-old Douglas student in 2013. The two exchanged picture messages and eventually had sex. The teenager Snapchatted evidence of the intimate encounter to his friends. The Cody School Board accepted Marcus&#39;s resignation in September. She was arrested in August.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;prior-warning-ignored&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 367, &#34;case_id&#34;: 279, &#34;case_name&#34;: &#34;Katie Marcus&#34;, &#34;source&#34;: &#34;Casper Star-Tribune / TribLive&#34;, &#34;date&#34;: &#34;2015-08-26&#34;, &#34;text&#34;: &#34;Former Douglas special education teacher Katie Marcus was arrested in Cody Monday on a Converse County warrant without specifics on the underlying charges. Marcus, 34, was a special education teacher at Converse County School District #1 until July 2013. Her contract was terminated at that point but no reason for the termination was given. Marcus, a Gillette native whose maiden name is Marso, is married to Mike Marcus, a former teacher at Douglas Primary School. According to her Facebook page, Marcus was hired as a SPED teacher at Park County School District #6. The Park County Detention Center said Marcus was no longer in custody as of noon on Tuesday. The Converse County warrant said bail was set at $50,000.&#34;, &#34;tags&#34;: [&#34;prior-warning-ignored&#34;]}, {&#34;id&#34;: 368, &#34;case_id&#34;: 280, &#34;case_name&#34;: &#34;Lauren Harrington-Cooper&#34;, &#34;source&#34;: &#34;Citizens&#39; Voice (James Halpin)&#34;, &#34;date&#34;: &#34;2014-01-09&#34;, &#34;text&#34;: &#34;KINGSTON \u2013 The Wyoming Valley West High School teacher charged last month with having sex with a student was hit with new charges Thursday alleging she sent explicit text messages and performed oral sex on a second boy. Lauren Harrington-Cooper, 31, of 377 Winola Ave., Kingston, is accused of having sexual encounters in parked cars with a 17-year-old boy, and for the first time the charges allege misconduct that took place at school. In an incident last fall, the student asked Harrington-Cooper, an English teacher and hall monitor, for a piece of candy, police said. &#39;All the candy you need is right here,&#39; she replied, court documents allege. Harrington-Cooper, who was charged with institutional sexual assault last month for allegedly having sex with an 18-year-old student, was arrested Thursday on new counts of sexual contact with a student and corruption of minors. The second alleged victim was discovered during the investigation of the first case, Luzerne County Detective Chaz Balogh said. Authorities are unsure if there are more victims. The charges filed Thursday allege Harrington-Cooper&#39;s relationship with the 17-year-old began after she told a girl student she thought the boy was good-looking. The boy later left a note with his cellphone number and a heart on it on Harrington-Cooper&#39;s desk. Harrington-Cooper texted him trying to identify whose number it was. Once the boy identified himself, Harrington-Cooper began sending sexually explicit emails talking about having sex with the boy and asking him not to tell anyone so she wouldn&#39;t get in trouble. After about two weeks of texting, they arranged to meet and the boy picked Harrington-Cooper up from her home. One weekend in November, Harrington-Cooper contacted the boy at about 2:30 a.m. and arranged to meet him. They drove to the McDonald&#39;s in Edwardsville and
