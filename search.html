 be a repeat offender and she is sorry. He said he didn&#39;t have to send her to prison but felt he needed to, but now she has served her time.\n\nProsecutor David Fornshell said the judge focused too much on the recidivism factor, which was an incorrect analysis because she can&#39;t teach anymore or have control over students.\n\n\&#34;Really the focus here, and where I think the court was misguided was on its focus on recidivism as opposed to the seriousness of what she had done, what laws she had broken. From my perspective, when you commit 16 felonies of the third degree against five different victims, I don&#39;t think one year in prison is sufficient punishment.\&#34;\n\nSchuler will be on probation for five years and was ordered to get drug, alcohol and sex offender counseling. She is not allowed to profit from the sensational story while on probation and she must register as a sex offender.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;sex-offender-registration&#34;, &#34;alcohol&#34;, &#34;early-release&#34;, &#34;group-sex&#34;]}, {&#34;id&#34;: 264, &#34;case_id&#34;: 217, &#34;case_name&#34;: &#34;Tiffany Eichler&#34;, &#34;source&#34;: &#34;Canton Repository (Ed Balint)&#34;, &#34;date&#34;: &#34;2018-06-19&#34;, &#34;text&#34;: &#34;Former McKinley teacher sentenced on sex charges\n\nCANTON \u2014 Tiffany Eichler stood in front of a judge, her face visibly distressed as she awaited her fate.\n\nIn a frail voice, the 36-year-old former McKinley High School teacher apologized for having sexual relationships with three male students and to the teaching profession, school district and the victims \&#34;for putting everyone in this position.\&#34;\n\nHer attorney, Brad Iams, addressed Stark County Common Pleas Judge John Haas, pleading for leniency and predicting she would not re-offend since she&#39;ll never again be in a teaching position.\n\nStark County Assistant Prosecutor Christy Donnelly asked for prison time, citing concern the defendant \&#34;has not fully held herself accountable for her actions.\&#34; She specified a term of four years.\n\nThe judge heard the emotionally-charged sentiments of the mother of one of the victims, who branded Eichler a \&#34;professional predator\&#34; for manipulating her son.\n\nEichler avoided prison. Haas sentenced her to 30 days in jail and 30 half-days in a non-jail reporting program. The sentence also includes three years of probation and other conditions: counseling, 300 hours of community service, a $1,000 fine, and paying counseling costs for victims. Eichler was immediately taken into custody. Haas warned he is reserving 60 months in prison if she violates probation terms.\n\nHaas required Eichler to write an essay on the wrongfulness of her actions and said he may share it with schools.\n\nEichler pleaded guilty last month to three counts of sexual battery. The sexual encounters occurred between Feb. 20 and Feb. 24, 2018. Prosecutors said Eichler engaged in sexual conduct with two 18-year-old students and one 17-year-old student. Snapchat was the primary communication platform; the sentence bars her from using it.\n\nDonnelly noted that Eichler told a counselor \&#34;the students at her school always approached her for sex and that she never initiated sexual activity with them\&#34; and that she \&#34;felt pressured into it.\&#34; Donnelly countered that Eichler drove to one victim&#39;s home to pick him up, drove from New Franklin to Canton at 2:30 a.m. for a second encounter, and called a separate student to her locked classroom during non-school hours.\n\nDonnelly also wrote in the sentencing document: \&#34;(The prosecutor&#39;s office) has always been concerned that the sentencing in this case would be considered differently because the defendant is a female teacher with male student victims, and that there would be a level of sympathy given to this defendant which would not have been given if the genders of the parties were reversed.\&#34;\n\nEichler has already lost her teaching license and will have to register as a sex offender for the rest of her life.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;female-defendant&#34;, &#34;victim-blaming&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;, &#34;entry&#34;, &#34;tag&#34;, &#34;265&#34;]}, {&#34;id&#34;: 265, &#34;case_id&#34;: 217, &#34;case_name&#34;: &#34;Tiffany Eichler&#34;, &#34;source&#34;: &#34;People Magazine (Steve Helling)&#34;, &#34;date&#34;: &#34;2018-05-17&#34;, &#34;text&#34;: &#34;Ohio Gym Teacher Had Sexual Encounters with Three Male Students\n\nA former high school physical education teacher in Ohio pleaded guilty to three counts of felony sexual battery on Wednesday after having sexual contact with three of her teenage students.\n\nTiffany M. Eichler, 36, faces up to three years in prison for each count.\n\nProsecutors said that Eichler was teaching at Canton McKinley High School when she engaged in sexual contact with one 17-year-old student and two 18-year-old students. The encounters all happened in February.\n\nUnder Ohio law, teachers and coaches are prohibited from having sexual contact with any student, even if the student is over the age of consent.\n\nAccording to the police report, detectives received a tip that Eichler had inappropriate relationships with students. When they interviewed her on March 9, she admitted to having sex with several students. She allegedly admitted to having sex with the same student in her car, and then later that evening at his house.\n\nAfter her police interview, Eichler was placed on unpaid leave by the school district. She resigned from her job on March 30.\n\nEichler appeared in court with her attorney, Brad Iams. She admitted to the charges against her and waived her right to a trial. The judge has ordered a pre-sentencing investigation. Eichler does not have a prior criminal record.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;plea&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 266, &#34;case_id&#34;: 218, &#34;case_name&#34;: &#34;Marie-Jo Gordo&#34;, &#34;source&#34;: &#34;Inside Edition Digital&#34;, &#34;date&#34;: &#34;2024-01-11&#34;, &#34;text&#34;: &#34;Florida Teacher Faces Child Porn Charges After Filming 28 Sex Videos With Her Former 8th Grade Student: FBI\n\nMarie-Jo Gordo, 29, is facing three counts of sexually exploiting a minor after allegedly filming videos of herself and a former eighth-grade student, according to an indictment obtained by Inside Edition Digital.\n\nA forensic evaluation of the student&#39;s phone by the Orange County Sheriff&#39;s Office discovered \&#34;approximately 28 videos\&#34; of Gordo and the victim \&#34;engaged in sexual activity,\&#34; according to a complaint filed in October that was unsealed this week.\n\nAn FBI Task Force Officer states there is probable cause to believe Gordo produced child pornography, possessed child pornography, received and distributed child pornography, and coerced and enticed a minor to engage in sexual activity.\n\nAuthorities learned about the alleged relationship in September, when the student&#39;s mother reported to the OCSO that her son, who had yet to reach the age of 18, was having a relationship with his former teacher. The mother consented to a search of her son&#39;s iPhone 14.\n\nThe FBI task force officer detailed three of the videos: a 13-minute video depicting mutual oral and penile/vaginal sexual activity; a 4-minute video of Gordo performing oral sex on the student and penile/vaginal activity; and a 4-minute video depicting digital penetration, the student performing oral sex on Gordo, and penile/vaginal activity.\n\nA detective with the Seminole County Sheriff&#39;s Office Crimes Against Children task force spoke with the student, who said he and Gordo had been in a relationship between June and September 2023, engaged in sexual activity at various hotels and Gordo&#39;s car, and that in 2019 Gordo was both his eighth-grade teacher and his religious ambassador.\n\nGordo resigned from the charter school in June 2023. The FBI noted she had since taken a job as an art teacher at another school. The teacher entered a plea of not guilty via a signed waiver ahead of her next hearing on Jan. 18. She had been out on bond following her arrest in October.&#34;, &#34;tags&#34;: [&#34;explicit-photos&#34;, &#34;csam-distribution&#34;, &#34;fbi&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 267, &#34;case_id&#34;: 218, &#34;case_name&#34;: &#34;Marie-Jo Gordo&#34;, &#34;source&#34;: &#34;Judgment in a Criminal Case (USDC M.D. Fla.)&#34;, &#34;date&#34;: &#34;2025-06-13&#34;, &#34;text&#34;: &#34;US v. Marie-Jo Gordo, Case 6:24-cr-3-PGB-NWH. Judgment filed 06/17/2025.\n\nDefendant pleaded guilty to Count One of the Superseding Information: Distribution of Child Pornography (18 U.S.C. \u00a72252(a)(2) and (b)(1)), offense concluded September 22, 2023. Original indictment Counts One, Two, and Three dismissed on motion of the United States.\n\nSentence imposed June 13, 2025, by U.S. District Judge Paul G. Byron:\n- 60 months imprisonment; surrender to Bureau of Prisons by 2:00 PM on July 14, 2025\n- Court recommends placement near Central Florida, mental health counseling, RDAP participation\n- 5 years supervised release\n- $100 special assessment; fine waived; no restitution ordered\n- Asset forfeiture as previously ordered (Doc. 107)\n\nAdditional conditions of supervised release include: sex offender registration (SORNA/F.S. 943.0435); no direct contact with minors under 18 without probation officer approval; no access to computer/internet/smartphone without probation officer approval; mental health program specializing in sex offender treatment; polygraph testing; no child nudity/sexual material.\n\nDefense counsel: Richard Randall Kuritz and William Charles Fletcher (both Jacksonville, FL, retained).&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;federal&#34;]}, {&#34;id&#34;: 268, &#34;case_id&#34;: 219, &#34;case_name&#34;: &#34;Melissa Bonkoski&#34;, &#34;source&#34;: &#34;PhillyVoice (Michael Tanenbaum)&#34;, &#34;date&#34;: &#34;2017-08-29&#34;, &#34;text&#34;: &#34;Former Philly teacher, out on bail, re-arrested in sex assault probe\n\nMelissa Bonkoski, 38, of Pottstown, had been charged Aug. 16 with multiple felonies for her alleged involvement with a male student at Owen J. Roberts High School in South Coventry Township, where she was in her second year teaching Earth science.\n\nInvestigators detailed a secretive intrigue in which Bonkoski allegedly purchased a \&#34;burner\&#34; phone exclusively to interact with the victim, a former student who she had offered to give rides home from work. The victim came forward to police after he became upset he had cheated on his girlfriend, who notified authorities upon discovering suspicious text messages.\n\nThe initial charges contained uncertainty over whether the relationship had progressed beyond kissing and touching. Bonkoski told detectives she had sex with the victim during a second interview on Aug. 11, but the victim only acknowledged he had slept in his former teacher&#39;s bed.\n\nOn Tuesday, prosecutors announced her re-arrest in light of an alleged confirmation from the victim that the two had sex for the first time in December 2016.\n\nBonkoski allegedly became obsessed with her former student. When sexual contact stopped in January 2017, texts discovered by the victim&#39;s girlfriend revealed the teacher&#39;s apparent desperation: \&#34;I was kinda hoping you would have called me back last night. I really needed to talk.\&#34; (5:53 a.m., March 3.) Weeks later: \&#34;Whatever you do, please don&#39;t shut me out. Not now. I&#39;m begging you.\&#34;\n\nBonkoski allegedly admitted she began to \&#34;bombard\&#34; the victim with memories after he cut off contact. She said she believed her decision to get a burner phone was \&#34;smart\&#34; and that she thought the communication couldn&#39;t be traced to her.\n\nShe is charged with institutional sexual assault, unlawful contact with a minor, unlawful use of a communications facility, and corruption of minors.\n\n\&#34;Rule No. 1 if you are a teacher or a coach: Do not have sex with a student. Breaking this rule is a one-way ticket to arrest, losing your job, and prison,\&#34; Chester County District Attorney Tom Hogan said.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;surveillance&#34;, &#34;emotional-manipulation&#34;, &#34;female-defendant&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;, &#34;entry&#34;, &#34;tag&#34;, &#34;269&#34;]}, {&#34;id&#34;: 269, &#34;case_id&#34;: 219, &#34;case_name&#34;: &#34;Melissa Bonkoski&#34;, &#34;source&#34;: &#34;NBC Philadelphia&#34;, &#34;date&#34;: &#34;2018-02-27&#34;, &#34;text&#34;: &#34;Ex-Teacher Pleads Guilty to Sex with Student\n\nA former Pennsylvania high school teacher has pleaded guilty to having sex with a 16-year-old student.\n\nInvestigators say 38-year-old Melissa Bonkoski started communicating outside of class with a male student who was in her science class during his freshman year. They allege she kissed him multiple times in her car and assaulted him at her home in 2016. An investigation began when the victim&#39;s girlfriend discovered texts from Bonkoski.\n\nBonkoski was a teacher and coach at Owen J. Roberts High School in Pottstown.\n\nBonkoski pleaded guilty Monday to charges of institutional sexual assault, unlawful contact with a minor and corruption of minors. She remains free on bail pending sentencing.&#34;, &#34;tags&#34;: [&#34;plea&#34;]}, {&#34;id&#34;: 270, &#34;case_id&#34;: 220, &#34;case_name&#34;: &#34;Katie Rufener&#34;, &#34;source&#34;: &#34;WFMJ / 21 News&#34;, &#34;date&#34;: &#34;2016-03-09&#34;, &#34;text&#34;: &#34;Southern Local teacher convicted after affair with former student\n\nAn East Liverpool woman on paid leave from her job as a science teacher at Southern Local Schools has been found guilty of reduced charges stemming from an alleged sexual affair she had with one of her students from a previous teaching job.\n\nA judge in Kansas found Katie Rufener guilty of three counts of simple battery after she pleaded no contest on Wednesday.\n\nDistrict Judge Robert Frederick sentenced Rufener to 180 days in jail on each count, but suspended the sentence and placed her on non-reporting probation for one year.\n\nConditions of the probation include obeying the laws in any state and not having contact with the victim.\n\nRufener was originally charged with having unlawful relations with one of her 18-year-old high school students on three separate occasions when she was a teacher in Holcomb, Kansas last spring.\n\nAlthough investigators say that the alleged sexual relations between Rufener and the student were consensual, courts have upheld a Kansas law making it illegal for a teacher to have a sexual relationship with a student, even if that student is an adult.\n\nWhen the allegations first surfaced last year, Southern Local School Superintendent John Wilson said Rufener&#39;s future as an employee at Southern Local depends on the outcome of the investigation in Kansas. She was placed on administrative leave from Southern Local on October 1st.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;female-defendant&#34;, &#34;adult-victim&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;, &#34;entry&#34;, &#34;tag&#34;, &#34;271&#34;]}, {&#34;id&#34;: 271, &#34;case_id&#34;: 220, &#34;case_name&#34;: &#34;Katie Rufener&#34;, &#34;source&#34;: &#34;Salineville News / Garden City Telegraph&#34;, &#34;date&#34;: &#34;2015-10-07&#34;, &#34;text&#34;: &#34;Teacher faces charges for having sexual relations with student\n\nA Southern Local teacher has been placed on administrative leave as she faces charges of having sexual relations with a Kansas high school student.\n\nKatie Rufener, 26, of East Liverpool has been charged with three counts of unlawful sexual relations with a student older than 16. All three counts are felonies under Kansas law which can result in a prison sentence of 31 to 102 months if convicted.\n\nRufener was arrested after voluntarily returning to Garden City and appeared in Finney County District Court. She was released on a recognizance bond.\n\nShe is accused of having consensual relations with a then-18-year-old male student during her tenure at Holcomb High School, where she served as a science teacher, head cheerleading coach and an assistant dance team coach. Three separate instances occurred at her Garden City residence on March 19 and 20, and April 10. Parents contacted the sheriff&#39;s office about the matter on June 18, nearly a month after the school year ended.\n\nRufener taught at the high school from 2012 until this past spring, when she resigned from her teaching position in March and from her coaching positions in April.\n\nFinney County Attorney Susan Richmeier stated a possibility that a prison term, if convicted, would be underlying and the defendant would receive supervised probation based on Rufener&#39;s criminal history.&#34;, &#34;tags&#34;: [&#34;female-defendant&#34;, &#34;adult-victim&#34;]}, {&#34;id&#34;: 272, &#34;case_id&#34;: 221, &#34;case_name&#34;: &#34;Stephanie Amato&#34;, &#34;source&#34;: &#34;Philadelphia Inquirer (Joseph A. Slobodzian)&#34;, &#34;date&#34;: &#34;2017-05-02&#34;, &#34;text&#34;: &#34;Philly special-ed teacher gets prison, sex-offender status for relationship with boy, 14\n\nShe graduated magna cum laude from Temple University with a degree in education, earned her master&#39;s degree from Cabrini University with a 4.0 grade point average, and worked for six years as a special education teacher in the Philadelphia School District.\n\nBut on Tuesday, Stephanie Amato left a Philadelphia courtroom with an 11\u00bd-to-23-month prison sentence and the label of sex offender after pleading guilty to a sexual relationship with a 14-year-old student.\n\nAmato, 33, who sat holding rosary beads before the hearing, tearfully apologized to her family and to the Ethan Allen Elementary student for hurting them, adding, \&#34;I truly feel that I do not believe this would have occurred if it were not for drugs.\&#34;\n\nDefense attorney Trevan Borum told Common Pleas Court Judge Jeffrey P. Minehart that Amato began \&#34;recreational use\&#34; of prescription opioid narcotics in 2010 and that by the time of her arrest in June 2014 she was snorting heroin every day. Borum said Amato underwent inpatient drug treatment in 2013 and 2014 and relapsed both times. Borum asked for probation, noting it was her first offense, she was sober, and she was the single mother of a 7-month-old son.\n\nAssistant District Attorney Kelly Harrell argued for a state prison sentence of five to 10 years, saying Amato picked the boy because \&#34;she thought she would never get caught doing this.\&#34; Harrell said Amato had vaginal and oral sex with the boy over a period of months, including at her parents&#39; home in the Northeast, in her car, and in a park. Even when under investigation by school officials, Amato kept in contact with the boy and warned him, \&#34;You know I can get arrested if you tell.\&#34; DNA testing of Amato&#39;s parents&#39; sofa and her car seats proved the sexual relationship.\n\nMinehart said he could not understand how someone with Amato&#39;s family and education could have done such a thing. \&#34;I know drugs were involved, and that affects everything, but I understand that it&#39;s not controlling of this behavior.\&#34;\n\nThe judge gave a county prison sentence (rather than state) because it was her first offense and he had received 33 letters of support. In addition to prison, Minehart put Amato on 10 years of reporting probation and ordered no contact with juveniles. As a sex offender, Amato must register her address for life and report in person four times a year.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;dna-evidence&#34;, &#34;drugs&#34;, &#34;special-needs-victim&#34;, &#34;female-defendant&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;, &#34;entry&#34;, &#34;tag&#34;, &#34;concealment&#34;, &#34;273&#34;]}, {&#34;id&#34;: 273, &#34;case_id&#34;: 221, &#34;case_name&#34;: &#34;Stephanie Amato&#34;, &#34;source&#34;: &#34;CBS Philadelphia&#34;, &#34;date&#34;: &#34;2014-06-05&#34;, &#34;text&#34;: &#34;Special Education Teacher Accused Of Sex With Student Released On Bail\n\nStephanie Amato, 30, has been charged with Involuntary Deviate Sexual Intercourse, Statutory Sexual Assault, Unlawful Contact with a Minor, Interference with Custody of Children, Endangering the Welfare of a Child, Corruption of a Minor, Indecent Assault and Indecent Exposure.\n\nAmato is accused of having a sexual relationship with her 14-year-old male student at Ethan Allen Elementary School in Mayfair, a special education teacher. She turned herself in to police Wednesday morning and was released on $125,000 bail. An ongoing sexual relationship with the student allegedly occurred between March and April 2014, in her car and her home.\n\n\&#34;It has been an ongoing investigation. The time when the allegations came in, that triggered the removal of the teacher from the building,\&#34; Philadelphia School District spokesperson Fernando Gallard said. The school sent a letter to parents alerting them about Amato&#39;s arrest. Amato will be suspended without pay.&#34;, &#34;tags&#34;: [&#34;special-needs-victim&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 274, &#34;case_id&#34;: 222, &#34;case_name&#34;: &#34;Lisa Kelly&#34;, &#34;source&#34;: &#34;KDKA / CBS Pittsburgh&#34;, &#34;date&#34;: &#34;2017-03-08&#34;, &#34;text&#34;: &#34;Former Job Coach Accused Of Raping Man Who Is Mentally Challenged\n\nLisa Kelly, 53, was arrested Wednesday afternoon and had no comment while on her way to the Allegheny County Jail.\n\n\&#34;She did admit to having a relationship with the individual,\&#34; said Bethel Park Police Det. Joelle Dixon.\n\nThe victim is a 24-year-old man with an IQ of 48 and the mental capacity of a 5- to 8-year-old child. Kelly was a job coach with the Allegheny Intermediate Unit Lifehouse during the 2013-14 school year.\n\nThe AIU released a statement: \&#34;When the AIU became aware of the alleged inappropriate and unprofessional communication between Ms. Kelly and the former student, the agency took swift and immediate action to investigate the matter. While the AIU was in the process of completing its investigation, Ms. Kelly abruptly resigned on February 4, 2014.\&#34;\n\nOfficials say Kelly then began working at South Hills Village, as did the victim. \&#34;The father became aware after speaking with his son because he had some concerns,\&#34; said Det. Dixon. \&#34;He became aware of a possible relationship between the two and he confronted his son and obtained some information, and then came forward to us.\&#34;\n\nKelly told KDKA she had no sexual relationship with the victim; however, police say she told them that she did, calling it a \&#34;weird friendship.\&#34; According to investigators, Kelly said the two allegedly had sex in a storage room in the South Hills Village mall more than 12 times for about a year.\n\nKelly is charged with the rape of a man who does not have the capacity to make informed decisions about engaging in sexual interactions.&#34;, &#34;tags&#34;: [&#34;behavioral-health&#34;, &#34;charge-reduction&#34;, &#34;special-needs-victim&#34;, &#34;female-defendant&#34;, &#34;adult-victim&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;]}, {&#34;id&#34;: 275, &#34;case_id&#34;: 223, &#34;case_name&#34;: &#34;Christine Towers&#34;, &#34;source&#34;: &#34;Philadelphia Inquirer (Michaelle Bond)&#34;, &#34;date&#34;: &#34;2017-03-06&#34;, &#34;text&#34;: &#34;Ex-aide at Conestoga High School gets jail time for sex with student\n\nA former teacher&#39;s aide and coach at Conestoga High School in Tredyffrin Township was sentenced to 11 to 23 months in jail Monday for a sexual relationship with a 16-year-old student she tutored privately.\n\nChristine Marie Towers, 26, of Phoenixville, pleaded guilty to institutional sexual assault and corruption of minors at the Chester County Justice Center in West Chester and left in handcuffs. She will be on probation for five years after her release from jail and must also register as a sex offender.\n\nThrough tears, the boy, his mother, and his grandmother told County Court Judge Patrick Carmody of the \&#34;devastation\&#34; Towers caused their family. The boy, who said he has learning disabilities, told Carmody that he did not understand the direction the relationship was headed and was \&#34;mostly just confused.\&#34; \&#34;She made me think I was her everything and she would go crazy if I left her. I cooperated with the detectives because I saw it as a way out.\&#34;\n\nAfter word of their relationship got out, classmates mocked the boy in the hallways. He quit playing basketball in part because opposing players jeered \&#34;teacher&#39;s pet\&#34; at him. He is seeing a therapist.\n\nCarmody explicitly addressed the gender double standard: \&#34;If you were a male and it was a 16-year-old female, people would be outraged and screaming for blood.\&#34; Calling the situation \&#34;sad on both ends,\&#34; he told Towers, \&#34;You threw a lot away here and made a lot of wrong decisions that resulted in someone being traumatized.\&#34;\n\nTowers worked as a paraeducator and coach in the Tredyffrin/Easttown School District from August 2014 until April 2016, coaching girls&#39; soccer, basketball, softball, and track. She began tutoring the student last year in math and other subjects. Their relationship turned sexual when Towers kissed him on March 17, 2016. Over about a month she took him out to eat, to the mall, and on trips to Philadelphia; they had sex four times.\n\nProsecutor Emily Provencher and defense attorney Vincent P. DiFabio reached the plea agreement. DiFabio said his client accepted full responsibility.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;special-needs-victim&#34;, &#34;female-defendant&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;]}, {&#34;id&#34;: 276, &#34;case_id&#34;: 224, &#34;case_name&#34;: &#34;Nikki Varney&#34;, &#34;source&#34;: &#34;Altoona Mirror (Kay Stephens)&#34;, &#34;date&#34;: &#34;2018-03-10&#34;, &#34;text&#34;: &#34;Former teacher takes plea deal \u2014 Varney sentenced to house arrest, probation for having sex with male student\n\nA former Williamsburg Community High School teacher who had sex twice last summer with a 15-year-old male student pleaded guilty Friday to a charge of institutional sexual assault.\n\nNikki Varney, 45, Hollidaysburg, rendered the plea in Blair County Court in exchange for a recommended house arrest sentence of nine to 23 months, followed by two years&#39; probation. Judge Wade Kagarise directed the Blair County Adult Parole and Probation Department to supervise the house arrest sentence. No electronic monitoring device was requested as part of the plea.\n\nDistrict Attorney Richard Consiglio said he agreed to the house arrest sentence only because the student&#39;s family supported it. \&#34;The family wanted this because she has two children at home and they didn&#39;t want her separated from them.\&#34;\n\nVarney, accompanied to court by her husband, David, was represented by Altoona attorney Brian Grabill. Grabill advised the judge that his client, when confronted by investigating police officers, admitted to and took responsibility for her actions. \&#34;She recognizes that what happened was inappropriate. \u2026 She has been remorseful.\&#34;\n\nState police at Hollidaysburg began investigating in late August after being contacted by school officials who learned of the incidents from the male student. Police said the pair had sex at two locations in July \u2014 once at Varney&#39;s residence and another time at Canoe Creek State Park.\n\nVarney had been a teacher for 20 years; she&#39;s likely to lose her pension because of the conviction. At Consiglio&#39;s request, Kagarise ordered a state Sexual Offenders Assessment Board evaluation; Consiglio stated he intends to seek Megan&#39;s Law registration requirements after reviewing the assessment.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;no-prison&#34;, &#34;female-defendant&#34;, &#34;home-confinement&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;]}, {&#34;id&#34;: 277, &#34;case_id&#34;: 225, &#34;case_name&#34;: &#34;Megan Batykefer&#34;, &#34;source&#34;: &#34;Reuters (Elizabeth Daley)&#34;, &#34;date&#34;: &#34;2015-08-13&#34;, &#34;text&#34;: &#34;Coach convicted under Pennsylvania law against sex with students of any age\n\nA high school rowing coach was found guilty on Thursday of sexual assault for her consensual relationship with an 18-year-old pupil under a Pennsylvania law prohibiting sex between teachers and students of any age.\n\nMegan Batykefer, 31, who coached at North Allegheny Senior High School in the Pittsburgh suburb of Wexford, could face up to seven years behind bars at sentencing on Nov. 10 at Allegheny County Court of Common Pleas.\n\nThe age of consent for sex is 16 in Pennsylvania, but a 2012 law allows felony charges of institutional sexual assault to be filed against teachers who have sex with students of any age.\n\nAfter his 18th birthday in April 2014, the boy told Batykefer, who had been coaching him since 2012, about his feelings for her and they began a sexual relationship. The boy \&#34;realized that it would&#39;ve been inappropriate for him to be involved romantically with her when he was less than 18 years of age so he waited to let her know how he felt.\&#34; The relationship was consensual and took place before and after he graduated in June 2014.\n\nBatykefer&#39;s lawyer argued the Pennsylvania law was overly broad and unconstitutional. Judge Edward Borkowski convicted her after ruling: \&#34;There is no constitutional protection for school employees to engage in sexual relations with their students... While the victim acknowledges that it was a consensual sexual relationship, the purpose of the statute is to protect students from such undue and coercive influence.\&#34;&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;sentenced&#34;, &#34;appeal&#34;, &#34;female-defendant&#34;, &#34;adult-victim&#34;, &#34;novel-statute&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;, &#34;entry&#34;, &#34;tag&#34;, &#34;278&#34;]}, {&#34;id&#34;: 278, &#34;case_id&#34;: 225, &#34;case_name&#34;: &#34;Megan Batykefer&#34;, &#34;source&#34;: &#34;KDKA / CBS Pittsburgh&#34;, &#34;date&#34;: &#34;2015-11-10&#34;, &#34;text&#34;: &#34;Former H.S. Rowing Coach Sentenced In Student Sex Case\n\nMegan Batykefer, 31, the former rowing coach at North Allegheny High School, arrived at court early Tuesday to learn her fate. She was accompanied by her father who asked the judge not to send her to jail so that she could be treated for mental illness.\n\nJudge Ed Borkowski told Batykefer: \&#34;You cannot do this and not expect to go to jail.\&#34; He sentenced her to eight to 23 months in jail. However, he is allowing her to remain out on bond while her lawyer challenges the constitutionality of the institutional sexual assault law to Superior Court.\n\nThe defense contended that although they met through the male student&#39;s participation on the rowing team while he was 17, their sexual relationship didn&#39;t begin till he turned 18. The defense, like that in Plum teacher Jason Cooper&#39;s case, argues the law is vague and that the teenaged victim was 18 and a consenting adult.\n\nThe judge&#39;s view: the law \&#34;puts the responsibility on the shoulders of the person, who by maturity and professional position, is responsible for avoiding such activity.\&#34; \&#34;The law is in place to make sure those affiliated with schools teach and guide students, not court them.\&#34;\n\nThe appeal to challenge the law goes to Superior Court; it is not certain how long the appeal process could take before she begins to serve her sentence.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;appeal&#34;, &#34;novel-statute&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;]}, {&#34;id&#34;: 279, &#34;case_id&#34;: 226, &#34;case_name&#34;: &#34;Keri Ann Brekne&#34;, &#34;source&#34;: &#34;lehighvalleylive.com (Steve Novak)&#34;, &#34;date&#34;: &#34;2015-11-20&#34;, &#34;text&#34;: &#34;Lopatcong teacher&#39;s sex assault case revived in ex-student&#39;s lawsuit\n\nA former Lopatcong Middle School student&#39;s lawsuit against the teacher who sexually assaulted her in 2007 and 2008 is back in state court, alleging district officials ignored reports that could have prevented it.\n\nKeri Ann Brekne pleaded guilty in 2009 to five counts of aggravated indecent sexual assault and is serving a prison sentence of up to 30 years in Pennsylvania, a term that includes her sentence out of New Jersey. The crimes took place in Lopatcong and at Brekne&#39;s Bethlehem home.\n\nBrekne, now 36, was believed to be a friend of the victim&#39;s family and would drive the student places, even after family and staff told her not to, and spent the night at the family&#39;s home on occasion. At various times, Brekne&#39;s colleagues told her that her relationship with students in general was too casual and advised her to be more professional.\n\nEventually, the victim&#39;s parents found a cell phone Brekne had bought for the girl, then in eighth grade, with text messages between the two.\n\nThe 119-page lawsuit names Brekne, the Lopatcong Township School District, school board, middle school and 10 current and former teachers and administrators, seeking at least $75,000 in damages. Federal counts were partially dismissed in July 2015; the state-level action was revived November 2015.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;prior-warning-ignored&#34;, &#34;female-victim&#34;, &#34;surveillance&#34;, &#34;gifts&#34;, &#34;emotional-manipulation&#34;, &#34;/home/mike/sw/sacs/.venv/bin/python&#34;, &#34;/home/mike/sw/sacs/sacs.py&#34;, &#34;render&#34;, &#34;entry&#34;, &#34;tag&#34;, &#34;280&#34;]}, {&#34;id&#34;: 280, &#34;case_id&#34;: 226, &#34;case_name&#34;: &#34;Keri Ann Brekne&#34;, &#34;source&#34;: &#34;The Star-Ledger (Michael Rispoli)&#34;, &#34;date&#34;: &#34;2009-04-18&#34;, &#34;text&#34;: &#34;Judge rejects Warren County teacher&#39;s sexual assault guilty plea\n\nSaying he felt \&#34;bushwhacked\&#34; by prosecution statements he had never before heard, a Superior Court judge who was ready to sentence a Warren County middle school teacher for molesting one of her female students rejected the teacher&#39;s guilty plea Friday and remanded the case to trial.\n\nAfter nearly an hour of statements from the student, her mother and the assistant prosecutor \u2014 including sexually explicit text messages Keri Ann Brekne allegedly sent the girl \u2014 Judge John Pursel said he needed a 10-minute recess. \&#34;I&#39;m getting kind of bushwhacked here.\&#34;\n\nPursel rejected the plea, saying sexual assault cases are difficult and that more information was needed before sentencing. He told a stunned courtroom: \&#34;I&#39;m not going to act as the goat in the case.\&#34;\n\nA throng of supporters for the student had been hoping for a 10-year sentence consecutive to the 15-to-30-year sentence Brekne received in Pennsylvania for sexually assaulting the same girl at the teacher&#39;s home.\n\nDefense lawyer Scott Wilhelm had called for a NJ sentence concurrent with the Pennsylvania sentence. \&#34;I blame the state for laying it on too thick,\&#34; Wilhelm said afterward.\n\nBrekne, 29, sexually assaulted the girl between June 2007 and January 2008, when the girl was 13 and 14. The girl&#39;s statement described how Brekne systematically befriended her, showering her with gifts, discouraging her from liking boys or hanging out with friends, telling her she \&#34;owned\&#34; her, gave her a wedding-style ring and a secret cell phone, and helped the girl sneak out of her home in the middle of the night. What started as a friendship with a social studies teacher seen as \&#34;cool\&#34; became an obsession that involved unwanted kissing, touching, and then sexual assault.\n\nNorthampton County Judge F.P. Kimberly McFadden had called it the most heinous case she had seen in two decades on the bench and told Brekne: \&#34;You are dangerous.\&#34;&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;appeal&#34;, &#34;female-victim&#34;, &#34;emotional-manipulation&#34;, &#34;novel-statute&#34;]}, {&#34;id&#34;: 281, &#34;case_id&#34;: 227, &#34;case_name&#34;: &#34;Cheryl B. Bremble&#34;, &#34;source&#34;: &#34;Montgomery County Record / Patch&#34;, &#34;date&#34;: &#34;2013-10-01&#34;, &#34;text&#34;: &#34;Ex-teacher sentenced to jail for sexually explicit conversations with student (Margaret Gibbons, Oct 1 2013): Cheryl B. Bremble, 43, former learning support teacher at Upper Dublin High School, sentenced to 30 days to 23 months in Montgomery County prison, served on 15 consecutive weekends. Five years probation following parole. Judge William J. Furber Jr. presiding. Deputy DA Samantha L.R. Cauffman prosecuted; defense attorney Douglas Dolfman. Bremble pleaded guilty in May 2013 to corruption of a minor and dissemination of obscene and other sexual materials to a minor. Original charges at June 2011 arrest: endangering welfare of child, corruption of minors, unlawful contact with a minor, obscene and other sexual materials, criminal use of communication facility, harassment. Victim: female high school student who had developed special bond with Bremble. Bremble took victim shopping, bought expensive clothing, gave victim a vibrator on school property during school hours, sent explicit texts encouraging use of device, disclosed her bisexuality to victim, commented on victim&#39;s body. Bremble admitted conduct to detectives. At sentencing, judge expressed doubt Bremble accepted full responsibility \u2014 she attempted to attribute some texts to her boyfriend. Bremble cited thyroid cancer treatment, divorce, controlling boyfriend, heavy drinking as context; sober since arrest and attending AA.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sexting&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;gifts&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 282, &#34;case_id&#34;: 42, &#34;case_name&#34;: &#34;Alyson Cranick&#34;, &#34;source&#34;: &#34;U.S. Attorney&#39;s Office, District of Connecticut&#34;, &#34;date&#34;: &#34;2026-03-12&#34;, &#34;text&#34;: &#34;David X. Sullivan, United States Attorney for the District of Connecticut, announced that ALYSON CRANICK, 44, of Columbia, was sentenced today by U.S. District Judge Kari A. Dooley in Bridgeport to 240 months of imprisonment and 10 years of supervised release for coercing a minor boy to engage in sexual activity.\n\nAccording to court documents and statements made in court, Cranick, first using text messaging and Snapchat, and then using the internet chat service Discord, coerced an 11-year-old boy to engage in sexually explicit conduct with her.  Several times during the summer and into the fall of 2022, Cranick induced the minor victim to leave his house after midnight to meet up with her.  Cranick sexually assaulted the minor victim during these meetings.\n\nBetween July and October 2022, Cranick exchanged more than 4,700 messages with the minor victim on Discord.\n\nCranick was arrested on related state charges on November 14, 2023, and has been detained since November 28, 2023.  She was federally charged in July 2024.  On November 18, 2025, she pleaded guilty to coercion and enticement of a minor to engage in sexual activity.\n\nThis matter was investigated by the FBI\u2019s Child Exploitation Task Force and the Connecticut State Police\u2019s Eastern District Major Crime Unit.  The FBI\u2019s Child Exploitation Task Force includes federal, state, and local law enforcement agencies.  The case was prosecuted by Assistant U.S. Attorneys Daniel E. Cummings and Katherine E. Boyles through the U.S. Department of Justice\u2019s Project Safe Childhood Initiative, which is aimed at protecting children from sexual abuse and exploitation.\n\nU.S. Attorney Sullivan thanked the State\u2019s Attorney\u2019s Office for the Judicial District of Tolland for its close cooperation in investigating and prosecuting this matter.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 283, &#34;case_id&#34;: 231, &#34;case_name&#34;: &#34;Rebecca Mason-Cales&#34;, &#34;source&#34;: &#34;KTVB/AP&#34;, &#34;date&#34;: &#34;2018-10-10&#34;, &#34;text&#34;: &#34;Idaho teacher sentenced to jail for sexual relations with student\nRebecca Mason-Cales has been sentenced to 120 days in jail and must register as a sex offender.\n\nCredit: Ada County Sheriff&#39;s Office\nRebecca E. Mason-Cales\nAuthor: Staff\nPublished: 11:13 AM PDT October 10, 2018\nUpdated: 12:21 PM PDT October 10, 2018\nFacebook\nMERIDIAN, Idaho (AP) \u2014 A southwest Idaho high school teacher who had sex with a student has been sentenced to 120 days in jail and must register as a sex offender for the rest of her life.\n\nThe Idaho Press reports 26-year-old Rebecca Mason-Cales had initially pleaded not guilty to six counts of battery against a minor child aged 16 or 17, but in August she entered a revised guilty plea of guilty to one count.\n\n\nPREVIOUS: Mountain View High School teacher accused of having sex with student\n\nMeridian police believe Mason-Cales and the Mountain View High School student&#39;s relationship began in August 2017 when the student was a 16-year-old junior.\n\nThe teen says although by law he is a victim, he insists that his interactions with Mason-Cales were all consensual.\n\nMason-Cales&#39; lawyer, Michael Bartlett, says the teacher didn&#39;t have malicious intentions.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 284, &#34;case_id&#34;: 232, &#34;case_name&#34;: &#34;Jessica Lawson&#34;, &#34;source&#34;: &#34;New York Post (Caitlin McCormack)&#34;, &#34;date&#34;: &#34;2024-09-30&#34;, &#34;text&#34;: &#34;Idaho teacher sentenced to prison for sexual battery, rape of teen adopted by a local family days prior\nBy Caitlin McCormack\nPublished Sep. 30, 2024, 12:35 a.m. ET\nA former Idaho schoolteacher was sentenced to prison time for sexual battery and rape of a minor who was adopted out of the foster system by a local family just days before she assaulted him.\n\nJessica Lawson, 36, accepted a plea deal for felony sexual battery and charges of felony rape of a minor. She previously faced charges of felony delivery of a controlled substance and misdemeanor dispensing alcohol to a minor for allegedly giving the 16-year-old boy marijuana and alcohol, but those were dropped as part of the deal.\n\nLawson \u2014 who taught at South Fremont High School from August 2021 through June 2023 \u2014 will face two to 20 years in prison and will have to register as a sex offender, along with attending sex offender treatment. There will also be a no-contact order in place against the victim for 20 years.\n\nAn officer from the Saint Anthony Police Department pulled over Lawson&#39;s car on the morning of Nov. 6, 2023, because her vehicle had no visible taillights. The cop found the teen boy driving, having been given the keys by Lawson, who was too \&#34;drunk to drive,\&#34; authorities said.\n\nThe boy admitted to having used marijuana, which was given to him by Lawson, and was driven home by the officer. Lawson was arrested later that week after the boy told his parents that she had picked him up that night and described how they had smoked and drunk alcohol before having sex.\n\nLawson called the teen&#39;s parents and admitted to having given him alcohol and picking him up, but denied that \&#34;anything else had occurred,\&#34; including the alleged sexual acts and substance use.\n\nThe teen&#39;s parents, who had adopted him just days before he was assaulted, said that while their son may have had no real idea about what was happening, he will still be dealing with the fallout of Lawson&#39;s violation for years to come.\n\n\&#34;It takes a village to raise a young man, especially a young man that has been in and out of foster care, that has never known what it&#39;s like to have a mom and a dad,\&#34; the father told the court, according to East Idaho News.\n\n\&#34;My son is going to take a long time to heal and he doesn&#39;t even know the wounds that he has yet. He&#39;s not going to understand those wounds until he&#39;s a parent and he&#39;s sending his daughter or son \u2026 to the house of a parent that he trusts.\&#34;\n\nThe teen&#39;s mother also attested that he struggles to differentiate between safe and unsafe situations as a result of his time in the foster care system.\n\n\&#34;We brought [my son] in because he needed somebody, and he didn&#39;t have anybody \u2026 It was pretty quick that we realized this is a really great kid, and he&#39;s wonderful and he should be in our family,\&#34; the mother told the court.\n\n\&#34;He&#39;s got a lot of problems because he didn&#39;t have a mom and dad that taught him how to recognize safe people. And you took advantage of that \u2026 she knew she could get something from him.\&#34;\n\nThe victim&#39;s parents believe that Lawson would&#39;ve gotten a harsher sentence if she were a male perpetrator or if their son were a girl, but Senior District Judge Stephen Dunn, who was in charge of sentencing, denied this.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;charge-reduction&#34;, &#34;special-needs-victim&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 285, &#34;case_id&#34;: 233, &#34;case_name&#34;: &#34;Zenna Galeria&#34;, &#34;source&#34;: &#34;KTVB Staff&#34;, &#34;date&#34;: &#34;2012-01-13&#34;, &#34;text&#34;: &#34;Former high school teacher faces jail time for sexual relationship with student\n\nAMERICAN FALLS -- A former American Falls High School teacher faces 45 days in jail for having a sexual relationship with a student.\n\nZenna Galeria was sentenced Thursday by 6th District Judge Stephen Dunn. Galeria, who is 23, pleaded guilty in November to sexual battery of a minor 16 to 17 years old.\n\nPower County prosecutors allege the relationship between Galeria and the student developed in early 2011, when he was 17 years old.\n\nDunn said the first 14 days of Galeria&#39;s sentence would have to be served consecutively, while the remainder could be served during her first year of a five-year probationary period.\n\nShe will be required to register as a sex offender for at least the next 10 years.\n\n---\n\nInvestigation Uncovers American Falls Teacher-Student Relationship\nPublished July 21, 2011\n\nAn investigation into a relationship between a student and a teacher in American Falls has a local sheriff pushing for charges.\n\nAfter a complaint from the American Falls School District and an investigation, Power County Sheriff Jim Jeffries wants Zenna Galeria, 23, charged with felony sexual battery, he said.\n\nThe relationship started at the American Falls High School, where Galeria taught. It began with some simple text messages but developed into more.\n\n\&#34;You&#39;ve heard of lewd and lascivious conduct with a child under 16? Basically sexual battery just extends that age from under 16 to 16 and 17,\&#34; Jeffries said.\n\nGaleria&#39;s public blog said she was an English as a Second Language aide and that she is married. Jeffries said she fully complied with the investigation.\n\nThe district issued this statement: \&#34;Zenna Galeria, head volleyball coach and teacher&#39;s aide at American Falls High School for one year has been relieved of her duties following a district investigation for events associated with her district responsibilities.\&#34;\n\nThe investigation showed there was a relationship, which started when Galeria and the student were texting each other during the second half of the 2010-2011 school year, deputies said. It lasted for about five months. The charge carries a maximum of 15 years in prison if convicted.\n\nThis would be the second case since 2010 for American Falls High School, when William Hamilton pleaded guilty to two counts of statutory rape.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;]}, {&#34;id&#34;: 286, &#34;case_id&#34;: 238, &#34;case_name&#34;: &#34;Teika Helton&#34;, &#34;source&#34;: &#34;WCNC Staff&#34;, &#34;date&#34;: &#34;2016-03-08&#34;, &#34;text&#34;: &#34;Teacher who slept with student gets no jail time\n\nGASTON COUNTY, N.C. -- A 23-year veteran Gaston County teacher who admitted to having sex with an 18-year-old student at her high school will not spend time behind bars.\n\nTeika Helton, 46, agreed to a deferred sentencing arrangement on Tuesday that places her on probation for two years and requires her to perform 200 community service hours.\n\nHelton, who was the 2005 Gaston County Teacher of the Year, must also surrender her teaching license.\n\nUnder the agreement, if Helton completes the requirements, her record will be wiped.\n\nDistrict Attorney Locke Bell was concerned about bringing the case to trial, calling it \&#34;he said-she said.\&#34;\n\nHelton and the 18-year-old South Point High recent graduate both admitted they had sex. The student would have been of consenting age, however, under North Carolina law, a teacher is not allowed to have sexual contact with a student.\n\nHelton insists the sexual contact took place after the student graduated. The teen said it happened while he was still in school. There were text messages exchanged between the two prior to graduation that the prosecutors say were \&#34;improper\&#34; but did not prove when the sexual encounter took place.\n\n\&#34;If we had gone to trial and the jury had said &#39;we don&#39;t know which date, we&#39;re not sure,&#39; then there would be no punishment at all. There would be nothing. She would be teaching again,\&#34; says Gaston County District Attorney Locke Bell.\n\nThe teen&#39;s mother is angry with the deal, saying she believes the punishment will allow Helton to target another teenager.\n\n\&#34;She robbed him of his innocence,\&#34; the mother says. \&#34;She&#39;s a sick individual for having done this.\&#34;\n\nThe mother says in the weeks after the sexual encounter, Helton befriended her, inviting her to college football games and social events. The mother says Helton never let on that she had slept with her son.\n\nThe mother shudders, thinking about the fact that one of her peers slept with her son. \&#34;We&#39;re a year apart in age and it&#39;s sickening,\&#34; she says.\n\nThe teen&#39;s mother says she learned what happened from a family friend and then tipped off the authorities.\n\nHelton opted not to make a statement in court on Tuesday. Her attorney says Helton knows what she did was wrong, and \&#34;lost everything\&#34; because of what happened. Helton was married at the time of the affair. She has two children still in the school system.\n\nThe teen&#39;s mother believes the case would have been brought to trial if the genders were reversed and it was an adult male teacher and a female student.\n\nEven the mother admits, she never thought to talk her son about possible dangers of teacher-student relationships.\n\n\&#34;Mothers, I beg you, talk to your sons about these pedophile women,\&#34; the teen&#39;s mother warned in the hallway after the court hearing. \&#34;It makes me very angry. It makes me sad that our justice system doesn&#39;t give a punishment that people like this deserve.\&#34;&#34;, &#34;tags&#34;: [&#34;social-media&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;long-term-relationship&#34;, &#34;adult-victim&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 287, &#34;case_id&#34;: 237, &#34;case_name&#34;: &#34;Rene Elena Carter&#34;, &#34;source&#34;: &#34;7NEWS/Chris Hook&#34;, &#34;date&#34;: &#34;2020-12-03&#34;, &#34;text&#34;: &#34;Female US high school teacher accused of raping student 25 times avoids prison time\n\nA US high school teacher charged with raping a teenage boy 25 times has dodged jail time with a plea agreement.\n\nRene Elena Carter, a former teacher at Capital High School in the state of Montana, was first charged with three counts of felony sexual intercourse without consent in 2018.\n\nThe Billings Gazette reports the charges followed a Helena police investigation after video emerged of Carter engaging in inappropriate contact with the student three years earlier. The 2015 video was brought to police by the high school&#39;s principal.\n\nHowever, the boy denied having sex with Carter and the case came to a standstill.\n\nBut then in 2016, one of the boy&#39;s family members approached police, claiming they had heard about the sexual liaisons between the pair and the investigation was reopened.\n\nDetectives interviewed Carter&#39;s husband who alleged the boy had been abusive to his wife, punching her, pulling her hair and demanding her attention. He called the boy \&#34;an unbelievable parasite\&#34; and said Carter had required counselling to recover from the treatment.\n\nIn interviews with detectives the student - who was 17 at the time of the relationship - admitted the relationship and said they had planned to get together once he turned 18, but it never happened. Eventually the boy claimed the pair had sex on 25 occasions and Carter was charged.\n\nCarter&#39;s case has since been delayed five times, and was finally set to go to trial at Lewis and Clark County District Court this week.\n\nBut a deal was reached allowing Carter to enter an \&#34;Alford plea\&#34; in which she does not admit guilt but rather acknowledges that on the weight of available evidence, she would likely be convicted.\n\nTwo of the rape charges were dropped while another was amended to criminal endangerment. However, the plea states that this was not because of the alleged sexual relationship but for a situation which \&#34;created a substantial risk of death or serious bodily injury,\&#34; to the victim.\n\nCarter was slapped with a three-year deferred sentence and will have to pay $US80 in costs.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;no-prison&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 288, &#34;case_id&#34;: 236, &#34;case_name&#34;: &#34;Montana Joan Davis&#34;, &#34;source&#34;: &#34;KWTX/Paul J. Gately&#34;, &#34;date&#34;: &#34;2016-03-24&#34;, &#34;text&#34;: &#34;Additional charges filed against local teacher in student sex case\n\nA former Mexia High School teacher was arrested Wednesday on a warrant charging inappropriate relationship between an educator and a student.\n\nMontana Joan Davis posted a $25,000 bond Wednesday afternoon and was released from custody, a McLennan County Jail records clerk said Thursday.\n\nIt is the second time Lacy Lakeview police have arrested Davis, 24, on that charge.\n\nAfter her first arrest on Feb. 26 she posted a $30,000 bond and was released from custody.\n\nThe Wednesday arrest stems from the same incidents in connection with which she was charged in February, but grew out of a separate investigation.\n\nThe February arrest by Lacy Lakeview police was based on a warrant issued out of Limestone County that says she, while a teacher in Mexia, engaged in an inappropriate sexual encounter with a high school boy.\n\nThe second was based on a warrant issued to Lacy Lakeview police stemming from alleged activity in McLennan County.\n\nAn affidavit issued for the warrant says the boy&#39;s father met with detectives from both Mexia and Lacy Lakeview police.\n\nThe teenage victim admitted to police he had sex with a teacher and that the activity had been going on for about three weeks at the time of the investigation, the affidavit said.\n\nThe victim also admitted that he and the teacher \&#34;sexted\&#34; each other using text programs on their cell phones and on Instagram, the affidavit said.\n\nThe victim said he and the teacher had sex at least four times and two of those incidents happened in Lacy Lakeview at a residence on Wisdom Lane.\n\nThe other two, he said, happened at a location in Limestone County.\n\nMexia ISD Superintendent Dr. Sharon Ross confirmed on Feb. 9 that the district was investigating allegations involving an inappropriate relationship between a staff member and a high school student.&#34;, &#34;tags&#34;: [&#34;instagram&#34;, &#34;social-media&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 289, &#34;case_id&#34;: 234, &#34;case_name&#34;: &#34;Ann Kuroki&#34;, &#34;source&#34;: &#34;KMVT/Morgan Rumpf&#34;, &#34;date&#34;: &#34;2018-06-27&#34;, &#34;text&#34;: &#34;Ann Kuroki sentenced on two felony and one misdemeanor charge\n\nThe case is closed in regards to former Gooding School District employee Ann Kuroki.\n\nThe 27 year old was in front of Gooding County Court facing two felony counts of injury to a child and one misdemeanor count of dispensing alcohol to a minor.\n\nKuroki was arrested back in January after it was revealed she had a sexual relationship with a 17 year old boy.\n\nShe plead guilty to the charges and reached a plea deal with the prosecution, which at sentencing the judge complied with.\n\nThe victim&#39;s mother gave an impact statement at sentencing highlighting the struggles her son and their family faced when the hearings were taking place, and how they&#39;ve overcome the hardships to continue to move forward.\n\n\&#34;But you also missed the day that he finally, finally understood that regardless of how smart or capable he is of making his own choices in other aspects of his life, that his then 17 year old mind wasn&#39;t developed and mature enough to fathom the severity of the consequences of the situation,\&#34; said the victim&#39;s mother Aubrey Cheney. \&#34;That he was led into and taken advantage of by someone whose brain is mature enough and did know better.\&#34;\n\nKuroki was sentenced to 90 day in Gooding County jail and 4 years&#39; probation. She will serve her 90 days on work release. She will also have to enroll in sex offender treatment program, though she does not have to register as a sex offender.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 290, &#34;case_id&#34;: 234, &#34;case_name&#34;: &#34;Ann Kuroki&#34;, &#34;source&#34;: &#34;International Business Times/Andria Seo&#34;, &#34;date&#34;: &#34;2018-01-08&#34;, &#34;text&#34;: &#34;Ann Kuroki, Idaho Basketball Coach Arrested For Having Sex With Teen Student\n\nA female basketball coach from Gooding, Idaho, was arrested Friday for indulging in sexual activity with a minor student after the police received a tip regarding the same.\n\nAnn Kuroki, 26, faces a charge of felony sexual abuse of a minor aged 16 to 17 years, it was reported. She is currently being held without bail at the Gooding County Jail.\n\nKuroki was hired by the Gooding High School, Idaho, in October and worked there as a coach for the boys&#39; basketball team.\n\nAccording to her LinkedIn and Facebook profiles, she graduated from Southern Virginia University in 2015 with a degree in general studies and humanities. Kuroki played for the women&#39;s basketball team and was captain of her varsity&#39;s basketball team in her senior year. Before joining Southern Virginia University, she spent two years at Bellevue University studying behavioral sciences and also earned an associate&#39;s degree in psychology in 2012 at Mid-Plains Community College, Nebraska.\n\nPrior to working with Gooding High School, she worked as a nanny in Las Vegas.\n\nGooding Police Chief Dave Fisher said she was suspended from her job Thursday. He added the school would also be conducting an internal investigation into the incident.\n\nAn agenda for the school&#39;s upcoming board meeting scheduled for Tuesday mentions a point about Kuroki&#39;s termination.\n\nFisher said police began investigating Kuroki after they received a tip she was allegedly involved in an illicit relationship with a minor student. Kuroki is scheduled to be arraigned Monday. If convicted, she could face up to 25 years in jail depending on the nature of charges pressed against her.&#34;, &#34;tags&#34;: []}, {&#34;id&#34;: 291, &#34;case_id&#34;: 239, &#34;case_name&#34;: &#34;Samantha Ciotta&#34;, &#34;source&#34;: &#34;Patch/Renee Schiavone&#34;, &#34;date&#34;: &#34;2018-05-11&#34;, &#34;text&#34;: &#34;Teacher Who Had Sex With Student Cuts Deal To Avoid Jail\n\nBEAUMONT, CA \u2014 A Beaumont High School teacher pleaded guilty Thursday to having sex with an underage student as part of an agreement with prosecutors that allows the 32-year-old mother to avoid jail.\n\nSamantha Ciotta, a 32-year-old mother of two, pleaded guilty to three felony counts of unlawful intercourse with a minor. She was sentenced to 180 days in a sheriff&#39;s work release program and four years probation. A single count of \&#34;oral copulation of a child\&#34; was dismissed. Ciotta, as part of her plea deal, is prohibited from making contact with the student victim for 10 years, according to court papers.\n\nShe does not need to register as a sex offender, the District Attorney&#39;s office said.\n\nIn a Friday conversation Ciotta told Patch News she is \&#34;relieved that this all has finally concluded,\&#34; and declined to answer questions.\n\n\&#34;There are so many facets to this story-- most of which were created by rumors and the media. I have learned a lot throughout the year-- more about myself and more about those who have committed their loyalty to me from the start-- with no questions asked. I would do anything to keep my children safe and by my side, even if that means sacrificing my words and becoming silent when all I really wanted to do was tell my story,\&#34; she said in a texted statement.\n\n\&#34;At the end of the day, we all bleed red-- we are all human.\&#34;\n\nThe English teacher was arrested last September, three months after starting a sexual relationship with a 16-year-old student that became public in a scandalous Snapchat video that allegedly showed the teacher drinking alcohol with two shirtless teenagers wearing only a shirt and \&#34;panties,\&#34; according to records obtained by Patch.\n\nShe was released on bail and Beaumont High placed her on administrative leave. Ciotta has since lost her state teaching license and her husband filed for divorce in October.\n\nCiotta must report by June 8 to begin her work release. If she had been convicted on the same counts she pleaded guilty to, she faced up to four years, four months in prison, DA spokesman John Hall said.\n\nPolice discovered Ciotta&#39;s relationship with the boy when a relative of the teen texted the boy last June to ask if swirling rumors about him and Ciotta were true. The relative received replies that made her question who was using the phone. The boy&#39;s relative told police she believed Ciotta&#39;s husband was using the boy&#39;s iPhone. The text from the husband stated that he \&#34;needed to know the extent of what happened \u2026 I deserve that much. I&#39;m not mad at [the boy]. Not even a little bit.\&#34;\n\nAt first, the boy denied having an inappropriate relationship with his teacher. Later, the teenage victim told police he had sex with Ciotta at least five times. He said he could not remember the exact number of times because he was usually intoxicated during their sexual encounters.\n\nThe victim told police he \&#34;tried cover for Ciotta so she would not get in trouble,\&#34; but ended his silence when he learned that Ciotta \u2014 after allegedly having sex with the boy&#39;s 19-year-old friend \u2014 reportedly said her former student \&#34;had ruined her life.\&#34;\n\nBeaumont police served no less than seven search warrants in the case. They searched the woman&#39;s home, swabbed her SUV for DNA samples and combed through her cell phone.\n\nThe guilty plea follows a lawsuit filed by the victim last week against Beaumont Unified School District, Principal Christina Pierce and Vice Principal Ian Young, alleging that while the sexual abuse was occurring, his guardian and at least one other teacher reported their concerns to school administrators, but nothing was done. Pierce resigned from her position earlier this year.\n\n\&#34;There&#39;s likely to be more information that comes out, but it is clear that there were unusual things happening where he was not going to other classes and spending virtually the entire school day in her classroom,\&#34; Attorney Roger Booth told Patch. \&#34;In our view the school district let him down; given the tough life he had, this is not what he needed from his high school experience.\&#34;&#34;, &#34;tags&#34;: [&#34;snapchat&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;dna-evidence&#34;, &#34;probation&#34;, &#34;prior-warning-ignored&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;charge-reduction&#34;, &#34;possible-additional-victims&#34;, &#34;on-campus&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 292, &#34;case_id&#34;: 240, &#34;case_name&#34;: &#34;Amber Stroda&#34;, &#34;source&#34;: &#34;KMBC / Abilene Reflector-Chronicle; KSAL Staff&#34;, &#34;date&#34;: &#34;2013-11-13&#34;, &#34;text&#34;: &#34;Ex Kansas teacher sentenced for having sex with teen\nAmber Stroda to spend 15 weekends in jail, 3 years on probation\n\nABILENE, Kan. \u2014 A former Kansas teacher will spend 15 weekends in jail for having sexual relations with a 17-year-old male student.\n\nThe Abilene Reflector-Chronicle reports 28-year-old Amber Stroda will also serve three years of probation under the sentence she received Wednesday in Dickinson County District Court.\n\nStroda taught third grade at Solomon Elementary School and was also a dance team sponsor at Solomon High School. She resigned from her teaching job in October 2012.\n\nStroda was initially charged with six counts of engaging in consensual sex with a student at least 16 years old. She pleaded guilty in August to three counts of having sex with the teen at his home. Prosecutors dropped the remaining counts in exchange.\n\n---\n\nEx-Solomon Teacher Pleads To Sex Charges\nKSAL Staff, August 7, 2013\n\nA former Solomon teacher pleads to sex charges.\n\nAccording to Dickinson County court officials, 28-year-old Amber Stroda on Wednesday pleaded to three felony counts of unlawful sexual relations.\n\nStroda was arrested back in February of this year. She was accused of having sex with two different male Solomon High School students. The students at the time were between the ages of 14 and 18.\n\nStroda was a third grade teacher in the Solomon district at the time, and the coach of the high school dance team. She had resigned in October.\n\nA sentencing date of October 2nd was set.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 293, &#34;case_id&#34;: 241, &#34;case_name&#34;: &#34;Christen Hayes&#34;, &#34;source&#34;: &#34;The Post-Standard (Jim O&#39;Hara; Robert A. Baker)&#34;, &#34;date&#34;: &#34;2012-03-02&#34;, &#34;text&#34;: &#34;Former BOCES teacher aide sentenced in Syracuse for sex with student\n\nSyracuse, NY - A former Onondaga-Cortland-Madison BOCES teacher&#39;s assistant was sentenced today to 10 years&#39; probation with six months in jail for a sexual relationship with an underage student.\n\nChristen L. Hayes, 30, for whom authorities listed an address in Binghamton, apologized to the victim and his family as she stood before state Supreme Court Justice John Brunetti for sentencing.\n\nHayes pleaded guilty in November to a single felony count of third-degree rape involving sexual contact with the victim when he was 16. She had been accused of engaging in sexual activity with the boy on a number of occasions in June 2009 and February 2010.\n\nAccording to Assistant District Attorney Geoffrey Ciereck, the boy was a student at the BOCES school where Hayes worked but none of the incidents took place on school property.\n\nThe relationship between Hayes and the boy came to light after the teenager was arrested in Broome County following an incident at Hayes&#39; home, Ciereck said. Upon learning from the youth about his relationship with Hayes, Broome County officials notified the District Attorney&#39;s Office here and the Onondaga County Sheriff&#39;s Office was called in to investigate, Ciereck said.\n\nHayes has already served about two months of the four-month penalty she would be required to serve under the six-month sentence Brunetti imposed.\n\nShe also will be required to register as a convicted sex offender when she is released from the Onondaga County Correctional Facility in Jamesville.\n\n---\n\nFormer BOCES teacher&#39;s assistant accused of having sex with student\nPublished: Feb. 16, 2011\n\nDeWitt, NY -- A former OCM BOCES teacher&#39;s assistant is charged with three counts of rape involving a student, the Onondaga County Sheriff&#39;s Office said.\n\nChristen L. Hayes, 30, of 164 Castle Creek Road, Binghamton, was charged Jan. 27 after an investigation that began in October. Hayes is charged with three counts of third-degree rape, three counts of third-degree criminal sexual act, all felonies, three counts of third-degree sexual abuse, three counts of endangering the welfare of a child, and one count of unlawfully dealing with a child, all misdemeanors.\n\nThe investigation began after the Onondaga County District Attorney&#39;s Office contacted the sheriff&#39;s office. Hayes began a relationship with a child under the age of 17 in 2009, deputies said. She is accused of engaging in sexual activity with the student on several occasions in June 2009 and in February 2010, deputies said.\n\nHayes was arraigned in DeWitt Town Court and posted the $10,000 bail, deputies said.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 294, &#34;case_id&#34;: 24, &#34;case_name&#34;: &#34;State v. McKenna Kindred&#34;, &#34;source&#34;: &#34;NY Post (Georgia Worrell)&#34;, &#34;date&#34;: &#34;2026-01-30&#34;, &#34;text&#34;: &#34;Sicko ex-teacher McKenna Kindred&#39;s loyal husband moves them across state lines\n\nThe lawyer husband of disgraced ex-Washington high school teacher McKenna Kindred has remained fiercely devoted to his convicted sex offender wife \u2013 even packing up and moving across state lines to start fresh together.\n\nThe couple now reportedly lives in a newly-built, four-bedroom home in Kuna, Idaho \u2013 a growing suburb about 15 miles southwest of Boise \u2013 which they jointly purchased for just under $500,000 in June 2024.\n\nJust three months earlier, Kindred, now 27, pleaded guilty to having an inappropriate relationship with her 17-year-old student at Central Valley High School \u2013 including engaging in a depraved, hours-long sex marathon with the teen inside her marital home, court records show.\n\nFive months before the move, Kindred was convicted of first-degree sexual misconduct after authorities said the illicit affair began when the teen discovered her Instagram account in June 2022 \u2013 leading to a torrent of nauseating messages, photos and videos sent between them. Kindred avoided jail time but was sentenced to two years of probation, fined $700 and ordered to register as a sex offender for 10 years.\n\nHer husband, Kyle Kindred \u2013 who was often away on hunting trips while his wife engaged in the sick tryst \u2013 attended Gonzaga University schools of law and business administration at the time. Kyle, now 27, currently works as an associate attorney for the Boise-based firm Hart &amp; Hart after obtaining his law degree from Southern Methodist University Dedman School of Law.\n\nThe pair previously shared an apartment in Liberty Lake, just outside Spokane, before staying at Kyle&#39;s parents&#39; $1 million, five-bedroom home in nearby Mica around the time of her sentencing in March 2024.\n\nKindred&#39;s teaching license was surrendered amid an Idaho Standards Commission probe in August 2024. The victim&#39;s mother called Kindred&#39;s behavior \&#34;predatory\&#34; and an \&#34;abuse of power,\&#34; stating Kindred started to groom the boy when he was 16.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;instagram&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;surveillance&#34;]}, {&#34;id&#34;: 295, &#34;case_id&#34;: 242, &#34;case_name&#34;: &#34;Julia Engle&#34;, &#34;source&#34;: &#34;WTVY (Ken Curtis); Dothan Police Department&#34;, &#34;date&#34;: &#34;2023-08-30&#34;, &#34;text&#34;: &#34;Former Dothan teacher avoids prison sex charge plea deal\n\nDOTHAN, Ala. (WTVY) - Former Dothan High School teacher Julia Michelle Engle pleaded guilty to sex charges Wednesday and received probation in a plea deal with prosecutors.\n\nShe will serve 24 months but must register as a sex offender.\n\n\&#34;If she wasn&#39;t a school teacher this wouldn&#39;t even be against the law,\&#34; attorney Will Matthews said of his client&#39;s case.\n\nThe district attorney&#39;s office did not immediately make a statement.\n\nEngle, a then-married math teacher who is 33, had an ongoing consensual sexual relationship with a 16-year-old student. Per prosecutors, these sexual encounters happened in the classroom.\n\nAs part of the plea deal she is forbidden from having contact with the student who is now an adult.\n\nBesides School Employee Sex, she faced charges of Distributing Obscene Materials, according to charging documents.\n\n---\n\nDothan High School Teacher Arrested for Sex Crime \u2014 May 3, 2019\n\nOn Friday May 3, 2019 The Dothan Police Department was notified by Dothan City Schools that a teacher from Dothan High School was possibly engaging in sexual acts with a student. Investigators responded to the school and began an investigation into the claims.\n\nThe teacher, Julia Engle (29) of Dothan, was taken to the Dothan Police Department for an interview. Engle and two students were interviewed. After interviews were completed Investigators arrested Engle and charged her with one count of a School employee engaging in a sex act with a student under the age of 19 years. The bond has been set at $30,000.00.\n\nThis investigation is ongoing and more charges could be filed at a later date.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;possible-additional-victims&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 296, &#34;case_id&#34;: 243, &#34;case_name&#34;: &#34;Janae Nunnelly&#34;, &#34;source&#34;: &#34;Jennifer Weiser (local)&#34;, &#34;date&#34;: &#34;2026-01-12&#34;, &#34;text&#34;: &#34;Former Mexico teacher gets probation for guilty plea to sexual contact with student\n\nA former Mexico High School teacher was sentenced to probation after pleading guilty to having sexual contact with a student.\n\nOn Tuesday, October 14, 2025, Janae Nunnelly pleaded guilty to one charge of Sexual Contact With a Student. The state dropped the other count of Sexual Contact With a Student against her.\n\nMexico Public school officials reported to police in February 2025 that an employee had sexual contact with a student and a former student.\n\nThe current student told the investigator it started in June 2024.\n\nThe former student said it started in March 2022 and continued until he graduated in 2022.\n\nOn Monday, January 12, 2026, Nunnelly was sentenced to five years of probation. She will also have to complete a substance abuse evaluation and treatment.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 297, &#34;case_id&#34;: 244, &#34;case_name&#34;: &#34;Lena Stewart&#34;, &#34;source&#34;: &#34;KY3 Staff&#34;, &#34;date&#34;: &#34;2025-01-14&#34;, &#34;text&#34;: &#34;Former Nixa High School teacher avoids jail time after pleading guilty to misdemeanor\n\nNIXA, Mo. (KY3) - A former Nixa High School teacher will avoid jail time after pleading guilty to a misdemeanor for inappropriate relations with a student.\n\nLena Stewart pleaded guilty to one count of sexual abuse. A judge sentenced her to two years of supervised probation. She must comply with all requirements for registering as a sex offender.\n\nAfter prosecutors filed several charges, Nixa School District leaders fired Stewart in February 2023. Prosecutors said the incidents involving the student dated back to October 2022. Investigators said the student claimed he felt pressured to participate in the relationship, earning an &#39;A&#39; for little classwork.\n\n---\n\nFrom earlier reporting:\n\nAccording to preliminary court documents, prosecutors for Christian County charged the teacher, 26-year-old Lena Stewart, with the following crimes: Second-degree statutory rape; Sexual misconduct with a minor; First-degree sexual misconduct.\n\nThe allegations came to light in December, just a few days before schools closed for the winter vacation. Investigators with the Christian County Sheriff&#39;s Office launched a probe. Court records revealed that Stewart taught woodworking and agricultural science classes and had been employed by Nixa Public Schools since 2021 and helped lead the high school&#39;s FFA.\n\nCourt records say that a 16-year-old male student admitted to having a sexual relationship with Stewart beginning in October 2022. The student&#39;s parents filed a complaint because they were concerned he was spending too much time with Stewart.\n\nAn investigator questioned Stewart about private communications with students, and she admitted to sending and receiving occasional private messages. Police searched her phone but could not locate any messages; Stewart said her phone automatically deletes text messages and denied any physical relationship. Further investigation led police to a secret Instagram account Stewart used to communicate with the student.\n\nIn a probable cause statement, the 16-year-old told police Stewart would pick him up in her car an
