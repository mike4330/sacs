d drive to a secluded area where they would engage in sexual acts. The minor said he was uncomfortable but felt pressured to continue because he received good grades in the class.\n\nStewart was arrested January 22, 2023 and held on $25,000 bail at the Christian County Jail.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;instagram&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;evidence-tampering&#34;, &#34;charge-reduction&#34;, &#34;late-night-meetups&#34;, &#34;gifts&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 298, &#34;case_id&#34;: 245, &#34;case_name&#34;: &#34;Brynn Larsen&#34;, &#34;source&#34;: &#34;WBAY news staff&#34;, &#34;date&#34;: &#34;2021-04-26&#34;, &#34;text&#34;: &#34;Former coach, teacher sentenced to prison for sexual relationship with student\n\nOCONTO, Wis. (WBAY) - A former volleyball coach and substitute teacher was sentenced last week to two years in prison for having a sexual relationship with a student when she worked at Oconto Falls High School in 2014.\n\nLarsen pleaded no contest in February to third-degree sexual assault. Charges of second-degree sexual assault of a child and child enticement were dismissed but were read into her court record.\n\nBack in 2014, investigators received an anonymous tip that Brynn Larsen was seen holding hands and kissing a 15-year-old girl, but the student denied a sexual relationship and Larsen told investigators she didn&#39;t think the relationship was inappropriate. The criminal complaint added that the high school athletic director was aware of complaints but he could not substantiate them and he had a talk with Larsen about boundaries.\n\nIn 2019, the victim contacted police and detailed a sexual relationship with Larsen. Detectives contacted Larsen through Facebook, posing as the victim, and they say Larsen admitted to the sexual relationship during a lengthy discussion.\n\nIn addition to two years in state prison, Larsen was given five years of extended supervision and will be added to Wisconsin&#39;s sex offender registry. The judge ordered her not to have any contact with minors without prior approval, and she can&#39;t have any contact with the victim.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;prior-warning-ignored&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;surveillance&#34;]}, {&#34;id&#34;: 299, &#34;case_id&#34;: 246, &#34;case_name&#34;: &#34;United States v. Meyer-Davis&#34;, &#34;source&#34;: &#34;DOJ Press Release, U.S. Attorney&#39;s Office Northern District of Iowa&#34;, &#34;date&#34;: &#34;2025-04-30&#34;, &#34;text&#34;: &#34;Former Teacher Pleads Guilty to Sexual Exploitation of Student\nWednesday, April 30, 2025\nFor Immediate Release\nU.S. Attorney&#39;s Office, Northern District of Iowa\n\nSamantha Meyer-Davis, 32, from Rutland, Iowa, pled guilty in federal court April 30, 2025, to sexual exploitation of a child.\n\nAt the plea hearing, Meyer-Davis admitted that from May 2022, through November 2023, she was engaged in sexually exploiting a student as well as disseminating and exhibiting obscene materials to the victim. Meyer-Davis was a middle school teacher at the time of the incidents and met with school administrators on several occasions and denied any inappropriate relationship. Administrators reminded Meyer-Davis of her professional and ethical obligations to her students and encouraged her to cease and desist any inappropriate relationship with the student. When interviewed by law enforcement, Meyer-Davis continued to deny any inappropriate relationship until she was confronted with photographic evidence of her kissing the student who was in a state of undress. Evidence further showed that Meyer-Davis and the victim exchanged over 130 photographs, and over 60 videos related to and depicting child pornography, including materials that portrayed sadistic and masochistic conduct.\n\nThis case was brought as part of Project Safe Childhood, a nationwide initiative launched in May 2006, by the Department of Justice to combat the growing epidemic of child sexual exploitation and abuse. Led by the United States Attorneys&#39; Offices and the Criminal Division&#39;s Child Exploitation and Obscenity Section, Project Safe Childhood marshals federal, state, and local resources to locate, apprehend, and prosecute individuals who sexually exploit children, and to identify and rescue victims.\n\nSentencing before United States District Court Judge Leonard T. Strand will be set after a presentence report is prepared. Meyer-Davis remains in custody of the United States Marshal pending sentencing. Meyer-Davis faces a mandatory minimum sentence of 15 years&#39; imprisonment and a possible maximum sentence of 30 years&#39; imprisonment, a $250,000 fine, and at least five years of supervised release following any imprisonment.\n\nThe case was investigated by the Iowa Division of Criminal Investigation, Iowa Division of Narcotics Enforcement, Iowa Special Enforcement Operations Bureau, and the Humboldt County Sheriff&#39;s Office and is being prosecuted by Assistant United States Attorney Kraig R. Hamit. Court file information at https://ecf.iand.uscourts.gov/cgi-bin/login.pl. The case file number is 24-3028.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;prior-warning-ignored&#34;, &#34;long-term-relationship&#34;, &#34;csam-distribution&#34;, &#34;federal&#34;]}, {&#34;id&#34;: 300, &#34;case_id&#34;: 246, &#34;case_name&#34;: &#34;United States v. Meyer-Davis&#34;, &#34;source&#34;: &#34;KTIV / Mike Bunge&#34;, &#34;date&#34;: &#34;2025-10-07&#34;, &#34;text&#34;: &#34;Iowa teacher&#39;s sexual exploitation case ends with 20-year sentence\nMike Bunge, Oct 7, 2025\n\nSIOUX CITY, Iowa \u2014 Samantha Meyer-Davis, 32 from Rutland, was sentenced Monday in federal court for sexually exploiting a child.\n\nThe former middle school teacher pleaded guilty on April 30.\n\nThe U.S. Attorney&#39;s Office for the Northern District of Iowa says from May 2022 to November 2023, Meyer-Davis exploited a student and shared obscene materials with the victim. Despite being warned by school administrators, she denied the relationship until confronted with incriminating photos. Federal investigators say over 130 photographs and 60 videos, including child pornography, were exchanged.\n\nJudge Leonard T. Strand presided over the sentencing. Judge Strand said, as a teacher, in a position of trust, Meyer-Davis was \&#34;every parent&#39;s worst nightmare when sending kids to school\&#34; and that there was \&#34;no way to overstate how serious and aggravated this is.\&#34; The Court noted this conduct went on for some time, that this was not a one-time mistake, stating \&#34;there was no indication this would have stopped on its own. This only ended because law enforcement got involved.\&#34;\n\nMeyer-Davis received a 240-month prison sentence and a 5-year supervised release. She must also pay $13,243.67 in restitution. There is no parole in the federal system, and she remains in custody awaiting transfer to a federal prison.\n\nThe investigation involved the Iowa Division of Criminal Investigation, Iowa Division of Narcotics Enforcement, Iowa Special Enforcement Operations Bureau, and the Humboldt County Sheriff&#39;s Office. It was prosecuted by Assistant United States Attorney Kraig R. Hamit.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;federal&#34;]}, {&#34;id&#34;: 301, &#34;case_id&#34;: 246, &#34;case_name&#34;: &#34;United States v. Meyer-Davis&#34;, &#34;source&#34;: &#34;KTIV / Kathryn Vlaanderen&#34;, &#34;date&#34;: &#34;2024-02-26&#34;, &#34;text&#34;: &#34;Iowa middle school teacher arrested for alleged sexual abuse and exploitation\nBy Kathryn Vlaanderen, KTIV\nPublished: Feb. 26, 2024\n\nHUMBOLDT COUNTY, Iowa (KTIV) - A central Iowa school teacher was arrested for allegedly having a sexual relationship with a student.\n\nOn Monday, Feb. 26, Samantha Meyer-Davis turned herself in at the Humboldt County Law Enforcement Center after a warrant was issued for her arrest. She was charged with one count of third-degree sexual abuse and one count of sexual exploitation by a school employee.\n\nIn September of 2023, the Humboldt County Sheriff&#39;s Office was made aware of an alleged sexual relationship between a Humboldt Middle School teacher and a Humboldt High School student. In October of 2023, the Iowa Division of Criminal Investigation (DCI) became involved in the investigation at the sheriff&#39;s office&#39;s request.\n\nAccording to the sheriff&#39;s office, several interviews were conducted and multiple search warrants were granted for electronic devices, social media platforms, and physical addresses. As the investigation went on, authorities say they discovered evidence of the two&#39;s relationship. Authorities say these acts began on or about June of 2022 when the minor was 14 years old.\n\nMeyer-Davis posted the $15,000 cash bond and was released with a court date set for Feb. 29. Additionally, the court issued a no-contact order between Meyer-Davis and the unidentified minor.\n\nThe website for the Humboldt Community School District shows Meyer-Davis is not listed on the staff directory.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;prior-warning-ignored&#34;, &#34;federal&#34;]}, {&#34;id&#34;: 302, &#34;case_id&#34;: 247, &#34;case_name&#34;: &#34;State v. Whiteside&#34;, &#34;source&#34;: &#34;Iowa Attorney General / sentencing press release&#34;, &#34;date&#34;: &#34;2025-06-12&#34;, &#34;text&#34;: &#34;Former Ankeny teacher sentenced to up to 20 years in prison for sexually exploiting student\nPublished 6/12/2025\n\nA former Ankeny teacher and coach pleaded guilty to sexually exploiting a student and was sentenced to up to 20 years in prison on Thursday.\n\nRachel Elizabeth Whiteside, 35, a former teacher and softball coach at Ankeny Northview Middle School, pleaded guilty to four counts of sexual exploitation by a school employee \u2013 pattern, practice, or scheme of conduct, a Class D felony.\n\nDistrict Judge Paul Scott sentenced Ms. Whiteside to consecutive sentences of five years on each charge, for a total of 20 years. She will also be under the supervision of the Department of Corrections for 10 years and be listed on the sex offender registry.\n\nThe defendant was arrested in February 2024 after Ankeny school officials received a tip from a former student. Evidence showed that starting in 2015, when she was 26 years old, Ms. Whiteside began a sexual relationship with a 15-year-old student. The relationship extended seven years.\n\nBecause Ms. Whiteside was a mandatory reporter of child abuse at the time of the offenses, and the victim was under the age of 18 years, a term of incarceration is mandatory under Iowa law.\n\nHer attorneys argued for a 10-year sentence, given her lack of a criminal record, opportunity for rehabilitation, support from family and friends, and other factors. Dr. Traci Thomas, a forensic psychologist, testified that Ms. Whiteside had no antisocial disposition and is not sexually attracted to children.\n\nThe defendant apologized to the victim, her family, and the community for her actions. She spoke of how her support for the victim evolved into a physical relationship. \&#34;This was entirely my failure. I had a responsibility to maintain boundaries, and I deeply regret the harm I caused,\&#34; she said.\n\nProsecutors asked the court to run the sentences consecutively for a total of 20 years in prison for the separate and distinct actions. \&#34;The defendant sees herself as the victim in this case,\&#34; said Assistant County Attorney Thomas Tolbert. \&#34;She should have been the teacher she was required to be. Instead of helping (the victim), she sexually abused her multiple times.\&#34;\n\nThe victim told the court that she was controlled, manipulated, and abused by the defendant. \&#34;I looked up to this person, and she took advantage of my vulnerability,\&#34; she said. She said she attempted suicide multiple times because of the abuse and trauma.\n\nThe mother of the victim told the court that she hopes the defendant gets the help she needs, and that her actions have had emotional, financial, and other impacts on her family. \&#34;I&#39;ve had anxiety and feelings of guilt for not being able to protect my child,\&#34; she said.\n\nJudge Scott said that after reading the psychological evaluation and hearing the defendant&#39;s comments, \&#34;I was struck by your lack of acceptance of responsibility,\&#34; he said. \&#34;It was grooming from the beginning to the end.\&#34;\n\nThe case was prosecuted by Assistant County Attorneys Thomas Tolbert and Shannon Bogolin. The investigation was led by Sgt. Stephanie Braun of the Ankeny Police Department.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;no-remorse&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;possible-additional-victims&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 303, &#34;case_id&#34;: 247, &#34;case_name&#34;: &#34;State v. Whiteside&#34;, &#34;source&#34;: &#34;Ankeny Police Department press release&#34;, &#34;date&#34;: &#34;2024-02-21&#34;, &#34;text&#34;: &#34;Ankeny woman arrested for Sex Abuse &amp; Sexual Exploitation by a School Employee\nAnkeny Police Department, Posted February 21, 2024 [ARCHIVED]\n\nIn late January 2024, the administration of the Ankeny School District notified the Ankeny Police Department about allegations of an inappropriate sexual relationship that occurred between a former student and a teacher/coach beginning in 2015. This relationship continued for several years and was recently reported to the Ankeny School District by the victim.\n\nThe Ankeny Police Department immediately investigated these allegations. After this investigation, it was determined Rachel Whiteside (34) a teacher and coach with the Ankeny Community School District, engaged in a pattern of sexual conduct with the victim while they attended the Ankeny Community School District between the years of 2015 \u2013 2018.\n\nWhiteside is charged with Sex Abuse 3rd, Sexual Exploitation by a school employee (4 counts), and Lascivious contact with a Minor. Whiteside turned herself in earlier this morning at the Ankeny Police Department and was transported to the Polk Co. Jail.\n\nArrested:\nRachel Whiteside (34)\n\nCharges:\nSex Abuse 3rd - IA Code 709.4 \u2013 C felony\nSexual Exploitation by a School Employee (4 counts) \u2013 IA code 709.15 \u2013 D felony\nLascivious Conduct with a Minor \u2013 IA Code 709.14 \u2013 Aggravated misdemeanor\n\nAnkeny PD case # - 24-000614&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 304, &#34;case_id&#34;: 247, &#34;case_name&#34;: &#34;State v. Whiteside&#34;, &#34;source&#34;: &#34;WOI / Anna Kutz, Laura Bowen&#34;, &#34;date&#34;: &#34;2024-02-21&#34;, &#34;text&#34;: &#34;Ankeny middle school teacher arrested for sex abuse and sexual exploitation\nAnna Kutz, Laura Bowen (WOI)\nPublished: February 21, 2024\n\nANKENY, Iowa \u2014 Ankeny police have arrested a Northview Middle School teacher and coach for alleged sex abuse and sexual exploitation of a minor from 2015 to 2018.\n\nRachel Whiteside, 34, \&#34;engaged in a pattern of sexual conduct\&#34; with a minor student beginning in 2015, the victim reported to the Ankeny Community School District on Jan. 24, 2024.\n\nPolice began investigating Whiteside just days after the victim&#39;s report, searching Whiteside&#39;s work computer and personal phone for more information about the alleged abuse. Whiteside was placed on administrative leave during the investigation.\n\n\&#34;It&#39;s not a good story for anyone involved,\&#34; said Sgt. Corey Schneden of the Ankeny Police Department. \&#34;It is a hard story to deal with, so we just hope the best for the victim and her family and friends.\&#34;\n\nThe victim&#39;s report claims Whiteside abused them on school district property, though they were in contact electronically as well. Court documents allege Whiteside \&#34;used her role as a teacher and coach to make the student feel comfortable and share intimate details of the student&#39;s life\&#34; and was \&#34;methodical in her actions\&#34;.\n\n\&#34;She&#39;s a threat to children based on what she has done to me and should be monitored. I believe she is currently doing this to a former student of Ankeny Centennial as well,\&#34; the victim&#39;s report reads in part.\n\nContent on her electronic devices aligned with the victim&#39;s report to the school district, according to court documents.\n\nWhiteside is charged with:\n- Sexual Abuse in the Third Degree\n- Sexual Exploitation by a School Employee (four counts)\n- Lascivious Conduct with a Minor\n\nWhiteside turned herself in to the Ankeny Police Department the morning of Feb. 21, 2024, and has since been transported to the Polk County Jail.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;possible-additional-victims&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 305, &#34;case_id&#34;: 248, &#34;case_name&#34;: &#34;State v. Rogers&#34;, &#34;source&#34;: &#34;People Magazine / Manthan C.&#34;, &#34;date&#34;: &#34;2024-07-17&#34;, &#34;text&#34;: &#34;Arizona Teacher Accused of Sexually Abusing Teen Who Had Run Away from Home, was Missing for Months\nBy Manthan C., Updated July 17, 2024\n\nA Lake Havasu City, Arizona, teacher has been arrested on accusations that she sexually abused a 17-year-old who had been missing for months.\n\nAccording to AZ Family, 44-year-old Robyn Rogers was arrested on Thursday, July 11, after the Lake Havasu City Police Department received a tip about the teenager&#39;s location.\n\nPolice said officers arrived at the location, they met with Rogers, who was allegedly hiding the 17-year-old. The teen had reportedly ran away from home in February, the outlet reported. Investigators found that Rogers was sexually involved with the teenager.\n\nLocal news outlet The Bee reported that the teenager was missing since Feb. 14, and an investigation began two days later regarding his disappearance.\n\nRogers was charged with three counts of sexual conduct with a minor, along with hindering prosecution, false reporting to law enforcement, possession of narcotic drugs and possession of drug paraphernalia, AZ Family reports.\n\nLocal news outlet Havasu News noted that Rogers taught at the charter school, Telesis Preparatory Academy. She reportedly worked as a life skills and child development teacher and was a cheerleading coach, though her name has been removed from the school&#39;s staff directory.\n\nThe district&#39;s superintendent told the outlet, \&#34;The staff member is no longer employed at our school. We do not have any additional information.\&#34;\n\nRogers is being held on a $30,000 bond in the custody of the Mohave County Sheriff&#39;s Office.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;drugs&#34;, &#34;charge-reduction&#34;, &#34;private-school&#34;, &#34;victim-in-home&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 306, &#34;case_id&#34;: 248, &#34;case_name&#34;: &#34;State v. Rogers&#34;, &#34;source&#34;: &#34;Mohave County Superior Court judgment (excerpt)&#34;, &#34;date&#34;: &#34;2024-09-20&#34;, &#34;text&#34;: &#34;Judgment of Guilt and Order Suspending Sentence \u2014 State v. Rogers\nMohave County Superior Court, September 20, 2024 [excerpt]\n\nIT IS THE JUDGMENT OF THE COURT that the Defendant is guilty of: Count 1 \u2013 Sexual Conduct with a Minor, a non-dangerous, non-repetitive, Class 6 Felony, in violation of A.R.S. \u00a7\u00a713-1405, 13-1401, 13-902, 13-701, 13-702 and 13-801, committed on or about July 10, 2024.\n\nUpon consideration of the offense, and the facts, law and circumstances involved in this case, the Court finds that the Defendant is eligible for probation. The specific reasons for the granting of probation are stated by the Court on the record.\n\nAs punishment for this crime:\nIT IS ORDERED suspending imposition of sentence and placing the Defendant on lifetime probation commencing on September 20, 2024, under the supervision of the Adult Probation Department of this Court, in accordance with the formal Judgment and Order suspending sentence and imposing terms of probation signed by the Court.\n\nAs a condition of probation,\nIT IS ORDERED that the Defendant be incarcerated in the Mohave County Jail for a period of 210 days with credit for 29 days served; the Defendant shall self-surrender to the Mohave County Jail to complete the sentence imposed no later than September 30, 2024, by 4:00 p.m. The Defendant will not be eligible for work release.\n\nIT IS ORDERED that the Defendant shall register as a sex offender for the remainder of her life.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 307, &#34;case_id&#34;: 249, &#34;case_name&#34;: &#34;People v. Damyan&#34;, &#34;source&#34;: &#34;CWBChicago&#34;, &#34;date&#34;: &#34;2021-02-13&#34;, &#34;text&#34;: &#34;Former North Side teacher pleads guilty to sexual abuse of 14-year-old student\nCWBChicago, February 13, 2021\n\nA Lakeview woman has pleaded guilty to sexually abusing a 14-year-old student from a North Side elementary school where she was a teacher in early 2019, according to court records.\n\nSara Damyan, 34, this week received a sentence of two years probation in exchange for pleading guilty to a single count of criminal sexual abuse by force. Judge Charles Burns oversaw the case.\n\nLast February, prosecutors said Damyan tutored the victim and other Alessandro Volta School students after hours and gave kids her phone number. She was employed as a special education instructor at the school in Albany Park.\n\nProsecutors said Damyan and the boy exchanged 12,000 text messages and phone calls. The boy began telling Damyan that he had feelings for her and she eventually invited her to her home, which was in the 2400 block of North Kedzie at the time.\n\nAt her home, Damyan allegedly gave the boy marijuana-laced tea and cannabis-infused gummy bears. She then sexually assaulted him and later texted him to say that he should not tell anyone about what happened, according to the state&#39;s initial allegations.\n\nThe boy returned to her home the next day, and a similar series of events unfolded, prosecutors said.\n\nProsecutors said she smuggled marijuana vaping devices onto school property inside a teddy bear and used them to smoke up with the student.\n\nDamyan allegedly told another adult that the teen was her boyfriend and that they had a sexual relationship. That adult works in a position that requires them to report potential abuse to authorities, and they followed through on that obligation in March 2019.\n\nCPS said they removed Damyan from classroom settings during their investigation, and she left their employment in September 2019.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;drugs&#34;, &#34;charge-reduction&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 308, &#34;case_id&#34;: 249, &#34;case_name&#34;: &#34;People v. Damyan&#34;, &#34;source&#34;: &#34;WLS ABC7 / Diane Pathieu&#34;, &#34;date&#34;: &#34;2020-02-18&#34;, &#34;text&#34;: &#34;Former Chicago Public Schools teacher Sara Damyan, 33, charged with sexually assaulting boy, 13, in Logan Square\nBy Diane Pathieu, WLS ABC7 Chicago\nFebruary 18, 2020\n\nCHICAGO (WLS) -- A former Chicago Public Schools special education teacher has been charged with criminal sexual assault against a 14-year-old boy.\n\nThe former educator, 33-year-old Sara Damyan, appeared in court Tuesday.\n\nDamyan worked at Albany Park&#39;s Alessandro Volta Elementary School where the victim was a student.\n\nAccording to the Illinois State&#39;s Attorney&#39;s Office, Damyan told the victim that she liked him and suggested that they \&#34;go out together,\&#34; although he expressed concern about their age difference.\n\nThe alleged abuse took place between January and March 2019, according to prosecutors.\n\nOn one occasion, Damyan invited the 14-year-old to her home in Logan Square and gave him cannabis gummy bears and vitamin tea laced with marijuana, prosecutors said.\n\nIt was only after Damyan told a friend what she was doing, calling the student \&#34;her boyfriend,\&#34; that the friend reported her actions to the school.\n\nDamyan was dismissed and an investigation initiated, resulting in her arrest Monday.\n\nParents, students, even fellow CPS teachers said they had no idea why she left and they were never made aware about the allegations.\n\n\&#34;CPS has a lack of regard for its students, so it just makes it really difficult,\&#34; said parent Jasmine Bates. \&#34;You are entrusting teachers and staff members to take care of your kids they are not using the best ability possible.\&#34;&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;sexting&#34;, &#34;drugs&#34;, &#34;emotional-manipulation&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 309, &#34;case_id&#34;: 250, &#34;case_name&#34;: &#34;State v. Anderson (Brooke)&#34;, &#34;source&#34;: &#34;Hillsborough County Sheriff&#39;s Office press release&#34;, &#34;date&#34;: &#34;2025-05-17&#34;, &#34;text&#34;: &#34;Riverview High School Teacher Arrested for Sexual Relationship With Student\nHillsborough County Sheriff&#39;s Office Press Release #25-97, May 17, 2025\n\nThe Hillsborough County Sheriff&#39;s Office has arrested a Riverview High School teacher accused of engaging in a sexual relationship with a student.\n\nOn May 16, 2025, detectives launched an investigation after receiving information about an inappropriate relationship between Brooke Anderson, 27, and a male student.\n\nThe student disclosed that the relationship began in September 2024, starting with sexually explicit text messages. In the weeks leading up to the arrest, the relationship escalated. The student reported multiple instances of sexual activity. The most recent incident occurred the morning of May 16, inside Anderson&#39;s classroom before the start of the school day.\n\n\&#34;This teacher betrayed the trust of a student, a school, and an entire community,\&#34; said Sheriff Chad Chronister. \&#34;What should have been a safe, supportive environment for learning was exploited for abuse. Her actions are criminal, calculated, and deeply disturbing.\&#34;\n\nCharges:\n1. Unlawful Sexual Activity with a Minor (F.S. 794.05) \u2014 2nd degree felony x3, offense dates on or about 05/01/2025\n2. Authority Figure Soliciting or Engaging in Lewd Conduct with a Student \u2014 2nd degree felony, offense date on or about 08/01/2024\n3. Transmission of Harmful Material to Minor \u2014 3rd degree felony x2, offense dates 04/20/2025 and 04/26/2025\n4. Unlawful Use of Two-Way Communications Device \u2014 3rd degree felony, offense date 04/20/2025&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 310, &#34;case_id&#34;: 251, &#34;case_name&#34;: &#34;State v. Lopez-Murray&#34;, &#34;source&#34;: &#34;NBC6 South Florida / Christian Col\u00f3n&#34;, &#34;date&#34;: &#34;2023-12-13&#34;, &#34;text&#34;: &#34;Ex-Hialeah &#39;rookie teacher of the year&#39; pleads guilty to sex crimes with 14-year-old\nBy Christian Col\u00f3n, NBC6 South Florida\nPublished December 13, 2023\n\nThe former &#39;rookie teacher of the year&#39; at a Hialeah high school entered her guilty plea to six charges for having sexual relations with a 14-year-old student.\n\nA former teacher at a South Florida middle school who was arrested for having sex with a 14-year-old former student more than two years ago pleaded guilty to multiple charges Wednesday.\n\nBrittiny Lopez-Murray, 33, entered a guilty plea to six charges, including lewd and lascivious battery, lewd and lascivious molestation of a child and electronic transmission harmful to minors.\n\nIn exchange, she was sentenced to two years of community control plus 10 years of probation, must register as a sex offender and must attend a program for mental disorder sex offenders.\n\nProsecutors said the plea deal was approved by the victim&#39;s family. Lopez-Murray didn&#39;t want to comment after her sentencing.\n\nLopez-Murray was a drama teacher at Hialeah Middle School when she was arrested in October 2021. She had previously been named \&#34;rookie teacher of the year\&#34; in 2017.\n\nA police report said Lopez-Murray started the relationship with the teenager in August 2021. The teen had been her student when he attended Hialeah Middle School, but was in high school at the time of the encounters.\n\nThe police report said the victim&#39;s sister became suspicious of his behavior and managed to get his phone, where she saw \&#34;explicit text messages and photos\&#34; between the teen and Lopez-Murray.\n\nThe boy&#39;s father later saw the phone, which had explicit photos that Lopez-Murray had sent, the report said. Text messages detailed \&#34;how much they enjoyed the sex with each other.\&#34;\n\nThe boy was interviewed by Hialeah police and told investigators Lopez-Murray sent him a text and they later met for coffee. He told police that led to multiple sex acts in her car, including in the parking lot at a mall and grocery store.\n\nIn some cases, she would pick him up from basketball practice, authorities said.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 311, &#34;case_id&#34;: 251, &#34;case_name&#34;: &#34;State v. Lopez-Murray&#34;, &#34;source&#34;: &#34;Dolman Law Blog&#34;, &#34;date&#34;: &#34;2021-10-04&#34;, &#34;text&#34;: &#34;Hialeah Middle School Teacher Arrested For Allegedly Having Sex with 14 Year Old Student\nDolman Law Blog, January 5, 2023 (case update; original arrest October 2021)\n\nA middle school teacher at an arts magnet school has been arrested after police said she had sex with a 14-year-old boy who was a former student of the drama teacher.\n\nThe drama teacher, who worked at Hialeah Middle, is accused of sexually abusing the boy in her car multiple times over a two-month period between August and October 2021.\n\nBrittiny Lopez-Murray, 31, was booked at Miami-Dade jail on multiple felonies, including lewd and lascivious battery, molestation, and engaging in a sexual act with a child.\n\nHer defense attorneys, Landon Ray and Jeff Chukwuma, told the Miami Herald, \&#34;she is presumed innocent until proven guilty. We hope everyone is patient, doesn&#39;t rush to judgment and respects the family&#39;s privacy.\&#34;\n\nThe Miami-Dade school district responded to the allegations saying that Lopez-Murray has been a teacher for four years and has not had any previous disciplinary actions. Lopez-Murray was also named \&#34;rookie teacher of the year\&#34; by Hialeah Middle in 2017.\n\nThe 14-year-old boy, who is currently in high school, was once one of Lopez-Murray&#39;s students. Lopez-Murray started to abuse the teenager in August, according to the police report.\n\nPolice were made aware of the possible sexual abuse after the victim&#39;s sister saw explicit text messages and photos between the teen and Lopez-Murray. The photos and text were then shown to the father and the police were involved.\n\nThe series of texts allegedly included nude photos of the teacher, details about past sex acts, and other information about times and places they had met.\n\nAccording to police detectives that interviewed the boy, she texted him in August 2021 and expressed her feelings toward the boy. They later met up on multiple occasions where she abused the boy in her car.\n\nWhen Hialeah detectives arrested Lopez-Murray on October 4, she invoked her right to remain silent and did not speak to the police.\n\nUPDATE: Lopez-Murray had her first appearance in court on October 5, 2021. The Judge ordered her to stay away from the victim and she is to have no unsupervised contact with minors. She posted bail in the amount of $185,000.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 312, &#34;case_id&#34;: 252, &#34;case_name&#34;: &#34;State v. Valle-Tejeda&#34;, &#34;source&#34;: &#34;NBC6 South Florida / Daniela Flamini&#34;, &#34;date&#34;: &#34;2021-03-26&#34;, &#34;text&#34;: &#34;Hialeah Teacher Sexually Abused Multiple Students for Years: Police\nBy Daniela Flamini, NBC6 South Florida\nPublished March 26, 2021\n\nA Hialeah teacher was arrested Friday for allegedly engaging in inappropriate and abusive sexual behavior with at least three underage students over the course of several years.\n\n41-year-old Jeanette Valle-Tejeda is facing various charges of child abuse, sexual battery and committing sex acts with a minor. She&#39;d been employed with Miami-Dade County public schools for twenty years.\n\nPolice were first alerted to the case when one of Valle-Tejeda&#39;s victims alerted the principal at Hialeah Senior High School, where Valle-Tejeda currently works.\n\nThe victim said that Valle-Tejeda had sexually molested her when she was a student at Henry H. Filer Middle School in 2009, and the abuse had continued for four years through her time at Westland Hialeah Senior High.\n\nAccording to an arrest report, Valle-Tejeda \&#34;groomed the victim as a mother figure, providing financial assistance and other needs.\&#34; The victim frequently slept overnight at the teacher&#39;s house.\n\nThe two would shower together, engage in sexual acts, and skip class time together, the arrest report said. An investigation found that they had missed school on 11 of the same days.\n\nDuring this time, they would reportedly go to the beach, restaurants, or Valle-Tejeda&#39;s house. Valle-Tejeda would allegedly sign the student out of school without her mother&#39;s permission and frequently excuse her from class.\n\nOther witnesses and victims told police that Valle-Tejeda had a similar relationship with multiple students, often using the technique of appearing as a mother figure in order to cement her relationship with them.\n\nA second victim said that the abuse lasted for three years, with much of the inappropriate activity taking place on school grounds. Valle-Tejeda reportedly asked her for phone sex and instructed her to masturbate over text, reminding her constantly to delete the conversations afterwards.\n\nA parent also complained in 2018 that Valle-Tejeda had invited several students over to her house and offered them alcohol. One witness told police it was known among her classmates that Valle-Tejeda&#39;s house was a \&#34;hang out\&#34; spot.\n\nA third victim said that when she was 17, she&#39;d spend time at nightclubs, bars and restaurants with Valle-Tejeda, eventually choosing to stop spending time with her at her house because Valle-Tejeda would reportedly become intoxicated.\n\n\&#34;Miami-Dade County Public Schools is deeply disturbed about the allegations made against this individual,\&#34; MDCPS said in a statement. \&#34;As soon as the claims surfaced last month, the employee was removed from the school setting and Miami-Dade Schools Police launched an investigation. The District will be terminating her employment and she will be prevented from seeking future work with this school system.\&#34;\n\nPolice took Valle-Tejeda into custody on Friday at a traffic stop on West 65th Street and West 4th Avenue. She was transported to Turner Guilford Knight Correctional Center.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;probation&#34;, &#34;prior-warning-ignored&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;possible-additional-victims&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 313, &#34;case_id&#34;: 252, &#34;case_name&#34;: &#34;State v. Valle-Tejeda&#34;, &#34;source&#34;: &#34;Miami-Dade PD Complaint/Arrest Affidavit (Case F21005350)&#34;, &#34;date&#34;: &#34;2021-03-26&#34;, &#34;text&#34;: &#34;Complaint/Arrest Affidavit \u2014 State v. Valle-Tejeda, Jeanette Barbara\nMiami-Dade Police Department, Arrest Date: 03/26/2021\nCourt Case No: F21005350, Police Case No: 210225062077\n\nDefendant: VALLE-TEJEDA, JEANETTE BARBARA. DOB: 08/06/1979. Age 41. Occupation: TEACHER. Address: 242 E 35TH ST, HIALEAH, FL 33013. Business address (school): 251 E 47TH ST, HIALEAH, FL 33013.\n\nCHARGES (11 counts):\n1. F/2 - Offenses Against Students by Authority Figures (F.S. 800.101(3)) - 2nd degree felony\n2. F/C - Sexual Battery/On a Minor by an Adult (F.S. 794.011(2)) - 2nd degree felony (capital)\n3. F/1 - Engage Sex Act Child Family/Custodial/Before 4/1/14 (F.S. 794.011(8)(B)) - 2nd degree felony\n4. F/2 - Unlawful Sexual Activity with Specified Minor (F.S. 794.05) - 2nd degree felony\n5. F/2 - Lewd Assault/Child/Under 16 (F.S. 800.04(3)) - 2nd degree felony\n6. F/3 - Lewd/Lascivious Battery on a Child 12-16 Yrs (F.S. 800.04(4)) - 3rd degree felony\n7. F/2 - Lewd/Lascivious Battery/Sexual Activity (F.S. 800.04(4)(A)(1)) - 2nd degree felony\n8. F/3 - Child Abuse/No Great Bodily Harm (F.S. 827.03(2)(C)) - 3rd degree felony\n9. F/3 - Tampering with Physical Evidence/Attempt (F.S. 918.13(1)(A)) - 3rd degree felony\n10. M/1 - Luring or Enticing a Child (F.S. 787.025(2)(A))\n11. M/2 - Lewd and Lascivious Behavior (F.S. 798.02)\n\nAFFIDAVIT NARRATIVE SUMMARY (redacted victims identified as V-1, V-2, V-3):\n\nOn February 25, 2021, V-1 reported to the Hialeah High School principal that Jeanette Valle-Tejeda had sexually molested her when she was a student at Henry H. Filer Middle School in 2009, and the abuse continued through her high school years at Westland Hialeah Senior High.\n\nInvestigation revealed: the relationship began when V-1 was 14 years old and ended at 19. The offender groomed V-1 as a mother figure providing financial assistance and other needs. They visited the subject&#39;s residence several times, sleeping overnight. On several occasions, the offender showered with V-1, kissed her, and ultimately engaged in oral sex. The offender penetrated V-1&#39;s vagina with her finger causing her to bleed and, in doing so, losing her virginity. Investigation revealed V-1 and the offender were absent from school 11 times during the same days.\n\nOn school grounds at Henry Filer Middle School and later Westland Hialeah Senior High, they maintained a close lascivious relationship that included kissing, touching, and penetration. The offender ate lunch alone with V-1 in the offender&#39;s classroom, excused V-1 from another class so she could be alone with her, and signed V-1 out of school without her mother&#39;s consent. V-1 also stated the offender would sign her out of school without her mothers consent.\n\nThe offender presented herself to V-1&#39;s mother as a trustworthy person seeking to help her daughter, who accepted the offender&#39;s help and allowed the teacher to take V-1 to school and bring her home without knowing the offender&#39;s real lewd intentions.\n\nV-1 informed investigators that she was not the only victim, and provided names of possible victims V-2 and a witness.\n\nOn March 9, 2021, investigators interviewed V-2, a student at Henry Filer Middle School from 2009-2011. V-2 described the offender as a mother figure and heard rumors about the romantic relationship between the offender and V-1. V-2 also told investigators that the offender and V-1 were having a weird relationship. V-2 confirmed that V-1 had slept over at the offender&#39;s residence a lot, and that numerous students visited the offender&#39;s home to hang out.\n\nInvestigators contacted V-2 (V-2 in the affidavit), who was her reading teacher at Henry Filler Middle School (2007). They were involved in a romantic relationship when she was 11 years old. The offender took advantage of the fact that V-2 was constantly disagreeing with her parents and stepped in as a mother figure. The offender would excuse V-2 from her other classes to spend more time together in her classroom. In sixth grade (2007), V-2 alleges the offender kissed her while alone in the classroom, saying \&#34;I&#39;m sorry, I just really had to do that.\&#34; Their romantic relationship continued for approximately three years, with most of the inappropriate activity happening on school grounds. This activity included kissing, touching, and penetration. V-2 stated she and the offender would have phone sex with the offender instructing her how to masturbate; the offender always reminded V-2 to erase the messages.\n\nOn March 17, 2021, investigators interviewed V-3. According to V-3, she met the offender at Hialeah High School in her junior year (17 years old). The offender constantly communicated by text messages, always reminding V-3 to erase the messages. V-3 stated the offender excused her from her other classes to spend more time together in her classroom. The offender met with V-3 at different places like Hooters, Flanigans, and nightclubs. The offender complimented V-3&#39;s legs and touched them on various occasions. V-3 says she stopped spending time at the offender&#39;s residence because the offender would become intoxicated.\n\nOn February 26, 2021, the Hialeah High School principal provided a copy of the summary of the conference for the record issued to the offender on September 17, 2018, after a mother complained about the offender inviting her daughter and son to the offender&#39;s residence, where alcohol was served to minors. Her daughter is V-3.\n\nOn March 26, 2021, offender was observed on West 65th Street and West 4th Avenue where a traffic stop was conducted. Offender was taken into custody and transported to TGK via Headquarters Station. Vehicle removed and towed. Cell phone was impounded at M-DSPD property room. Offender was read her Miranda rights and invoked her rights at this time. Offender was arrested and transported to TGK.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;sexting&#34;, &#34;prior-warning-ignored&#34;, &#34;alcohol&#34;, &#34;evidence-tampering&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 314, &#34;case_id&#34;: 252, &#34;case_name&#34;: &#34;State v. Valle-Tejeda&#34;, &#34;source&#34;: &#34;Miami-Dade Circuit Court judgment (Case F21005350)&#34;, &#34;date&#34;: &#34;2022-09-15&#34;, &#34;text&#34;: &#34;Criminal Finding of Guilt and Order of Withholding Adjudication\nMiami-Dade Circuit Court, Eleventh Judicial Circuit, Division F009\nCase Number: F21005350 \u2014 The State of Florida vs. Jeanette Barbara Valle-Tejeda\nSeptember 15, 2022\n\nThe defendant being personally before the court accompanied by her attorneys, DIEGO WEINER, PA and JEFFREY S WEINER, PA, has been found guilty of the charge of:\n\nCount 1: CHILD ABUSE/AGGRAV/GREAT BOD HARM/TORTURE \u2014 1st degree felony\nCount 2: CHILD ABUSE/AGGRAV/GREAT BOD HARM/TORTURE \u2014 1st degree felony\n\nby the court upon the entry of a guilty plea.\n\nIt appearing unto the court, upon a hearing of the matter, that the defendant is not likely to engage in a criminal course of conduct and the ends of justice and welfare of society do not require that the defendant shall presently suffer the penalty imposed by law, it is ORDERED and ADJUDGED that an adjudication of guilt be, and the same is hereby stayed and withheld.\n\nIT IS FURTHER ORDERED AND ADJUDGED that:\nThe defendant is placed on COMMUNITY CONTROL in a separate Order entered herein. NO GPS. Followed by PROBATION.\n\nSPECIAL CONDITIONS: Costs; DNA not taken; COMMUNITY CONTROL/PROBATION\n\nCourt costs ordered: $1,050.00 total (including $302.00 additional court cost for crimes against minors).\n\nDONE AND ORDERED in Open Court in Miami-Dade County, Florida this 15th day of September, 2022.\nJUDGE JOSEPH D. PERKINS, Circuit Court Judge, Div. F009&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 315, &#34;case_id&#34;: 253, &#34;case_name&#34;: &#34;State v. Moser&#34;, &#34;source&#34;: &#34;KVLY / Bailey Hurley&#34;, &#34;date&#34;: &#34;2018-11-05&#34;, &#34;text&#34;: &#34;Former WF teacher sentenced after sex related crimes with students\nBy Bailey Hurley, KVLY\nPublished: November 5, 2018\n\nUPDATE: A Cass County judge sentenced former West Fargo teacher Shannon Moser to 15 years Monday morning.\n\nMoser will have to serve 10 years with 5 years of supervised probation. Moser will also have to register as a sex offender.\n\nThe courtroom was packed this morning with tearful family, friends, members of her church and faculty of West Fargo Schools.\n\nWe didn&#39;t hear from any of Moser&#39;s victims, but we did hear an emotional apology from Moser herself who said she feels like she &#39;doesn&#39;t deserve life or breath&#39; for her actions.\n\nORIGINAL: A sentencing date has been set for a former West Fargo teacher that pleaded guilty to sex crimes with students.\n\nShannon Moser will be sentenced on November 5th in Cass County District Court.\n\nShe pleaded guilty August 27th to sexual assault, gross sexual imposition, and four counts of luring minors by computer.\n\nMoser was a teacher at Liberty Middle School since 2016. She resigned earlier this year.\n\nMoser was originally also charged with two counts of a use of a minor in a sexual performance, however both of those were dismissed.\n\nCourt documents revealed there are six victims total, and that Moser had sexual contact with two of them. One of those victims being 15 and the other only 14-years-old.\n\nDocuments also say some of these incidents have been going on since May 2016.\n\nShe&#39;s facing five years to life in prison.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 316, &#34;case_id&#34;: 253, &#34;case_name&#34;: &#34;State v. Moser&#34;, &#34;source&#34;: &#34;KVLY / Bailey Hurley&#34;, &#34;date&#34;: &#34;2018-07-24&#34;, &#34;text&#34;: &#34;Former students of Shannon Moser &#39;not surprised&#39; about recent sex charges\nBy Bailey Hurley, KVLY\nPublished: July 24, 2018\n\nBail has been set at 30 thousand dollars for a West Fargo teacher accused of luring a minor and sex-related crimes.\n\nA Cass County judge ordered 37-year-old Shannon Moser cannot have any contact with the 2 juvenile male victims -- and she cannot use any form of social media.\n\nThree former students of Moser reflect on uncomfortable times in her classroom as well as outside of it; saying it&#39;s about time something was done about her behavior.\n\n\&#34;When I would be talking about parties that I would have, she&#39;d always ask, &#39;Oh am I invited?&#39; And then she&#39;d ask me who&#39;s invited and if there were boys there she would get excited. Which is kind of something you do when you&#39;re in my grade, not when you&#39;re 37,\&#34; former student #1 said.\n\nThey say their biggest concern was the way Moser acted on social media. Specifically the app Snapchat.\n\n\&#34;When I was added on her Snapchat, she would post pictures on her story of her in bikinis and I thought that was a little weird because I knew she had all the boys in our grade on her Snapchat,\&#34; former student #2 said.\n\n\&#34;When she would Snapchat me, it was always pictures of her legs, pictures of her face or her in the shower. She&#39;d Snapchat me in the shower, which I thought was very inappropriate,\&#34; former student #1 said.\n\nThey added that Moser made at least three different accounts on the app. Saying she usually only kept young boys as her contacts.\n\n\&#34;I thought it was sketchy when she started getting new social media and she told us she didn&#39;t want her husband to know about it,\&#34; former student #2 said.\n\nOne woman was a student of Moser&#39;s over 10 years ago at Park Christian High School, but says the behavior was the same.\n\n\&#34;She was extremely unprofessional, and frankly didn&#39;t act like a teacher. She kind of just acted like she wanted to be a student.\&#34; former student #3 said.\n\nShe adds that Moser gave most of her attention to the boys in her classroom, which is a problem she also had in West Fargo.\n\n\&#34;She just acted differently. She would wear different clothes when she was around boys our age,\&#34; former student #2 said.\n\nVideo exclusive to Valley News Live shows Shannon Moser straddling a student in her classroom last year. Students add that the actions in this video weren&#39;t uncommon to see in her classroom.\n\n\&#34;It hurts me because she was super close to me and she did all this stuff that she knew from the beginning was not okay and she could have stopped,\&#34; former student #1 said.\n\n\&#34;This is bad. This is not just you cheating on your husband this is you being a pedophile,\&#34; former student #3 said.\n\nMoser&#39;s husband, Brett, was a pastor at the River City Church in Fargo, and he&#39;s being put on administrative leave.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;possible-additional-victims&#34;, &#34;on-campus&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 317, &#34;case_id&#34;: 253, &#34;case_name&#34;: &#34;State v. Moser&#34;, &#34;source&#34;: &#34;West Fargo Police Department press release&#34;, &#34;date&#34;: &#34;2018-07-23&#34;, &#34;text&#34;: &#34;In June 2018 the West Fargo Police Department received anonymous information regarding possible sexual contact involving an adult female and a juvenile male. The monthlong investigation has resulted in charges being filed with the Cass County State&#39;s Attorney&#39;s office against the suspect, Shannon Moser, 37 years old, for Luring a Minor and sex-related crimes with two male juveniles. Moser had been a teacher in the West Fargo School District, at Liberty Middle School since the 2016-2017 school year but resigned July 12, 2018. The two juvenile males are students in West Fargo, and are between the ages of 14 and 16. This case is still an active investigation.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;]}, {&#34;id&#34;: 318, &#34;case_id&#34;: 254, &#34;case_name&#34;: &#34;State v. McCrea&#34;, &#34;source&#34;: &#34;Child Molestation Institutional Abuse in the News&#34;, &#34;date&#34;: &#34;2015-10-01&#34;, &#34;text&#34;: &#34;Washington High School Drama Teacher Sentenced to Prison for Sex with Student\nOctober 1, 2015 \u2014 Child Molestation Institutional Abuse in the News\n\nVANCOUVER, WA \u2014 Stephanie McCrea, 36, a former drama teacher at Evergreen High School was sentenced to five years in prison Wednesday. McCrea was arrested in January and in July, pleaded guilty to four counts of child rape and tampering with a witness. According to news reported, the victim told investigators that he had a sexual relationship with his teacher that started in December of 2014. McCrea is separated from her husband and has a 9-year-old son. Court documents stated that McCrea had rehearsed what to say with the boy if they were ever interviewed by law enforcement. Even after allegations first surfaced, McCrea continued communicating with the boy, even creating a fake Facebook account to talk with him. The sentencing Wednesday was part of McCrea&#39;s plea deal; she is due back in court on October 14th for her formal sentencing.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;evidence-tampering&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 319, &#34;case_id&#34;: 254, &#34;case_name&#34;: &#34;State v. McCrea&#34;, &#34;source&#34;: &#34;The Oregonian / Stuart Tomlinson&#34;, &#34;date&#34;: &#34;2015-02-11&#34;, &#34;text&#34;: &#34;Evergreen High teacher Stephanie McCrea pleads not guilty to child rape of 15-year-old student\nBy Stuart Tomlinson, The Oregonian/OregonLive\nPublished: February 11, 2015\n\nThe boy also told police that he and McCrea had intercourse again at the school after Christmas break, according to court documents.\n\nProsecutors said McCrea and the boy agreed to set up fake Facebook accounts to avoid detection. The sexual abuse went on after McCrea had been placed on administrative leave, the prosecutor said. McCrea faces four counts of third-degree child rape, one count of witness tampering and four counts of sexual misconduct.\n\nIn court documents, defense attorney Thayer said McCrea separated from her husband in late December and attempted suicide two weeks later. He said she began to suffer from mental health issues following a 2012 car accident.\n\nMcCrea applied in April 2014 to renew her teaching certificate and also applied for a professional teacher certification through the Washington state Office of Superintendent of Public Instruction.\n\nOn her application for the professional teaching certificate, according to state documents, McCrea was required to show that she had taken course work or a course relating to issues of abuse.\n\nBecky Young, whose son is not involved in the case but was in a class taught by McCrea, attended Wednesday&#39;s arraignment. She said the news of McCrea&#39;s arrest \&#34;crushed\&#34; her son.\n\n\&#34;My son considered her a friend and that&#39;s where the line has been blurred,\&#34; Young said. \&#34;It&#39;s frustrating because the truth is out there. My son looked up to her and she abused that right.\&#34;\n\nKimberly Boucher, a former student at the high school who worked on school plays under McCrea&#39;s direction, came to support the suspended teacher.&#34;, &#34;tags&#34;: [&#34;evidence-tampering&#34;, &#34;on-campus&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 320, &#34;case_id&#34;: 255, &#34;case_name&#34;: &#34;United States v. Carazas-Pinez&#34;, &#34;source&#34;: &#34;DOJ Press Release, U.S. Attorney&#39;s Office SDNY&#34;, &#34;date&#34;: &#34;2025-09-19&#34;, &#34;text&#34;: &#34;Former Yonkers Teacher Sentenced To 25 Years In Connection With Sexual Exploitation Of Minor Student\nU.S. Attorney&#39;s Office, Southern District of New York, September 19, 2025\n\nUnited States Attorney for the Southern District of New York, Jay Clayton, announced today that SANDY CARAZAS-PINEZ was sentenced to 25 years in prison for enticing a minor to engage in illegal sexual activity. CARAZAS-PINEZ&#39;s sentence was imposed by U.S. District Judge John P. Cronan, who also presided over her guilty plea.\n\n\&#34;Sexual exploitation by teachers offends every New Yorker,\&#34; said U.S. Attorney Jay Clayton. \&#34;Sandy Carazas-Pinez betrayed her role and, through explicit texts and other means, coerced a 16-year-old into a sexual relationship. Actions of this type by anyone, particularly a teacher or other person of trust, will not be tolerated.\&#34;\n\nAccording to the court documents and statement made during court proceedings:\n\nCARAZAS-PINEZ was a high school teacher at a school for kindergarten through 12th grade students located in Yonkers, New York (\&#34;School-1\&#34;). From in or around November 2022 through February 2023, CARAZAS-PINEZ abused her position as a teacher at School-1 by inducing and attempting to induce a student (\&#34;Minor Victim-1\&#34;) at School-1 into a sexual relationship with CARAZAS-PINEZ. Minor Victim-1 was 16 years old at the time of the abuse.\n\nCARAZAS-PINEZ singled out Minor Victim-1 for personal attention at School-1. In addition, CARAZAS-PINEZ induced Minor Victim-1 to engage in sexual activity with her by leading Minor Victim-1 to believe that they were in a romantic relationship.\n\nCARAZAS-PINEZ used her personal cellphone to call, text, and video call Minor Victim-1 to arrange sexual encounters and to repeatedly induce Minor Victim-1 to engage in live-streamed sexually explicit conduct while on video calls with CARAZAS-PINEZ. In text messages with Minor Victim-1, CARAZAS-PINEZ referred to her sexual encounters with Minor Victim-1 and the live depictions of sexually explicit conduct she induced Minor Victim-1 to create as \&#34;gifts.\&#34;\n\nCARAZAS-PINEZ also used her personal cellphone to send Minor Victim-1 sexually suggestive photographs of herself along with sexually explicit text messages. After sending the photographs and messages, CARAZAS-PINEZ instructed Minor Victim-1 to delete them and inquired repeatedly as to whether Minor Victim-1 had done so.\n\nTo facilitate their sexual encounters outside the premises of School-1, CARAZAS-PINEZ directed Minor Victim-1 in text messages to obtain day passes from School-1 to be permitted to leave campus. CARAZAS-PINEZ then met Minor Victim-1 at a location near School-1&#39;s campus and drove Minor Victim-1 to another location. On multiple occasions, while parked in CARAZAS-PINEZ&#39;s car at various locations, including in or around the Bronx, Yonkers, and Staten Island, New York, CARAZAS-PINEZ engaged in sexual intercourse and other sexual acts, and attempted to do so, with Minor Victim-1.\n\nIn addition to the prison term, CARAZAS-PINEZ, 36, of Bethel, Connecticut, was sentenced to five years of supervised release.\n\nThe prosecution of this case is being handled by the Office&#39;s Civil Rights and Human Trafficking Unit in the Criminal Division. Assistant U.S. Attorney Mitzi S. Steiner is in charge of the prosecution.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;csam-distribution&#34;, &#34;federal&#34;, &#34;fbi&#34;, &#34;emotional-manipulation&#34;, &#34;special-needs-victim&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 321, &#34;case_id&#34;: 255, &#34;case_name&#34;: &#34;United States v. Carazas-Pinez&#34;, &#34;source&#34;: &#34;New York Post / Susan Edelman&#34;, &#34;date&#34;: &#34;2024-05-25&#34;, &#34;text&#34;: &#34;Special needs teacher caught sexually abusing student on camera \u2014 but the school didn&#39;t monitor the video: suit\nBy Susan Edelman, New York Post\nPublished May 25, 2024\n\nClassroom cameras at a costly taxpayer-funded boarding school for autistic, mentally ill and emotionally disturbed students captured a biology teacher sexually abusing a boy \u2014 but no one monitored the video, a bombshell lawsuit alleges.\n\nOnly after the student told his mom that he had sex repeatedly with Sandy Carazas-Pinez, a teacher at Biondi High School, did the principal watch the video. It showed the instructor cuddling with the 16-year-old during class and asking him to \&#34;rub her crotch,\&#34; the suit by the boy and his mother charges.\n\nIn July 2023, Carazas-Pinez, 34, a married mother of three who formerly taught in two city public schools, was charged criminally in Manhattan federal court with luring the teen into a sexual relationship and convincing him to appear with her on an X-rated livestream video call.\n\nFor three years, from 2020 to 2023, the NYC Department of Education paid Biondi for the boy&#39;s tuition, room and board, psychological treatment, and 24-hour supervision. The cost likely exceeded $100,000 a year.\n\nAmong her many texts to the teen, the lawsuit states, Carazas-Pinez wrote, \&#34;I love that you were holding and hugging me in school,\&#34; and \&#34;I call you crazy when you try to finger me in class.\&#34;\n\nThe school let the youth leave campus for hours at a time on a \&#34;day pass\&#34; without his mother&#39;s permission. On dozens of outings, Carazas-Pinez met the boy at a nearby Dunkin&#39; Donuts and they had sex in her car, the lawsuit says.\n\nCarazas-Pinez sent the boy nude photographs of herself and lewd text messages \u2014 including one saying she was \&#34;sore\&#34; after he gave her a \&#34;workout,\&#34; records show.\n\nWhen the youth tried to stop the sexual activity, the suit says, Carazas-Pinez threatened to fail him in class or kill herself, which traumatized the teen, a schizophrenic who had attempted suicide.\n\n\&#34;Had the school followed even their own most basic safety protocols, they could have prevented the horrific, repeated and ongoing abuse that had occurred under their own roof,\&#34; said lawyer Lesley Brovner of the law firm Peters Brovner.\n\nSeveral months after Carazas-Pinez was arrested in 2023, the Biondi School permanently closed because it \&#34;was not financially viable,\&#34; said Jennifer Scott, a spokeswoman for Rising Ground, Inc., the Brooklyn non-profit that ran Biondi.\n\nConnecticut-based iPark purchased the 28-acre campus for $52.6 million and plans to use the site for film studios and a performing arts school.\n\nThe Biondi scandal is a black eye for Rising Ground, which has collected $374 million in NYC funds for various services since 2018. The institution, which fired Carazas-Pinez after discovering her misconduct, declined to comment on the suit.\n\nThe disgraced teacher was jailed this month after a judge found she violated her bail conditions while staying with her parents in Staten Island.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;behavioral-health&#34;, &#34;csam-distribution&#34;, &#34;federal&#34;, &#34;emotional-manipulation&#34;, &#34;special-needs-victim&#34;, &#34;on-campus&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 322, &#34;case_id&#34;: 255, &#34;case_name&#34;: &#34;United States v. Carazas-Pinez&#34;, &#34;source&#34;: &#34;NBC4 New York&#34;, &#34;date&#34;: &#34;2023-07-13&#34;, &#34;text&#34;: &#34;Sandy Carazas-Pinez, 34, formerly taught high school in Yonkers, New York at a K-12 school. She allegedly enticed a 16-year-old student to take part in sexual activities, told the student to perform sexual acts while on video calls with her, and exchanged explicit texts and photos with the student. She is also accused of meeting the teen outside of school grounds several times for sex. The alleged abuse occurred between November 2022 and February 2023. Carazas-Pinez was arrested Wednesday morning. She is being charged with enticing a minor victim to engage in illegal sexual activity and production of child pornography. If convicted, Carazas-Pinez could face anywhere from 10 years to a life sentence for the first charge and 15 to 30 years for the child pornography charge. The investigation is still ongoing.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;csam-distribution&#34;, &#34;federal&#34;, &#34;special-needs-victim&#34;]}, {&#34;id&#34;: 323, &#34;case_id&#34;: 256, &#34;case_name&#34;: &#34;Wisconsin v. Allemang-Reinke&#34;, &#34;source&#34;: &#34;Milwaukee Journal Sentinel&#34;, &#34;date&#34;: &#34;2025-07-15&#34;, &#34;text&#34;: &#34;Rufus King teacher pleads guilty to sexual misconduct charge\nBy Ariela Lopez, Milwaukee Journal Sentinel\nUpdated July 15, 2025\n\nA former teacher at Rufus King High School pled guilty to sexual misconduct after accusations of inappropriate behavior towards four of her students surfaced earlier this year.\n\nErica Allemang-Reinke, 40, will face 24 months of probation for one felony count of sexual misconduct by a school staff member and one misdemeanor count of disorderly conduct. Allemang-Reinke also forfeited her teaching license as part of the plea deal.\n\nAt a July 15 hearing in Milwaukee County Circuit Court, two of the four students who had accused the teacher of misconduct \u2014 and two of their parents \u2014 testified to the impact the teacher&#39;s conduct had on their mental health and educational careers.\n\n\&#34;The amount of damage Erica has done in my family and to my child, is unmeasurable,\&#34; Rufus King parent Raylena Windmon said at the hearing.\n\nAllemang-Reinke has been a teacher since 2008, and employed at Rufus King since the 2013-14 school year, according to her attorney, Craig Mastantuono. She apologized for her actions during the hearing.\n\n\&#34;I am so sorry to parents and students that I&#39;ve hurt,\&#34; Allemang-Reinke said. \&#34;I have been seeking therapy due to this incident, and I&#39;ve come to the realization that I&#39;ve had an issue with boundaries. It just has never come into fruition until my 17th year of teaching, due to the fact that I felt more students seem to have more social needs this past year.\&#34;\n\n\&#34;It was not my job to fulfill those social needs.\&#34;\n\nOn April 21, Allemang-Reinke was charged with four felony counts of sexual misconduct by a school staff member or volunteer. According to the criminal complaint filed in the case, students on the basketball team at Rufus King High School told a school resource officer on April 15 that Allemang-Reinke had been inappropriately contacting them throughout the 2024-25 school year.\n\nThe north side magnet school&#39;s principal communicated to parents on April 16 that a teacher was not working while an investigation was conducted, but did not name Allemang-Reinke. According to the teacher&#39;s attorney, Allemang-Reinke found out about the charges filed against her from the news, and she turned herself in to police.\n\nAccording to the complaint, students alleged Allemang-Reinke asked for them to share their phone numbers and locations with her. They claim she sent them cash or gifts, made inappropriate comments and \u2014 in one case \u2014 touched a student inappropriately. One student also said that Allemang-Reinke offered to perform a sex act with them, which the student declined.\n\nWhen the charges were filed, the four student victims were all between the ages of 16 and 18.\n\nAs part of a plea deal, Allemang-Reinke pled guilty to the first sexual misconduct charge, and to a lesser second charge of disorderly conduct. The third and fourth sexual misconduct charges were dismissed.\n\nShe was sentenced to 18 months of initial confinement in prison and an additional two years of extended supervision on the first charge, and 90 days in the Community Reintegration Center on the second charge. However, the judge stayed both sentences, instead placing the former teacher on probation for two years.\n\nA \&#34;stayed\&#34; sentence means the sentence is not imposed as long as certain conditions are met. In this case, those conditions include not contacting any of the victims or Rufus King High School, no unsupervised contact with any individuals under 18 except for relatives, forfeiting her teaching license, undergoing a sex offender assessment and maintaining employment.\n\nAllemang-Reinke will also pay restitution to three victims and relatives, totaling $3,004.\n\nMastantuono noted the teacher demonstrated an \&#34;extraordinary\&#34; amount of cooperation with the law enforcement investigation into the charges against her. After turning herself in for arrest, Allemang-Reinke spent four days in custody. She consented to let Milwaukee Police Department officers search her phone.\n\nAs of July 15, Allemang-Reinke&#39;s teaching license is listed as \&#34;under investigation\&#34; on the Wisconsin Department of Public Instruction registry, as it has been since at least April 22.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;gifts&#34;, &#34;cash&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 324, &#34;case_id&#34;: 256, &#34;case_name&#34;: &#34;Wisconsin v. Allemang-Reinke&#34;, &#34;source&#34;: &#34;FOX6 News Milwaukee&#34;, &#34;date&#34;: &#34;2025-07-15&#34;, &#34;text&#34;: &#34;Rufus King High School teacher sexual misconduct case; plea entered, sentence handed down\nBy FOX6 News Digital Team\nPublished July 15, 2025\n\nErica Allemang-Reinke, a former Milwaukee Rufus King High School teacher accused of sexually harassing four student athletes, was in court on Tuesday, July 15 for a plea and sentencing hearing.\n\nOnline court records indicate Allemang-Reinke pleaded guilty to two charges against her \u2013 sexual misconduct by school staff or volunteer and disorderly conduct. Two other sexual misconduct charges were dismissed but read into the court record for the purposes of sentencing.\n\nAfter the pleas were entered, a Milwaukee County judge sentenced Allemang-Reinke to two years of probation \u2013 which includes six months in jail with Huber release in the first six months.\n\nAccording to a criminal complaint, four students approached a school resource officer in April about the teacher inappropriately contacting them throughout the school year.\n\nErica Allemang-Reinke, known as \&#34;Mrs. A\&#34;, was charged with three counts of sexual misconduct by school staff and one count of disorderly conduct.\n\nAll the student athletes were interviewed by police.\n\nCourt filings said one student said Allemang-Reinke texted them a sexually explicit message, which the student said was inappropriate, and she apologized. She later offered the student a sexual favor, which the student declined and then avoided her afterward.\n\nAnother student told police that Allemang-Reinke caressed their inner thigh when she was talking to them in the classroom, per the complaint. The student stated that the contact made them feel uncomfortable, prompting them to move her hand away and tell her they did not appreciate the gesture. The complaint said Allemang-Reinke responded: \&#34;I&#39;m an affectionate person.\&#34;\n\nAllemang-Reinke also sent a student more than $700 via Cash App and used the financial gifts as a form of leverage. She also tried to sit on the student&#39;s lap, but the student didn&#39;t allow it. There was also texting between the two, with Allemang-Reinke texting the student-athlete in the middle of the night about having a \&#34;weird feeling\&#34; about the student.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;gifts&#34;, &#34;cash&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 325, &#34;case_id&#34;: 257, &#34;case_name&#34;: &#34;North Carolina v. Doll&#34;, &#34;source&#34;: &#34;WRAL&#34;, &#34;date&#34;: &#34;2022-09-21&#34;, &#34;text&#34;: &#34;West Johnston High teacher charged with statutory rape of student bonds out of jail\nBy WRAL Staff\nUpdated September 21, 2022\n\nA West Johnston High School teacher who was charged with statutory rape of a student has bonded out of jail.\n\nPreviously, a judge reduced the bond to $75,000 for Amanda Doll. Prior to that, Doll&#39;s bond had stood at $1 million.\n\nA Johnston County Jail spokesperson confirmed Doll bonded out within the last few days on Wednesday night.\n\nDoll, 37, of Clayton is charged with statutory rape for a student younger than the age of 15. She is also charged with sexual act with a student and indecent liberties with a student.\n\nCourt documents list one victim&#39;s name. Warrants show the student attended West Johnston High School and is younger than 15 years old.\n\nEarlier this month, Doll appeared before a judge and asked for a lower bond, saying that she has four kids and works full-time to support them. The judge initially denied her request on Sept. 6.\n\nA spokesperson for Johnston County Schools said that Doll resigned from her position as English teacher on Sept. 2. She first started out as a substitute teacher in the school system and then was hired as an English teacher in August 2021.\n\nAn arrest warrant shows the alleged sexual abuse happened on Aug. 12.\n\nDoll, who was once nominated for \&#34;Teacher of the Year,\&#34; is due back in court on Thursday for a probable-cause hearing.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 326, &#34;case_id&#34;: 257, &#34;case_name&#34;: &#34;North Carolina v. Doll&#34;, &#34;source&#34;: &#34;WTVD (ABC11)&#34;, &#34;date&#34;: &#34;2022-09-06&#34;, &#34;text&#34;: &#34;Former Johnston Co. high school teacher accused of statutory rape appears in court; bond set at $1M\nBy Cindy Bae, WTVD\nTuesday, September 6, 2022\n\nSMITHFIELD, N.C. -- A former Johnston County high school teacher who is charged with sexually abusing a student appeared in court on Tuesday.\n\nAmanda Doll, 37, is being held on a $1 million dollar bond on charges of statutory rape and taking indecent liberties with a child. Doll asked the judge to lower her bond so she could get home to her children. The judge denied her request.\n\nDoll said in court that her husband is working on legal representation for her. However, the judge went ahead and assigned her a court-appointed attorney.\n\nUntil her arrest on Friday, Doll was an English teacher at West Johnston High School.\n\nShe is accused of having sex with a 15-year-old boy who attended the same school, according to new court documents.\n\n\&#34;She was my English teacher,\&#34; Leonardo Delaguila said. Delaguila, a freshman at the school, said he was told Doll won&#39;t be coming back. \&#34;It was just weird because I was just being taught by somebody who did something like that. It just felt strange.\&#34;\n\nFor juniors Carley Weeks and Katie Parrish, this wasn&#39;t the first time they&#39;ve heard about incidents at the school involving \&#34;sex and students.\&#34; The past sex crimes involved a band director in 2010 and a school resource officer in 2011.\n\n\&#34;Well I&#39;m definitely glad she&#39;s not here anymore, but it definitely makes me worried about the other teachers here,\&#34; Weeks said.\n\nJohnston County Public Schools released the following statement on Tuesday: \&#34;Johnston County Public Schools takes any allegations of staff misconduct seriously. Although we cannot discuss the specifics of an investigation into alleged staff misconduct, we can confirm that whenever such allegations arise, our administration responds swiftly, by investigating the allegations and, sometimes, by removing staff from classrooms pending completion of a thorough review.\&#34;\n\nDoll was booked into jail Friday. That same day, she was terminated from her teaching position.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 327, &#34;case_id&#34;: 258, &#34;case_name&#34;: &#34;Idaho v. Beach&#34;, &#34;source&#34;: &#34;CBS News&#34;, &#34;date&#34;: &#34;2009-12-30&#34;, &#34;text&#34;: &#34;Middle School Teacher Sentenced to 20 Years for Seducing 13-Year-Old Student\nBy Carlin Miller, CBS News\nDecember 30, 2009\n\nBOISE, Idaho \u2014 Ashley Jo Beach expressed her remorse and apologized to her family and community for breaking their trust before she was sentenced to 20 years in prison for her relationship with a 13-year-old boy.\n\nMeridian, Idaho police say back in September, Beach, a 38-year-old middle school teacher, was caught in the bushes with the teen, a former student.\n\nProsecutors said Beach had targeted the boy from their first contact in April when he was only 12.\n\n\&#34;She began grooming him when he was in 6th grade and she was his teacher,\&#34; said Jean Fisher, the prosecuting attorney. \&#34;The grooming was methodical and it was calculated.\&#34;\n\nDuring the course of the investigation against Ashley Jo Beach, her husband, Shawn Beach, was also arrested. Prosecutors say Shawn Beach, a former employee of the Ada County Sheriff&#39;s office, took naked photos of female inmates in the Ada County Jail and sent them to his wife. They say he was jealous of his wife&#39;s affair with the boy and wanted to strike back at her. He is facing charges of video voyeurism.\n\nProsecutor Fisher said Ashley Jo Beach bought the boy shoes and clothes and admitted she loved and needed the boy who she called the \&#34;light of her life.\&#34; She also wanted him to mow her lawn and babysit her three children, according to prosecutors.\n\nBeach has admitted the relationship lasted over the summer and that they even had sex in her classroom with the door locked.\n\nIn court, Beach&#39;s attorney, John Meienhofer, said she would be best served by treatment, not prison. \&#34;She&#39;s not a pedophile,\&#34; he argued. \&#34;She&#39;s remorseful and she&#39;s gained insight.\&#34;\n\nJudge Ronald Wilper disagreed. \&#34;You cashed in your family, your husband and your children, your reputation,\&#34; he said. \&#34;And you did this for the sake of lust.\&#34;\n\nWilper sentenced her to 20 years in prison with possibility of parole in four years.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;sex-offender-registration&#34;, &#34;long-term-relationship&#34;, &#34;early-release&#34;, &#34;gifts&#34;, &#34;cash&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 328, &#34;case_id&#34;: 258, &#34;case_name&#34;: &#34;Idaho v. Beach&#34;, &#34;source&#34;: &#34;KBCI&#34;, &#34;date&#34;: &#34;2009-09-18&#34;, &#34;text&#34;: &#34;Meridian middle school teacher arrested for lewd conduct with student\nBy KBCI Web Staff\nSeptember 18, 2009\n\nMERIDIAN - Officials say a southwestern Idaho middle school teacher was caught with a 13-year-old boy in Meridian Thursday night behind some bushes.\n\nPolice say the 37-year-old teacher at Meridian Middle School, Ashley Jo Beach, has been having a sexual relationship with the 13-year-old for several months.\n\nMeridian Police says Beach was arrested for lewd conduct with a child under 16.\n\nOfficers received a call of suspicious circumstances around 9:30 p.m. Thursday night in the area of Cherry Lane and Vineyards, which is a few blocks away from the school.\n\nWhen they arrived they found Beach and the boy laying down between the bushes and a fence, partially concealed from view. The officers questioned both of them but found several inconsistencies in their explanations of why they were there.\n\nPolice say the relationship began in April and lasted until Thursday night. According to the middle school&#39;s website, Beach taught math and science.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;grooming&#34;, &#34;sex-offender-registration&#34;, &#34;long-term-relationship&#34;, &#34;gifts&#34;, &#34;cash&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 329, &#34;case_id&#34;: 259, &#34;case_name&#34;: &#34;New Jersey v. Leahey&#34;, &#34;source&#34;: &#34;NJ.com&#34;, &#34;date&#34;
