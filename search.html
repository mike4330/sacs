 then parked in front of a Kingston house. Harrington-Cooper told the boy she wanted to have sex but couldn&#39;t because she had her period, and instead performed oral sex on the boy. Harrington-Cooper also asked the boy on several occasions to delete their text messages because she was afraid someone would see them. &#39;What 17-year-old doesn&#39;t want to have sex with his 31-year-old teacher?&#39; she asked him. Harrington-Cooper, whose salary was $45,075 a year, was suspended without pay after her first arrest last month. In that case, she is accused of performing oral sex on an 18-year-old senior three times and having intercourse with him twice. It is not the first time she has been in trouble with the district. Superintendent Suppon said she used to work at Wyoming Valley West Middle School and that there were &#39;some issues that had to be addressed&#39; \u2014 described as teacher performance, nothing remotely close to this.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;sexting&#34;, &#34;prior-warning-ignored&#34;, &#34;evidence-tampering&#34;, &#34;possible-additional-victims&#34;, &#34;late-night-meetups&#34;, &#34;on-campus&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 369, &#34;case_id&#34;: 280, &#34;case_name&#34;: &#34;Lauren Harrington-Cooper&#34;, &#34;source&#34;: &#34;AP / Citizens&#39; Voice&#34;, &#34;date&#34;: &#34;2015-08-19&#34;, &#34;text&#34;: &#34;WILKES-BARRE (AP) \u2014 Two months past her minimum prison sentence, former high school English teacher Lauren Harrington-Cooper has been released from prison. Luzerne County Judge Michael T. Vough at a hearing Wednesday granted the former Wyoming Valley West teacher&#39;s petition for parole, ordering the county prison release her following the court proceeding. &#39;If you violate your parole in anyway and you come before me, guess what&#39;s going to happen. I&#39;m going to max you out,&#39; Vough said. Harrington-Cooper, 32, of Kingston, pleaded guilty before Vough in September to institutional sexual assault, corruption of minors and unlawful contact with a minor. The judge immediately sentenced her to nine to 23 months in Luzerne County Correctional Facility. She first moved for parole in June after completing her minimum sentence. Defense attorney Joseph D&#39;Andrea said his client has been a &#39;model prisoner&#39; and used the time for &#39;soul searching.&#39; ADA Jenny Roberts said the DA&#39;s Office declined to take a position on the woman&#39;s release. Harrington-Cooper was first arrested in December 2013, accused of engaging in both oral sex and sexual intercourse with an 18-year-old student. While free on bail, Harrington-Cooper was arrested twice more as other students came forward. Criminal complaints documented an alleged pattern that escalated from flirtatious notes and sexually-explicit comments and text messages. The release comes with restrictions prohibiting Harrington-Cooper from visiting or working within 1,000 feet of areas where children congregate, or within 100 yards of schools and school activities. She must register as a sex offender with state police and is prohibited from leaving Luzerne or Lackawanna County.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;early-release&#34;]}, {&#34;id&#34;: 370, &#34;case_id&#34;: 281, &#34;case_name&#34;: &#34;Anna Andersen&#34;, &#34;source&#34;: &#34;AP / Wyoming Tribune Eagle&#34;, &#34;date&#34;: &#34;2015-08-18&#34;, &#34;text&#34;: &#34;A former sixth-grade teacher in Cheyenne who pleaded no contest to charges she had sex with a 13-year-old boy has been sentenced to eight to 12 years in prison. The Wyoming Tribune Eagle reports, Anna Andersen, who taught at Freedom Elementary, was sentenced Monday. She previously pleaded no contest to second- and third-degree sexual abuse of a minor. Andersen was arrested in March 2014. Prosecutors say she and the boy had an ongoing relationship from 2012 to 2014 and a sexual relationship for two years. Prosecutors say the boy was prepared to testify and investigators had text messages and other evidence to support the charges.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 371, &#34;case_id&#34;: 281, &#34;case_name&#34;: &#34;Anna Andersen&#34;, &#34;source&#34;: &#34;Wyoming Tribune Eagle (Cat Smith)&#34;, &#34;date&#34;: &#34;2014-04-29&#34;, &#34;text&#34;: &#34;CHEYENNE \u2014 A local elementary school teacher pleaded not guilty Monday to seven felony counts of sexual abuse of a minor. Anna-Maria Andersen, 54, stood next to her attorney, Sean Barrett, shackled at the ankles as Laramie County District Judge Steven Sharpe read the charges against her. Andersen also entered not-guilty pleas to five counts of second-degree sexual abuse of a minor and one count of first-degree sexual abuse of a minor. Laramie County assistant district attorney Antoinette Healy advised Sharpe that another count of second-degree sexual abuse of a minor had been dismissed by her office. If found guilty on all charges, Andersen faces a maximum penalty of 165 years in prison and fines up to $70,000. A first-degree sexual abuse of a minor charge carries a maximum sentence of 25 to 50 years in prison. Court documents show: Andersen allegedly had sexual intercourse with a male victim on three occasions between Oct. 20, 2012, and March 12, 2014, when the victim was between the ages of 13 and 14. Andersen also allegedly had sex with the victim in June 2012, when he was younger than 13. The sexual encounters reportedly took place at Andersen&#39;s home and in at least two of her vehicles. Other charges allege Andersen groped the victim&#39;s groin through a blanket. After she was arrested earlier this month, Andersen was immediately placed on administrative leave. The school board has elected not to renew her contract. &#39;She won&#39;t be back,&#39; Superintendent Mark Stock said.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;, &#34;long-term-relationship&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 372, &#34;case_id&#34;: 282, &#34;case_name&#34;: &#34;Mary Jahn&#34;, &#34;source&#34;: &#34;LA County DA press release&#34;, &#34;date&#34;: &#34;2018-11-30&#34;, &#34;text&#34;: &#34;A former Lakewood High School teacher was sentenced today to three years in state prison for sexually abusing a student over a three-year period, the Los Angeles County District Attorney&#39;s Office announced. Deputy District Attorney Troy Davis said Mary Jahn, 53, of Lakewood also was ordered to register as a sex offender for the rest of her life. On Nov. 9, Jahn pleaded no contest to one count of lewd act upon a child in case NA107331. The defendant engaged in a three-year sexual relationship starting in July 2008 with a 15-year-old female student while she was a teacher at Lakewood High School, the prosecutor said. In 2017, the now adult victim alerted authorities about the sexual abuse. The case was investigated by the Long Beach Police Department.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 373, &#34;case_id&#34;: 282, &#34;case_name&#34;: &#34;Mary Jahn&#34;, &#34;source&#34;: &#34;Press-Telegram (Jeremiah Dobruck)&#34;, &#34;date&#34;: &#34;2017-09-19&#34;, &#34;text&#34;: &#34;A former Lakewood High School teacher accused of sexually abusing a female student during a years-long relationship hopes she&#39;ll be &#39;totally exonerated&#39; when more facts come to light, her lawyer said. Mary Jahn, 52, of Lakewood, appeared Tuesday in a Long Beach courtroom to face nine sex-related felonies. She&#39;s been behind bars since authorities arrested her Wednesday. She did not enter a plea, but, &#39;Miss Jahn adamantly denies the charges,&#39; defense attorney Leonard B. Levine said after the hearing. Jahn is charged with four counts of sexual penetration by a foreign object, three counts of lewd act upon a child and two counts of oral copulation of a person under 18. Prosecutors allege Jahn had a sexual relationship with a Lakewood High School student starting in July 2008 when the girl was 15-years-old. That relationship continued until after the victim turned 18 in 2011. Despite the sexual relationship ending, Jahn and the victim remained in contact intermittently until late April or early May this year. That&#39;s around the time police began investigating and the Long Beach Unified School District put Jahn on leave from her job. Jahn had been teaching English at Lakewood High School since 2006. Authorities began investigating after the student told police earlier this year about what happened. If she&#39;s convicted, Jahn could be sentenced to a maximum of eight years and four months in state prison and be required to register as a sex offender for the rest of her life. Jahn remains behind bars in lieu of $750,000.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 374, &#34;case_id&#34;: 283, &#34;case_name&#34;: &#34;Liliana Alvarez&#34;, &#34;source&#34;: &#34;Clarksville Now (Keely Quinlan)&#34;, &#34;date&#34;: &#34;2021-09-17&#34;, &#34;text&#34;: &#34;CLARKSVILLE, TN \u2014 A former teacher at Northeast High School in Clarksville was arrested Thursday and charged with sex crimes against a minor. Liliana Martiza Alvarez, 46, was charged with sexual battery by an authority figure-forcible fondling, and sexual exploitation of a minor. Between Nov. 1, 2019 and June 23, 2020, Alvarez used her position as a teacher to get a 17-year-old to engage in sexual contact with her, according to an indictment by the September term of the Montgomery County Grand Jury. The indictment also claims she engaged in online sexual activity with the teenager. She had been employed as a teacher with CMCSS since 2013, but resigned on May 26 according to Jessica Goldberg, director of communications and marketing at CMCSS. CMCSS had no comment on Alvarez&#39;s arrest.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 375, &#34;case_id&#34;: 283, &#34;case_name&#34;: &#34;Liliana Alvarez&#34;, &#34;source&#34;: &#34;Clarksville Leaf-Chronicle (Alexis Clark)&#34;, &#34;date&#34;: &#34;2021-09-20&#34;, &#34;text&#34;: &#34;A former Northeast High School math teacher is facing sex charges, including sexual battery by an authority figure and sexual exploitation of a minor, after she was indicted by a Montgomery County Grand Jury earlier this month and arrested on Sept. 16. Liliana Martiza Alvarez, 46, taught in the Clarksville-Montgomery School system since 2013 and resigned May 26. Her indictment said that Alvarez engaged in sexual contact with a minor during or between Nov. 2019 and June 2020 and used her position as a teacher to do so. The minor in question is now 19, according to the indictment. The indictment also states that Alvarez had online, webcam communications with the teen and engaged in simulated sexual activity.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;sexting&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 376, &#34;case_id&#34;: 283, &#34;case_name&#34;: &#34;Liliana Alvarez&#34;, &#34;source&#34;: &#34;TN State Board of Education \u2014 Petition for Declaratory Order (Perry A. Craft, counsel)&#34;, &#34;date&#34;: &#34;2023-08-07&#34;, &#34;text&#34;: &#34;Petitioner Liliana Alvarez petitions for declaratory order as to validity of State Board of Education Rule 0520-02-03-.09(1)(a), which defines &#39;conviction&#39; to include judicial diversion under T.C.A. \u00a740-35-313. Petitioner applied for and was granted Judicial Diversion. The Board has filed administrative action No. 07.02-233872 seeking to revoke her teaching license. Petitioner argues the rule conflicts with the diversion statute and cites Rodriguez v. State, 437 S.W.3d 450, holding that a Board is not authorized to invoke additional punitive action including license revocation. Requests dismissal of the administrative proceeding.&#34;, &#34;tags&#34;: [&#34;no-prison&#34;, &#34;novel-statute&#34;, &#34;sora-appeal&#34;]}, {&#34;id&#34;: 377, &#34;case_id&#34;: 284, &#34;case_name&#34;: &#34;Kendahl Coode&#34;, &#34;source&#34;: &#34;Clarksville Now (Jordan Renfro)&#34;, &#34;date&#34;: &#34;2024-05-31&#34;, &#34;text&#34;: &#34;A former English teacher at Northwest High School recently pleaded guilty to sex-related crimes involving a 16-year-old and was granted judicial diversion. Kendahl Erin Coode was hired by Northwest in August 2021 and was in her second year of employment when the incident happened. In October 2022, Coode, 28, used online communication to expose a teen to sexual material two times, according to an indictment by the July 2023 term of the Montgomery County Grand Jury. On Nov. 1, 2022, CMCSS was informed of the investigation. Coode was immediately placed on alternative worksite duty and instructed to not have contact with students. While still off-site, she resigned on Dec. 2, 2022. Coode was indicted on two counts of solicitation of sexual exploitation of a minor and arrested on July 17. On Jan. 26, she pleaded guilty to both charges. On May 15, she received the judicial diversion and will remain on the Sexual Offender Registry. Timothy Warren, Coode&#39;s attorney, explained that judicial diversion is a method by which many first-time offenders can have the opportunity to have their conviction dismissed and expunged following a successful probationary period.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;novel-statute&#34;]}, {&#34;id&#34;: 378, &#34;case_id&#34;: 284, &#34;case_name&#34;: &#34;Kendahl Coode&#34;, &#34;source&#34;: &#34;Clarksville Now (Chris Smith)&#34;, &#34;date&#34;: &#34;2023-08-03&#34;, &#34;text&#34;: &#34;A former English teacher at Northwest High School has been charged with sex-related crimes involving a then-16-year-old teenager. Two times in October 2022, Kendahl Erin Coode, 27, used online communications to expose a teenager to sexual material, according to an indictment by the July term of the Montgomery County Grand Jury. The indictment did not give further specifics. Coode was indicted on two counts of solicitation of sexual exploitation of a minor and was arrested on July 17. Also on July 17, a no-contact order was issued by the Montgomery County Circuit Court stating that Coode &#39;is a threat to the alleged victim&#39; and that she is ordered to refrain from contacting or approaching the victim. Coode was in her second year of employment at Northwest when the incident is alleged to have happened. She was hired in August 2021. On Nov. 1, 2022, when CMCSS was informed of the investigation, Coode was immediately placed on alternative worksite duty and instructed to not have contact with any students. While still off-site pending the outcome of the law enforcement investigation, she resigned on Dec. 2, 2022.&#34;, &#34;tags&#34;: [&#34;sexting&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 379, &#34;case_id&#34;: 285, &#34;case_name&#34;: &#34;Rumah Byrapaka&#34;, &#34;source&#34;: &#34;Augusta Chronicle (Sandy Hodson)&#34;, &#34;date&#34;: &#34;2022-07-15&#34;, &#34;text&#34;: &#34;A former teacher at Hephzibah Middle School found to have had improper and illegal contact with a student pleaded guilty Thursday, July 14. Rumah Byrapaka, 26, has been held in jail without bond since her arrest in January 2020. Because of the length of time she has been in custody and the likely deportation she now faces, the prosecutor agreed to forego a request for further incarceration, Assistant District Attorney Kyle Davis said Thursday. Byrapaka pleaded guilty Thursday in Richmond County Superior Court to two counts of criminal attempt to commit the crime of enticement of a child for indecent purposes. The mother of a 13-year-old boy discovered correspondence between her son and Byrapaka that left her shocked and sickened. There was talk of sexual contact and photographs of sexual poses. He and even his siblings have been exposed to extensive hurtful and ugly comments on social media, the mother said. The responses show an unfair double standard because the victim is male. But he was a child, and Byrapaka was the adult, the mother said. Byrapaka, who completed her work for a master&#39;s degree just before her arrest, was brought from India to the United States when she was 9 years old. She now faces deportation. Flythe accepted the plea negotiation and sentenced Byrapaka to an additional 13 years on probation. He declined to impose the sentence under the First Offender Act, so that the record of the conviction will remain public.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 380, &#34;case_id&#34;: 285, &#34;case_name&#34;: &#34;Rumah Byrapaka&#34;, &#34;source&#34;: &#34;WJBF News&#34;, &#34;date&#34;: &#34;2020-11-12&#34;, &#34;text&#34;: &#34;Former Hephzibah Middle School teacher Rumah Byrapaka was indicted in Richmond County Superior Court on five charges: Sexual Contact by Employee or Agent in the First Degree, Sexual Contact by Employee or Agent in the Second Degree, Child Molestation (x2), and Enticing a Child for Indecent Purposes. Byrapaka taught science at Hephzibah Middle School and was arrested in January 2020 following accusations of an inappropriate relationship with a student. She allegedly sent nude photos and explicit text messages to one of her 13-year-old male students. The texts discussed kissing and sexual touching. Byrapaka was also accused of luring the student from his classroom to another room on campus where she allegedly molested him. Initially, Byrapaka was granted a $25,000 bond on child molestation charges and enticement of a child for indecent purposes. Because of her charges and since she was in the U.S. on a student visa, ICE placed a hold on her in the event she was able to post bail. She has been at the Charles B. Webster detention center since her arrest on January 16, 2020.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 381, &#34;case_id&#34;: 286, &#34;case_name&#34;: &#34;Reagan Gray&#34;, &#34;source&#34;: &#34;KTHV (Chris Banks)&#34;, &#34;date&#34;: &#34;2025-05-20&#34;, &#34;text&#34;: &#34;A former Arkansas teacher and leader at Immanuel Baptist Church has taken a plea deal related to sexual assault charges. Reagan Gray, who worked as a teacher for Pulaski County Special School District and volunteer at a local church, was accused of having a sexual relationship with a minor while working as a church volunteer back in April of 2024. Following her &#39;no contest&#39; plea to a reduced charge of 2nd degree sexual assault, Gray is now required to register as a sex offender and has been given six years probation. Gray was initially arrested in April of last year and was fired by PCSSD in May of 2024 following the sexual assault allegations. According to an affidavit, Gray began having a sexual relationship with a minor back in 2020. At the time, Gray worked as a teacher at Little Rock Christian Academy and was a volunteer in the student ministry at Immanuel Baptist Church. The minor did not attend Little Rock Christian Academy where Gray worked, but was a member of the student ministry, where Gray volunteered. The affidavit showed that the minor&#39;s parents discovered text messages in the minor&#39;s cell phone in 2020. After they made the discovery, the minor&#39;s parents reportedly told Gray to stop messaging the child and then reported the text messages to the senior pastor. The church&#39;s head pastor proceeded to ask Gray about the messages, to which Gray responded that their relationship was not &#39;physical.&#39; She was then removed from the student ministry and required to undergo counseling. Shortly after being removed, Gray returned and began volunteering in the ministry once again. The head pastor of Immanuel Baptist Church was interviewed in February of 2024 and shared that in the Fall of 2023, Gray admitted to him during a counseling session that her relationship with the minor back in 2020 was sexual in nature. Gray and the minor continued talking on Snapchat. During a Child and Adolescent Forensic Interview conducted by the FBI, the minor shared that they had sexual contact with Gray, who was 23 years old at the time of the incident. The minor also shared that Gray received their phone number through the group chat for the church&#39;s music program, and added that Gray sent nude photos of herself to the minor on a daily basis and expected nude images to be sent back to her. Gray most recently worked at Sylvan Hills Middle School but had been on administrative leave in February of 2024 prior to being fired that following May.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;prior-warning-ignored&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;fbi&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 382, &#34;case_id&#34;: 286, &#34;case_name&#34;: &#34;Reagan Gray&#34;, &#34;source&#34;: &#34;New York Post (Patrick Reilly)&#34;, &#34;date&#34;: &#34;2025-05-21&#34;, &#34;text&#34;: &#34;A former teacher pleaded guilty to sexually assaulting a teenager she met while volunteering at an Arkansas church once frequented by former President Bill Clinton. Reagan Gray began assaulting the boy in 2020 when she was 23 and he was just 15 after they met at the iconic Immanuel Baptist Church in Little Rock, where she volunteered with the student ministry. During interviews with investigators, the boy alleged that Gray had given him oral sex \u2014 but claimed they didn&#39;t have intercourse so he could &#39;stay pure,&#39; according to court documents. Gray was initially charged with sexual assault in the first and fourth degree after her arrest last year, but pleaded guilty to sexual assault in the second degree. She was sentenced Monday to six years&#39; probation and ordered to pay a $1,000 fine. Additionally, she must submit a DNA sample and will be placed on the sex offender registry. The alleged abuse, which occurred nearly a dozen times, took place in Gray&#39;s car or apartment, the victim told police. The victim&#39;s parents discovered a trove of racy text messages, including nude photos, between the victim and Gray in 2020 \u2014 which they reported to the church&#39;s then-head pastor Steven Smith. Smith confronted Gray about the texts \u2014 but she assured him the relationship was not &#39;physical.&#39; Gray, who also worked as a teacher at Little Rock Christian Academy at the time, was yanked from the student ministry and forced by the church to attend counseling services, to which she agreed. Shortly afterward, however, she was back with the church youth group. Federal authorities launched an investigation in February 2024 when they learned that Gray had continued to exchange messages with the teen via Snapchat. Smith resigned from his position last year over the controversy.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;prior-warning-ignored&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;fbi&#34;, &#34;concealment&#34;]}, {&#34;id&#34;: 383, &#34;case_id&#34;: 287, &#34;case_name&#34;: &#34;Madeleine Schmaltz&#34;, &#34;source&#34;: &#34;Duluth News Tribune / Star Tribune (Paul Walsh)&#34;, &#34;date&#34;: &#34;2020-09-03&#34;, &#34;text&#34;: &#34;A 29-year-old woman has been charged with sexually assaulting a high school student who had been one of her pupils in middle school in Hermantown. Madeleine R. Schmaltz, of nearby Saginaw, was charged Wednesday in St. Louis County District Court with fourth-degree criminal sexual conduct with the 16-year-old in connection with multiple encounters in spring 2019. Schmaltz was hired by the school district in 2014 and was teaching science at Hermantown Middle School until her resignation was accepted on June 10, 2019. She also coached middle school volleyball. Law enforcement was alerted on June 4, 2019, that Schmaltz and the student were having a sexual relationship. The teen&#39;s mother told police that she overheard her child having a phone conversation with an older female that was &#39;sexual in nature.&#39; The mother checked phone records, which revealed that her teen was speaking with Schmaltz, who was the teen&#39;s teacher about two years earlier. The parents said their teen would visit Schmaltz&#39;s home often for help with schoolwork and mentoring. The parents also told law enforcement that Schmaltz had given their child several gifts. Two days later, the teen confirmed with law enforcement the existence of the sexual relationship and visits to Schmaltz&#39;s home, where they had sexual contact more than twice that spring. Interviewed that same day by a sheriff&#39;s sergeant, Schmaltz acknowledged that her relationship &#39;became sexual, and she admitted to sexual touching of the victim ... and to having the victim touch her.&#39;&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;long-term-relationship&#34;, &#34;gifts&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 384, &#34;case_id&#34;: 287, &#34;case_name&#34;: &#34;Madeleine Schmaltz&#34;, &#34;source&#34;: &#34;Hermantown Star / local news&#34;, &#34;date&#34;: &#34;2020-11-10&#34;, &#34;text&#34;: &#34;Former Hermantown Middle School teacher Madeleine Schmaltz, 30, received sentencing of three years of supervised probation after pleading guilty to the felony charge of fourth-degree criminal sexual conduct in September. Schmaltz had been charged with having a sexual relationship with a 16-year-old high school student. According to the criminal complaint, a mandated reporter contacted Hermantown police about the relationship in June 2019. When later interviewed by police both Schmaltz and the victim admitted to having engaged in sexual acts within the past couple of weeks. The victim&#39;s mother told police she had overheard a phone conversation between her teenager and Schmaltz that was &#39;sexual in nature.&#39; Schmaltz resigned from the Hermantown School District shortly after.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;]}, {&#34;id&#34;: 385, &#34;case_id&#34;: 288, &#34;case_name&#34;: &#34;Shari Herrs&#34;, &#34;source&#34;: &#34;AP / KAKE News&#34;, &#34;date&#34;: &#34;2019-11-14&#34;, &#34;text&#34;: &#34;WICHITA, Kan. \u2014 A former physical education teacher in Haysville has been sentenced to two years of probation for having sexual contact with a male student. District Attorney Marc Bennett said 36-year-old Shari Herrs, of Andover, was sentenced Wednesday for an amended charge of attempted unlawful sexual relations. If Herrs violates her probation, she could receive a 13-month prison sentence. Prosecutors said Herrs committed the acts with an 18-year-old student at Campus High School between April and May of 2018. Herrs has already registered as a sex offender and surrendered her teaching license.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;adult-victim&#34;]}, {&#34;id&#34;: 386, &#34;case_id&#34;: 2 equest for house arrest. Defense attorney Jim Wall said he respected the way Davis handled the case. &#39;These cases are very tough for everyone involved. I really cannot take any issue at all with his decision. I have a lot of respect for the judge and I think his decision is probably spot on as to what should have happened, even though I was asking for something else.&#39; In May 2016, Gunn was arrested on charges of sexual assault and three counts of contributing to the delinquency of a minor after an alleged sexual relationship with a 17-year-old male student. Gunn resigned from South Gwinnett on April 19, 2016, and a sexual assault police report was filed the next day. The relationship began sometime in March 2016 and ended in less than two months. Some of the sexual activity occurred at the school, at the teacher&#39;s residence and at Lenora Park. A detective found that the teacher hosted a party at her home in Grayson, and during the party, the teacher allowed the 17-year-old and two other female students to smoke marijuana under her direct supervision; the teacher smoked marijuana as well. Gunn, a music teacher, had worked at the school since 2002.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;drugs&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 388, &#34;case_id&#34;: 289, &#34;case_name&#34;: &#34;Therese Gunn&#34;, &#34;source&#34;: &#34;11Alive / WXIA (Greg Rossino)&#34;, &#34;date&#34;: &#34;2016-05-09&#34;, &#34;text&#34;: &#34;A South Gwinnett High School teacher is out on bond after having a sexual relationship with a 17-year-old student. Therese Gunn, 53, of Grayson, was charged with one count of Sexual Assault and three counts of Contributing to the Delinquency of a Minor. She turned herself into the Gwinnett County Police Department on Friday, May 6. The teen&#39;s mother filed a police report on April 20. The mother learned of the relationship and visited the school on April 19 to inform them of the allegations. The School Resource Officer and Department of Family and Children Services were contacted. Gunn has since resigned from her teaching position. The report states the relationship began sometime in March and has since ended. Some of the sexual activity occurred at the school, at the teacher&#39;s residence and at Lenora Park. During the investigation, officials also discovered the teacher hosted a party at her home in Grayson where she allowed the teen and two other female students to smoke marijuana. According to the detective, the teacher smoked marijuana as well.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;drugs&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 389, &#34;case_id&#34;: 290, &#34;case_name&#34;: &#34;Noelle Devlin&#34;, &#34;source&#34;: &#34;Richland Source / local news&#34;, &#34;date&#34;: &#34;2015-12-08&#34;, &#34;text&#34;: &#34;MOUNT VERNON \u2013 A former Mansfield area third-grade teacher was arrested Monday morning at a home on James Street. Noelle Devlin, 31, was arrested on a warrant by MVPD and transported to the Richland County Jail. Devlin is charged with 15 counts of sexual battery and 14 counts of child endangering. The indictment was filed on Nov. 16. According to the indictment, Devlin had a sexual relationship with an underage teenage boy enrolled at the school. The sexual conduct occurred between June 1 and October 1. According to WMFD-TV in Mansfield, Devlin was employed as a third-grade teacher for the Interactive Media and Construction School since 2014 at the school which is located at the Ocie Hill Neighborhood Center. Devlin remains in jail on a $15,000 bond.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 390, &#34;case_id&#34;: 290, &#34;case_name&#34;: &#34;Noelle Devlin&#34;, &#34;source&#34;: &#34;Mansfield News Journal (Courtney McNaull)&#34;, &#34;date&#34;: &#34;2016-04-25&#34;, &#34;text&#34;: &#34;MANSFIELD - Former Mansfield Choice Academies teacher Noelle Devlin was sentenced to one year in prison and four years of probation after she admitted to sexual involvement with a student. Devlin pleaded guilty last month to three counts of sexual battery and three counts of child endangering for the sexual relationship, which reportedly happened Oct. 1, 2014 \u2013 June 5, 2015. As part of the plea agreement, prosecutors dismissed 12 additional counts of sexual battery and 12 counts of child endangering. Devlin was fired in October 2015 from her position at Mansfield Choice Academies, a public charter school housed at Ocie Hill Neighborhood Center. Though Devlin said in court she was sorry for what transpired between herself and the male victim, who was 16 at the time, Richland County Common Pleas Judge James DeWeese said he did not believe Devlin was remorseful. DeWeese read excerpts from an eight- or nine-page letter Devlin submitted to the court in which she claimed she was not thinking clearly and stated she felt the victim &#39;was in charge of the relationship.&#39; &#39;In your letter you substantially blame him. I have a hard time believing you are taking responsibility,&#39; DeWeese said, adding that Devlin took advantage of the victim&#39;s age and mental state as well as her position of trust as a teacher. A victim advocate read a letter from the victim&#39;s father: &#39;You took a vulnerable, impressionable mind and twisted it to believe this was a normal and adult-style relationship. How do you explain that what was being taught by a mentor, a teacher, an adult and a mother was all lies and untruths?&#39; Devlin&#39;s four years of probation will begin after her 12-month prison term. Devlin has been ordered to have no contact with the victim and is required to register as a Tier III sex offender for the rest of her life.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;no-remorse&#34;, &#34;charge-reduction&#34;, &#34;long-term-relation function esc(s) {

function highlight(text, terms) {
  let out = esc(text);
  terms.forEach(t => {
    if (!t) return;
    const re = new RegExp(t.replace(/[.*+?^${}()|[\]\\]/g,"\\$&"), "gi");
    out = out.replace(re, m => `<mark>${m}</mark>`);

  return out;
}

function excerpt(text, terms, ctx=120) {
  const lower = text.toLowerCase();
  let pos = 0;
  for (const t of terms) {
    const i = lower.indexOf(t.toLowerCase());
    if (i >= 0) { pos = i; break; }
  }
  const start = Math.max(0, pos - 40);
  const end = Math.min(text.length, pos + ctx);
  return (start > 0 ? "…" : "") + text.slice(start, end) + (end < text.length ? "…" : "");
}

function search(q) {

  if (!q) { results.innerHTML = ""; status.textContent = `${INDEX.length} entries indexed.`; return; }

}
