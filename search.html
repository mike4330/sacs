 Schutte pleaded guilty to a felony charge of corruption of a minor of a sexual nature in connection with at least three incidents that occurred with the underage boy between September 2022 and July 2023.\n\nAt the time of the incidents, Schutte was employed as a guidance counselor at Pennridge South Middle School in Bucks County. The boy, of Bucks County, was 14 years old and had met Schutte in her role as a guidance counselor.\n\nAssistant District Attorney Bradley Walter Deckel alleged Schutte groomed the victim for months and began to have sexual contact with him even though he was 14, could not consent and she was his guidance counselor.\n\n\&#34;She was the victim&#39;s guidance counselor, so she was in a position of trust over him. She was entrusted by our community to take care of and to look after our children and she failed that responsibility,\&#34; Deckel said.\n\nThe investigation began on July 18, 2023, when the 14-year-old boy&#39;s parents contacted Upper Perkiomen police to report that their son disclosed Schutte had inappropriate sexual contact with him.\n\nThe boy disclosed that he began communicating regularly with Schutte during the fall of 2022 following a class trip during which he sat with her on a school bus. He and Schutte communicated through the school district&#39;s messaging app and later switched to using Snapchat. A large volume of electronic messages were exchanged on the school district&#39;s messaging app; handwritten notes from the boy were located in Schutte&#39;s office. Detectives also found Snapchat messages and photos of the boy and Schutte together at her Pennsburg residence on his cellphone. Surveillance footage corroborated the boy&#39;s account that he and Schutte were together on July 17 when she sexually touched him in her vehicle. One of Schutte&#39;s earrings was found in the boy&#39;s Bucks County home following an alleged encounter in June 2023.\n\nOther charges of institutional sexual assault and indecent assault were dismissed as part of the plea agreement.\n\nPrior to sentencing, Schutte was evaluated by the Pennsylvania Sexual Offenders Assessment Board, which determined she did not meet the criteria to be classified as a sexually violent predator.\n\nDefense lawyer W. Joshua Buchanan represented Schutte. The defense portrayed Schutte as a mother of three and \&#34;a loved wife of 18 years,\&#34; but presented no witnesses on Schutte&#39;s behalf.\n\nMore than a dozen members of Bikers Against Child Abuse chapters from Montgomery, Delaware and Bucks counties showed up in court to support the boy and his family.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;physical-evidence&#34;, &#34;no-remorse&#34;]}, {&#34;id&#34;: 36, &#34;case_id&#34;: 32, &#34;case_name&#34;: &#34;Melissa Marie Curtis&#34;, &#34;source&#34;: &#34;FOX 5 DC&#34;, &#34;date&#34;: &#34;2024-11-19&#34;, &#34;text&#34;: &#34;Former Montgomery County teacher sentenced to 30 years for having sex with student\nBy Jillian Smith \u2014 November 19, 2024\n\nMONTGOMERY COUNTY, Md. - A Montgomery County teacher accused of having sex with a 14-year-old middle schooler more than a dozen times has been sentenced to 30 years in prison.\n\nMelissa Curtis, 32, will spend three decades with all but 12 months suspended and five years of supervised probation upon release for three counts of third-degree sex offense.\n\nOnce released, Curtis will be required to register as a sex offender for 25 years and as a condition of probation, she will not be allowed to have unsupervised contact with minors other than her own children.\n\nCurtis was sentenced on Friday, Nov. 15. She pleaded guilty to the sex offense charges on June 20.\n\nThe investigation into the sexual abuse began in October 2023 after the victim came forward with the allegations that he had engaged in sexual acts with Curtis, who was teaching at Lakelands Park Middle School while he was a student. According to prosecutors, in 2015, the 14-year-old victim was volunteering for an after-school program that Curtis, who was 22 years old at the time, was running and they were often alone together.\n\nInvestigators say the sexual assaults occurred for several months until the end of April 2015 in several different locations including the school, inside of her car and at her mother&#39;s house in Montgomery County.\n\nThe documents also say Curtis provided the victim with alcohol and marijuana and that she had sexual intercourse with him more than 20 times while he was in eighth grade.\n\nA warrant for Curtis&#39;s arrest was obtained on Oct. 31, 2023, charging her with sexual abuse of a minor and multiple counts of third and fourth-degree sexual offenses. She turned herself in on Nov. 7, 2023.\n\nA spokesperson said Curtis left Montgomery County Public Schools in 2017.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;delayed-reporting&#34;]}, {&#34;id&#34;: 37, &#34;case_id&#34;: 33, &#34;case_name&#34;: &#34;Cassidy Kraus&#34;, &#34;source&#34;: &#34;WHO-HD / local Iowa news&#34;, &#34;date&#34;: &#34;2024-03-12&#34;, &#34;text&#34;: &#34;Former Iowa teacher Cassidy Kraus sentenced to 33 years for sexual abuse of students\nUpdated: March 12, 2024\n\nMANNING, Iowa \u2014 A former central Iowa teacher has been sentenced to 33 years in prison after pleading guilty to a slew of sexual abuse and lascivious acts charges.\n\nCassidy Kraus, 24, was a teacher in the IKM-Manning Community School District in Carroll County when she was arrested last October and accused of sexually abusing three boys between the ages of 13 and 14.\n\nIn January, she pleaded guilty to one count of third-degree sexual abuse, two counts of lascivious acts with a child and three counts of dissemination and exhibition of obscene material to minors.\n\nInvestigators say in addition to engaging in sexual activity with the minors, she also sent obscene material over Snapchat.\n\nOn Tuesday, Kraus was sentenced to the maximum sentence of 33 years in prison and a total fine of $5,400 plus 15% criminal surcharge. She will also be required to register as a sex offender for the rest of her life.\n\n---\n\nUpdated: January 31, 2024\n\nMANNING, Iowa \u2014 A former Iowa teacher is pleading guilty in a sex abuse case.\n\nCassidy Kraus taught in the IKM Manning Community School District in Carroll County.\n\nInvestigators say she sent obscene material over social media and sexually abused three boys between the ages of 13 and 14.\n\nKraus pleaded guilty to several charges, including third-degree sexual abuse and two counts of lascivious acts with a child.\n\nThe school board approved her resignation last August. Sentencing is scheduled for March.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;maximum-sentence&#34;]}, {&#34;id&#34;: 38, &#34;case_id&#34;: 34, &#34;case_name&#34;: &#34;Julie Rizzitello&#34;, &#34;source&#34;: &#34;Monmouth County Prosecutor&#39;s Office&#34;, &#34;date&#34;: &#34;2026-02-13&#34;, &#34;text&#34;: &#34;Ex-Wall Township HS Teacher Sentenced to 10 Years for Sex Crimes Against Two Students\n\nFREEHOLD \u2013 A former Wall Township High School English teacher has been sentenced to 10 years in state prison for separately engaging in numerous sexual acts with two of her students over the course of several years, Monmouth County Prosecutor Raymond S. Santiago announced Thursday.\n\nJulie Rizzitello, 37, of Brick Township (Ocean County), will also be subjected to Parole Supervision for Life, required to register as a sex offender under Megan&#39;s Law, barred from contact with the victims, and ordered to permanently forfeit her teaching position, under the terms set down by Monmouth County Superior Court Judge Jill G. O&#39;Malley during a sentencing hearing taking place yesterday.\n\nAn investigation involving members of the Monmouth County Prosecutor&#39;s Office Special Victims Bureau and Wall Township Police Department \u2013 assisted by the Ocean County Prosecutor&#39;s Office and Brick Township Police Department, and led by MCPO Detective Jose I. Rodriguez and Wall Township Police Detective Devin Corso \u2013 revealed that the criminal conduct by Rizzitello involved two victims, one of whom she met when he was a freshman and the other she met when he was a junior.\n\nAfter initially asking to spend time with them alone and developing a casually friendly relationship, the conduct escalated to sexual activity with each, lasting for a period of several months. The sexual acts with both victims took place largely in three locations: in Rizzitello&#39;s Brick home, in a vehicle at a Wall Township parking lot, and at the Belmar bagel shop owned by Rizzitello&#39;s family, where each victim was employed, at her suggestion.\n\nWhile the investigation was ongoing, Rizzitello also contacted both victims and asked that they delete evidence of the crimes from their personal electronic devices.\n\nRizzitello was arrested without incident in July 2024. Prior to being indicted, she pleaded guilty to two counts of second-degree Sexual Assault during a hearing held before Judge O&#39;Malley in August 2025.\n\nIn ruling that four aggravating factors in the case qualitatively and quantitatively outweighed a single mitigating factor, Judge O&#39;Malley referred directly to the poignancy of a victim impact statement read into the record earlier during the sentencing hearing in denying a defense request for a reduced term of 5 years in prison.\n\n\&#34;These crimes were not isolated incidents constituting moments of poor judgment; they were textbook cases of grooming, involving a defendant who repeatedly leveraged tactics of isolation, manipulation, and control for the sake of her own selfish purposes,\&#34; Monmouth County Prosecutor Raymond S. Santiago said.\n\nWall Township Police Chief Sean O&#39;Halloran commended the courage of those who came forward and recognized the dedication of investigators from Wall Township PD and the Monmouth County Prosecutor&#39;s Office.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;evidence-tampering&#34;, &#34;parole-supervision-for-life&#34;]}, {&#34;id&#34;: 39, &#34;case_id&#34;: 35, &#34;case_name&#34;: &#34;Carissa Jane Smith&#34;, &#34;source&#34;: &#34;Fox News&#34;, &#34;date&#34;: &#34;2025-11-23&#34;, &#34;text&#34;: &#34;Former Missouri substitute teacher gets 10 years for trading students money, drugs for sex\nBy Stephen Sorace \u2014 Fox News, November 23, 2025\n\nA former substitute teacher in Missouri was sentenced to 10 years in prison on Wednesday after she was accused of giving students money, alcohol and drugs in exchange for sex.\n\nCarissa Jane Smith, 31, of Dixon, was arrested last November on 19 counts, including statutory rape and sexual contact with a student, the Pulaski County Sheriff&#39;s Office said at the time.\n\nIn September, Smith pleaded guilty to lesser charges of one count of endangering the welfare of a child, and two counts of sexual contact with a student.\n\nSmith worked in the Dixon School District as a paraprofessional and long-term substitute. She resigned in August 2024.\n\nSmith would offer students money, marijuana and alcohol in return for sex or to allow her to perform oral sex. Smith would allegedly meet with the victims at isolated places or while her husband was away for work. Victims told investigators that Smith would have sex with them at her home or other locations \&#34;such as gravel roads or on the side of the road.\&#34; One victim said Smith asked him to have sex with her when he was in middle school. Smith told them not to tell anyone about their encounters or else she could get into trouble.\n\nOne victim said Smith&#39;s husband threatened them with a baseball bat after she told him they were trying to blackmail her with a video of her smoking marijuana with students.\n\nSmith&#39;s sentence includes six years in the Missouri Department of Corrections for the charge of endangering the welfare of a child, and two years each for the sexual contact charges.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;evidence-tampering&#34;]}, {&#34;id&#34;: 40, &#34;case_id&#34;: 36, &#34;case_name&#34;: &#34;Elizabeth Blanchard&#34;, &#34;source&#34;: &#34;Action News Jax&#34;, &#34;date&#34;: &#34;2024-10-31&#34;, &#34;text&#34;: &#34;Woman who worked with kids in St. Augustine arrested on sex crimes\nBy Annette Gutierrez, Action News Jax \u2014 October 31, 2024\n\nST. AUGUSTINE, Fla. \u2014 Elizabeth Blanchard, 34, used to work at EPIC Behavioral Healthcare, but is now at the St. Johns County jail.\n\nJacksonville deputies arrested Blanchard last Friday (October 25) on out-of-county warrants from St. Johns County. Among the nine felony charges, she is accused of sexual assault by an authority figure against a minor and for lewd and lascivious battery on a minor.\n\nEPIC is a center to help people with mental health and substance abuse. Clients include court-ordered minors, who meet with staff in one-on-one settings.\n\nAction News Jax obtained an internal email the company shared with its employees which said Blanchard had been fired before the charges for \&#34;walking off campus with a minor client.\&#34; A week later, a parent accused Blanchard of having an inappropriate relationship with a client. EPIC said Blanchard had to move facilities at least once.\n\nEPIC&#39;s CEO Nangela Pulsfus: \&#34;We are shocked and dismayed by the actions of our former employee. The behavior in question goes against the values and standards of our company, and we do not tolerate such misconduct in any form.\&#34;\n\nBlanchard is in jail with a $267,000 bond. Her next court date with Duval County is set for November 7th.\n\n---\n\nCourt records, case# 24001689CFMA (St. Johns County):\n\n1/6/2026 \u2014 Defendant entered plea of guilty (charges 3 and 4).\n1/6/2026 \u2014 Sentenced on charge 2: 10 years max confinement prison, 73 days credit for time served, 5 years probation, other court restriction, sentencing guidelines.\n1/6/2026 \u2014 Sentenced on charge 3: 10 years prison concurrent with charge 2, 73 days credit, 8 years probation, sexual predator designation.\n1/6/2026 \u2014 Sentenced on charge 4: 10 years prison concurrent with charge 2, 73 days credit, 8 years probation, sexual predator designation.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sexual-predator&#34;, &#34;sex-offender-registration&#34;, &#34;prior-warning-ignored&#34;, &#34;behavioral-health&#34;, &#34;court-ordered-victims&#34;]}, {&#34;id&#34;: 41, &#34;case_id&#34;: 37, &#34;case_name&#34;: &#34;Renee L. DeLeon&#34;, &#34;source&#34;: &#34;CT court records / local news (Wallingford)&#34;, &#34;date&#34;: &#34;2024-08-08&#34;, &#34;text&#34;: &#34;Wallingford teacher charged with sexually assaulting underage student \u2014 court records\nDocket: N07M-CR24-0357666-S | Court: Meriden GA 7 | Arrest: 8/8/2024 | Sentenced: 8/25/2025\n\nWALLINGFORD, CT \u2014 A woman has been accused of sexually assaulting an underage student when the woman was a middle school teacher in town, police said.\n\nWallingford police say 52-year-old Renee Deleon has been charged with second-degree sexual assault and risk of injury to or impairing the morals of a child.\n\nPolice said officers received a report of suspected child abuse on April 15, saying that Deleon was engaged in a sexual relationship with a minor. Investigators determined the relationship allegedly occurred between April 23, 2008 and Dec. 31, 2008, when the victim was 14 years old.\n\nWallingford Police Detectives determined that Deleon engaged in the relationship with a student while she was a teacher at James Moran Middle School on Hope Hill Road. The relationship allegedly included numerous sex acts, including intercourse. Detectives conducted multiple interviews and executed a search and seizure warrant.\n\nDeleon is no longer employed by the Wallingford school system. She was taken into custody on Thursday after an arrest warrant was approved.\n\n---\n\nCourt records:\nStatute 53-21(a)(2) \u2014 Illegal Sexual Contact with Victim, Class B Felony\nOffense date: 4/23/2008 | Plea: Guilty | Verdict date: 6/30/2025\nSentenced 8/25/2025: 10 Years Jail, Execution Suspended, Probation 10 Years\nFine: $151.00\nOverall sentence: Probation with Special Conditions&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;delayed-reporting&#34;]}, {&#34;id&#34;: 42, &#34;case_id&#34;: 38, &#34;case_name&#34;: &#34;Rikki Laughlin&#34;, &#34;source&#34;: &#34;KOMU 8&#34;, &#34;date&#34;: null, &#34;text&#34;: &#34;Former St. James R-1 teacher Rikki Laughlin sentenced to probation on amended charge\n\nA former teacher in the St. James R-1 School District has been sentenced to probation on an amended charge following a child sex crimes investigation from 2023.\n\nRikki Laughlin pleaded guilty last week in Grundy County court to first-degree endangering the welfare of a child with no sexual conduct, and she was sentenced to five years of probation, court records show. If she violates her probation, she will spend five years in prison.\n\nLaughlin was charged with several child sex crimes in October 2023 after she was accused of sending sexual content of herself to a minor through Snapchat. She was initially charged in Maries County, and her case was moved to Grundy County in May 2024.\n\n---\n\nMARIES COUNTY \u2014 Rikki Laughlin, 25, is charged with possession of child pornography, tampering with a victim in a felony prosecution, second-degree statutory rape, sexual exploitation of a minor, tampering with physical evidence in felony prosecution, furnishing pornographic material or attempting to furnish to a minor, and second degree sexual trafficking of a child under 18 years old.\n\nAccording to court documents, Laughlin allegedly sent inappropriate content of herself to a minor through Snapchat. She also allegedly invited the student to her house. Laughlin initially denied all allegations against her, but then reportedly admitted to communicating with the minor over Snapchat but said the minor initiated it.\n\nShe was held at the Maries County Jail on a $100,000 cash-only bond.&#34;, &#34;tags&#34;: [&#34;snapchat&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;evidence-tampering&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 43, &#34;case_id&#34;: 39, &#34;case_name&#34;: &#34;Linda Leann Wallace&#34;, &#34;source&#34;: &#34;Associated Press&#34;, &#34;date&#34;: &#34;2013-09-10&#34;, &#34;text&#34;: &#34;Ex-teacher gets 16 years in prison for student sex\nAssociated Press \u2014 September 10, 2013\n\nBEAUMONT \u2014 An ex-music teacher at a private Christian school in Southeast Texas has been sentenced to 16 years in prison for having a sexual relationship with a student.\n\nA judge in Beaumont on Monday sentenced 53-year-old Linda Leann Wallace.\n\nThe former educator and counselor at Legacy Christian Academy in Beaumont in July pleaded guilty to sexual assault of a child and having an inappropriate relationship with the girl. Investigators say the assault began when the child was 13 and continued for at least four years until the victim graduated.\n\nProsecutors say the sexual abuse happened on campus, during school outings and at Wallace&#39;s home.\n\nWallace resigned last November before the charges were made public.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;private-school&#34;]}, {&#34;id&#34;: 44, &#34;case_id&#34;: 40, &#34;case_name&#34;: &#34;Shannon Pavlansky-Wojtowicz&#34;, &#34;source&#34;: &#34;21 News (WFMJ) / The Vindicator&#34;, &#34;date&#34;: &#34;2015-02-18&#34;, &#34;text&#34;: &#34;Former Campbell Memorial teacher Shannon Pavlansky-Wojtowicz convicted of sex with three students; released after one year of four-year sentence\n\nYOUNGSTOWN, Ohio \u2014 A former Campbell Memorial High School teacher convicted of having sex with three students has been released from prison after serving one year of a four-year sentence.\n\nMahoning County Common Pleas Court Judge Scott Krichbaum granted a motion for early release to 32-year-old Shannon Pavlansky-Wojtowicz on Friday.\n\nPavlansky-Wojtowicz was five months pregnant when Judge Krichbaum sentenced her in October after she pleaded guilty to three counts of sexual battery, one count of illegally using minors in nude performances, and one count of disseminating material harmful to juveniles.\n\nInvestigators say Pavlansky-Wojtowicz had sex with three different male students, one of them age 16, the other two, 17. The conduct occurred during a time period spanning from September 2011 to January 2015 when she resigned her position. The prosecutor&#39;s office said she had been a teacher in the district since 2009, and requested one of the minors to text her nude photos of himself. She sent nude images of herself to all three of the minors.\n\nPavlansky-Wojtowicz remains on probation for five years and must register as a tier three sex offender for the rest of her life.\n\n---\n\nWednesday, February 18, 2015 \u2014 CAMPBELL \u2014 Shannon Pavlansky-Wojtowicz, 30, of Campbell faces a third-degree felony charge of sexual battery. City law director Brian J. Macala said: \&#34;We are alleging that there was physicality between her and the student.\&#34; The alleged sexual misconduct occurred between Dec. 14, 2014, and Jan. 16. Campbell schools Superintendent Matthew Bowen filed a complaint with the Campbell Police Department on Jan. 16. Pavlansky-Wojtowicz admitted during the initial investigation that she engaged in receiving and sending text communications with a minor student \&#34;that may have a sense of impropriety.\&#34;&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;early-release&#34;]}, {&#34;id&#34;: 45, &#34;case_id&#34;: 21, &#34;case_name&#34;: &#34;State v. Anna Crocker&#34;, &#34;source&#34;: &#34;FOX6 News&#34;, &#34;date&#34;: null, &#34;text&#34;: &#34;Additional detail on Anna Crocker case \u2014 FOX6 News\n\nVictim 1 (12 years old, current student):\nProsecutors said the alleged sexual assault happened over the winter of 2023-2024. The victim said he was at Crocker&#39;s home for a sleepover and was asleep in the basement when Crocker woke him up, removed his pants and sexually assaulted him. He said Crocker tried to hide, but the other kids \&#34;saw what happened.\&#34; The victim said what took place was not consensual and he told her repeatedly to get off and tried to push her off, but she would not listen. Months later, the victim received a text from Crocker in which she told him to apologize to her \&#34;for what happened in the basement\&#34; \u2014 described as her \&#34;trying to make him feel guilty.\&#34; She told him he could not tell anyone.\n\nVictim 2 (14 years old, former student):\nProsecutors said the 14-year-old reported that Crocker \&#34;had been inappropriate with him\&#34; and the two exchanged \&#34;sexual chats and pictures\&#34; via Snapchat. He also said Crocker sexually assaulted him in a parking lot in August 2024. In an interview with a detective, Crocker admitted to receiving a sexual video from the 14-year-old victim and saving it. She also admitted sending the video to a student at the victim&#39;s school. The detective seized and searched the phone, which included the video in a password-protected section.\n\nVictim 3 (13 years old):\nTwin Lakes police spoke to the 13-year-old and his parents on October 10, 2024. The victim said he told a school staff member that Crocker sent him inappropriate messages, including multiple videos of herself performing a sex act.\n\nThe alleged crimes involved a current student and a former student of the school, according to the sheriff&#39;s department.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;explicit-photos&#34;, &#34;evidence-tampering&#34;, &#34;csam-distribution&#34;, &#34;witness-present&#34;]}, {&#34;id&#34;: 46, &#34;case_id&#34;: 41, &#34;case_name&#34;: &#34;Reagan Anderson&#34;, &#34;source&#34;: &#34;WIS-TV&#34;, &#34;date&#34;: &#34;2025-04-10&#34;, &#34;text&#34;: &#34;Former Orangeburg County teacher Reagan Anderson sentenced to probation after guilty plea\nWIS \u2014 April 10, 2025\n\nCOLUMBIA, S.C. \u2014 A former teacher in Orangeburg County pled guilty today after having an inappropriate relationship with a student.\n\nReagan Anderson, 28, was sentenced to five years of probation for second-degree assault and battery.\n\nAnderson was originally arrested for two counts of sexual battery of a 16 or 17-year-old back in 2023.\n\nThe victim&#39;s mother said the world as she knew it had completely fallen apart. \&#34;A predator hiding in plain sight, waiting for her prey,\&#34; said the victim&#39;s mother. \&#34;She sent several nude photos of herself to my son to lure her into a sexual relationship with him. He was not the only one. He was the one brave enough to put a stop to her heinous acts.\&#34;\n\nArrest warrants said these incidents happened in October of 2023 at a Pizza Hut in Santee and a home on Bunch Ford Rd. in Orangeburg County.\n\nAnderson, a former teacher at Holly Hill Academy, was fired from the school after the head of the school notified law enforcement about the relationship after students came forward.\n\nAs part of her plea agreement, Anderson is ordered to sex offender counseling that must be approved by the solicitor&#39;s office. She will not be placed on the sex offender registry. But if she violates any terms of her probation, Anderson can face up to 8 years in prison and will be registered as a sex offender.\n\nAnderson also has a permanent restraining order from the victim and his family as part of her plea agreement.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;private-school&#34;, &#34;possible-additional-victims&#34;]}, {&#34;id&#34;: 48, &#34;case_id&#34;: 42, &#34;case_name&#34;: &#34;Alyson Cranick&#34;, &#34;source&#34;: &#34;U.S. Attorney&#39;s Office, District of Connecticut&#34;, &#34;date&#34;: &#34;2025-11-18&#34;, &#34;text&#34;: &#34;Columbia Woman Who Coerced Minor Boy to Engage in Sexual Activity Pleads Guilty\nU.S. Attorney&#39;s Office, District of Connecticut \u2014 November 18, 2025\n\nDavid X. Sullivan, United States Attorney for the District of Connecticut, announced that ALYSON CRANICK, 44, of Columbia, pleaded guilty today before U.S. District Judge Kari A. Dooley in Bridgeport to coercion and enticement of a minor to engage in sexual activity.\n\nAccording to court documents and statements made in court, Cranick, first using text messaging and Snapchat, and then using the internet chat service Discord, coerced an 11-year-old boy to engage in sexually explicit conduct with her. Several times during the summer and into the fall of 2022, Cranick induced the minor victim to leave his house after midnight to meet up with her. Cranick sexually assaulted the minor victim during these meetings.\n\nBetween July and October 2022, Cranick exchanged more than 4,700 messages with the minor victim on Discord.\n\nCranick was arrested on related state charges on November 14, 2023, and has been detained since November 28, 2023. She was federally charged in July 2024.\n\nJudge Dooley scheduled sentencing for February 12, at which time Cranick faces a mandatory minimum term of imprisonment of 10 years and a maximum term of imprisonment of life.\n\nThis matter has been investigated by the FBI&#39;s Child Exploitation Task Force and the Connecticut State Police&#39;s Eastern District Major Crime Unit. The case is being prosecuted by Assistant U.S. Attorneys Daniel E. Cummings and Katherine E. Boyles through the U.S. Department of Justice&#39;s Project Safe Childhood Initiative.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;discord&#34;, &#34;federal&#34;, &#34;late-night-meetups&#34;, &#34;fbi&#34;]}, {&#34;id&#34;: 49, &#34;case_id&#34;: 42, &#34;case_name&#34;: &#34;Alyson Cranick&#34;, &#34;source&#34;: &#34;U.S. District Court, District of Connecticut \u2014 Doc 79 (filed under seal)&#34;, &#34;date&#34;: &#34;2026-03-06&#34;, &#34;text&#34;: &#34;Government&#39;s Sentencing Memorandum \u2014 United States v. Alyson Cranick\nCase 3:24-CR-159 (KAD), Document 79, Filed 03/06/26\n\nGovernment recommends 240 months (20 years). Sentencing Guidelines recommend life imprisonment. Plea entered November 18, 2025 \u2014 two weeks before scheduled jury selection.\n\nOffense Conduct:\nCranick was a trusted family friend of M.V.&#39;s family, giving her regular private access to the 11-year-old victim. She systematically groomed and sexually assaulted M.V. over 10 times during summer 2022. She escalated communications from Snapchat/iMessage to Discord specifically to conceal contact from M.V.&#39;s mother. Between July and October 2022, they exchanged 4,700+ Discord messages.\n\nAssault pattern: Cranick drove to M.V.&#39;s neighborhood once or twice per week between midnight and 3am, hid in bushes outside his home, and fed him real-time surveillance information (which lights were on, who appeared awake) over Discord to help him sneak out undetected. She drove him to secluded locations (Columbia Lake; locations along Salmon River in Colchester) in a tinted-window vehicle. M.V. estimated sexual intercourse occurred more than 10 but fewer than 20 times.\n\nGrooming: Gifts including candy, energy drinks, $400-600 cash. Made M.V. a bracelet inscribed \&#34;BFFLWB\&#34; (\&#34;Best Friends Forever With Benefits\&#34;) and coached him on a cover story for its meaning. Coached him to lie to his parents. Used emotional manipulation \u2014 when M.V. said he was too tired to sneak out, she told him she&#39;d be \&#34;up all night crying.\&#34;\n\nM.V. ended the abuse in September 2022 by blocking Cranick. He had told her \&#34;no means no\&#34; and that he could not continue \&#34;physically and mentally.\&#34;\n\nAdditional conduct: M.V. was not the only minor Cranick communicated with. She cultivated relationships with other children and communicated over social media with underage lifeguards on her staff. After her initial state arrest, she violated conditions of release by contacting a 13-year-old girl on Snapchat despite court orders prohibiting unsupervised contact with minors.\n\nVictim impact: M.V.&#39;s mother stated: \&#34;This crime robbed my son of his trust, his joy, and his natural curiosity about the world.\&#34;&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;possible-additional-victims&#34;, &#34;discord&#34;, &#34;federal&#34;, &#34;surveillance&#34;, &#34;gifts&#34;, &#34;cash&#34;, &#34;emotional-manipulation&#34;, &#34;violation-of-release-conditions&#34;, &#34;sentencing-memo&#34;]}, {&#34;id&#34;: 50, &#34;case_id&#34;: 43, &#34;case_name&#34;: &#34;Jane Shetterly&#34;, &#34;source&#34;: &#34;Bay Area News Group&#34;, &#34;date&#34;: &#34;2022-11-23&#34;, &#34;text&#34;: &#34;Fired Richmond teacher sentenced to 3 years, eight months for sexually abusing student\nBy Nate Gartrell, Bay Area News Group \u2014 November 23, 2022 / July 19, 2022\n\nMARTINEZ \u2014 In a plea deal with prosecutors, a West Contra Costa high school teacher was sentenced Wednesday to three years and eight months in state prison for sexually abusing a female student.\n\nJane Shetterly, 42, pleaded no contest to two counts of sexual penetration with a foreign object, under aggravated circumstances of being more than 10 years older than the victim. She remains in county jail, pending transfer to the California Department of Corrections and Rehabilitation.\n\nShetterly, a Martinez resident who taught at De Anza High School in Richmond, was charged last July with 12 felonies related to alleged sexual abuse of a girl during private lessons at Shetterly&#39;s home. Police say the victim is a special needs student.\n\nThe sentence can be reduced by up to 50 percent with good behavior. Shetterly also gets credit for time she served in the county jail. As part of the sentence, she was ordered to stay away from the victim for 10 years and given a 10-year minimum sex offender registration requirement.\n\nIn court records, police alleged Shetterly groomed the girl after they met during her freshman year. The girl reported that she and Shetterly kissed more than 100 times, that Shetterly wrote the girl \&#34;love letters,\&#34; bought her alcohol, and took her to sex shops. Police also allege that Shetterly told the girl to falsely accuse her parents of abuse so that Shetterly could adopt her and \&#34;scripted\&#34; messages to that effect for the girl to submit to authorities.\n\nThe victim&#39;s family has sued the West Contra Costa Unified School District, alleging officials there missed or ignored warning signs that the girl was being abused, and failed to stop Shetterly from contacting the victim after the alleged abuse came to light. Civil attorney Micha Star Liberty called the original charges \&#34;the first steps to achieving accountability.\&#34;\n\nShetterly was charged with 12 felonies including 3 counts lewd act upon a child, 1 count contacting a minor for lewd purposes, and 8 counts specific sexual acts on a minor. She turned herself in approximately two weeks after charges were filed June 30. She was held in Contra Costa County jail on $1.1 million bail.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;alcohol&#34;, &#34;female-victim&#34;, &#34;love-letters&#34;, &#34;special-needs-victim&#34;, &#34;adoption-scheme&#34;]}, {&#34;id&#34;: 51, &#34;case_id&#34;: 44, &#34;case_name&#34;: &#34;Dominique Allinda Maynard&#34;, &#34;source&#34;: &#34;Hamden Police Department / CT court records&#34;, &#34;date&#34;: &#34;2022-06-02&#34;, &#34;text&#34;: &#34;Former teacher Dominique Allinda Maynard arrested \u2014 Hamden Police news release #22-053\nJune 2, 2022\n\nOn 11/10/21, the Hamden Police Department received a report of inappropriate text messages being sent between a teacher and a group of students (12-13 years old) at the Booker T. Washington Academy, 306 Circular Avenue. The teacher was identified as Dominique Maynard, age 27, of New Haven.\n\nDetective Jay Bunnell of the Hamden Police Department&#39;s Special Victims Unit conducted an extensive investigation which revealed that Maynard sent inappropriate text messages to a group of students, including a 13-year-old male student. The investigation also determined that Maynard engaged in sexual intercourse with the 13-year-old student, on more than one occasion, at the school.\n\nOn 05/31/22, Dominique Maynard was charged with four counts of Sexual Assault in the Second Degree and four counts of Risk of Injury to a Minor. Maynard was held on a $100,000.00 court set bond and scheduled to appear in Meriden Superior Court on 06/03/22.\n\n---\n\nCourt records \u2014 Docket N07M-CR22-0350160-S, Meriden GA 7:\nArrest: 5/31/2022 | Sentenced: 1/7/2025\nStatute 53-21(a)(2) \u2014 Illegal Sexual Contact with Victim, Class B Felony\nOffense date: 10/1/2021 | Plea: Guilty | Verdict date: 9/4/2024\nSentenced: 10 Years Jail, Execution Suspended After 9 Months, Probation 5 Years | Fine: $151.00\nOverall sentence: Committed to Department of Corrections and Probation Ordered\nDefense attorney: MG Dolan (#413074)&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 52, &#34;case_id&#34;: 45, &#34;case_name&#34;: &#34;Courtney Horn&#34;, &#34;source&#34;: &#34;WKYT / Kentucky DOC supervision records&#34;, &#34;date&#34;: &#34;2022-04-26&#34;, &#34;text&#34;: &#34;Former Lee County teacher Courtney Horn arraigned for sexual relationship with female student\nBy Jim Stratman, WKYT \u2014 April 26, 2022\n\nLEE COUNTY, Ky. \u2014 A now-former Kentucky teacher accused of having a sexual relationship with a student was in court Tuesday.\n\nCourtney Horn had her first appearance in front of a judge for an arraignment hearing. She pleaded not guilty to all charges.\n\nHorn, 32, is accused of engaging in a sexual relationship with a female student at Lee County Middle High School. Court documents show Lee County Superintendent Sarah Wasson reported a possible inappropriate relationship between Horn, a PE teacher, and a 16-year-old student. Kentucky State Police began an investigation. A KSP detective interviewed Horn, who admitted to engaging in sexual activity with the student at her house after school hours. The student also confirmed the relationship to the detective.\n\nWasson sent a note to parents about the investigation and that Horn had been fired.\n\nHorn is facing charges of third-degree sodomy, third-degree rape and first-degree sexual abuse. She is out on bond with conditions prohibiting school property access and student contact.\n\n---\n\nKentucky DOC supervision records:\nPID #548565 | Indictment 22-CR-00017 | Lee County\nConviction: Possession of Matter Portraying Sexual Performance by a Minor (KRS 531.335), Class D Felony\nCrime date: 10/1/2021 | Sentence: 5 years probation (regular)\nSupervision: 11/20/2023 \u2013 10/3/2028 | Risk: Moderate\nLocation: District 08 \u2013 Richmond, Madison County&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;female-defendant&#34;]}, {&#34;id&#34;: 53, &#34;case_id&#34;: 46, &#34;case_name&#34;: &#34;Alley Bardfield&#34;, &#34;source&#34;: &#34;WAND&#34;, &#34;date&#34;: &#34;2025-09-25&#34;, &#34;text&#34;: &#34;Former DPS sub accused of sexually assaulting 11-year-old student sentenced to 10 years\nWAND Digital Team \u2014 September 25, 2025\n\nDECATUR, Ill. \u2014 A former long-term substitute teacher for Decatur Public Schools was sentenced to 10 years in prison Thursday afternoon. Alley Bardfield, 34, will serve the 10-year sentence at 85%, with three years up to life supervised release.\n\nBardfield was arrested by police in April 2024 for sexually abusing and grooming an 11-year-old student.\n\nAccording to Mt. Zion Police, in early April 2024, a Decatur resident reported a possible inappropriate relationship between Bardfield and her 11-year-old son. The victim was a sixth grade student with DPS at the time of the crime.\n\nDuring an August hearing, Bardfield took a partial plea agreement to count 1. At the time, the state recommended she be sentenced to 40 years at 85%. The maximum penalty for this sentence is 60 years.\n\nThe victim&#39;s mother said her son had been acting differently after a visit to Bardfield&#39;s home. She checked her son&#39;s phone and social media. Her son said he had a sexual encounter with Bardfield while he was a guest at her Mt. Zion residence on March 29, 2024.\n\nIn early April 2024, officers executed a search warrant at Bardfield&#39;s residence and reviewed her text messages and social media accounts.\n\nAccording to a sworn statement, Bardfield had sent the child over $700 through CashApp over the prior months. During a Mirandaized interview, she admitted to police having sexual penetration with the victim on one occasion. She also stated that she paid him via CashApp and exchanged nude photographs on Snapchat.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;cash&#34;]}, {&#34;id&#34;: 54, &#34;case_id&#34;: 47, &#34;case_name&#34;: &#34;Melissa Rockensies&#34;, &#34;source&#34;: &#34;Daily Mail / New York Post&#34;, &#34;date&#34;: &#34;2024-04-09&#34;, &#34;text&#34;: &#34;Married sex predator teacher grins as she escapes jail despite raping male student, 14\nBy Will Potter, Daily Mail \u2014 April 9, 2024\n\nMelissa Rockensies, 33, was all smiles as she left Queens court on Tuesday with a plea deal: no jail time, permanent surrender of teaching license, and completion of a 2-year sexual predator program.\n\nRockensies, dean of Leadership and Student Support at Corona Arts middle school, groomed a 14-year-old student beginning when she started at his school in mid-2022. Contact began via email over an issue with another student, escalated to Instagram in September 2022, then to in-person meetings. She took him for a walk in a park after the supermarket, hugged him \&#34;really close,\&#34; and kissed him. The sexual relationship then escalated to approximately 4x per week, typically in her car parked near the school \u2014 including during school hours.\n\nVictim&#39;s account (New York Post): \&#34;She&#39;d tell me where to go to meet her, where the car is parked. Every time we&#39;d meet up, we&#39;d have sex.\&#34; He said she gave him gifts including money (up to $500) and nicotine devices. She texted explicitly while caring for her children: \&#34;You&#39;re gonna be lucky once I put this kid to sleep.\&#34; \&#34;I wanna be able to kiss those lips of yours.\&#34;\n\nNovember 2023: Rockensies claimed the victim was extorting her and threatened to shoot her and her children unless she paid $5,000. The victim denied this, saying his Instagram account had been hacked after he was banned for skipping summer school.\n\nHusband William Rockensies publicly defended her: \&#34;My wife is innocent. She&#39;s the mother of three kids.\&#34;\n\nCivil lawsuit filed January 2024 by victim&#39;s mother against NYC DOE alleging negligence (attorney Jonathan Cooper). DA Melinda Katz: \&#34;These disturbing allegations represent an abuse of authority and a betrayal of the trust students and parents place in their schools.\&#34;\n\nRockensies earned approximately $85,000/year and has been removed from the school. If convicted she would face termination per DOE policy.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;sexting&#34;, &#34;no-prison&#34;, &#34;cash&#34;, &#34;victim-blaming&#34;, &#34;extortion-counter-claim&#34;]}, {&#34;id&#34;: 55, &#34;case_id&#34;: 48, &#34;case_name&#34;: &#34;Jill Edstrom&#34;, &#34;source&#34;: &#34;Fox 17 West Michigan&#34;, &#34;date&#34;: &#34;2022-05-16&#34;, &#34;text&#34;: &#34;West Ottawa substitute teacher Jill Edstrom sentenced to 18 months for criminal sexual assault\nFox 17 West Michigan \u2014 October 26, 2021 / May 16, 2022\n\nPARK TOWNSHIP, Mich. \u2014 A long-term substitute teacher for Ottawa County Public Schools has been charged with sexual misconduct after police say she had a relationship with a student.\n\nAn investigation by the Ottawa County Sheriff&#39;s Office revealed that Jill Edstrom, 50, had previously entered a relationship with a 16-year-old student. Court documents reveal Edstrom was having an inappropriate relationship with a 16-year-old male staying in the family home. She was charged on one count of 3rd-degree criminal sexual conduct on October 26, 2021.\n\n---\n\nPARK TOWNSHIP, Mich. \u2014 A West Ottawa substitute teacher who pleaded guilty to sexually assaulting a student has been sentenced.\n\nCourt records show Jill Edstrom was sentenced Monday to 18 months behind bars for criminal sexual assault in the third degree. Edstrom was charged back in October after deputies said she had a relationship with a 16-year-old.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 56, &#34;case_id&#34;: 49, &#34;case_name&#34;: &#34;Bridgette Doucette-Howell&#34;, &#34;source&#34;: &#34;Seacoast Online&#34;, &#34;date&#34;: &#34;2024-04-02&#34;, &#34;text&#34;: &#34;Teacher pleads guilty to sex with 18-year-old student; victim did not want charges\nBy Angeljean Chiaramida, Seacoast Online \u2014 April 2, 2024\n\nBRENTWOOD \u2014 Bridgette Doucette-Howell, 40, of Merrimack, pleaded guilty to two counts of aggravated felonious sexual assault as the first person charged under New Hampshire&#39;s \&#34;Howie Leung Loophole Law\&#34; (RSA 632-A:2 I(k)), which criminalizes sexual contact between school authority figures and students regardless of age or consent.\n\nSentenced at Rockingham Superior Court by Judge James Kennedy: Count 1 \u2014 1 year jail, serve 14-day minimum, remaining 50 weeks on administrative home confinement; Count 2 \u2014 5-10 years suspended for 10 years. Sex offender registration required.\n\nDoucette-Howell was a drama coach at Sanborn Regional High School in Kingston and a 2016 NH Teacher of the Year finalist. The incidents occurred April 26 \u2013 May 11, 2021 in Kingston and Exeter with a then-18-year-old male student.\n\nThe victim submitted a statement opposing the prosecution: \&#34;I do not wish for Bridgette to be punished under criminal law for our reactions from our unhealthy circumstances of life.\&#34; He wrote that the investigation \&#34;had more trauma than the case ever did\&#34; and that Doucette-Howell \&#34;helped him get through those difficult times.\&#34; His family was also \&#34;questioning as to why the case qualified for criminal charges when it should have stayed at the school level.\&#34;\n\nThe Howie Leung Loophole Law was passed after the 2019 case of Concord High School teacher Primo \&#34;Howie\&#34; Leung, who was seen kissing a student of adult age but could not be criminally charged under existing law. The statute applies to any school employee, contractor, or volunteer engaging in sexual activity with any student up to 10 months post-graduation; consent is expressly not a defense.\n\nDefense attorney Kurt Olson said he was \&#34;quite pleased\&#34; with the outcome. Assistant County Attorney Kristin Vartanian said \&#34;justice was served\&#34; given the particular circumstances. The plea came after court-approved judicial mediation.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;adult-victim&#34;, &#34;victim-opposed-prosecution&#34;, &#34;novel-statute&#34;, &#34;home-confinement&#34;]}, {&#34;id&#34;: 57, &#34;case_id&#34;: 50, &#34;case_name&#34;: &#34;Kristin M. Bellinger&#34;, &#34;source&#34;: &#34;WRGB CBS 6 / NY Appellate Division 3rd Dept&#34;, &#34;date&#34;: &#34;2024-11-18&#34;, &#34;text&#34;: &#34;Kristin M. Bellinger \u2014 HFM BOCES teacher convicted of criminal sexual act with 13yo student\nSources: WRGB CBS 6 (arrest) / People v. Bellinger, Appellate Division 3rd Dept, Nov 18, 2024\n\nJOHNSTOWN, N.Y. \u2014 Kristin M. Bellinger, 39, a special education teacher with the Hamilton Fulton Montgomery BOCES District, surrendered to police and was charged with rape for allegedly having sexual intercourse with a 13-year-old boy in 2019.\n\nInvestigators said Bellinger was providing private in-home tutoring to the teenager outside of her classroom role. HFM BOCES contacted police after the victim came forward, placed Bellinger on leave, and she is no longer employed by the district. She was arraigned and released on $15,000 bail.\n\n---\n\nFrom the Appellate Division decision (November 18, 2024):\nDefendant was a 35-year-old special education teacher in a middle school BOCES program. The victim was an eighth-grade student enrolled in two of her classes. Defendant briefly dated the victim&#39;s father, with whom the victim resided, and sexually abused the victim when she would go to their house, often when the father was absent, to help the victim with schoolwork; later, the abuse continued at her house in another county.\n\nIn 2023, defendant pleaded guilty to criminal sexual act in the second degree (indictment also charged 3 counts rape in the second degree) and was sentenced to six months in jail, followed by 10 years of post-release supervision.\n\nSORA: RAI initially assigned 125 points (presumptive Risk Level 3). County Court assigned 85 points and classified defendant as Risk Level 2, declining the People&#39;s request for upward departure. The SORA assessment included 25 points under risk factor 2 (sexual intercourse more than 10 times) and 20 points under risk factor 7 (professional relationship). The Appellate Division upheld Risk Level 2, finding: the teacher-student professional relationship preceded the personal relationship with the father and was appropriately the basis for risk factor 7 points.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;victim-in-home&#34;, &#34;dating-parent-for-access&#34;, &#34;sora-appeal&#34;]}, {&#34;id&#34;: 58, &#34;case_id&#34;: 51, &#34;case_name&#34;: &#34;Rachel E. Lasecki&#34;, &#34;source&#34;: &#34;Times Observer&#34;, &#34;date&#34;: &#34;2023-08-26&#34;, &#34;text&#34;: &#34;Teacher gets probation for sexually assaulting student\nBy Josh Cotton, Times Observer \u2014 August 26, 2023\n\nA former Warren County School District teacher has been sentenced to probation for sexually assaulting a high school student.\n\nRachel E. Lasecki, 27, Erie, was sentenced Friday by Judge Gregory Hammond at the Warren County Courthouse.\n\nAccording to the affidavit of probable cause, police said they scheduled a forensic interview with the victim at the Warren County Children&#39;s Advocacy Center based on a report of suspected abuse that \&#34;stated concerns over possible grooming behaviors.\&#34; Lasecki made alcohol and marijuana available to a student and \&#34;exposed (the victim) to sexually explicit material via the internet on more than one occasion.\&#34; Lasecki allegedly touched the victim inappropriately while in Lasecki&#39;s car at a remote location in Warren County. At the time, Lasecki was a teacher at Warren Area Elementary Center and an assistant volleyball coach at Warren Area High School.\n\nDefense attorney Elizabeth Feronti said prosecution previously had no objection to probation and said it would be \&#34;certainly appropriate.\&#34; ADA Casey Strickland said Lasecki&#39;s conduct \&#34;crossed\&#34; several lines and that Lasecki was able to \&#34;ingratiate\&#34; herself into the private life of the victim via her vulnerabilities. \&#34;Lasecki had a choice to do what she did. The victim did not.\&#34;\n\nSOAB evaluation: not a sexually violent predator, but conduct was predatory in nature.\n\nJudge Hammond, speaking to the victim: \&#34;You&#39;re 100 percent the victim. The fact you believe the community turned against you\u2026 is heartbreaking\&#34; and explains why victims don&#39;t come forward.\n\nLasecki declined to comment. 30 letters submitted on her behalf.\n\nSentence \u2014 Indecent assault: 2yr probation, $500 fines/fees, $2,955.77 restitution, no contact order, DNA sample, sex offender registration, sexual offender counseling, mental health/drug/alcohol evaluation, 50hr community service, no employment or volunteering with minors.\nCorruption of minors: additional 2yr probation, 25hr community service.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;female-victim&#34;, &#34;community-backlash&#34;]}, {&#34;id&#34;: 59, &#34;case_id&#34;: 22, &#34;case_name&#34;: &#34;State v. Madison Bergmann&#34;, &#34;source&#34;: &#34;Court/investigative records&#34;, &#34;date&#34;: null, &#34;text&#34;: &#34;Additional evidence detail \u2014 State v. Madison Bergmann\n\nInvestigators discovered over 35,000 text messages, along with nearly 100 handwritten love notes and artwork, exchanged between Bergmann and the 11-year-old student over a three-month period in 2024.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;physical-evidence&#34;, &#34;love-letters&#34;]}, {&#34;id&#34;: 60, &#34;case_id&#34;: 52, &#34;case_name&#34;: &#34;Leeann Yammarino&#34;, &#34;source&#34;: &#34;PEOPLE / WBRZ&#34;, &#34;date&#34;: &#34;2025-11-18&#34;, &#34;text&#34;: &#34;Louisiana cheer mom Leeann Yammarino sentenced to 26 years for sex crimes involving teenagers\nPEOPLE / WBRZ (Bess Casserleigh) \u2014 November 18, 2025\n\nPRAIRIEVILLE \u2014 Leeann Yammarino, 44, was sentenced to 26 years in prison. She previously pleaded no contest to two counts of carnal knowledge of a juvenile and two counts of indecent behavior with a juvenile. Judge Gant-Turner sentenced her to 10 years for each carnal knowledge charge and 3 years each for the indecent behavior charges.\n\nYammarino was very involved in her daughter&#39;s cheerleading team. In court, her own daughter asked the judge to give her mother the maximum sentence on each charge.\n\nThe case came to light in July 2024 after Ascension Parish Sheriff&#39;s Office detectives were called to a residence and spoke to four sets of juvenile parents about Yammarino. One parent&#39;s 15-year-old son said he had sex with Yammarino in her vehicle. He showed his mother an explicit photo Yammarino sent over Snapchat \u2014 \&#34;a white female lying in a bathtub from her belly button up to her facial area depicting Leeann&#39;s face with both her breasts exposed.\&#34; Three other male juveniles alleged Yammarino sent them explicit nude photos and videos over the past few months. Two more juvenile victims were identified in August 2024.\n\nProsecutors alleged she had sex with a 14-year-old boy between Jan. 1, 2024, and July 30, 2024, and sexted with multiple teenagers ranging from 14 to 16 years old.\n\nYammarino was arrested August 2024 and did not bond out. She will receive credit for time served and must register as a sex offender for 15 years.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;family-member-sought-maximum&#34;, &#34;non-school&#34;]}, {&#34;id&#34;: 61, &#34;case_id&#34;: 53, &#34;case_name&#34;: &#34;Stefanie Kellenberger&#34;, &#34;source&#34;: &#34;The Richland Source&#34;, &#34;date&#34;: &#34;2025-10-06&#34;, &#34;text&#34;: &#34;Stefanie Kellenberger, a former Shelby, Ohio teacher, was sentenced on October 6, 2025 to 15 years in prison in Richland County Common Pleas Court. She was convicted on 21 felony counts: 4 counts of sexual battery and 17 counts of unlawful sexual conduct with a minor. The offenses occurred between February 2020 and October 2021, when the victim was 14\u201315 years old. The victim also worked as Kellenberger&#39;s babysitter. A joint sentencing recommendation was accepted by the court. Judicial release is possible after serving 10 years. Kellenberger was classified as a Tier III sex offender. She apologized in court. The victim, in her statement, said she primarily wanted Kellenberger&#39;s teaching license permanently revoked and asked for only a 3-year sentence.&#34;, &#34;tags&#34;: [&#34;guilty-plea&#34;, &#34;female-victim&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;babysitter&#34;, &#34;tier-iii-sora&#34;, &#34;multiple-counts&#34;, &#34;victim-statement&#34;, &#34;lenient-request&#34;]}, {&#34;id&#34;: 62, &#34;case_id&#34;: 54, &#34;case_name&#34;: &#34;Stacy Michelle Walker&#34;, &#34;source&#34;: &#34;City News Service / NBC San Diego&#34;, &#34;date&#34;: &#34;2024-08-15&#34;, &#34;text&#34;: &#34;A former Mount Carmel High School teacher who pleaded guilty to committing sex acts on an underage female student was sentenced Wednesday to three years in state prison.\n\nStacy Michelle Walker, 40, was arrested in March and initially charged with 17 felonies for what a prosecutor called \&#34;a highly inappropriate relationship\&#34; that began when the victim was 15 years old and continued until 2020, when the victim was 18.\n\nWalker, previously a drama and theater tech teacher and a former Mount Carmel High student, pleaded guilty last month to three sex crime counts and her plea included an admission that she took advantage of a position of trust or confidence to commit the offense. Along with prison time, she is required to register as a sex offender for life.\n\nA criminal complaint states the crimes occurred in 2018 and 2019. The victim reported the offenses to police last July.\n\nNow 22 years old, the victim described at length in court how she was groomed by her former teacher and led to believe she and Walker were in a loving relationship.\n\nShe said Walker would provide \&#34;special treatment\&#34; for her, such as trips to restaurants and shows, and eventually started broaching sexual topics in their conversations.\n\nWalker&#39;s treatment of the girl escalated into controlling behavior, requests for sexually explicit pictures and videos via an encrypted messaging application, and sex acts, the victim said.\n\nKnowing that their relationship could not be made public, the victim said she frequently lied to protect Walker, who she said \&#34;forced me to live a complete double life. It exhausted me to the point of no return.\&#34;\n\nThe victim said, \&#34;For years, I was forbidden to keep any sort of paper trail of my thoughts and feelings. I was forced to contain the vast burden of everything I had experienced to myself in order to protect what I thought was a relationship of true love. Now I know it was all just to protect her. My feelings, my wellbeing, my safety, were never a part of the equation.\&#34;\n\nThe victim, who said she suffers from depression, anxiety, and panic attacks, and has been diagnosed with post-traumatic stress disorder, said her complicated feelings for Walker led her to feel guilty even as she reported the sexual abuse to police.\n\n\&#34;My heart was breaking for her rather than for myself and everything I had endured up to that point,\&#34; she said.\n\nAddressing Walker, she said the former teacher \&#34;knew right from wrong\&#34; and said Walker once commented about knowing it was wrong that she \&#34;fell in love with me the second you laid eyes upon me in your office\&#34; when the girl was 15.\n\n\&#34;It was never my job to police your adult decisions and behaviors,\&#34; she told Walker. \&#34;You were 18 years older than me. Our age gap was larger than my age itself when I first became your student.\&#34;&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;lenient-sentence&#34;, &#34;guilty-plea&#34;, &#34;sexting&#34;, &#34;female-victim&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;victim-statement&#34;, &#34;encrypted-messaging&#34;, &#34;ptsd&#34;, &#34;controlling-behavior&#34;]}, {&#34;id&#34;: 63, &#34;case_id&#34;: 55, &#34;case_name&#34;: &#34;Ellen Phillips&#34;, &#34;source&#34;: &#34;DOJ / U.S. Attorney&#39;s Office, Eastern District of Kentucky&#34;, &#34;date&#34;: &#34;2024-04-26&#34;, &#34;text&#34;: &#34;LEXINGTON, Ky. \u2013 A Danville, Ky., woman, Ellen Phillips, formerly known as Ellen Shell, 38, was sentenced on Friday, by Chief U.S. District Judge Danny Reeves, to 188 months in prison, for using the internet to attempt to entice a minor to engage in sexual conduct.\n\nPhillips, who at the time of her offenses was employed as a teacher&#39;s aide, was conducting sexual relationships with numerous teenage boys in the Boyle and Garrard County areas. Phillips would communicate with the victims via Snapchat, Facebook, or text messaging; and in many instances, she would meet the victims for the purpose of engaging in sexual activity. According to Phillips&#39; plea, she engaged in sexual activity with multiple minors at the same time.\n\nIn her plea agreement, Phillips specifically admitted that on December 20, 2022, she attempted to entice a 15-year-old minor to engage in sexual activity. In this conversation, Phillips messaged the victim using Facebook and repeatedly attempted to get the victim to sneak out of his house for sexual activity. When the victim said he could not leave, Phillips offered alcohol and oral sex to the minor and offered excuses the victim could tell his mother as to why he needed to leave his home.\n\nUnder federal law, Phillips must serve 85 percent of her prison sentence. Upon her release from prison, she will be under the supervision of the U.S. Probation Office for life.\n\nThe investigation was conducted by the HSI, KSP, Garrard County Sheriff&#39;s Office, and Danville Police Department. Assistant U.S. Attorney Erin Roth is prosecuting the case on behalf of the United States.\n\nThe U.S. Attorney&#39;s Office prosecuted this case as part of Project Safe Childhood, a nationwide initiative launched in 2006 by the Department of Justice to combat the growing epidemic of child sexual exploitation and abuse.&#34;, &#34;tags&#34;: [&#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;guilty-plea&#34;, &#34;social-media&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;federal-prosecution&#34;, &#34;project-safe-childhood&#34;, &#34;alcohol-as-inducement&#34;]}, {&#34;id&#34;: 64, &#34;case_id&#34;: 56, &#34;case_name&#34;: &#34;Heather Hare&#34;, &#34;source&#34;: &#34;DOJ / U.S. Attorney&#39;s Office, Eastern District of Arkansas; PEOPLE Magazine&#34;, &#34;date&#34;: &#34;2024-05-15&#34;, &#34;text&#34;: &#34;LITTLE ROCK\u2014Heather Hare, 33, of Conway, was sentenced to serve the next 13 years in federal prison for transporting a minor across state lines for the purpose of unlawful sexual activity. Hare was sentenced earlier today by United States District Judge Lee P. Rudofsky.\n\nThe investigation into Hare revealed that Hare taught Family Consumer Science classes at Bryant High School and met the minor victim on their first day of their senior year. Hare began one-on-one counseling sessions with the minor victim, eventually giving them her personal phone number and primarily communicating with them through Instagram and Snapchat.\n\nHare later told the minor victim that she had a dream of them having sex and gave the victim her home address in Conway. The minor victim and Hare engaged in sexual activity between 20 to 30 times throughout the 2021-2022 school term, including multiple times at her Conway residence, in her vehicle, and in her classroom and parking lots at Bryant High School.\n\nBetween April 21 and April 24, 2022, Hare was the sponsor and chaperone for a field trip to Washington, D.C., as part of an extracurricular activity related to the Family Consumer Science courses Hare taught. During the field trip, Hare and the minor victim engaged in the unlawful sexual activity to which she pleaded guilty.\n\nHare was indicted on August 1, 2023, and charged with one count of interstate/foreign travel for prostitution/sexual activity by coercion and one count of transportation of a minor with intent to engage in criminal sexual activity. In exchange for her guilty plea, the remaining charge was dismissed.\n\nJudge Rudofsky also sentenced Hare to serve a lifetime of supervised release. Hare faced a maximum sentence of not less than 10 years imprisonment and up to life imprisonment, and not less than five years of supervised release for transportation of a minor to engage in unlawful sexual activity.\n\n\&#34;Teachers who have sex with their minor students should take note of today&#39;s sentence for Ms. Hare which reflects the consequences of abusing her position of trust and taking advantage of the vulnerability of this minor to repeatedly engage in unlawful sexual activity,\&#34; Ross said.\n\nThe case was investigated by the Federal Bureau of Investigation, Saline County Sheriff&#39;s Office, and the Bryant Police Department and was prosecuted by Assistant United States Attorney Kristin Bryant.\n\nPrior to meeting the victim, Hare appeared on Good Morning America in 2020 after a group of her students made her a heartfelt farewell video after her consumer science class was halted amid distance learning during the COVID-19 pandemic.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;snapchat&#34;, &#34;guilty-plea&#34;, &#34;instagram&#34;, &#34;social-media&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;federal-prosecution&#34;, &#34;field-trip-offense&#34;, &#34;chaperone-offense&#34;, &#34;dream-disclosure&#34;, &#34;good-morning-america&#34;, &#34;media-profile&#34;]}, {&#34;id&#34;: 65, &#34;case_id&#34;: 57, &#34;case_name&#34;: &#34;Kristen Gantt&#34;, &#34;source&#34;: &#34;Des Moines Register / WHO 13&#34;, &#34;date&#34;: &#34;2024-02-28&#34;, &#34;text&#34;: &#34;Former Dowling Catholic High School teacher Kristen Gantt, 36, was sentenced February 28, 2024 to two years in prison for an inappropriate sexual relationship with a student. She was arrested in April 2023 on two counts of sexual exploitation by a school employee, pleading guilty on Feb. 8 to one count (an aggravated misdemeanor).\n\nAccording to court documents, Gantt kissed \&#34;a student for the purpose of (her) sexual arousal,\&#34; while she \&#34;was a school employee and licensed teacher.\&#34; Gantt admitted to police that she engaged in a romantic relationship with the student involving physical intimacy on at least five occasions, all in her classroom after the school day had ended. All incidents occurred between February and March 2023.\n\nGantt and the 17-year-old male student were in contact via personal emails, official Dowling-issued emails, and Instagram dating back to December 2022. The student had a hard home life and confided in Gantt; emails of encouragement allegedly turned into messages investigators found concerning. One message shows the student sending a shirtless photo asking \&#34;What do you think about this?\&#34; with Gantt replying \&#34;I think you know.\&#34; Other messages show attempts to schedule outside-school meetings (yoga; Top Gun Maverick movie, canceled due to weather). Gantt also messaged the student \&#34;you look annoyingly good today.\&#34;\n\nAn individual contacted WHO 13 on March 20 with documentation of social media conversations. West Des Moines PD began investigating the following day. A search warrant yielded journals, computers, a Fitbit, Kindle, letters, and Dowling desktop and laptop computers. Dowling placed Gantt on administrative leave after receiving an anonymous email and reported the matter to WDMPD.\n\nAs part of the plea agreement, the court issued a no-contact order until Feb. 28, 2029. Gantt must register as a sex offender and submit a DNA sample.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;lenient-sentence&#34;, &#34;guilty-plea&#34;, &#34;instagram&#34;, &#34;social-media&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;dual-channel-communication&#34;, &#34;vulnerable-victim&#34;, &#34;classroom-offense&#34;, &#34;anonymous-tip&#34;]}, {&#34;id&#34;: 66, &#34;case_id&#34;: 58, &#34;case_name&#34;: &#34;Michelle Schiffer&#34;, &#34;source&#34;: &#34;KTRK / AP / Houston Chronicle&#34;, &#34;date&#34;: &#34;2018-09-06&#34;, &#34;text&#34;: &#34;A former Cypress Springs High School teacher has been sentenced to serve eight years in prison after being accused of having sex and smoking marijuana with an underage male student.\n\nIn November 2017, Michelle Schiffer was charged with improper relationship with a student and sex assault of a child aged 14-17.\n\nCourt documents stated Schiffer admitted to the relationship after another student informed school officials of the alleged sex. Investigators said the incident took place in July 2017. The tipster also told authorities the victim was a 15-year-old at the time.\n\n24-year-old Michelle Schiffer had been facing up to 20 years in prison after she pleaded guilty in May to one charge of improper relationship with a student. She was sentenced Thursday during a hearing in a Houston courtroom.\n\nHer defense attorney, Grant Scheiner, says Schiffer accepts responsibility for what she has done.\n\nAccording to court records, Schiffer, a world history teacher at Cypress Springs High School, admitted to meeting with a former student for sex at least twice in 2017. Authorities say she also smoked marijuana with the student.\n\nProsecutors say she also texted topless photos to other students.\n\nFollowing her arrest, Schiffer was removed from campus and placed on administrative leave.&#34;, &#34;tags&#34;: [&#34;multiple-victims&#34;, &#34;guilty-plea&#34;, &#34;sexting&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;marijuana&#34;, &#34;student-tipster&#34;, &#34;young-defendant&#34;]}, {&#34;id&#34;: 67, &#34;case_id&#34;: 59, &#34;case_name&#34;: &#34;Shelley Dufresne&#34;, &#34;source&#34;: &#34;CBS News/AP; The Advocate; CBS affiliate WGCL&#34;, &#34;date&#34;: &#34;2017-06-16&#34;, &#34;text&#34;: &#34;Shelley Dufresne, 32, former English teacher at Destrehan High School, St. Charles Parish LA, pleaded guilty April 10, 2015 to obscenity (reduced from carnal knowledge of a juvenile) in connection with a sexual relationship with a 16-year-old male student. Sentence: $1,000 fine, 90 days in a mental health facility, 3 years probation \u2014 no jail, no sex offender registration. After leaving court, Dufresne posted a smiling photo on social media with the caption \&#34;my mood today\&#34; followed by three smiling face emojis.\n\nDufresne is the daughter of Judge Emile St. Pierre, 29th Judicial District, St. Charles Parish. All three St. Charles Parish judges recused themselves; the Louisiana Supreme Court appointed retired Judge Anne Lennan Simon (16th JDC) to the case.\n\nCo-defendant Rachel Respess, 24, also an English teacher at Destrehan High, was separately charged in Jefferson Parish with failure to report a crime, stemming from an incident on September 12, 2014 (Dufresne&#39;s birthday) in which both teachers allegedly engaged in group sex with the student at Respess&#39; Kenner apartment.\n\nDufresne was also charged in Jefferson Parish with two counts of carnal knowledge of a juvenile for alleged acts in that jurisdiction. She was acquitted in April 2017 by Judge Danyelle Taylor (24th JDC). The issue was not whether the relationship occurred \u2014 prosecution conceded it did \u2014 but whether sufficient evidence placed the acts in Jefferson Parish. No Jefferson or Kenner police investigators testified; prosecution relied on St. Charles investigators. The Jefferson Parish DA (Paul Connick) subsequently dropped the failure-to-report charge against Respess, citing insufficient evidence to proceed.&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;group-sex&#34;, &#34;co-defendant&#34;, &#34;judicial-family-connection&#34;, &#34;recusal&#34;, &#34;acquittal&#34;, &#34;social-media-after-plea&#34;, &#34;no-sora-registration&#34;]}, {&#34;id&#34;: 68, &#34;case_id&#34;: 60, &#34;case_name&#34;: &#34;Kelly Aldinger&#34;, &#34;source&#34;: &#34;WFMZ / local press&#34;, &#34;date&#34;: &#34;2017-05-29&#34;, &#34;text&#34;: &#34;A former substitute teacher who acknowledged having sex with a 17-year-old student in a car parked in a Pennsylvania cemetery has been ordered to serve more time behind bars.\n\nKelly Aldinger, 50, of Pen Argyl, was originally sentenced to three to 23 months in Northampton County jail after pleading guilty to institutional sexual assault.\n\nShe was sentenced to 18 months to three years on a parole violation after authorities said she contacted the victim following her release. Defense attorney Philip Lauer said Aldinger texted the teen \&#34;in essence just to see if he was OK.\&#34; A prosecutor said she was also troubled that the sexual encounters began when the teen was 15, not 16 as previously believed.\n\nPolice caught Aldinger, then 49, having sex with a 17-year-old boy in a car at Easton Cemetery on May 18, 2016. She met the victim while working as a substitute teacher at Easton Area High School. According to investigators, a police officer on routine patrol discovered them inside a car. The relationship started approximately a year to year-and-a-half prior; the victim was a student of Aldinger&#39;s at one time.\n\nAldinger admitted to having sex with the victim multiple times since the previous fall. Investigators said they did not believe there were any other victims. She was released on $50,000 bail. Aldinger worked for Source4Teachers, a staffing company used by Easton Area School District to hire substitutes; the company suspended her indefinitely.\n\nEaston Cemetery superintendent Jeff Mutchler noted police do sometimes patrol the cemetery and this was not the first time people had come there to be intimate: \&#34;Folks have loved ones here that mean a lot to them, and to think that people will come in to these places because they&#39;re out of the way...\&#34;&#34;, &#34;tags&#34;: [&#34;guilty-plea&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;substitute-teacher&#34;, &#34;staffing-agency&#34;, &#34;parole-violation&#34;, &#34;post-release-contact&#34;, &#34;unusual-venue&#34;, &#34;older-defendant&#34;]}, {&#34;id&#34;: 69, &#34;case_id&#34;: 61, &#34;case_name&#34;: &#34;Summer Hansen&#34;, &#34;source&#34;: &#34;KABC / Corona Police Department&#34;, &#34;date&#34;: &#34;2015-04-04&#34;, &#34;text&#34;: &#34;A former special education teacher was sentenced Friday to three years in jail for sex acts with five students at Centennial High School in Corona.\n\nSummer Hansen pleaded guilty last month to 16 sex-related felonies with underage students, including sending nude photos of herself. None of the victims \u2014 between ages 14 and 17 \u2014 were her students. She met them at Saturday school.\n\nProsecutors and the victim&#39;s family opposed the short sentence.\n\n\&#34;Teaching young impressionable children how to have sex in classrooms, in storage rooms, in cars, these are not the life skills I want my child to learn,\&#34; a victim&#39;s mother said. \&#34;Three years is a slap on the wrist for this sexual predator. It is a slap in the face for the victims and their families.\&#34;\n\nIn court, Hansen apologized amid tears. \&#34;From the bottom of my heart, everything that I have, I&#39;m not a monster. I made bad choices in life. For that, I am truly, truly sorry,\&#34; Hansen said.\n\nRiverside County Superior Court Judge Becky Dugan voiced little sympathy. \&#34;Not just one kid, but multiple kids. That&#39;s a plan. You&#39;re making a plan and continue to do it. I think you are sorry for the last two years, but frankly you&#39;re just sorry that you got caught.\&#34;\n\nIf Hansen had been convicted of all counts by a jury, she could have faced 13 years in state prison.\n\nHansen, 31, was arrested June 20, 2013 after an investigation launched by Corona Police following notification from the Corona Norco Unified School District. She was charged with 16 felony counts including unlawful sexual intercourse with a minor, unlawful oral copulation with a minor, and sending harmful matter to a minor. The crimes took place from May 2012 through May 2013 in her classroom, a utility room at the school, her vehicle parked near a victim&#39;s home, and at another victim&#39;s home.&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;multiple-victims&#34;, &#34;guilty-plea&#34;, &#34;sexting&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;saturday-school&#34;, &#34;special-ed&#34;, &#34;victim-family-statement&#34;, &#34;notable-judge-quote&#34;]}, {&#34;id&#34;: 70, &#34;case_id&#34;: 62, &#34;case_name&#34;: &#34;Laura Whitehurst&#34;, &#34;source&#34;: &#34;The Sun / Courthouse News Service&#34;, &#34;date&#34;: &#34;2014-02-07&#34;, &#34;text&#34;: &#34;Laura Elizabeth Whitehurst, 28, former English teacher and club adviser at Citrus Valley High School and Redlands High School (Redlands Unified School District), pleaded guilty July 31, 2013 to six felony counts \u2014 four counts of unlawful sexual intercourse and two counts of oral copulation with a person under 18 \u2014 in San Bernardino Superior Court. Originally charged with 41 felony counts (maximum 29 years). Sentenced August 28, 2013 by Judge Arthur Harrison to 365 days county jail + 5 years probation + lifetime sex offender registration + teaching credential forfeiture. Released January 5, 2014.\n\nThree male victims. Earliest offense: 2007, Redlands High School, victim aged 16, Whitehurst aged 23. Primary victim John BB Doe: relationship began summer 2012 when Doe was 16. Whitehurst insisted on sex without birth control; became pregnant. Told Doe the pregnancy was \&#34;divine intervention,\&#34; a \&#34;miracle baby,\&#34; and \&#34;part of God&#39;s plan.\&#34; Sent nude pregnancy photos with message \&#34;good night daddy, I love you so much.\&#34; Called school principal to excuse Doe&#39;s absences so he could accompany her to prenatal appointments. Gave birth June 18, 2013. Doe&#39;s parents reported the relationship to school two weeks later; Whitehurst arrested July 1. Two additional victims came forward; re-arrested July 8.\n\nDefense attorney James Gass: \&#34;She was not charged with doing anything against anyone&#39;s will or by force.\&#34; Gass also noted he tried to get Whitehurst less than a year but \&#34;didn&#39;t have a lot of leverage since, according to the police reports, she admitted that those things occurred.\&#34; Whitehurst&#39;s parents are raising the child; Whitehurst sought custody upon release.\n\nCivil lawsuit filed by Doe against Whitehurst, Redlands Unified School District, Citrus Valley High School, and teacher Sarah Seevers (alleged to have known about the abuse). Plaintiff alleged the district knew or had reason to know and helped conceal Whitehurst&#39;s abuse. Doe represented by John C. Manly, Manly, Stewart &amp; Finaldi.&#34;, &#34;tags&#34;: [&#34;lenient-sentence&#34;, &#34;multiple-victims&#34;, &#34;guilty-plea&#34;, &#34;pregnancy&#34;, &#34;sentencing&#34;, &#34;teacher-student&#34;, &#34;male-victim&#34;, &#34;religious-manipulation&#34;, &#34;no-birth-control&#34;, &#34;institutional-failure&#34;, &#34;civil-suit&#34;, &#34;long-pattern&#34;, &#34;district-concealment&#34;]}, {&#34;id&#34;: 71, &#34;case_id&#34;: 63, &#34;case_name&#34;: &#34;Charli Jones Parker&#34;, &#34;source&#34;: &#34;AL.com / local press / Alabama Court of Criminal Appeals&#34;, &#34;date&#34;: &#34;2018-02-09&#34;, &#34;text&#34;: &#34;Charli Jones Parker, 31, former girls&#39; basketball coach and PE/computers teacher at Pickens Academy (private school), Carrollton AL, is appealing her conviction after pleading guilty to improper sexual contact with two male students. She is serving a three-year prison sentence.\n\nParker was arrested March 28, 2016, charged with being a school employee and having sex with a student under 19 (Ala. Code \u00a7 13A-6-81). She was indicted on 13 counts. Primary victim: male student, at least 11 incidents between October 2014 and March 2016 at her home and in a cemetery. A civil lawsuit by one victim (filed same day appeal was denied) alleged incidents also occurred in her classroom during school hours, contra
