d or Lascivious Molestation (Defendant Over 18; Victim 12-15) (Authority Figure Over Student); Lewd or Lascivious Exhibition (Defendant Over 18) (Authority Figure Over Student); Authority Figure Soliciting or Engaging in a Romantic Relationship With a Student; Sexual Battery (Familial or Custodial Authority) (Authority Figure Over Student).\n\nCourt records: Plea \u2014 No Contest Best Interest Plea 01/08/2025. Disposition \u2014 NT - ADJUDGED GUILTY on charges 2-5 (2nd degree felonies); NT - NOLLE PROSSED on charge 1 (life felony sexual battery). Judge: Fuson, Robin F. Prosecutor filed 03/29/2023; Nolle Prosse filed 01/08/2025 on charge 1.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;evidence-tampering&#34;, &#34;charge-reduction&#34;, &#34;private-school&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 114, &#34;case_id&#34;: 102, &#34;case_name&#34;: &#34;Sarah Lindsay Lewis&#34;, &#34;source&#34;: &#34;Deseret News (Pat Reavy), three articles: Jan 31 2017, Jul 9 2018, Jul 13 2018&#34;, &#34;date&#34;: &#34;2017-01-31&#34;, &#34;text&#34;: &#34;Payson dance teacher charged with raping male student (Jan 31, 2017): Sarah Lindsay Lewis, 27, charged in 4th District Court with rape (1st degree felony), tampering with a witness (3rd degree felony), and two counts of supplying alcohol to a minor (class A misdemeanor). Accused of having sexual intercourse with a 17-year-old boy on Jan. 4 in her home. Boy had told Lewis ~2 weeks earlier he wanted to have sex; they arranged to meet. Lewis supplied vodka; boy recorded them kissing on cellphone before going to bedroom. Lewis told victim to deny the relationship if asked. Also bought 3 30-packs of beer for the boy and another teen after the boy gave her $100 for the purchase. Lewis taught social studies and dance at Landmark High School (alternative HS, ~340 students grades 10-12) since 2014; first met victim when he was in her class in 2015, again in 2016. Nebo School District placed her on leave of absence. Husband filed for divorce on same day charges filed.\n\nEx-teacher convicted of sex with student arrested again (Jul 9, 2018): Lewis, 27, arrested after Utah County Major Crimes Task Force found she was \&#34;selling narcotics from her car.\&#34; Found with 12 ounces of meth. Booked into jail for three days for probation violation. Agents recommending drug distribution charge. Earlier violations: failed drug test June 22; caught with alcohol Oct 25, 2017. Lewis had pleaded guilty in June 2017 to unlawful sexual activity with a minor (3rd degree felony); received suspended sentence of up to five years, credit for 195 days pre-trial jail; sex offender registry; no contact with students.\n\nFormer teacher convicted of sex with minor charged with selling drugs (Jul 13, 2018): Lewis charged with drug distribution (2nd degree felony) and possession of drug paraphernalia (class B misdemeanor). On July 2, concerned citizen told task force detective Lewis was selling meth to minors. Detective and Lewis&#39;s probation officer waited at her residence. Lewis arrived showing signs of meth use (sores, dilated pupils); admitted to recent use. Search found digital scale, baggies with residue, two used meth pipes. Car search found \&#34;substantial\&#34; amount of meth. Lewis told investigators she was selling ~1 oz meth/week to supplement income.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;evidence-tampering&#34;, &#34;charge-reduction&#34;, &#34;cash&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 115, &#34;case_id&#34;: 103, &#34;case_name&#34;: &#34;Olivia Ortz&#34;, &#34;source&#34;: &#34;WKBN (Patty Coller, Jul 7 2023) + KDKA/CBS Pittsburgh (Shelley Bortz, May 17 2022)&#34;, &#34;date&#34;: &#34;2022-05-17&#34;, &#34;text&#34;: &#34;Music teacher is second in school district charged after her husband reports alleged inappropriate relationship (May 17, 2022, KDKA): Olivia Ortz, 26, of Hermitage, Mercer County, charged with institutional sexual assault, unlawful contact with a minor, and criminal use of a communication facility. Worked as choir director at Wilmington Area High School. Suspended and later resigned. Husband, who works with the district&#39;s theater productions, reported the situation to the principal after finding evidence of the alleged relationship. After ChildLine reports by husband and principal, police interviewed the student. Teen reported visiting Ortz&#39;s home several times; pair continued communicating through apps even after aware of investigation. Student&#39;s father eventually took the girl&#39;s cell phone, iPad, and laptop. Ortz jailed in lieu of $150,000 bond. Second music teacher in district charged; first was Jonathan Priano (male, band teacher, 20+ counts, June 2020 \u2014 out of scope).\n\nFormer teacher sentenced for having sexual relationship with student (Jul 7, 2023, WKBN): Ortz, 27, sentenced Thursday in Lawrence County Court: five years probation, first nine months house arrest with electronic monitoring. Ordered no contact with victim; must surrender PA teaching license. Pleaded guilty March 2023 to one count criminal use of communication facility, two counts sexual contact with student, one count unlawful contact with minor. Husband discovered love letter from student after returning from Florida trip and notified high school principal.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;probation&#34;, &#34;husband-reported&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;, &#34;love-letters&#34;, &#34;victim-in-home&#34;, &#34;home-confinement&#34;]}, {&#34;id&#34;: 116, &#34;case_id&#34;: 104, &#34;case_name&#34;: &#34;Tracy Vanderhulst&#34;, &#34;source&#34;: &#34;LA Times (Rachel Uranga, May 19 2023) + San Bernardino County Superior Court records&#34;, &#34;date&#34;: &#34;2023-05-19&#34;, &#34;text&#34;: &#34;Yucaipa High &#39;teacher of the year&#39; accused of sex crime involving student (LA Times, May 19, 2023): Tracy Vanderhulst, 38, arrested Thursday night on suspicion of unlawful sexual intercourse with a 16-year-old male student. Math teacher at Yucaipa High School. Named 2017 \&#34;Teacher of the Year.\&#34; Booked into Central Detention Center, San Bernardino, in lieu of $30,000 bail. Investigation by San Bernardino County Sheriff&#39;s Department and Yucaipa-Calimesa Joint Unified School District.\n\nCourt records: Charges filed 4/14/2023. Count 001 PC 288.4(B) (arrange meeting with minor: sexual interest) \u2014 not guilty plea 6/4/2024; dismissed pursuant to plea 8/27/2024. Count 002 PC 261.5(C) (unlawful sexual intercourse with minor more than 3 years younger) \u2014 guilty plea 8/27/2024; convicted by plea. Sentenced 10/3/2024: felony probation (formal/supervised) 3 years (10/3/2024\u201310/2/2027); 180 days county jail, weekend/work release eligible, 1 day credit. Sentence modified 11/12/2024 (same probation). Sentence modified 4/4/2025: 50 days credit for time served. Change of venue 10/24/2025.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;]}, {&#34;id&#34;: 117, &#34;case_id&#34;: 105, &#34;case_name&#34;: &#34;Christy Lee Smith&#34;, &#34;source&#34;: &#34;Lancaster Online (Brett Hambright, May 20 2014) + Lancaster County DA press release (Aug 2 2017)&#34;, &#34;date&#34;: &#34;2014-05-20&#34;, &#34;text&#34;: &#34;Former McCaskey teacher jailed 14 to 30 years for sex abuse of 2 students (May 20, 2014): Christy Lee Smith convicted at trial in March 2014 of sex abuse against former McCaskey High School student, who was a sophomore when the abuse happened in 2008. At sentencing, Smith also pleaded guilty to sex abuse of a Solanco High School student who was 17 at time of crimes. Lancaster County Judge Dennis Reinaker ordered 14 to 30 years in state prison. In 2012, Reinaker had sentenced Smith to 20 to 40 years, but that conviction was overturned on appeal. Defense attorney Janice Longer requested a 10-year minimum sentence; Reinaker declined, citing Smith&#39;s refusal to accept responsibility and having subjected McCaskey victim to trial twice. When asked for comment or apology, Smith said \&#34;No.\&#34; Reinaker called her trial testimony \&#34;laughable\&#34; and \&#34;obviously such a lie.\&#34; Smith, 36, listened with a \&#34;furled brow,\&#34; answering questions briefly and quietly.\n\nEx-Teacher who Sexually Abused 2 Students Gets no Break on Minimum Prison Term (Aug 2, 2017, Lancaster County DA): Christy Lee Smith, 39, resentenced after mandatory minimum sentences in such cases ruled unconstitutional. Lancaster County President Judge Dennis Reinaker ordered 14 to 28 years \u2014 no change to the 14-year minimum. ADA James Reeder asked for a sentence in the high end of state guidelines. Smith appeared via video conference, said little, and offered no remorse for sex abuse of two county students between 2008 and 2010. ADA Karen Mansfield prosecuted the original case.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;appeal&#34;, &#34;no-remorse&#34;]}, {&#34;id&#34;: 118, &#34;case_id&#34;: 106, &#34;case_name&#34;: &#34;Jessica Langford&#34;, &#34;source&#34;: &#34;Dayton Daily News (Nick Blizzard): May 31 2018 (sentencing/timeline) + Apr 17 2018 (prior warnings memo)&#34;, &#34;date&#34;: &#34;2018-04-17&#34;, &#34;text&#34;: &#34;From classroom to prison: Timeline of ex-teacher in student sex case (May 31, 2018): Jessica Langford, 32, sentenced to one year in prison and five years probation by Montgomery County Common Pleas Court Judge Timothy O&#39;Connell. Convicted by jury April 13 of three counts sexual battery and three counts unlawful sexual conduct with a minor. Victim was 14-year-old male eighth-grader; sexual encounter occurred May 23, 2017 in Langford&#39;s locked, darkened classroom before school. Victim testified to 20-30 minute encounter. Tier III sex offender; $632 restitution. Defense attorney Lawrence Greger sought community control with electronic monitoring; ADA Michele Henne sought maximum incarceration citing age of victim, lack of remorse, \&#34;egregious nature.\&#34; Other students reported Langford gave them gifts and showed them an erotic photograph of herself and her husband having sex.\n\nKey dates: Aug 2008 hired. Jan 2016 meeting re: male students eating lunch in classroom. Feb 2016 nine-concern memo; counseled to refrain from physical contact. Feb 2 email directing her to stop. April 2017 boundary conversation. Late May 2017 discussion of elementary transfer; Langford resisted. May 23 confronted, resigned. May 25 complaint filed. May 27 home search (seized underwear, computer, iPhone). Nov 14 indicted. Nov 21 not guilty plea. Apr 10-13 trial. May 29 sentenced.\n\nMiamisburg told teacher: &#39;Refrain from physical contact with students&#39; (Apr 17, 2018): February 2016 memo obtained showing district investigated Langford&#39;s conduct 15+ months before criminal charges. Concerns included flirting with male students and sitting on a student&#39;s lap. Principal and AP counseled Langford to \&#34;maintain a professional distance from, and relationship with, students, and that she was to refrain from physical contact with students.\&#34; District said the February 2016 investigation found insufficient evidence to support some concerns but documented the counseling session.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;guilty&#34;, &#34;grooming&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;prior-warning-ignored&#34;, &#34;physical-evidence&#34;, &#34;no-remorse&#34;, &#34;gifts&#34;, &#34;sentencing-memo&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 119, &#34;case_id&#34;: 107, &#34;case_name&#34;: &#34;Julie Hautzenroeder&#34;, &#34;source&#34;: &#34;WLWT (Brad Evans, Dec 17 2014) + UPI (Aug 1 2013)&#34;, &#34;date&#34;: &#34;2013-08-01&#34;, &#34;text&#34;: &#34;Ohio teacher accused of partying, having sex with two boys (UPI, Aug 1 2013): Julie Hautzenroeder, 36, of Loveland, science teacher at Colerain High School, pleaded not guilty to two counts sexual battery. Released on $1,000 bond. Accused of inviting two 16-year-old boys to her home in late April or mid-May, supplying alcohol and marijuana, having oral sex with one and intercourse with the other. A third adult present saw Hautzenroeder smoke marijuana with the boys but left before sex. Single mother with 7-year-old daughter; worked for Northwest district since 2003 (sub), full-time at Colerain since 2006. AP Joshua Berkowitz prosecuting.\n\nFormer Colerain H.S. teacher&#39;s sex conviction upheld (WLWT, Dec 17 2014): Ohio appeals court upholds jury conviction of one count sexual battery (November 2013). Sentenced to two years in prison; released early after approximately six months in July 2014. Three appeal grounds all rejected: (1) claim Colerain was not a \&#34;school\&#34; under Ohio Revised Code; (2) insufficient evidence; (3) ineffective assistance of counsel. Note: article headline states \&#34;served 18 months\&#34; but article body states approximately 6 months before early release.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;guilty&#34;, &#34;multiple-victims&#34;, &#34;appeal&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;early-release&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 120, &#34;case_id&#34;: 108, &#34;case_name&#34;: &#34;Victoria Fowler&#34;, &#34;source&#34;: &#34;Howell County newspaper (Mar 15 2024) + Springfield News-Leader/USA Today (Claudette Riley, Sep 15 2023)&#34;, &#34;date&#34;: &#34;2023-09-15&#34;, &#34;text&#34;: &#34;Missouri math teacher charged, accused of inappropriate sexual relationship with student (News-Leader, Sep 15 2023): Victoria \&#34;Tori\&#34; Fowler, 30, of Caulfield, charged with three counts statutory rape and one count statutory sodomy. Hired to teach middle school math/science at Lutie School District (2023-24) but allegations stemmed from prior year at Bakersfield district. Investigation began late August when Ozark County deputy received screenshots from a parent. Deputy seized Fowler&#39;s smartphone; she admitted to the relationship. Missouri State Highway Patrol investigation. Both Fowler and victim told investigators they started talking over Snapchat and Messenger in early 2023 when he was her student; became \&#34;flirty\&#34; by March. Fowler admitted sending first nude photo; multiple images exchanged. Both described meeting on a dirt road, getting into a vehicle, driving to secluded property in Howell County for sex; also met at Fowler&#39;s house. Frequency discrepancy: Fowler said 3 times; student said approximately 15 times between May and August. Lutie district terminated Fowler immediately; she had passed background check, had \&#34;significant teaching experience and excellent references.\&#34; Defense attorney Mark Allan Hammer. Initial appearance before Howell County Judge Steven Privette set Oct. 16.\n\nEx-teacher convicted of having sex with student is sentenced (local court report, Mar 15 2024): Victoria \&#34;Tori\&#34; Fowler pleaded guilty March 9 in Howell County Court to two counts having sexual contact with a student. Original statutory rape and sodomy charges dismissed. Suspended sentence; 5 years supervised probation; surrender teaching license permanently; no contact with victim or school students; no unsupervised contact with children under 18 except own children; register as sex offender. Investigation began Aug. 30 with nude photos discovered by parent. Fowler admitted to meeting teen for sex three times in Howell County between July 4 and Aug. 1; teen said acts began in May.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 121, &#34;case_id&#34;: 109, &#34;case_name&#34;: &#34;Kaitlyn Wilkes&#34;, &#34;source&#34;: &#34;Tribune Chronicle/WKBN (Mike Gauntner, Jul 10 2023; sentencing) + Tribune Chronicle (Chris McBride, May 24 2023; trial)&#34;, &#34;date&#34;: &#34;2023-05-24&#34;, &#34;text&#34;: &#34;Ex-dance teacher gets prison, labeled sex offender (Jul 10 2023): Kaitlyn Wilkes, 20, of Vienna, sentenced by Trumbull County Common Pleas Court Judge Cynthia Rice to 3 to 4.5 years in prison; Tier III sex offender (lifetime registration). 12-year-old female dance student; five assaults at four sites in Trumbull County between December 2021 and February 2022. Jury in May returned guilty verdicts on 5 counts gross sexual imposition (3 as lesser-included on rape counts); not guilty on 2 rape counts; hung on 6 rape counts. At sentencing, 6 hung rape counts dismissed; Wilkes pleaded guilty via bill of information to 6 counts sexual battery (2nd degree felony). Judge Rice said Wilkes would not be able to hold any position of authority.\n\nVictim discusses alleged rape (Tribune Chronicle, May 24 2023): Trial day 2. Victim (then 13, age 12 during abuse) testified for over an hour. Met Wilkes at age 9 when Wilkes was 16; both students at Cortland dance academy. Wilkes became instructor for victim&#39;s class in 2021-22 season (Wilkes age 18). October 2021: relationship changed, Wilkes began isolating victim from friends. December 2021: sexual contact began in Wilkes&#39; father&#39;s home in Champion. Also occurred at Wilkes&#39; mother&#39;s home and dance studio. Wilkes would \&#34;blow her phone up\&#34; and guilt-trip victim. Fake self-harm threat: \&#34;One time she had me thinking she was in the bathroom in the bathtub slitting her wrists.\&#34; January 2022: 17-year-old witness&#39;s mother saw messages where Wilkes admitted abuse. Mother of 17-year-old reported to dance teacher in April 2022; became frustrated when studio did not act after witnessing Wilkes massaging victim in parking lot (video presented at trial). Late April 2022: hotel altercation in Altoona PA \u2014 Wilkes tried to force way in; victim hysterical, said \&#34;make her go away\&#34; and \&#34;she&#39;s the devil.\&#34; Police reports filed April 28-29. Text exchange admitted: 17-year-old asked Wilkes if they had sex; Wilkes replied \&#34;Mhm.\&#34; Defense attorney Mary Ellen Ditchey.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;guilty&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;delayed-reporting&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;private-school&#34;, &#34;surveillance&#34;, &#34;emotional-manipulation&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 122, &#34;case_id&#34;: 110, &#34;case_name&#34;: &#34;Jocelyn Sanroman&#34;, &#34;source&#34;: &#34;Patch (Marcus Taylor, Mar 5 2026) + Gray News/WXYZ (Jun 30 2025)&#34;, &#34;date&#34;: &#34;2025-06-30&#34;, &#34;text&#34;: &#34;Pontiac Tutor Sex Case Ends In Guilty Plea (Patch, Mar 5 2026): Jocelyn Sanroman, 27, pleaded guilty to three counts 3rd-degree criminal sexual conduct before Oakland County Circuit Court Judge Cheryl Matthews. Incidents occurred July 2023 while Sanroman was tutoring the student in Pontiac; victim was 16-year-old boy. Charges filed June 2025 after fellow teacher reported that Sanroman had disclosed she was in a sexual relationship with the student. School: Oakside Prep Academy, charter campus in Waterford Township. Sentencing scheduled April 28, 2026. Maximum 15 years per count (45 years theoretical maximum).\n\nOakland County Prosecutor charges teacher (Gray News/WXYZ, Jun 30 2025): Jocelyn Sanroman, 26, charged with three counts criminal sexual conduct. Allegedly had sexual relationship with 16-year-old boy in 2023 and told another teacher about it. Prosecutor Karen McDonald: \&#34;This defendant is accused of using her position of authority to exploit a minor victim. These allegations represent the ultimate breach of trust placed in educators by parents and the community. As a former teacher myself, I applaud the teacher who contacted police about this situation, protecting other students from further exploitation.\&#34;&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;plea&#34;, &#34;delayed-reporting&#34;, &#34;private-school&#34;]}, {&#34;id&#34;: 123, &#34;case_id&#34;: 111, &#34;case_name&#34;: &#34;Tennille Whitaker&#34;, &#34;source&#34;: &#34;AP (Mar 15 2019, civil lawsuit) + KRNV/KENV (Jun 7 2017, arrest)&#34;, &#34;date&#34;: &#34;2017-06-07&#34;, &#34;text&#34;: &#34;Elko County teacher arrested for alleged sexual conduct with 2 high school students (KRNV/KENV, Jun 7 2017): Tennille Whitaker, 40, arrested June 5. Charged with eight counts of sexual conduct between employee of school and pupil. Teacher at Wells Elementary School, Wells NV. Held on $160,000 bail. Undersheriff Ron Supp confirmed arrest; investigation ongoing. Superintendent Jeff Zander: Whitaker placed on administrative leave.\n\nCivil lawsuit filed by victims of former teacher convicted of sex with students (AP, Mar 15 2019): Whitaker, 41, had pleaded no contest in April 2018 to four counts of sexual conduct between school employee and pupil; serving 20-year sentence. Prosecutors said she sexually harassed, molested and abused at least four high school boys serving as teaching aides in her fourth-grade class over September 2015\u2013June 2017 period. Gave them gifts; provided alcohol in exchange for sexual gratification; drove them to hotels; conduct on and off campus. Prior warnings: parent reported rumors to school May/June 2016; another teacher reported concerns to Principal McAnany October 2016 (triggering sheriff investigation); February 2017 custodian found Whitaker with student in locked dark classroom; March 2017 teacher discovered Snapchat photo showing Whitaker having sex with minor students. Whitaker not placed on admin leave until June 5 2017 arrest; resigned two months later. At October 2018 sentencing Whitaker apologized: \&#34;I will be ashamed forever. I am truly sorry for betraying the trust of the parents and the victims.\&#34; Civil suit filed March 9 2019 in U.S. District Court Reno, naming school district and Principal Christopher McAnany; one plaintiff, plus estate of victim who moved from Wells post-graduation 2018 and died by suicide August 2018. District accused of deliberate indifference and suppression of information.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;multiple-victims&#34;, &#34;civil-lawsuit&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;prior-warning-ignored&#34;, &#34;alcohol&#34;, &#34;possible-additional-victims&#34;, &#34;gifts&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 124, &#34;case_id&#34;: 112, &#34;case_name&#34;: &#34;Julie Ann Moore&#34;, &#34;source&#34;: &#34;Amarillo Globe-News (Staff Writer, Jan 31 2013; sentencing) + Amarillo Globe-News (Bobby Cervantes, Dec 6 2011; arrest)&#34;, &#34;date&#34;: &#34;2011-12-06&#34;, &#34;text&#34;: &#34;Teacher charged in teen sex case (Dec 6 2011): Julie Ann Moore, 34, turned herself in at Potter County Detention Center after Texas Rangers arrest warrant. Released on $7,500 bond; cannot contact minors except own children. Third-grade teacher at Sanborn Elementary School (700 S. Roberts St., Amarillo TX); hired by AISD September 2002, salary $45,843. Investigation began November 2011 after allegations of inappropriate texts and sexual relationship with at least one Amarillo High student. Nov. 4: Ranger met with 15-year-old (\&#34;Juvenile Victim 1.2\&#34;) who described three sexual encounters with Moore; ~100 texts over June-August, half \&#34;extremely sexually explicit\&#34;; Moore offered oral sex via text; Moore kissed him open-mouthed and rubbed front of his pants. Nov. 11: Rangers seized Dell laptop, 2 USB drives, AT&amp;T SIM from her Randall County home; iPhone 4 from Sanborn Elementary. Nov. 14: AISD placed Moore on paid admin leave. Halftime incident: Moore asked teen at football game if he wanted to \&#34;see something she had in her car\&#34;; drove him to back of apartment complex; had sex for 10-15 minutes; returned him before second half. DPS official had observed Moore and teen at game hugging, sitting together, walking off privately. Affidavits reference three 15-year-old boys. Defense attorney Joe Marr Wilson.\n\nGuilty plea and sentence (Jan 31 2013): Moore, 35, pleaded guilty to sexual assault of a child (Potter County) and indecency with a child (Randall County; two counts from incidents July 15 and Aug 1). Sentenced by 47th DA Randall Sims: 10 years deferred probation, 180 days in jail, sex offender registration, forfeit teaching license. Randall County grand jury had indicted in March 2012 on two counts indecency with a child.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;physical-evidence&#34;, &#34;possible-additional-victims&#34;, &#34;late-night-meetups&#34;]}, {&#34;id&#34;: 125, &#34;case_id&#34;: 4, &#34;case_name&#34;: &#34;State v. Hailey Clifton-Carmack&#34;, &#34;source&#34;: &#34;PEOPLE Magazine (Emily Palmer, Sep 10 2024)&#34;, &#34;date&#34;: &#34;2024-09-10&#34;, &#34;text&#34;: &#34;How Scratches Found on a Teenage Boy Led to a Sex Crime Conviction for His Teacher (PEOPLE, Sep 10 2024): Hailey Clifton-Carmack pleaded guilty Sept. 6 to felony sexual contact with a student; faces 4 years under Missouri&#39;s Sex Offender Assessment Program (sentencing Oct. 11). Pulaski County PA Kevin S. Hillman; defense attorney Charles Theodore Frahm. Victim (16) showed classmate photos of scratches on his back left during sex in the classmate&#39;s driveway. Classmate told Detective Sgt. Bryan Gibbs that Clifton-Carmack \&#34;has openly discussed her personal life with the class and stated she has gotten in trouble with the administration for being &#39;too close with students.&#39;\&#34; Superintendent confirmed private discussion with her about student interactions. Victim told classmate he was \&#34;the reason\&#34; her divorce was \&#34;pushed through\&#34; \u2014 husband filed for divorce August 2023, finalized September 2023; couple had a child together. Confronted Dec. 8 by Gibbs; handed over phone voluntarily; messages with victim recovered. Contact continued until Dec. 23 when she left for Texas. Students used as look-outs during on-campus sex. Victim&#39;s father charged with child endangerment; allegedly told witness \&#34;they are going to do it behind my back so I may as well let it happen.\&#34; Father&#39;s case on hold pending teacher sentencing; agreed to testify. Arrested January 2024, Garden Ridge TX; extradited to Pulaski County. Original charges (statutory rape, child molestation, endangering welfare) dropped in plea.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;plea&#34;, &#34;prior-warning-ignored&#34;, &#34;physical-evidence&#34;, &#34;charge-reduction&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 126, &#34;case_id&#34;: 113, &#34;case_name&#34;: &#34;Shawnee Nicole Despain&#34;, &#34;source&#34;: &#34;KWTX (Feb 14 2025) + CBS Austin (Nov 7 2023) + Mirror/Zahra Khaliq (Feb 18 2025)&#34;, &#34;date&#34;: &#34;2023-11-07&#34;, &#34;text&#34;: &#34;Former Texas teacher charged with child pornography, improper relationship (CBS Austin, Nov 7 2023): Shawnee Nicole Despain, 24, turned herself in at Milam County Jail on two felony warrants: possession/promotion of child pornography ($200,000 bond) and improper relationship between educator and student ($150,000 bond). Rockdale ISD reported misconduct to police Sept. 21; Despain immediately suspended, resigned Sept. 25. Investigation by Rockdale Police Department.\n\nFormer teacher placed on felony probation (KWTX, Feb 14 2025): Despain, 26, pleaded guilty in November to improper relationship between educator and student (2nd degree felony, max 20 years). Sentenced by 20th State District Judge John W. Youngblood: 10 years felony probation, $3,000 fine, forfeit teaching license, sex offender evaluation. No prison; offense does not require sex offender registration. Milam County DA Brian Price argued for prison: \&#34;My argument to the judge was she was in a position of power and trust over her students and she used that to abuse this young man, and that is going to affect him his entire life. People put in a position of authority and trust should be held to a higher standard, not a lower one.\&#34; Price said if male teacher, no question he would go to prison. Defense attorney Jessica Huynh (Austin) declined comment. DNA confirmed student (not husband) was father of Despain&#39;s child. Phone search: texts professing love + Snapchat video of them having sex. School surveillance: alone in classroom at least 4 times including ~3 hrs on Labor Day 2023 and ~90 mins Sunday Sept. 17. Also alone at her home while husband was away. Agricultural science teacher at Rockdale High School (80 miles SE of Waco).&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;grooming&#34;, &#34;snapchat&#34;, &#34;pregnancy&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;physical-evidence&#34;, &#34;charge-reduction&#34;, &#34;csam-distribution&#34;, &#34;on-campus&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 127, &#34;case_id&#34;: 114, &#34;case_name&#34;: &#34;Christina Formella&#34;, &#34;source&#34;: &#34;WGN9/Andy Koval (Mar 17 2025) + FOX 32 Chicago/Cody King (Jun 17 2025)&#34;, &#34;date&#34;: &#34;2025-03-17&#34;, &#34;text&#34;: &#34;Downers Grove South teacher charged, accused of sexually abusing 15-year-old (WGN9, Mar 17 2025): Christina Formella, 30, arrested during traffic stop March 16. Special ed teacher and soccer coach at DGS since 2020-21; volunteer coach since 2021. Victim (15 at time of report) was her soccer coaching charge and tutoring student. Dec. 2023: victim and Formella in classroom for tutoring before school began; alleged sexual assault. Mother discovered abuse via son&#39;s cell phone; victim and mother reported to Downers Grove PD March 15. Formella charged with 2 counts agg. criminal sexual abuse + 1 count criminal sexual assault. State detention motion denied. Formella denied having sex with minor; claimed \&#34;everybody comes after her because she is good looking and she is just a good person who cared too much about (the boy).\&#34; Released with conditions: no contact with under-18s, no school entry. DGS principal Arwen Lyp notified families; district placing Formella on paid administrative leave.\n\nFormer Downers Grove teacher indicted on dozens of new sexual abuse charges (FOX 32, Jun 17 2025): Grand jury (May 20) returns 52-count indictment: 20 criminal sexual assault (Class 1), 20 agg. criminal sexual abuse (Class 1), 6 indecent solicitation of child (Class 3), 6 grooming (Class 4). Abuse allegedly began January 2023, continued through August/September 2024. ~50 sexual acts total; at least 45 at school, additional at her home. Grooming text messages sent to victim. April 17: victim and parents returned to DuPage County Children&#39;s Advocacy Center, disclosed additional abuse history. Second state detention motion denied. Next court date Aug. 4. State&#39;s Attorney Robert Berlin: \&#34;The new allegations against Ms. Formella, including the allegations of grooming and that the abuse lasted nearly two years, are beyond disturbing.\&#34; ASAs Jaclyn McAndrew and Michael Fisher; Investigator George Fencl (DuPage County Children&#39;s Advocacy Center).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;sexting&#34;, &#34;long-term-relationship&#34;, &#34;possible-additional-victims&#34;, &#34;special-needs-victim&#34;, &#34;on-campus&#34;, &#34;victim-blaming&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 128, &#34;case_id&#34;: 115, &#34;case_name&#34;: &#34;Caitlin Rock&#34;, &#34;source&#34;: &#34;News 4/Fox 11 Reno (Tom Aizenberg &amp; Kim Burrows, Jan 28 2026) + KRNV (Kenneth Dunn, Jun 18 2024)&#34;, &#34;date&#34;: &#34;2024-06-18&#34;, &#34;text&#34;: &#34;Ex-school employee faces court over alleged sexual relationship with teen boy (KRNV, Jun 18 2024): Caitlin Rock, intervention prevention assistant at Billinghurst and Swope Middle Schools (Washoe County SD), accused of sexual relationship with 13-year-old male student beginning December 2022. Relationship started with text messages, progressed to in-person meetings outside school. Victim&#39;s mother tracked son&#39;s location after he snuck out; led to confession; victim reported to police. Rock arrested June 11, 2024 (contract ended June 10). Bail set at $2 million. Charges: sexual assault of a minor, statutory sexual seduction. Due back in court July 9.\n\nFormer Washoe County school employee found guilty of 19 felonies in sexual abuse case (News 4/Fox 11, Jan 28 2026): Jury returns guilty verdicts on all 19 felony counts after approximately 6 hours deliberation: 4 counts sexual assault against a child under 14, 5 counts statutory sexual seduction, 10 counts luring using a computer. Abuse began when victim was 13 and continued over a year and a half. Prosecutors presented testimony, DNA evidence, and records of repeated contact. Rock previously pleaded not guilty. Sentencing April 17, 2026; faces possible life in prison under Nevada law.&#34;, &#34;tags&#34;: [&#34;verdict&#34;, &#34;guilty&#34;, &#34;social-media&#34;, &#34;sexting&#34;, &#34;dna-evidence&#34;, &#34;long-term-relationship&#34;, &#34;late-night-meetups&#34;]}, {&#34;id&#34;: 129, &#34;case_id&#34;: 116, &#34;case_name&#34;: &#34;Allison Havemann-Niedrach&#34;, &#34;source&#34;: &#34;Monmouth County Prosecutor press release (Jan 22 2026) + NJ.com/Jeff Goldman (Jan 22 2026) + NY Post/Matthew Sedacca (Jun 29 2024)&#34;, &#34;date&#34;: &#34;2024-06-29&#34;, &#34;text&#34;: &#34;NJ special ed teacher accused of sexually assaulting student (NY Post, Jun 29 2024): Allison Havemann-Niedrach, 43, special ed teacher at Freehold Intermediate School, charged with first-degree aggravated sexual assault and second-degree child welfare endangerment. Arrested after MCPO Special Victims Bureau and Freehold PD investigation. Employed by Freehold Borough SD since 2022. Victim age unknown; school covers grades 6-8. Held Monmouth County Jail pending first appearance. Prior attorney Thomas Huth said she \&#34;maintains her innocence at this time.\&#34;\n\nIntermediate School Teacher Admits to Sexual Crimes Against Student (MCPO press release, Jan 22 2026) + Former N.J. teacher admits sexually assaulting student (NJ.com, Jan 22 2026): Havemann-Niedrach, 45, pleaded guilty Jan 22 before Monmouth County Superior Court Judge Jill G. O&#39;Malley to first-degree aggravated sexual assault. Grand jury had indicted March 2025. Conduct: January through June 2024 (~6 months); thousands of text messages; bought victim gifts and food; recorded video of herself sexually assaulting him. Sentencing May 7, 2026; state seeking 12 years, NERA (85%), Parole Supervision for Life, Megan&#39;s Law registration, forfeit teaching license, bar from future public employment. Prosecuted by APA Danielle Zanzuccki, Director Special Victims Bureau; defense attorney Matthew Mordas.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;parole-supervision-for-life&#34;, &#34;csam-distribution&#34;, &#34;gifts&#34;, &#34;special-needs-victim&#34;]}, {&#34;id&#34;: 130, &#34;case_id&#34;: 117, &#34;case_name&#34;: &#34;Apryl Patterson&#34;, &#34;source&#34;: &#34;Local news (Jessica Johnston, May 8 2019; plea) + Zanesville Times Recorder (Shelly Schultz, Jun 10 2019; sentencing)&#34;, &#34;date&#34;: &#34;2019-05-08&#34;, &#34;text&#34;: &#34;Teacher pleads guilty to sexual battery after having intimate relationship with student (May 8 2019): Apryl Patterson, 27, former Foxfire intervention specialist, pleaded guilty to three third-degree felony counts of sexual battery. November 2017 through end of April 2018: sexual relationship with 17-year-old male student, including intercourse, at her home and contact during school hours via phone. During investigation: Patterson searched internet for ways to delete Facebook and Snapchat interactions and researched other teacher-student sex cases. While on admin leave she attempted to contact victim through a coworker; was terminated. Prior to plea, tried to represent herself as a sovereign citizen; court required appointed counsel (Keith Edwards). Made comments to coworkers \&#34;her life was over and she was going to prison.\&#34; APA Ron Welch. Patterson&#39;s bond continued pending sentencing.\n\nSex with a student nets former teacher two-year sentence (Zanesville Times Recorder, Jun 10 2019): Patterson, 26 at time of offense, sentenced to 2 years prison (state recommended 6 years). Tier III sex offender registration for life. Forfeit teaching license. At her home in St. Clairsville; bought beer for herself and student to consume at apartment before sex acts. Text messages recovered from phone documenting beer purchase. Victim told parents; they filed complaint April 29, 2018. Note: OH RC 2907.04 \u2014 17-year-old can consent to sex with adult unless forced, coerced, or offender is in position of power (teacher, coach, etc.).&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;physical-evidence&#34;, &#34;alcohol&#34;, &#34;evidence-tampering&#34;, &#34;sentencing-memo&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 131, &#34;case_id&#34;: 118, &#34;case_name&#34;: &#34;Allenna Ward&#34;, &#34;source&#34;: &#34;AP (Mar 30 2007; indictment) + AP/6abc (Feb 19 2008; sentencing) + AP/Daily News (Sep 25 2007; Robbins article with Ward background)&#34;, &#34;date&#34;: &#34;2007-03-30&#34;, &#34;text&#34;: &#34;Teacher faces charges of sex with 5 students (AP, Mar 30 2007): Allenna Ward, 24, indicted on 5 counts criminal sexual conduct with a minor and 6 counts lewd acts on a minor. Former Bell Street Middle School teacher, Clinton SC (Laurens County). Married. Accusation: sexual encounters with five 14- and 15-year-old boys at the school, a motel, a park, and behind a restaurant. Investigation began after school officials found a note believed written by Ward to one of the boys. Fired February 28. Prosecutor: Solicitor Jerry Peace.\n\nTeacher sentenced for sex with students (AP/6abc, Feb 19 2008): Ward pleaded guilty in September 2007 to 3 counts 2nd-degree criminal sexual conduct with minor + 3 lewd acts on minor. Sentenced: 15 years on each lewd act count suspended to 6 years; 6 years on each CSC count; all concurrent. Defense attorney Donald Hocker sought home imprisonment, citing vulnerability in prison. Forensic psychiatrist Donna Schwartz-Watts testified Ward is not a pedophile but suffers from personality disorders and repressed childhood \u2014 described as \&#34;free spirit\&#34; who never broke away from family (minister&#39;s daughter). Ward apologized: \&#34;I apologize from the depths of my heart.\&#34; Prosecutors emphasized violation of parental trust. Victim&#39;s sister after hearing: \&#34;We&#39;re just glad that it&#39;s all over.\&#34;\n\nLaurens County cluster context (AP, Sep 25 2007): Three SC teachers charged in Laurens County within 18 months: (1) Wendie Schweikert \u2014 sex with 11-year-old student, 10 years; (2) Ward \u2014 sex with five teens, pending sentencing at time; (3) Karen Robbins, 49 \u2014 charged September 2007 with 3 counts CSC with minor + 3 lewd acts, sex with 15-year-old boy in car and at her home Sept\u2013Nov 2005 (private school at time; not her student). All prosecuted by Solicitor Jerry Peace.&#34;, &#34;tags&#34;: [&#34;guilty&#34;, &#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;late-night-meetups&#34;, &#34;love-letters&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 132, &#34;case_id&#34;: 119, &#34;case_name&#34;: &#34;Abigail Faust&#34;, &#34;source&#34;: &#34;WQOW (Kristen Shill, Aug 18-19 2025)&#34;, &#34;date&#34;: &#34;2025-08-18&#34;, &#34;text&#34;: &#34;Second Hudson 5th grade teacher charged with child sex crimes (WQOW, Aug 18 2025): Abigail Faust, 24, charged with four felonies: failure to protect a child, causing mental harm to a child, child enticement, and sexual misconduct by school staff. Accused of keeping a student after class, pushing him against the wall, and kissing him on the cheek. Court documents show Faust and Madison Bergmann (fellow Hudson 5th-grade teacher, #22) were friends who texted each other about their relationships with students. Bergmann&#39;s jury trial scheduled October 2025. Faust released on $10,000 signature bond; due back in court October 2025. Hudson School District: Faust resigned early May 2024; immediately removed from classroom and investigated for alleged failure to report child abuse (mandated reporter). District has since strengthened staff training on professional boundaries in partnership with Wisconsin Awareness to Action.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 133, &#34;case_id&#34;: 121, &#34;case_name&#34;: &#34;Dayna Chidester&#34;, &#34;source&#34;: &#34;WLS-TV / Chicago Tribune / U.S. Attorney&#39;s Office NDIL&#34;, &#34;date&#34;: &#34;2021-12-10&#34;, &#34;text&#34;: &#34;Will County Woman Who Engaged in Sexual Conduct With Underage Boy Sentenced to More Than Five Years in Federal Prison\n\nDAYNA CHIDESTER engaged in sexual conduct with the boy on numerous occasions in November and December 2018. Chidester knew at the time that the boy was 14 years old. Chidester also directed the boy to take photos of himself while he was engaged in sexually explicit conduct, and to send the photos to Chidester&#39;s cell phone.\n\nChidester, 53, of Manhattan, Ill., pleaded guilty earlier this year to a charge of receiving child pornography. U.S. District Judge Jorge L Alonso on Wednesday sentenced Chidester to five years and four months in federal prison.\n\n\&#34;Defendant&#39;s offense was not a one-time lapse in judgment, but an ongoing pattern of criminal activity,\&#34; Assistant U.S. Attorney Ashley A. Chung argued in the government&#39;s sentencing memorandum. \&#34;Knowing full well that what she was doing was both reprehensible and criminal, defendant repeatedly victimized a child who trusted defendant.\&#34;\n\n---\n\nBraidwood teacher charged with sex crimes in alleged relationship with teen boy (WLS-TV, Jan 4, 2019):\n\nDayna Chidester of Manhattan, Illinois, was arrested one month after another teacher at the same school was arrested on child pornography charges. The married 50-year-old cried as Will County Judge Ted Jarz set her bail at $1 million. The 14-year-old boy doesn&#39;t attend the school where Chidester taught apparels and textiles, adult living, and food and nutrition classes, but is also a resident of Manhattan. Prosecutors said Chidester began communicating by text with the teen in September of 2018, and soon evolved into the two sexting and sending each other nude photos before they allegedly began having sex. Sexual contact happened at the defendant&#39;s home, in her vehicle and at local motels.\n\n---\n\nFeds allege former high school teacher had sex with underage boy for months (Chicago Tribune, Sep 25, 2019):\n\nChidester texted a student at her school: \&#34;It&#39;s horrible. (I) can go to jail.\&#34; FBI agents arrested her Wednesday on a charge alleging she had sex with the boy at her home, her car and in suburban hotels between September and December 2018. State charges were dropped. Authorities found nude photos of Chidester and more than 9,000 text messages on the victim&#39;s phone. The victim said he had sex with Chidester 15-20 times and both had exchanged sexually explicit photos. Chidester purchased gifts including a robe and a longboard skateboard. Chidester had also worked at Thornwood High School in South Holland.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;prior-warning-ignored&#34;, &#34;csam-distribution&#34;, &#34;federal&#34;, &#34;fbi&#34;, &#34;gifts&#34;, &#34;sentencing-memo&#34;]}, {&#34;id&#34;: 134, &#34;case_id&#34;: 122, &#34;case_name&#34;: &#34;Sarah Jacas&#34;, &#34;source&#34;: &#34;WESH 2 News&#34;, &#34;date&#34;: &#34;2025-06-24&#34;, &#34;text&#34;: &#34;Orange County teacher accused of having sex with student in classroom (WESH 2, June 24, 2025):\n\nSarah Jacas was arrested on Monday and faced a judge for the first time on Tuesday afternoon. She is being held in the Orange County Jail. Investigators say this happened more than once at Corner Lake Middle School. This all allegedly happened during the 2022-2023 school year. Jacas is accused of having sex with a 14-year-old boy during lunchtime. The arrest report states Jacas allegedly placed curtains over the classroom&#39;s windows and locked the door at one point. The boy told detectives he would eat lunch in her classroom because he had issues fitting in. In court, the judge revealed that Jacas is married and is the mother of a 12-year-old. Detectives say Jacas told the boy her husband allegedly found out about their relationship and threatened to report her. Bond of $19,000 for all charges.\n\nCharges: Lewd or lascivious battery (custodial authority); Lewd or lascivious molestation (custodial authority) x2; Sex offense - authority figure solicit/engage sexual conduct statutory rape.\n\nCorner Lake Middle School principal email: \&#34;one of our employees has been arrested after allegations of misconduct from two years ago were reported... this person will not be returning to campus pending the outcome of the investigation.\&#34;\n\nDocket: Trial set June 1, 2026; pre-trial conference May 19, 2026; trial management conference May 27, 2026 (Judge Snure). Defense attorney: Branden Michael Vicari.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;husband-reported&#34;, &#34;delayed-reporting&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 135, &#34;case_id&#34;: 123, &#34;case_name&#34;: &#34;Megan Jordan Swanson&#34;, &#34;source&#34;: &#34;WWBT / WRIC&#34;, &#34;date&#34;: &#34;2024-05-20&#34;, &#34;text&#34;: &#34;Former Henrico teacher sentenced for sex crimes involving student (WWBT, May 20, 2024):\n\nMegan Jordan Swanson, of Chesterfield, pleaded guilty to several charges of carnal knowledge and one count of indecent liberties of a minor earlier this year. The victim was a student of Swanson&#39;s during the 2022-23 school year and was 14 years old at the time of the offenses. Sexual acts happened while Swanson was a teacher at Hungary Creek Middle School. Sentenced Monday to a total of 40 years, with 34 years suspended. After she serves six years in prison, she will be placed on 20 years of supervised probation.\n\n---\n\nFormer Henrico teacher charged with sex crimes with student pleads guilty, facing 50 years in prison (WRIC, Feb 6-7, 2024):\n\n25-year-old Megan Pauline Jordan of Chesterfield County pleaded guilty to four felony counts of carnal knowledge of a minor and one felony count of indecent liberties with a minor. Jordan engaged in sexual relations with the victim while he was a student of hers during the 2022-2023 school year, going to his home on several occasions to have sexual intercourse. Jordan&#39;s DNA was found on the victim&#39;s bed sheets. \&#34;Because of their efforts, this predator is off the streets, out of our schools, and will be held accountable for her actions.\&#34; \u2014 Henrico Commonwealth&#39;s Attorney Shannon Taylor. Jordan was arrested in June 2023 and was initially charged with five counts of carnal knowledge of a minor and two counts of indecent liberties with a minor.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;dna-evidence&#34;, &#34;probation&#34;, &#34;physical-evidence&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 136, &#34;case_id&#34;: 124, &#34;case_name&#34;: &#34;Mary Jo Spack&#34;, &#34;source&#34;: &#34;Tampa Bay Times / Teachers In Custody blog&#34;, &#34;date&#34;: &#34;2008-03-22&#34;, &#34;text&#34;: &#34;Mary Jo Spack, 45, honors English teacher at Freedom High School, Tampa FL. Arrested March 21, 2008. On March 14, Spack met two male students (17 and 18) at a liquor store, bought them alcohol, drove to a Howard Johnson motel where she rented a room. Three more teens arrived. Spack had sex with the 17-year-old in the shower. Case surfaced when victim boasted at school; reached school resource officer. Tampa Police asked publicly whether additional victims existed; none confirmed.\n\nCharged: 1 count unlawful sexual conduct with a minor (felony); 2 counts contributing to delinquency of a minor. Pleaded guilty to felony battery (reduced charge) ~March 2009. Sentenced to 5 years probation; no prison; no sex offender registration.\n\nSchool district spokeswoman Linda Cobbe: \&#34;There were no problems ever in her history as a teacher. Everything was the highest marks you could receive.\&#34;\n\nPart of Hillsborough County cluster: Stephanie Ragusa arrested March 13, 2008; Spack March 21; Lisa Marinelli days later. Newsweek covered the cluster (\&#34;Teacher Sex Scandals Alarm Fla.\&#34;, 2008).&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;alcohol&#34;, &#34;charge-reduction&#34;, &#34;possible-additional-victims&#34;]}, {&#34;id&#34;: 137, &#34;case_id&#34;: 125, &#34;case_name&#34;: &#34;Yessenia Navarro Garcia&#34;, &#34;source&#34;: &#34;OC Register / ABC7 / dlawgroup.com / mynewsla.com&#34;, &#34;date&#34;: &#34;2025-11-21&#34;, &#34;text&#34;: &#34;Santa Ana choir teacher pleads guilty to sexual contact with student (OC Register, Nov. 21, 2025):\n\nYessenia Navarro Garcia, choir/music teacher at Santa Ana High School for ~5 years, pleaded guilty November 21, 2025 to two misdemeanor counts of oral copulation of an underage victim. Original charges were multiple felonies. Sentenced same day: 30 days county jail (4 days time served credit), 1 year informal probation, sex offender registration. The 17-year-old male victim was a senior.\n\nEarlier arrest coverage (ABC7 / dlawgroup, Nov. 2024): Garcia was arrested November 16, 2024 after the victim texted her to arrange a meeting; police set up a sting and arrested her on arrival. Garcia \&#34;admitted to all of the sexual acts that the victim reported.\&#34; Police believed additional victims may exist. The relationship spanned approximately six months.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;charge-reduction&#34;, &#34;possible-additional-victims&#34;]}, {&#34;id&#34;: 138, &#34;case_id&#34;: 126, &#34;case_name&#34;: &#34;Julie Elizabeth Tichon&#34;, &#34;source&#34;: &#34;LA County DA / KTLA / dlawgroup.com&#34;, &#34;date&#34;: &#34;2024-09-20&#34;, &#34;text&#34;: &#34;DA Gasc\u00f3n announces charges against West LA high school guidance counselor (LA County DA, Sept. 20, 2024):\n\nJulie Elizabeth Tichon, guidance counselor at YULA Boys Division (private Orthodox Jewish high school, Pico-Robertson, West LA), charged with 3 felony counts of unlawful sexual intercourse with a minor more than 3 years younger (PC \u00a7261.5(d)) and 1 count oral copulation of a person under 18 (PC \u00a7287). Victim: 16-year-old male student. Offenses February\u2013March 2024, \&#34;multiple times.\&#34; Arraigned Sept. 19, 2024, pleaded not guilty. Max: up to 5 years state prison.\n\nSchool head Rabbi Arye Sufrin notified parents May 28, 2024 of \&#34;an inappropriate relationship of a sexual nature\&#34; involving a female staff member and \&#34;two male students.\&#34; Tichon immediately removed; LAPD notified. Police believed additional victims may exist.\n\nMarch 4, 2025 (journalist Louis Keene): \&#34;Julie Tichon, former YULA Boys guidance counselor accused of sexual relationships with multiple underage students...appeared in court today. It sounds like the criminal case will be settled at the next court date, in April.\&#34; No public confirmation of resolution as of March 2026.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;private-school&#34;, &#34;possible-additional-victims&#34;]}, {&#34;id&#34;: 139, &#34;case_id&#34;: 127, &#34;case_name&#34;: &#34;Colleen Jo Matarico&#34;, &#34;source&#34;: &#34;LA County DA / Daily News / CBS LA / Patch&#34;, &#34;date&#34;: &#34;2024-11-08&#34;, &#34;text&#34;: &#34;DA Gasc\u00f3n announces charges against middle school teacher (LA County DA, Nov. 8, 2024):\n\nColleen Jo Matarico, 43, special education teacher at John Burroughs Middle School (LAUSD), Valley Village. 24 years with LAUSD. Arrested November 7, 2024. Charged with 5 counts lewd act upon child under 14 (PC \u00a7288(a)), 2 counts lewd act upon child 14\u201315 (PC \u00a7288(c)(1)), 1 count furnishing cannabis to a minor \u2014 8 felony counts. Max: 20 years 4 months. Bail: $590,000 + GPS monitoring.\n\nVictim first met Matarico at age 12. Sexual abuse began when victim was 13 (2023), continued to age 14 (2024). Groomed in classroom; cannabis provided; sex in her vehicle. Matarico told victim he was \&#34;the only one she would go to jail for\&#34; and described him as her \&#34;crystal meth.\&#34; Allegedly left her husband due to relationship. After learning of investigation, drove to victim&#39;s new school and sent Instagram messages to victim and friends expressing romantic feelings.\n\nArraigned November 12, 2024; pleaded not guilty. Prosecutor: Deputy DA Ariel Anson. Defense: Deputy PD Carlos Bido. Judge: Susan J. De Witt. Police believed additional unidentified victims may exist. No 2025 court updates in public reporting.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;, &#34;drugs&#34;, &#34;possible-additional-victims&#34;, &#34;surveillance&#34;, &#34;emotional-manipulation&#34;, &#34;special-needs-victim&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 140, &#34;case_id&#34;: 128, &#34;case_name&#34;: &#34;Stephanie L. Harmon&#34;, &#34;source&#34;: &#34;WICS/WCCU / WANDTV / Kankakee Daily Journal / newsbug.info&#34;, &#34;date&#34;: &#34;2023-05-17&#34;, &#34;text&#34;: &#34;Teacher sentenced to probation for sexual relationship with student (WICS/WCCU, May 17, 2023):\n\nStephanie L. Harmon, 32, pleaded guilty to one count of aggravated criminal sexual abuse and sentenced to 4 years probation and $1,000 fine. Relationship with student at an unnamed Iroquois County school. Conduct did not occur at school. Watseka PD received tip in mid-August 2022, arrested Harmon September 30, 2022 after one-month investigation. Both Harmon and victim admitted allegations during police interviews. Original charge was aggravated criminal sexual assault (citing victim age and position of trust/authority); reduced to abuse at plea. 90 days jail credited as time served.\n\nArrest coverage (newsbug.info / WGFA, Oct 2022): Harmon, Watseka resident, charged with aggravated criminal sexual assault, a Class 2 felony. School identity not disclosed. Case no. 2022CF102, Iroquois County.\n\nSex offender registration confirmed on Illinois Sex Offender Registry (OffenderRadar/ISP data): offense category \&#34;AGGRAVATED CRIMINAL SEX ABUSE/VICTIM 13-18.\&#34;&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 141, &#34;case_id&#34;: 129, &#34;case_name&#34;: &#34;Imagine Kay Ewer&#34;, &#34;source&#34;: &#34;Sage Kelley / local reporting&#34;, &#34;date&#34;: &#34;2025-02-04&#34;, &#34;text&#34;: &#34;Former JeffCo paraprofessional sentenced for sexually assaulting student (Feb. 4, 2025):\n\nImagine Kay Ewer, 28, sentenced to four years in prison and 10 years to life on Sex Offender Intensive Supervision (SOIS) probation by First Judicial District Judge Chantel Contiguglia. Ewer pleaded guilty in November 2024 to contributing to the delinquency of a minor in the first degree and sexual assault on a child by one in a position of trust.\n\nEwer worked for Jefferson County Public Schools from 2015 to 2023 as school nurse, paraprofessional, and teaching assistant. At Brady Exploration School in Lakewood August\u2013November 2023. Investigation triggered November 2023 when inappropriate writing found on victim&#39;s worksheet; staff had previously observed \&#34;favoritism\&#34; toward the 16-year-old male student with an undisclosed disability.\n\nEvidence: frequent sexual encounters; thousands of texts with repeated derogatory remarks directed at victim; introduction of fentanyl, alcohol, and weapons. Ewer directed victim to bring gun to sexual encounters and to \&#34;bring the gun to school and shoot another faculty member in the leg.\&#34; Also exploited victim for money. Arrested January 2024; arrested again for drug offense in Douglas County while on bond.\n\nProsecutor Brynn Chase (special victims): \&#34;Over the past year, multiple individuals in positions of trust within Jefferson County have been accused and charged with similar offenses.\&#34; Judge noted first felony conviction but situation \&#34;particularly aggravating\&#34; due to position of trust and drugs.\n\nVictim&#39;s mother: \&#34;The defendant preyed on my son, leading him to believe she genuinely cared for him, all while exploiting him for money and manipulating him into thinking he was &#39;the one.&#39;\&#34;\n\nEwer: \&#34;I just want to apologize to the victim and the victim&#39;s family. I&#39;m really sorry; this will never happen again.\&#34;\n\nNote: Ewer&#39;s arrest was the first of five similar JeffCo educator cases in 2024. Chloe Castro (JeffCo social worker) arrested November 2024 on similar charges.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;prior-warning-ignored&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;parole-supervision-for-life&#34;, &#34;cash&#34;, &#34;emotional-manipulation&#34;, &#34;special-needs-victim&#34;]}, {&#34;id&#34;: 142, &#34;case_id&#34;: 130, &#34;case_name&#34;: &#34;Chloe Rose Castro&#34;, &#34;source&#34;: &#34;First Judicial DA / Denver Gazette / 9News / Colorado Politics&#34;, &#34;date&#34;: &#34;2026-02-02&#34;, &#34;text&#34;: &#34;Former School Social Worker Chloe Castro Pleads Guilty to Sexual Assault on a Child (First Judicial DA, Feb. 2, 2026):\n\nChloe Rose Castro pleaded guilty to Sexual Assault on a Child by One in a Position of Trust \u2014 Victim Less Than 15 (F3, C.R.S. 18-3-405.3). Original counts \u2014 Pattern of Abuse (F3) and Internet Luring of a Child (F4) \u2014 dismissed. No sentencing concessions by prosecution. Faces indeterminate minimum 4 years to life in DOC under SOLSA, or minimum 20 years to life probation. Remanded into custody. Sentencing April 2, 2026.\n\nArrest coverage (Denver Gazette / 9News, Nov. 2024): Arvada PD arrested Castro November 6, 2024 after parents discovered \&#34;countless\&#34; inappropriate Instagram messages on victim&#39;s phone October 29, 2024. Castro had saved herself in victim&#39;s contacts as \&#34;youth pastor.\&#34; Met victim as his IEP case manager at Three Creeks K-8; relationship began ~late 2022 when victim was 12 (end of sixth grade). Physical contact \u2014 cuddling, kissing, intimate touching, nude photos \u2014 in her school office. Castro told victim they \&#34;couldn&#39;t have sex until he turned 18\&#34; and discussed moving to NM/CA together. Bond set $75,000.\n\nColorado Politics (Jan. 20, 2026): Victim&#39;s mother Lia Flynn expressed frustration at lengthy pre-plea period; said ordeal caused \&#34;lifelong issues and lifelong therapy.\&#34; Jeffco Kids First advocacy group alleged a prior settlement with Castro and another family.\n\nProsecutor Tyra Forbes. Defense: Marshall Breit. Judge: Diego Hunt. Part of JeffCo cluster: cross-reference Imagine Kay Ewer #129 (same district, same year, also IEP/special-needs student).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;instagram&#34;, &#34;plea&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;prior-warning-ignored&#34;, &#34;parole-supervision-for-life&#34;, &#34;behavioral-health&#34;, &#34;long-term-relationship&#34;, &#34;emotional-manipulation&#34;, &#34;special-needs-victim&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 143, &#34;case_id&#34;: 6, &#34;case_name&#34;: &#34;State v. Katherine Harper&#34;, &#34;source&#34;: &#34;Fort Worth Star-Telegram / local reporting&#34;, &#34;date&#34;: &#34;2017-03-24&#34;, &#34;text&#34;: &#34;Roanoke Texas \u2014 Northwest ISD middle school teacher arrested for having an improper relationship with a 15-year-old student was pregnant after the encounter.\n\nKatherine Ruth Harper, 27, was a 7th grade English teacher and coach at Tidwell Middle School. Arrested March 21 and charged for alleged encounters with a 15-year-old boy who attended Byron Nelson HS (former student from Tidwell MS). Northwest ISD received anonymous tip via district website alleging Harper and the boy were having sex and that she was pregnant. Harper was 8 months pregnant at arrest; the warrant does not explicitly state if the 15-year-old is the father.\n\nWhen questioned by the Byron Nelson principal, the student began crying and admitted multiple sexual encounters: \&#34;One thing led to another and she told me to &#39;put it in&#39; and I did.\&#34; Other encounters involved drinking alcohol, undressing together, oral sex performed by victim, and Harper sending multiple nude photos via smartphone. Harper and the victim communicated 76 times between June 1 and July 31. Arrests occurred prior to that as former tennis coach and teacher. District placed Harper on administrative leave December 2016. Arrested March 21 by Trophy Club police; booked Denton County jail; $15,000 bond.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;pregnancy&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;alcohol&#34;]}, {&#34;id&#34;: 144, &#34;case_id&#34;: 16, &#34;case_name&#34;: &#34;State v. Kathryn Murray&#34;, &#34;source&#34;: &#34;KPRC Click2Houston&#34;, &#34;date&#34;: &#34;2014-01-31&#34;, &#34;text&#34;: &#34;Former Spring Branch ISD teacher sentenced again (KPRC, January 31, 2014):\n\nKathryn Murray, 31, resentenced to two years in prison with no probation. On January 21, Murray had been sentenced to two years probation with one year served in jail; however, that sentence was set aside because under Texas law the judge could not sentence her to probation for sexual assault of a child. On January 31, lawyers for both sides agreed to the new sentence of 2 years prison.\n\nMurray had pleaded guilty in December to one count of improper relationship with a student and one count of sexual assault of a child. She was charged after investigators learned of her relationship with a 15-year-old boy she was tutoring. Former Memorial Middle School teacher. Encounters occurred at the boy&#39;s home while his parents were not there. Also ordered: no contact with victim for at least two years; surrender teaching license; sex offender registration.\n\nMurray was arrested again while on bond after she and the victim were caught together at Murray&#39;s father&#39;s house in February 2013 \u2014 demonstrating charges were insufficient to keep them apart. Victim&#39;s parents (Jenny and Alex Pallais) sent the boy to a school in Louisiana to physically separate them.\n\nVictim&#39;s father Alex Pallais: \&#34;She&#39;s a blonde pretty lady who abused a kid. A woman gets much lighter sentences, where the victim has the same reaction. They get depressed. They become very suicidal. So, why is it that a boy is different than a girl?\&#34;\n\nVictim&#39;s mother Jenny Pallais on the no-probation sentence: \&#34;No probation? That means she can come back near my son.\&#34;&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;surveillance&#34;, &#34;victim-blaming&#34;]}, {&#34;id&#34;: 145, &#34;case_id&#34;: 131, &#34;case_name&#34;: &#34;Marcie Kay Zimmerman&#34;, &#34;source&#34;: &#34;WLUK FOX 11 / Fond du Lac County jail records&#34;, &#34;date&#34;: &#34;2025-12-04&#34;, &#34;text&#34;: &#34;Plymouth High School teacher formally charged in Fond du Lac County (Sept. 2, 2025) / Former Plymouth teacher pleads not guilty (WLUK FOX 11, Dec. 4, 2025):\n\nMarcie Kay Zimmerman, 42 (later 43), culinary arts teacher at Plymouth High School. Resident of St. Cloud, WI. Arrested August 25, 2025 (Fond du Lac County Sheriff, 25SO-2351, case 25CF000779); bond $250,000 cash.\n\nFormally charged September 2, 2025 with: sexual assault of a student by school staff (x1), sexual intercourse with a child 16 or older (x1), exposing child to harmful material (x1). By not-guilty plea December 4, 2025 the charges had expanded to 5 counts, including 2 counts of sexual assault of a student by school staff. No trial date set; status conference January 6, 2026.\n\nConduct: In 2023, victim was a 16-year-old female student in mental health crisis. Zimmerman developed relationship through texting and school conversations. Relationship first became sexual via phone conversations, then in-person contacts. Zimmerman sent sexually charged messages, then explicit photos and videos. Victim spent nights at Zimmerman&#39;s home. Victim&#39;s mother reported suspicions to the school district; district kept Zimmerman employed and issued no-contact order \u2014 which Zimmerman violated. When victim tried to end the relationship, Zimmerman made suicidal threats and threatened to go public to \&#34;ruin both their reputations.\&#34; After victim said never contact her again, Zimmerman showed up at victim&#39;s workplace. Victim came forward to police July 2025.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;social-media&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;prior-warning-ignored&#34;, &#34;delayed-reporting&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;surveillance&#34;, &#34;emotional-manipulation&#34;]}, {&#34;id&#34;: 146, &#34;case_id&#34;: 132, &#34;case_name&#34;: &#34;Kristy Risell&#34;, &#34;source&#34;: &#34;MediaNews Group / Pottstown Mercury (Carl Hessler Jr. / Brandie Kessler)&#34;, &#34;date&#34;: &#34;2013-07-11&#34;, &#34;text&#34;: &#34;Exeter woman, former Daniel Boone teacher, admits to sexual contact with boy, 15 (Pottstown Mercury, July 11, 2013):\n\nKristy Risell, 32, sentenced in Berks County Court to five years probation, three months house arrest (electronic monitoring), after pleading guilty to felony institutional sexual assault. Must register as sex offender for 25 years. Still faces PA Sexual Offender Assessment Board evaluation for possible sexually violent predator classification (lifetime reporting, counseling, community notification).\n\nIncidents: January\u2013April 2012 at her Exeter Township home. Judge John A. Boccabella accepted plea agreement between ADA Jonathan Kurland and defense attorney William R. Bernhart. Risell raised a potential insanity defense; prosecutors didn&#39;t believe it had merit but plea resolved the case quickly at victim family&#39;s request to avoid months of litigation.\n\nADA Kurland: \&#34;This teacher took that trust and exploited it and used that child for whatever her selfish motivations or reasons were.\&#34; Kurland noted the sentence was \&#34;a compromise to get that resolution.\&#34;\n\n---\n\nDaniel Boone High School teacher charged (Pottstown Mercury, Sept. 14, 2012):\n\nRisell, 31, charged with statutory sexual assault, institutional sexual assault, indecent assault, indecent exposure, and related charges. Relationship began with text messages; Risell arranged private meetings at her home. In March 2012 she picked the boy up from his home and drove him to her residence. Surrendered to detectives September 13, 2012; released on $20,000 unsecured bail.&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;sexting&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;charge-reduction&#34;, &#34;victim-in-home&#34;, &#34;home-confinement&#34;]}, {&#34;id&#34;: 147, &#34;case_id&#34;: 133, &#34;case_name&#34;: &#34;Erica Lynne Mesa&#34;, &#34;source&#34;: &#34;WUSA9 / Complex / News Corp Australia&#34;, &#34;date&#34;: &#34;2015-05-21&#34;, &#34;text&#34;: &#34;VA teacher sentenced 3 years for sex with multiple students (WUSA9, May 21, 2015) / plea coverage (Complex, March 23, 2015 / News Corp, March 25, 2015):\n\nErica Lynne Mesa, 28, geometry teacher and volleyball coach at Colonial Forge High School, Stafford County, VA. Sentenced May 21, 2015: 22 years, all but 3 suspended. Had been in jail since September 2014 arrest.\n\nPleaded guilty to 2 counts electronic solicitation of a minor and 2 misdemeanor counts contributing to the delinquency of a minor. Police received anonymous tip 2014 naming Mesa as having sex with students. Confessed to 4 students total (charged initially with 2): one 16-year-old (underage), others 17-18. Sent nude photos to the 16-year-old. Sex at her home while husband away \u2014 one boy waited in the basement while she had sex with another upstairs. Sex with one student on his 18th birthday in a commuter lot. Taught at Colonial Forge 5 years.\n\nMesa told deputies she had sex with the students because it made her feel \&#34;attractive and wanted.\&#34; Husband Keith Mesa was also a teacher/coach at the same school; couple (married 2 years) separated.\n\nDefense attorney Mark Gardner: \&#34;She was not preying on people who had no interest in participating.\&#34;&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;multiple-victims&#34;, &#34;plea&#34;, &#34;explicit-photos&#34;, &#34;sexting&#34;, &#34;victim-blaming&#34;, &#34;group-sex&#34;]}, {&#34;id&#34;: 148, &#34;case_id&#34;: 134, &#34;case_name&#34;: &#34;Felicia A. Smith&#34;, &#34;source&#34;: &#34;Click2Houston / ABC13 / KHOU&#34;, &#34;date&#34;: &#34;2014-09-05&#34;, &#34;text&#34;: &#34;Teacher who performed lap dance for student in class to serve probation (Click2Houston, Sept. 5, 2014):\n\nFelicia A. Smith, 42, Stovall Middle School, Aldine ISD. Pleaded guilty to improper relationship between educator and student (felony, TX PC \u00a721.12). Sentenced to 3 years deferred adjudication probation; no prison. Bond had been set at $30,000.\n\nIncident: February 26, 2014, Smith performed a full-contact lap dance on a 15-year-old male student celebrating his birthday, at the front of the classroom in front of other students, for approximately 3 minutes 54 seconds. She rubbed her body against his, placed her head in his lap; student struck her buttocks multiple times. She said \&#34;I love you, baby. Happy birthday.\&#34; Accompanied by music. A student captured the incident on a cellphone. Smith told police the class had persuaded her to do it. SBEC teaching license revocation initiated.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;physical-evidence&#34;, &#34;on-campus&#34;]}, {&#34;id&#34;: 149, &#34;case_id&#34;: 135, &#34;case_name&#34;: &#34;Lillian Sarah Cameron&#34;, &#34;source&#34;: &#34;Click2Houston / ABC13 / Houston Chronicle&#34;, &#34;date&#34;: &#34;2016-04-30&#34;, &#34;text&#34;: &#34;Ridge Point High School teacher arrested after allegations of improper relationship with student (Click2Houston, April 30, 2016):\n\nLillian Sarah Cameron, 27, chemistry teacher at Ridge Point High School, Fort Bend ISD, Missouri City. Turned herself in April 28, 2016. Charged with felony improper relationship between educator and student (TX PC \u00a721.12). Fort Bend ISD became aware in March 2016; a second allegation was under investigation. Victim details not publicly reported.\n\nLater coverage (Houston Chronicle / Sugarland.com, ~late 2018): Cameron had been placed on community supervision; by late 2018 court documents described \&#34;an ongoing pattern of high-risk behavior relating to substance abuse, resistance to treatment and an obsession with sexual behaviors\&#34; and she had been \&#34;unsuccessfully discharged\&#34; from sex offender treatment. Probation revocation proceedings were pending. Final outcome not publicly confirmed.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;possible-additional-victims&#34;]}, {&#34;id&#34;: 150, &#34;case_id&#34;: 136, &#34;case_name&#34;: &#34;Christine McCallum&#34;, &#34;source&#34;: &#34;AP / Brockton Enterprise&#34;, &#34;date&#34;: &#34;2012-03-28&#34;, &#34;text&#34;: &#34;Former Abington elementary teacher sentenced to just under 2.5 years for child rape (AP, March 28, 2012):\n\nChristine McCallum pleaded guilty in Brockton Superior Court to 12 counts of child rape, 1 count of drugging a person for sex, and 1 count of providing alcohol to a minor. Sentenced to just under 2.5 years in prison plus 10 years probation. Abuse began when victim was 13; McCallum had been tutoring his older brother when she began the relationship. Abuse continued \&#34;nearly two years\&#34; (sentencing coverage) / \&#34;more than 300 times over a three-year period\&#34; (2009 charging docs). Discovered by the boy&#39;s father in early 2009.\n\nVictim impact statement: McCallum \&#34;destroyed his life.\&#34; Father (via prosecutor): called McCallum \&#34;a true predator and monster.\&#34; Defense attorney Kevin Mahoney told radio station McCallum got a fair sentence and has her family&#39;s support.\n\nEarlier coverage (Brockton Enterprise, Aug. 2009): McCallum, 30, Rockland resident; 5th grade teacher at Woodsdale Elementary, Abington. Arrested January 8, 2009; fired shortly after. Arraigned Brockton DC (Abington charges) and Hingham DC (Rockland charges); indicted March 10, 2009 and transferred to Plymouth Superior Court. Released on $1,000 bail; pleaded not guilty at arraignment; GPS monitoring and no-contact with victim and minors under 16 ordered. ADA Susan McDonough. Defense: Kevin Mahoney.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;probation&#34;, &#34;alcohol&#34;, &#34;drugs&#34;, &#34;long-term-relationship&#34;]}, {&#34;id&#34;: 151, &#34;case_id&#34;: 137, &#34;case_name&#34;: &#34;Jennifer Erin Massey&#34;, &#34;source&#34;: &#34;Comal County District Clerk / court records&#34;, &#34;date&#34;: &#34;2026-02-25&#34;, &#34;text&#34;: &#34;Case CR2025-941D, 433rd District Court, Comal County, Texas. Defendant: Jennifer Erin Massey, DOB 07/05/1973. Art teacher at Davenport High School, Comal ISD, Garden Ridge TX. Arrested October 3-4, 2024, after being found with a male juvenile at a residence under construction on Citadel Point, Garden Ridge. Indicted November 19, 2025 on 5 counts: Trafficking of Person from School (1st degree felony, \u00a720A.02(b-1)); Improper Relationship Between Educator and Student (2nd degree felony, \u00a721.12); Sexual Assault of a Child (2nd degree felony, \u00a722.011(a)(2)); Indecency with a Child by Sexual Contact x2 (2nd degree felony, \u00a721.11(d)). Arraignment waived January 28, 2026. Pre-trial reset February 25, 2026; next pre-trial April 8, 2026. Prosecutor: Ashley Indelicato. Defense: Shawn C. Brown (retained).&#34;, &#34;tags&#34;: [&#34;grooming&#34;, &#34;on-campus&#34;, &#34;novel-statute&#34;]}, {&#34;id&#34;: 152, &#34;case_id&#34;: 138, &#34;case_name&#34;: &#34;Kayla Alayne Sprinkles&#34;, &#34;source&#34;: &#34;Cherokee County Sheriff&#39;s Office press release; NC Tyler portal case 18CR000524-190&#34;, &#34;date&#34;: &#34;2023-05-22&#34;, &#34;text&#34;: &#34;Kayla Alayne Sprinkles, 26, of Hayesville NC, former high school teacher with Cherokee County Schools System. Case No. 18CR000524-190, Cherokee Superior Court.\n\nCherokee County Sheriff&#39;s Office began investigating allegations March 2018 with assistance from HAVEN Child Advocacy Center. Grand jury indicted June 4, 2018 on 5 counts of sex activity with a student. Sprinkles surrendered at Mecklenburg County Detention Center June 7, 2018; served indictments and released on $25,000 unsecured bond.\n\nTwo counts per court record under NC GS 14-27.32(A), offense date 03/01/2017. Case continued through multiple continuances 2018-2023 with four retained defense attorneys (Chappell, Mills, Roberts, Nielsen). Prosecutor: John Stephen Hindsman. Final defense: Joshua David Nielsen.\n\nMay 22, 2023: Guilty plea to count 52 (Sex Act With a Student). Count 51 dismissed per plea agreement. Judge William H. Coward imposed intermediate sentence: 13-25 months (presumptive range), suspended \u2014 24 months supervised adult probation. Special conditions: sex offender registration (GS 14-208.6), no contact with Hannah West, psychiatric/psychological counseling, DNA, 50 hours community service, $9,255 restitution.\n\nJune 21, 2023: Court modified conditions to allow residence with biological minor child and Landon Joseph Sprinkles. May 21, 2025: DCC-15 Final Discharge \u2014 Certificate of Completion issued.&#34;, &#34;tags&#34;: [&#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;probation&#34;, &#34;no-prison&#34;, &#34;delayed-reporting&#34;, &#34;charge-reduction&#34;, &#34;female-victim&#34;]}, {&#34;id&#34;: 153, &#34;case_id&#34;: 139, &#34;case_name&#34;: &#34;Camella Rodgers&#34;, &#34;source&#34;: &#34;WFIE 14 News / Evansville Courier &amp; Press (Megan Erbacher)&#34;, &#34;date&#34;: &#34;2018-06-28&#34;, &#34;text&#34;: &#34;Camella Rodgers, 45, former 5th-grade teacher at Farmersville Elementary School, Mount Vernon Indiana (Posey County). Charged with two felony counts of child seduction in connection with a year-long sexual relationship with a 17-year-old female high school student.\n\nBond set $15,000 cash (Jan 2018). Rodgers resigned December 2017 before charges filed. Probable cause affidavit filed January 5, 2018 in Posey County Circuit Court. Rodgers turned herself in to Posey County Jail before the sentencing hearing. She was not the victim&#39;s classroom teacher; she was tutoring the victim in biology and helping coach track. The victim&#39;s mother was friends with Rodgers; Rodgers lived in the victim&#39;s home for about two months the summer before charges. Mother discovered the relationship from a photo of Rodgers kissing her daughter.\n\nRodgers pleaded guilty as charged to child seduction Level 5 felony and Level 6 felony. June 28, 2018: Judge James Redwine sentenced to 3 years Indiana DOC \u2014 1 year to serve, 2 years probation. Sex offender registration 10 years. Redwine cited duty as teacher violated, but credited lack of criminal record and guilty plea. Prosecutor Travis Clowers sought immediate custody; denied, Rodgers allowed to report Saturday. Investigating officer: Mt. Vernon PD Officer Candace Rueger. Defense: Douglas Walton.\n\nVictim testified voluntarily that relationship was mutual and she did not want Rodgers incarcerated.&#34;, &#34;tags&#34;: [&#34;sentenced&#34;, &#34;grooming&#34;, &#34;plea&#34;, &#34;sex-offender-registration&#34;, &#34;female-victim&#34;, &#34;long-term-relationship&#34;, &#34;emotional-manipulation&#34;, &#34;love-letters&#34;, &#34;victim-in-home&#34;]}, {&#34;id&#34;: 154, &#34;case_id&#34;: 140, &#34;case_name&#34;: &#34;Emily Michelle Rogers&#34;, &#34;source&#34;: &#34;San Antonio Express-News (Zeke MacCormack); New York
