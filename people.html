  <style>
    /* ── Layout / chrome ───────────────────────────────────────────────── */
    body { background: #e9ebef; }
    main.container {
      background: #fff;
      border-radius: 10px;
      padding: 2rem 1.875rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }
    footer.container {
      margin-top: 0 !important;
      border-top: none !important;
    }

    /* ── Gradient headings ─────────────────────────────────────────────── */
    main h1, main h2 {
      padding: 0.15em 0.5em 0.15em 0.4em;
      border-radius: 5px;
      margin-left: -0.4em;
    }
    main h1 {
      background-image: linear-gradient(90deg, rgba(26,58,196,0.09) 0%, rgba(26,58,92,0) 85%);
    }
    main h2 {
      background-image: linear-gradient(90deg, rgba(30,72,164,0.09) 0%, rgba(30,72,118,0) 80%);
    }

    /* ── Nav / header ──────────────────────────────────────────────────── */
    nav ul { margin: 0; padding: 0; }
    header {
      position: sticky; top: 0; z-index: 100;
      background: #fff;
      border-bottom: 1px solid #ddd;
      margin-bottom: 1.5rem;
      padding-top: 0.3rem;
      padding-bottom: 0.3rem;
    }
    header nav { align-items: center; }
    nav > ul:last-child { gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
    nav > ul:last-child a {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      font-size: 0.84em;
      font-weight: 500;
      text-decoration: none;
      color: #444;
      background: #f0f2f5;
      border: 1px solid #dde0e5;
      transition: background 0.15s, color 0.15s;
    }
    nav > ul:last-child a:hover {
      background: #4a90d9;
      color: #fff;
      border-color: #4a90d9;
    }

    /* ── Misc ──────────────────────────────────────────────────────────── */
    .status-active     { color: #2d7a2d; font-weight: bold; }
    .status-trial      { color: #b36a00; font-weight: bold; }
    .status-verdict    { color: #7a2db3; font-weight: bold; }
    .status-sentenced  { color: #1a1a99; font-weight: bold; }
    .status-closed     { color: #555; }
    .status-appeal     { color: #c00; font-weight: bold; }
    .tag { display: inline-block; background: #e8edf2; border-radius: 4px;
           padding: 1px 7px; font-size: 0.82em; margin: 1px 2px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 0.92em;
          background: #f5f5f5; padding: 1rem; border-radius: 6px; }
    .dim { color: #888; font-size: 0.9em; }
    .notes-cell { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
    /* ── Case datablock table ───────────────────────────────────────────────── */
    table.datablock { border-collapse: collapse; margin-bottom: 1rem; font-size: 0.88em; width: auto; }
    table.datablock td { border: 1px solid #ccc; padding: 0.2rem 0.6rem; white-space: nowrap; }
    table.datablock td.lbl { font-weight: 600; color: #555; background: #f7f8fa; }
  </style>

<script>
(function () {
  const table  = document.getElementById("people-table");
  const tbody  = table.querySelector("tbody");
  const count  = document.getElementById("row-count");
  let sortCol = 2, sortAsc = true;

  // ── Sorting ───────────────────────────────────────────────────────────
  table.querySelectorAll("thead th").forEach(th => {
    th.addEventListener("click", () => {
      const col     = parseInt(th.dataset.col);
      const numeric = th.dataset.type === "num";
      sortAsc = (sortCol === col) ? !sortAsc : true;
      sortCol = col;

      table.querySelectorAll(".sort-icon").forEach(el => el.textContent = "↕");
      th.querySelector(".sort-icon").textContent = sortAsc ? "↑" : "↓";

      const rows = Array.from(tbody.querySelectorAll("tr"));
      rows.sort((a, b) => {
        const av = a.cells[col].textContent.trim();
        const bv = b.cells[col].textContent.trim();
        if (numeric) {
          const an = av === "" ? (sortAsc ? Infinity : -Infinity) : +av;
          const bn = bv === "" ? (sortAsc ? Infinity : -Infinity) : +bv;
          return sortAsc ? an - bn : bn - an;
        }
        return sortAsc ? av.toLowerCase().localeCompare(bv.toLowerCase())
                       : bv.toLowerCase().localeCompare(av.toLowerCase());
      });
      rows.forEach(r => tbody.appendChild(r));
    });
  });

  // ── Set initial sort indicator ────────────────────────────────────────
  const nameHeader = table.querySelector(`thead th[data-col="2"]`);
  if (nameHeader) nameHeader.querySelector(".sort-icon").textContent = "↑";

  // ── Filtering ─────────────────────────────────────────────────────────
  function activeRoles() {
    return new Set(
      Array.from(document.querySelectorAll(".role-filter:checked")).map(c => c.value)
    );
  }

  function applyFilter() {
    const roles = activeRoles();
    let visible = 0;
    tbody.querySelectorAll("tr").forEach(r => {
      const rowRoles = new Set((r.dataset.roles || "").split(" ").filter(Boolean));
      const show = [...roles].some(role => rowRoles.has(role)) || (roles.size === 0 && rowRoles.size === 0);
      r.style.display = show ? "" : "none";
      if (show) visible++;
    });
    count.textContent = `Showing ${visible} row${visible !== 1 ? "s" : ""}`;
  }

  document.querySelectorAll(".role-filter").forEach(cb =>
    cb.addEventListener("change", applyFilter)
  );
  document.getElementById("all-roles").addEventListener("click", e => {
    e.preventDefault();
    document.querySelectorAll(".role-filter").forEach(cb => cb.checked = true);
    applyFilter();
  });
  document.getElementById("no-roles").addEventListener("click", e => {
    e.preventDefault();
    document.querySelectorAll(".role-filter").forEach(cb => cb.checked = false);
    applyFilter();
  });

  applyFilter(); // apply default on load
})();
</script>
