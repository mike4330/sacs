  <style>
    /* ── Layout / chrome ───────────────────────────────────────────────── */
    body { background: #e9ebef; }
    main.container {
      background: #fff;
      border-radius: 10px;
      padding: 2rem 1.875rem;
      box-shadow: 0 2px 8px rgba(0,0,0,0.07);
      margin-top: 0.5rem;
      margin-bottom: 1.5rem;
    }
    footer.container {
      margin-top: 0 !important;
      border-top: none !important;
    }

    /* ── Gradient headings ─────────────────────────────────────────────── */
    main h1, main h2 {
      padding: 0.15em 0.5em 0.15em 0.4em;
      border-radius: 5px;
      margin-left: -0.4em;
    }
    main h1 {
      background-image: linear-gradient(90deg, rgba(26,58,92,0.13) 0%, rgba(26,58,92,0) 85%);
    }
    main h2 {
      background-image: linear-gradient(90deg, rgba(30,72,118,0.10) 0%, rgba(30,72,118,0) 80%);
    }

    /* ── Nav / header ──────────────────────────────────────────────────── */
    nav ul { margin: 0; padding: 0; }
    header {
      position: sticky; top: 0; z-index: 100;
      background: #fff;
      border-bottom: 1px solid #ddd;
      margin-bottom: 1.5rem;
      padding-top: 0.3rem;
      padding-bottom: 0.3rem;
    }
    header nav { align-items: center; }
    nav > ul:last-child { gap: 3px; flex-wrap: wrap; justify-content: flex-end; }
    nav > ul:last-child a {
      display: inline-block;
      padding: 0.2rem 0.55rem;
      border-radius: 5px;
      font-size: 0.84em;
      font-weight: 500;
      text-decoration: none;
      color: #444;
      background: #f0f2f5;
      border: 1px solid #dde0e5;
      transition: background 0.15s, color 0.15s;
    }
    nav > ul:last-child a:hover {
      background: #4a90d9;
      color: #fff;
      border-color: #4a90d9;
    }

    /* ── Misc ──────────────────────────────────────────────────────────── */
    .status-active     { color: #2d7a2d; font-weight: bold; }
    .status-trial      { color: #b36a00; font-weight: bold; }
    .status-verdict    { color: #7a2db3; font-weight: bold; }
    .status-sentenced  { color: #1a1a99; font-weight: bold; }
    .status-closed     { color: #555; }
    .status-appeal     { color: #c00; font-weight: bold; }
    .tag { display: inline-block; background: #e8edf2; border-radius: 4px;
           padding: 1px 7px; font-size: 0.82em; margin: 1px 2px; }
    pre { white-space: pre-wrap; word-break: break-word; font-size: 0.92em;
          background: #f5f5f5; padding: 1rem; border-radius: 6px; }
    .dim { color: #888; font-size: 0.9em; }
    .notes-cell { max-width: 260px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; cursor: default; }
  </style>
</head>

<p class="dim" id="row-count"></p>

<script>
(function () {
  const tbody = document.querySelector("tbody");
  const countEl = document.getElementById("row-count");

  function activeFields() {
    return new Set(
      Array.from(document.querySelectorAll(".field-filter:checked")).map(c => c.value)
    );
  }

  function applyFilter() {
    const fields = activeFields();
    let visible = 0;
    tbody.querySelectorAll("tr").forEach(r => {
      const rowFields = new Set((r.dataset.missing || "").split(" ").filter(Boolean));
      const show = fields.size === 0 ? false : [...rowFields].some(f => fields.has(f));
      r.style.display = show ? "" : "none";
      // dim tags that aren't in the active filter
      r.querySelectorAll(".field-tag").forEach(tag => {
        tag.style.opacity = fields.has(tag.dataset.field) ? "1" : "0.3";
      });
      if (show) visible++;
    });
    countEl.textContent = `Showing ${visible} row${visible !== 1 ? "s" : ""}`;
  }

  document.querySelectorAll(".field-filter").forEach(cb =>
    cb.addEventListener("change", applyFilter)
  );
  document.getElementById("all-fields").addEventListener("click", e => {
    e.preventDefault();
    document.querySelectorAll(".field-filter").forEach(cb => cb.checked = true);
    applyFilter();
  });
  document.getElementById("no-fields").addEventListener("click", e => {
    e.preventDefault();
    document.querySelectorAll(".field-filter").forEach(cb => cb.checked = false);
    applyFilter();
  });

  applyFilter();
})();
</script>
